# platform/sigstore/rekor-helm-values.yaml
#
# Overrides for the official sigstore/rekor Helm chart (Phase 3 item 2, sub-item 3 - see
# docs/provenance-policy.md). The chart pulls in Trillian (log server + log signer + its
# own bundled MySQL) and Redis as dependencies, and auto-creates the Trillian Merkle tree
# via a createtree Job - confirmed live from the chart's own real values.yaml, not
# assumed. No manual tree-ID creation, no separate MySQL setup needed.
#
# Only ingress is overridden here - this platform's clusters have no ingress
# controller/LoadBalancer by default (an already-documented gap elsewhere), and nothing
# outside the cluster needs to reach Rekor anyway, matching Fulcio's own
# ClusterIP-only pattern.
#
# Resource limits below were added after the first deploy attempt genuinely destabilized
# the cluster twice under the old podman-based stack - live-confirmed via `docker
# stats`, not guessed: MySQL + Trillian's log server + log signer all doing
# simultaneous first-boot initialization drove the podman VM to 41.04GB/41.96GB memory
# used (97.81%) with 337.8GB of block I/O (the other historical cause, a nested cgroup
# PID limit, is moot on kiac's per-VM isolation - see docs/provenance-policy.md for the
# full incident writeup). Deployed 2026-09-05 via a real ArgoCD Application (not the
# imperative, hand-staged `--set trillian.logServer.replicaCount=0`-then-scale-up
# sequence used to first bring this up and de-risk it that same day) - a single-shot
# declarative install is what ArgoCD needs anyway, and turned out not to require the
# staging at all: logServer/logSigner's own init container and createtree/createdb's
# own retry-until-ready logic already tolerate MySQL not being up yet, confirmed live
# with CPU/memory staying flat throughout (the storm above was these images/probes/
# credentials being broken under real emulation, not real capacity contention - see the
# next comment block).
#
# trillian.mysql.livenessProbe/readinessProbe.initialDelaySeconds below is a third
# mitigation, identified but never actually tried during the original four incidents
# (see docs/provenance-policy.md's "attempt 5" follow-up): the chart's own default probe
# timing (30s/10s initialDelay) kills mysql mid first-boot schema init on this Mac's
# virtualized disk path, forcing a restart that compounds I/O contention rather than one
# init just being slow. Raised well past first-boot's observed worst case.
#
# trillian.mysql.image / trillian.initContainerImage.netcat overrides (2026-09-05,
# on kiac/Apple `container`, arm64-native, no emulation): the chart's own pinned
# gcr.io/trillian-opensource-ci/db_server and docker.io/subfuzion/netcat images are both
# genuinely single-arch (amd64 only) - confirmed live via `docker manifest inspect`
# (`manifests: null` / a single non-index manifest, not a multi-arch index), which is
# why both failed outright with "exec format error" the moment kiac's real per-VM
# isolation replaced podman - no emulation layer papering over it this time. This is
# very likely the true explanation for every prior podman-era "I/O storm": those amd64
# images were almost certainly running under qemu-user binfmt emulation the whole time,
# and MySQL's disk-heavy first-boot schema init is exactly the kind of workload
# emulation overhead turns into an apparent storm. Every OTHER image this chart pulls in
# (trillian_log_server/log_signer, createdb, createtree, rekor-server, curlimages/curl)
# is confirmed genuinely multi-arch (real OCI image indexes with an arm64/v8 entry) -
# checked live, not assumed. Fix: swap only the two broken images for real multi-arch
# equivalents that do the same job. `createdb` (a separate, already-multi-arch sigstore
# job) applies Trillian's schema itself via a plain mysql_uri - db_server was never more
# than a stock MySQL server with the right MYSQL_USER/PASSWORD/DATABASE env vars, so a
# real official multi-arch mysql image is a drop-in replacement, not a re-architecture.
server:
  ingress:
    enabled: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
trillian:
  initContainerImage:
    netcat:
      registry: docker.io
      repository: library/busybox
      version: "sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
  mysql:
    # auth.password/rootPassword are DELIBERATELY NOT set here - this file is shared,
    # cluster-agnostic reference config living in platform-cicd.git (ADR-0006: no
    # cluster secrets in the app repo). They're supplied per-cluster instead, via
    # gitops-cluster-<name>'s own 50-platform-cicd/rekor/values-secrets.yaml
    # (generated by hack/customize-cluster.sh, same pattern as Infisical's own
    # PG/Redis passwords there).
    #
    # Pinning them explicitly (to ANY fixed value, not left to the chart's own
    # random-password helper) is still required, for a real reason found live: the
    # chart's `trillian.randomSecret` helper uses `lookup` to reuse an existing
    # secret's value across upgrades, but looks it up in .Release.Namespace
    # (rekor-system) while forceNamespace actually puts the real Secret in
    # trillian-system - the lookup never finds it, so a NEW random password gets
    # generated on every single `helm upgrade`, instantly desyncing the
    # already-booted mysql container's real password from what the next createdb
    # Job/upgrade expects (confirmed live: "Access denied for user 'mysql'..."
    # right after a probe-only upgrade that never touched auth). A fixed value
    # sidesteps the buggy helper entirely - genuinely internal, ClusterIP-only DB
    # auth for a local Merkle-tree store, not real crypto material like Fulcio's
    # root key, so a per-cluster-generated-but-committed value is an acceptable
    # tradeoff here the way it wouldn't be for a signing key.
    image:
      registry: docker.io
      repository: library/mysql
      version: "sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b"
    # The chart's default mysql.args (--ignore-db-dir=lost+found) is a MySQL 5.7-only
    # flag tuned for the old amd64-only db_server image above - mysqld 8.0 removed the
    # --ignore-db-dir option entirely and refuses to start with it ("unknown variable"),
    # confirmed live. Cleared, not needed with a stock image's own datadir handling.
    args: []
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      # No memory limit, deliberately - both 1Gi and 2Gi genuinely OOMKilled MySQL
      # during first-boot schema init (confirmed live both times, not guessed), and the
      # VM has plenty of real headroom (30Gi+ available) whenever this happened - the
      # ceiling was the problem, not actual VM memory pressure. The staged rollout
      # (nothing else heavy running concurrently while this starts) is the real safety
      # mechanism here, not a per-container cap MySQL's own bootstrap keeps blowing
      # through.
    # Also replaces the exec handler (`/etc/init.d/mysql status`) entirely: that's a
    # Debian/db_server-specific sysvinit script path that doesn't exist in the stock,
    # RPM-based mysql:8.0 image (confirmed live - "no such file or directory", both
    # probes erroring from the moment the container starts). A plain TCP check on 3306
    # is sufficient here - createdb's own retry loop already tolerates "server not
    # accepting connections yet", we just need the probes to stop lying.
    livenessProbe:
      initialDelaySeconds: 180
      exec: null
      tcpSocket:
        port: 3306
    readinessProbe:
      initialDelaySeconds: 120
      exec: null
      tcpSocket:
        port: 3306
  logServer:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
  logSigner:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
redis:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
