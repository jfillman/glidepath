<text x="48" y="656" fill="#1b1f24" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', Georgia, serif"><tspan x="48" dy="0">Events go out before state is written. If the write then fails, the next fact repeats the same deterministic event ids, which the broker</tspan><tspan x="48" dy="17">collapses; the other order could lose an event for good. A write conflict between the two relay replicas re-reads and re-reduces.</tspan><tspan x="48" dy="17">A record the relay cannot write degrades to the stateless Phase 1 behaviour. Nothing retries the 502 itself: the heartbeat fact</tspan><tspan x="48" dy="17">(every 15 minutes) is the retry.</tspan></text>
