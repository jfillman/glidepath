<text x="96" y="420" fill="#1b1f24" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', Georgia, serif"><tspan x="96" dy="0">Ignored, never a release: a scale, restart, heartbeat, a Progressing after the release is terminal, a Healthy already reported.</tspan><tspan x="96" dy="17">Drift (a ReleaseDrift Event, state unchanged): a changed pod hash on a known release, or Degraded after Healthy was reported.</tspan><tspan x="96" dy="17">Stalled (a ReleaseStalled Event from the sweeper): merged or progressing with no fact for 45 minutes.</tspan></text>
