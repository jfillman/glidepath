<title id="adr-0021-proposed-title">Proposed: prod emits facts, dev decides meaning</title>
<desc id="adr-0021-proposed-desc">Architecture showing the Rollouts controller on the prod cluster posting small facts to a relay and reducer on the dev cluster, which joins them with a release record and emits the existing CDEvents.</desc>
