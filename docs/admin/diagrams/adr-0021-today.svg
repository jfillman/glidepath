<title id="adr-0021-today-title">Today: hook-driven release outcome loop</title>
<desc id="adr-0021-today-desc">Architecture showing a gitops PR merge, Argo CD on the prod cluster running PreSync, PostSync and SyncFail hook Jobs that call a relay on the dev cluster, which forwards CDEvents to a broker and a notify PipelineRun.</desc>
