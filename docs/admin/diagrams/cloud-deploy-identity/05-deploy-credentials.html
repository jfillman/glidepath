<body><div class="frame"><p class="eyebrow">Hangar · keyless cloud deploys</p><h1>How the deploy step gets its AWS access</h1>

text><polygon points="500,216 620,260 500,304 380,260" fill="#f2efe9"/><polygon points="500,216 620,260 500,304 380,260" fill="#ffffff" stroke="#1b1f24" stroke-width="1"/><text x="500" y="257" fill="#1b1f24" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Token belongs to</text><text x="500" y="272" fill="#1b1f24" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">glidepath-cloud-deployer?</text><polygon points="500,332 620,376 500,420 380,376" fill="#f2efe9"/><polygon points="500,332 620,376 500,420 380,376" fill="#ffffff" stroke="#1b1f24" stroke-width="1"/><text x="500" y="373" fill="#1b1f24" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">STS accepts</text><text x="500" y="388" fill="#1b1f24" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the role?</text><rect x="696" y="348" width="264" height="56" rx="6" fill="#f2efe9"/><rect x="696" y="348" width="264" height="56" rx="6" fill="rgba(185,121,31,0.08)" stroke="#b9791f" stroke-width="1"/><text x="828.0" y="373.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Assume glidepath-deploy-&lt;fn&gt;</text><text x="828.0" y="389.0" fill="#5b6570" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no stored key</text><rect x="56" y="118" width="244" height="44" rx="20" fill="#f2efe9"/><rect x="56" y="118" width="244" height="44" rx="20" fill="#ffffff" stroke="#1b1f24" stroke-width="1"/><text x="178.0" y="138.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deploy fails</text><text x="178.0" y="152.0" fill="#5b6570" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">error names clusters.yaml</text><rect x="56" y="238" width="244" height="44" rx="20" fill="#f2efe9"/><rect x="56" y="238" width="244" height="44" rx="20" fill="#ffffff" stroke="#1b1f24" stroke-width="1"/><text x="178.0" y="258.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deploy fails</text><text x="178.0" y="272.0" fill="#5b6570" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">error names taskRunSpecs</text><rect x="56" y="354" width="244" height="44" rx="20" fill="#f2efe9"/><rect x="56" y="354" width="244" height="44" rx="20" fill="#ffffff" stroke="#1b1f24" stroke-width="1"/><text x="178.0" y="374.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deploy fails</text><text x="178.0" y="388.0" fill="#5b6570" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">error names the deploy Role</text></svg></div></div></body></html>
