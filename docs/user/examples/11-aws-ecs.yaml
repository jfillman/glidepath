# Example 11: deploy to AWS ECS (Fargate), dev on every push, prod through an approved release
#
# For an app that runs on ECS instead of this platform's Kubernetes clusters. Start here if you are
# configuring a cloud app for the first time.
#
# Before this file can deploy anything, the infrastructure has to exist. Glidepath never creates it:
#   1. An Airframe AwsEcsTarget per environment, committed to tenants/<app>/xr-requests/ in the dev
#      cluster's tenants repo (Airframe docs/user/cloud-targets.md). It creates the ECS cluster,
#      service and first task definition, an ECR repository for the images, and the deploy role
#      the pipeline assumes.
#   2. Nothing else. There is no AWS key to put anywhere: the deploy step proves who it is with a
#      short-lived token and AWS grants it one hour of access to that target's deploy role
#      (docs/admin/cloud-deploy-identity.md).
#
# Where the deploy.ecs values come from: the AwsEcsTarget's status, once it is Ready.
#   kubectl -n app-<app>-cicd get awsecstarget <name> -o jsonpath='{.status.cicd}'
# prints exactly the block below for that target. Copy it; don't guess the names.
#
# What happens:
#   push to main -> [build] -> [deploy dev]                      (every push, no approval)
#   Tower "Promote" (or a release step) -> a pin PR on this repo  (glidepath/releases/prod.yaml)
#   merge the pin PR -> [deploy prod]                            (ADR-0020)
#
# Each deploy copies the image from ghcr.io into the service's ECR repository (Fargate can only
# pull a private image from there), registers a new task-definition revision with only the image
# changed, points the service at it and waits for ECS to report it stable.
apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: go-1.23                # the build image; must be one of the schema's agents
  platforms: [arm64]            # build only what the service runs: AwsEcsTarget defaults to
                                # ARM64 Fargate (spec.architecture). Building amd64 on the arm64
                                # build node is slow, and crashes for Go (known gap 37).
  containerfile: ./Containerfile

pipelines:
  ci:
    trigger: { source: git, event: push, branch: main }
    steps:
      - stage: build
      - stage: deploy           # without this step a push builds an image and deploys nothing
        env: dev                # must be an environment declared under deploy.environments

deploy:
  target: aws-ecs               # per app: every environment deploys to ECS. Kubernetes is the
                                # default when this is unset.
  environments:                 # every environment, once, in promotion order
    - name: dev
      tier: ground              # ground: deployed automatically by the ci flow above
      ecs:                      # this environment's service: an AwsEcsTarget's status.cicd
        cluster: example-app            # the ECS cluster (the target's spec.appName)
        service: example-app-dev        # the service (<appName>-<env>); its ECR repository and
                                        # deploy role (glidepath-deploy-ecs-<service>) are named
                                        # after it
        containerName: example-app      # the container in the task definition whose image changes
        region: us-east-1
        # taskDefinitionFamily: ""      # defaults to <app>-<env>, which is what the target creates
    - name: prod
      tier: flight              # flight: deployed only when a release pin PR for prod is merged.
                                # Onboarding generates the promote-prod flow that does it; it does
                                # not appear under pipelines.
      ecs:                      # a second AwsEcsTarget, created with spec.env: prod
        cluster: example-app
        service: example-app-prod
        containerName: example-app
        region: us-east-1

# No secrets: block for AWS. aws-access-key-id / aws-secret-access-key are ignored since
# 2026-10-17; delete them if an older file still lists them.

notifications:
  backstage:
    enabled: true               # deploy results show in Backstage and Tower
