# Example 7: Two TestWorkflows against the same build
#
# A single build can be exercised by more than one test step in the same flow - useful
# when you want a fast smoke-style TestWorkflow to gate before running a slower, fuller
# integration one, without triggering two separate builds. Each `test` step needs its
# own `testName` here specifically because they'd otherwise be indistinguishable (both
# would inherit the same top-level test.name and look identical).
#
# Flow shape:
#
#   push to main -> [build] -(artifact.published)-> [test:smoke] -(testcaserun.finished)->
#                    [test:integration] -(testcaserun.finished)-> [deploy:dev]
#
# Confirmed live: flow-triggers.yaml's per-step-index Trigger naming correctly
# disambiguates two steps that share the same stage name ("test" twice) - each gets its
# own Trigger/TriggerBinding/TriggerTemplate object rather than colliding.
apiVersion: platform/v1
kind: PipelineConfig
build:
  agent: nodejs-20
  script: ./build.sh
test:
  name: integration # the fallback/default - only actually used if a test step
  # omits its own `testName`, which neither one does below
deploy:
  environments:
    - name: dev
      tier: ground
pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: test
        env: dev
        testName: smoke # overrides the top-level test.name for this step -
        # platform/smoke.yaml is what actually runs
      - stage: test
        env: dev
        testName: integration # a second, independent test step - platform/integration.yaml
      - stage: deploy
        env: dev
