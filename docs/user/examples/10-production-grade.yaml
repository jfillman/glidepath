# Example 10: Production-grade, everything together
#
# A capstone example combining most of the platform's real features into one realistic
# config for a service that actually matters: path-filtered builds (monorepo-friendly),
# dependency caching, two TestWorkflows, dev/staging promotion, a fully governance-gated
# release requiring signed commits, and real Slack notifications. Not a "toggle
# everything on" demo - each choice below is what a team shipping a real production
# service would plausibly want.
#
# Flow shape:
#
#   push to main (only if api/** or build.sh changed)
#     -> [build] -> [test:smoke] -> [test:integration] -> [deploy:dev] -> [deploy:staging] -> [release]
#
#   pull_request -> [build]   (validation only, no deploy)
#
apiVersion: platform/v1
kind: PipelineConfig
build:
  agent: nodejs-20
  script: ./build.sh
  containerfile: ./Containerfile
  unitTest:
    enabled: true
    command: ./test.sh
  cache:
    enabled: true
    size: medium
test:
  name: integration # fallback default; the flow below overrides per-step anyway
deploy:
  environments:
    - name: dev
      tier: ground
    - name: staging
      tier: flight
governance:
  sast: true
  imageScan: true
  policyCheck: true # the release gate always verifies the promoted commit's signature
  sbom: true
  # Who may sign and merge is the platform admins' release-signing policy
  # (docs/admin/commit-signing.md), not this file. This app can only tighten the
  # GitHub-merge path, if the admins turn it on for it: every PR commit gitsign-signed,
  # and one approval of the final head by another allowed merger.
  githubMerge:
    mode: strict
    requiredApprovals: 1
notifications:
  slack:
    enabled: true
    channel: "#team-releases"
    scanResults: true # separate pings the moment sast/imageScan produce a result,
    # not just the general pass/fail per stage
pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
      filePathPattern: ["api/**", "build.sh"] # skip the whole flow entirely if a
      # push touches neither - useful in a
      # monorepo where this app is one of
      # several under one repo
    steps:
      - stage: build
      - stage: test
        env: dev
        testName: smoke
      - stage: test
        env: dev
        testName: integration
      - stage: deploy
        env: dev
      - stage: deploy
        env: staging
      - stage: release
        env: staging # promotes to the governed release path - the required GitHub
        # status checks in .Values.releaseGuardrails (sast/image-scan/
        # provenance/sbom today, see docs/admin/release-guardrails.md)
        # plus your gitops repo's own required-reviewer branch
        # protection have to pass before this can merge
  pr-check:
    trigger:
      source: git
      event: pull_request
      branch: main
      filePathPattern: ["api/**", "build.sh"]
    steps:
      - stage: build
