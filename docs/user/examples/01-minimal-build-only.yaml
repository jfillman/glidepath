# Example 1: Minimal - build only
#
# The smallest valid cicd.yaml. Pushes to main build, unit-test, and publish an image
# to ghcr.io - nothing deploys. Good starting point for a brand new app, or for a
# library/CLI tool that never gets deployed at all, just published as an image/artifact.
#
# Flow shape:
#
#   push to main -> [build]
#
apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20   # swap for openjdk-17/21, python-3.11, go-1.22, nodejs-18/22
  script: ./build.sh # runs `npm ci && npm run build` (or your own equivalent) inside
                      # the agent image; omit this key entirely if your whole build
                      # lives inside a multi-stage Containerfile instead - see
                      # 08-containerfile-only-build.yaml

pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
