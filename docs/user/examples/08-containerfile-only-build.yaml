# Example 8: Whole build inside a multi-stage Containerfile (no build.script)
#
# The second of the two build strategies - see ../cicd-yaml-reference.md's "Two build
# strategies". Omitting `build.script` entirely switches the whole build into your
# Containerfile: kaniko builds it directly, and the separate build-source Task (which
# would otherwise run your build.sh) is skipped completely - there's presence/absence
# of `script`, no separate boolean, so there's no way to have this silently mean the
# wrong thing via an unrelated typo.
#
# build.agent is still required even here - unit tests always run inside it,
# independent of which build strategy you pick.
#
# Build caching in this path comes from kaniko's own layer cache, not build.cache (that
# field only applies to the build.script path) - order your Containerfile so
# `COPY package*.json .` / `RUN npm ci` happens BEFORE copying the rest of your source,
# standard Docker layer-caching practice, or the cache invalidates on every source
# change regardless of whether dependencies actually changed.
#
# Flow shape:
#
#   push to main -> [build] -> [test:dev] -> [deploy:dev]
#
# (identical flow shape to 02-standard-ci.yaml - the only difference this example shows
# is the build strategy itself)
apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20         # still required - unit tests run in this image regardless
  # script: omitted on purpose - the whole build happens in Containerfile below
  containerfile: ./Containerfile  # expected to be a real multi-stage build, e.g.:
                            #   FROM node:20 AS builder
                            #   WORKDIR /app
                            #   COPY package*.json .
                            #   RUN npm ci
                            #   COPY . .
                            #   RUN npm run build
                            #   FROM node:20-slim
                            #   COPY --from=builder /app/dist ./dist
                            #   CMD ["node", "dist/index.js"]

test:
  name: integration

deploy:
  lowerEnvironments: [dev]

pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: test
        env: dev
      - stage: deploy
        env: dev
