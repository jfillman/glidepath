# STUB, but with its own dedicated Pipeline (unlike itsm/policy-validation, which still
# share governance-check) - see docs/admin/governance-stubs.md and
# docs/admin/release-guardrails.md. References the qa-check Pipeline, which calls
# qa-gate.yaml, which itself still calls governance-gate-stub's shared machinery under
# the hood - loud "no real check implemented yet" logging + a stub span, never a silent
# pass (ADR-0003). Intended real behavior: verify the required TestWorkflow actually ran
# and passed for the commit being promoted (mechanism TBD - likely reading the test
# stage's own recorded outcome rather than re-running tests here). Landing that is now a
# one-file change to qa-gate.yaml's own step - see that Task's own header for why it's
# already shaped to receive it; nothing about this onboarding template needs to change.
#
# No <APP_NAMESPACE> substitution or workspace needed (an <APP_NAME> substitution now exists, for the platform.io/app label below) - same reasons as
# pull-request-sast.yaml. pr-number feeds the finally-block PR comment.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: qa-
  labels:
    platform.io/app: "<APP_NAME>"
  annotations:
    # See pull-request-sast.yaml for why this is on-cel-expression (release-branch-only)
    # and why has() guards the pull_request field.
    pipelinesascode.tekton.dev/on-cel-expression: 'has(body.pull_request) && body.pull_request.base.ref == "main" && body.pull_request.head.ref.startsWith("release-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: qa-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: pr-number, value: "{{ body.pull_request.number }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    # tasks/finally split - see pull-request-sast.yaml's own header (2026-08-23) for
    # why finally/comment-pr must never share a budget with the real check tasks.
    tasks: "8m"
    # finally bumped 2m->4m - see pull-request-sast.yaml's own header (2026-08-24)
    # for the live comment-pr cancellation this fixes.
    finally: "4m"
    pipeline: "12m"
