{{- $appNamespace := include "glidepath-app.namespace" . }}
{{- $gm := .Values.governance.githubMerge | default dict }}
# Rendered unconditionally, regardless of governance.policyCheck: the release-gate Task
# that reads this (verify-commit-signature.yaml) is a required GitHub Check the tenant
# can't turn off. governance.policyCheck no longer gates anything real; kept in the
# schema to avoid a breaking removal.
#
# Since 2026-10-20 this holds only the app's TIGHTEN-ONLY knobs for the provenance gate's
# GitHub-merge path (docs/admin/commit-signing.md): github-merge-mode ("strict" or empty)
# and github-merge-required-approvals. The release-signing policy itself - who may sign,
# whether a GitHub merge counts, who may merge - is admin-owned in the catalog chart
# (releaseSigning -> ConfigMap release-signing-policy), not here: this ConfigMap is filled
# from the app's own cicd.yaml, so the team being gated could add itself to the list that
# gates it. governance.allowedCommitSigners is still accepted by the schema and ignored.
#
# Lives in the Application's own namespace so the same-namespace verify-commit-signature
# Task (part of the release stage's `provenance` gate, renamed from `policy-check`
# 2026-08-23) can read it without cross-namespace RBAC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.platformIdentity.appName }}-policy-config
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "governance"
  namespace: {{ $appNamespace }}
data:
  # Tighten-only: "strict" makes the gate require every PR commit gitsign-signed even when the
  # admin policy says merger; empty leaves the admin's mode. The higher approval count wins.
  github-merge-mode: {{ $gm.mode | default "" | quote }}
  github-merge-required-approvals: {{ $gm.requiredApprovals | default 0 | toString | quote }}
---
# Lets pipeline-runner read exactly this one named ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-policy-config-read-{{ .Values.platformIdentity.appName }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "governance"
  namespace: {{ $appNamespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Values.platformIdentity.appName }}-policy-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-policy-config-read-{{ .Values.platformIdentity.appName }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "governance"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-policy-config-read-{{ .Values.platformIdentity.appName }} }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ $appNamespace }}
