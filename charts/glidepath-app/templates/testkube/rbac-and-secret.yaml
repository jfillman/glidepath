{{- if eq (include "glidepath-app.hasStage" (dict "ctx" . "name" "test")) "true" }}
# templates/testkube/rbac-and-secret.yaml
#
# Only rendered for Applications that declare a `test` stage. Everything here targets
# Testkube's own shared `testkube` namespace (NOT this Application's own
# <type>-<appName>-cicd namespace) - a deliberate, documented exception to this chart's
# usual "only ever touches its own namespace" rule (see pipeline-runner.yaml's own
# header on that rule), forced by Testkube CE's single-shared-namespace limitation
# (glidepath-control-plane's templates/testkube/rbac.yaml has the full story).
#
# Three things, all scoped to exactly this Application:
#
# 1. A placeholder Secret, pre-created empty so run-testworkflow.yaml's Testkube
#    step only ever needs get/update/patch on it - never create. That's the actual
#    security property this buys: Kubernetes RBAC can restrict get/update/patch/delete
#    to an exact resourceName, but NOT create (create has no object to check a name
#    against yet), so if the pipeline's own SA held create rights on secrets in this
#    shared namespace, a compromised pipeline-runner in ANY tenant could mint a secret
#    named after a DIFFERENT tenant's convention and get it read back by that tenant's
#    own TestWorkflow. Pre-seeding the object here and granting only get/update/patch
#    closes that off - the pipeline can only ever overwrite the data of the one secret
#    object this Application's own onboarding already created for it.
# 2. A Role+RoleBinding granting exactly that (get/update/patch on this one named
#    Secret, resourceNames-restricted), bound to this Application's own pipeline-runner
#    SA only.
# 3. A RoleBinding (no new Role - reuses glidepath-control-plane's shared
#    testkube-testworkflow-runner Role) letting this Application's pipeline-runner
#    create/manage TestWorkflow/TestWorkflowExecution objects in the shared namespace.
#    Deliberately NOT resourceNames-restricted - see that shared Role's own header for
#    why (self-service test naming needs it, and the accepted blast-radius tradeoff).
{{- $appNamespace := include "glidepath-app.namespace" . }}
{{- $secretName := printf "%s-app-secrets" .Values.platformIdentity.appName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.testkubeNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "testkube"
  annotations:
    # Purely informational - nothing reads this back. Documents why an object owned by
    # this Application's own Helm release lives outside this Application's own
    # namespace, for anyone auditing the shared testkube namespace's contents.
    hangar.io/owner-application: {{ .Values.platformIdentity.appName }}
type: Opaque
data: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.testkubeNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "testkube"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.testkubeNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "testkube"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $secretName }} }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ $appNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.platformIdentity.appName }}-testworkflow-runner
  namespace: {{ .Values.testkubeNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "testkube"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: testkube-testworkflow-runner }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ $appNamespace }}
{{- end }}
