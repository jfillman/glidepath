{{- if eq (include "glidepath-app.hasStage" (dict "ctx" . "name" "deploy")) "true" }}
{{- $appNamespace := include "glidepath-app.namespace" . }}
{{- /* Only same-cluster envs get local RBAC - a cluster-mapped entry has no local
namespace to grant access into (docs/multi-cluster.md). */ -}}
{{- $envs := include "glidepath-app.localDeployEnvs" . | fromYamlArray }}
{{- range $envs }}
---
# One copy per declared deploy env, rendered only if cicd.yaml declares a "deploy" stage.
#
# Without this, deploy-manifests.yaml's `kubectl get rollout` (waiting for Healthy after
# a platform/envs/<env>.yaml push) fails Forbidden - pipeline-runner's Role only grants
# rights in the Application's own namespace, and the deploy namespace is a separate peer
# under the flat <type>-<app-name>-<env> pattern.
#
# rollouts.argoproj.io, not deployments: deploy-manifests.yaml only reads (get/list/watch)
# the Rollout now - the image change goes through a git commit synced by ArgoCD selfHeal,
# not a direct mutation here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-pipeline-runner-deploy
  labels:
    {{- include "glidepath-app.labels" $ | nindent 4 }}
    hangar.io/subcomponent: "env"
  namespace: {{ include "glidepath-app.envNamespace" (list $ .) }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-pipeline-runner-deploy
  labels:
    {{- include "glidepath-app.labels" $ | nindent 4 }}
    hangar.io/subcomponent: "env"
  namespace: {{ include "glidepath-app.envNamespace" (list $ .) }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-pipeline-runner-deploy }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ $appNamespace }}
{{- end }}
{{- end }}
