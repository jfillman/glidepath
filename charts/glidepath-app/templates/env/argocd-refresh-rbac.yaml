{{- if and (eq (include "glidepath-app.hasStage" (dict "ctx" . "name" "deploy")) "true") (eq (include "glidepath-app.isKubernetesTarget" .) "true") }}
{{- $app := .Values.platformIdentity.appName }}
{{- $names := list }}
{{- range (include "glidepath-app.lowerEnvNames" . | fromYamlArray) }}
{{- $names = append $names (printf "%s-%s" $app .) }}
{{- end }}
{{- if $names }}
# Lets deploy-manifests.yaml ask Argo CD to look at the app repo right after it pushes a Ground release file,
# instead of waiting for argocd-apps' 120 s (+60 s jitter) poll (2026-10-09, report item 8). It annotates the
# environment's Application (<app>-<env>, generated by <app>-lower-envs) with argocd.argoproj.io/refresh=hard.
#
# get+patch on these Applications alone would let the pipeline rewrite the Application itself (its project,
# its destination, an `operation` that syncs another revision). The glidepath-control-plane chart's
# ValidatingAdmissionPolicy `pipeline-runner-application-refresh-only` denies any change from a pipeline-runner
# ServiceAccount other than that one annotation, so this grant is only ever a refresh request.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $app }}-pipeline-runner-refresh
  namespace: argocd-apps
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "env"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: {{ $names | toJson }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $app }}-pipeline-runner-refresh
  namespace: argocd-apps
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "env"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $app }}-pipeline-runner-refresh }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ include "glidepath-app.namespace" . }}
{{- end }}
{{- end }}
