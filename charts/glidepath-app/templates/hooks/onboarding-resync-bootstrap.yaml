{{- if .Values.platformIdentity.registerPipelinesAsCode }}
{{- $appNamespace := include "glidepath-app.namespace" . }}
# ArgoCD PostSync hook - automates the one-time manual bootstrap step documented in
# docs/archive/2026-08-18-pre-refactor/onboarding.md's old step 6 (`kubectl create -f -`
# a PipelineRun by hand). Real structural gap this closes: `.tekton/onboarding-resync.yaml`
# is the file whose PRESENCE is what lets Pipelines-as-Code catch a `cicd.yaml` push and
# deliver the rest of `.tekton/` (deliver-onboarding-files.yaml) - but that file is itself
# one of the things that same mechanism delivers. On a brand-new app repo neither exists
# yet, so no push, past or future, can ever trigger it - PaC only matches against
# `.tekton/*.yaml` files already committed at the pushed ref. Confirmed live 2026-08-24
# onboarding order-api: installing the platform's GitHub App on the repo AFTER `cicd.yaml`
# had already been pushed several times didn't matter either way - even with the App
# installed from the first push, PaC still had nothing in `.tekton/` to match.
#
# `Sync` phase, not `PostSync` - tried PostSync first and hit a real deadlock live
# 2026-08-24 onboarding order-api: PostSync hooks wait for the WHOLE Application to
# reach Healthy before firing, and this namespace's own `build-cache-order-api` PVC
# (WaitForFirstConsumer, see templates/env/build-cache-pvc.yaml) never binds - stays
# Progressing forever - until some Pod actually mounts it. For a genuinely new app
# that Pod only exists once a real `build` PipelineRun has run, which needs
# `.tekton/flow-ci.yaml`, which needs exactly this hook to have fired first. PostSync
# made the one thing meant to unblock the first pipeline run wait on the first
# pipeline run having already happened.
#
# `Sync` phase resources apply as part of the normal wave-ordered manifest set instead
# of gating on overall app health, so they don't inherit that deadlock - confirmed live
# (same order-api PVC, still Pending, no PostSync-style block). No explicit
# `sync-wave` override: stays in the same (default, "0") wave as
# `identity/pipeline-runner.yaml`'s ServiceAccount/Role/RoleBinding, which this Job's
# Pod depends on (serviceAccountName below) - same-wave resources apply together in one
# pass with no ordering between them, but a Job whose ServiceAccount doesn't exist yet
# at the instant of creation just has the Job controller retry pod creation (standard,
# well-tolerated Kubernetes behavior) until it appears a moment later in the same apply
# batch - not a real race in practice.
#
# Same shape/precedent as charts/glidepath-pr-preview-notify's own hook Job (ephemeral-envs.yaml)
# otherwise - "fire an action once this exact Application is real" - just Sync instead
# of PostSync for the reason above.
#
# Deliberately does NOT replace the existing PaC-driven resync mechanism -
# onboarding-mechanics.md documents that split (delivering files INTO the app/gitops
# repos is a PaC concern, not an ArgoCD one) as a real, considered decision, not an
# oversight. This hook only covers the one gap PaC structurally can't close itself: the
# very first delivery. It fires on every sync of this Application, but is a no-op past
# the first real one - see the existence check below - so it doesn't fight PaC's own
# self-heal once `.tekton/onboarding-resync.yaml` is actually there.
#
# Reuses the pipeline-runner ServiceAccount rather than minting a dedicated one: it
# already carries exactly the RBAC this Job needs (create on tekton.dev/pipelineruns,
# identity/pipeline-runner.yaml) and nothing more.
apiVersion: batch/v1
kind: Job
metadata:
  name: onboarding-resync-bootstrap
  namespace: {{ $appNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "hooks"
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: pipeline-runner
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: github-token-broker-token
          projected:
            sources:
              - serviceAccountToken:
                  path: github-token-broker-token
                  audience: github-installation-token
                  expirationSeconds: 600
        # readOnlyRootFilesystem below (unlike glidepath-pr-preview-notify, whose Job never writes
        # a file) needs somewhere writable for `mktemp -d`/`git clone` - hit live
        # 2026-08-24: "mktemp: failed to create directory ... Read-only file system".
        - name: tmp
          emptyDir: {}
      containers:
        - name: bootstrap
          image: {{ .Values.toolboxImage }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: github-token-broker-token
              mountPath: /var/run/secrets/platform
              readOnly: true
            - name: tmp
              mountPath: /tmp
          env:
            - name: GITHUB_TOKEN_BROKER_URL
              value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
            - name: GITHUB_OWNER
              value: {{ .Values.platformIdentity.githubOwner | quote }}
            - name: APP_REPO_URL
              value: {{ .Values.platformIdentity.appRepoUrl | quote }}
            - name: APP_NAMESPACE
              value: {{ $appNamespace | quote }}
            - name: APP_NAME
              value: {{ .Values.platformIdentity.appName | quote }}
            - name: APP_TYPE
              value: {{ .Values.platformIdentity.type | quote }}
            - name: GITOPS_REPO_URL
              value: {{ .Values.platformIdentity.gitopsRepoUrl | quote }}
            - name: CATALOG_NAMESPACE
              value: {{ .Values.platformIdentity.catalogNamespace | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              source "${PLATFORM_LIB}/github-app.sh"

              # Same owner/repo derivation deliver-onboarding-files.yaml itself uses -
              # repo name isn't assumed to equal app-name.
              repo="$(echo "${APP_REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"

              token="$(github_app_installation_token "${GITHUB_OWNER}" "${repo}")"
              workdir="$(mktemp -d)"
              clone_url="https://x-access-token:${token}@github.com/${GITHUB_OWNER}/${repo}.git"

              if git clone --quiet --depth 1 "${clone_url}" "${workdir}/repo" 2>/dev/null \
                  && [[ -f "${workdir}/repo/.tekton/onboarding-resync.yaml" ]]; then
                echo ".tekton/onboarding-resync.yaml already exists on ${GITHUB_OWNER}/${repo} - PaC's own cicd.yaml-push resync owns .tekton/ from here. Nothing to bootstrap."
                exit 0
              fi

              echo "No .tekton/onboarding-resync.yaml yet on ${GITHUB_OWNER}/${repo} - firing the one-time bootstrap PipelineRun (docs/admin/onboarding-mechanics.md step 6)."
              kubectl create -f - <<EOF
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                generateName: onboarding-resync-bootstrap-
                namespace: ${APP_NAMESPACE}
              spec:
                pipelineRef:
                  resolver: cluster
                  params:
                    - { name: kind, value: pipeline }
                    - { name: name, value: onboarding-resync }
                    - { name: namespace, value: ${CATALOG_NAMESPACE} }
                params:
                  - { name: git-url, value: "${APP_REPO_URL}" }
                  - { name: app-namespace, value: "${APP_NAMESPACE}" }
                  - { name: app-name, value: "${APP_NAME}" }
                  - { name: app-type, value: "${APP_TYPE}" }
                  - { name: github-owner, value: "${GITHUB_OWNER}" }
                  - { name: gitops-repo-url, value: "${GITOPS_REPO_URL}" }
                taskRunTemplate:
                  serviceAccountName: pipeline-runner
                timeouts:
                  pipeline: "10m"
              EOF
{{- end }}
