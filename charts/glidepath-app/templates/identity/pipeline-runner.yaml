{{- $appNamespace := include "glidepath-app.namespace" . }}
# Unconditional - every Application needs this identity regardless of declared stages.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
# Reuses kaniko's registry-credentials Secret so TaskRun pods can pull the private
# platform-cicd-toolbox image from this deployment's own registry.
imagePullSecrets:
  - name: registry-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Added for run-testworkflow.yaml's Testkube step: it reads this namespace's own
  # app-secrets via the API (to re-materialize it into Testkube's shared namespace,
  # see glidepath-app's templates/testkube/rbac-and-secret.yaml) rather than a
  # volume mount, since which keys to forward isn't known until runtime. get-only,
  # resourceNames-restricted to the one Secret this Role's own namespace already trusts
  # this pipeline with - not a general secrets-read grant.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-secrets"]
    verbs: ["get"]
  # release-tracking ConfigMaps (open-release-pr.yaml writes release-tracking-<chain-id>
  # holding pr-url/pr-created-at, since those can't be committed to git before the PR
  # exists - see that Task's own header; release-outcome-notify.yaml's
  # resolve-release-tracking Task reads + deletes it). Can't be resourceNames-restricted
  # like the app-secrets grant above - the name is dynamic per chain-id - so this is
  # genuinely configmaps-wide within this one namespace, not just one object.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "delete"]
  # Deliberately no apps/deployments rule (that's deploy-rbac.yaml, a peer namespace),
  # no impersonate, no wildcards, no cluster-scoped rules - this plus the configmaps
  # grant above is the entire blast radius of a compromised pipeline-runner identity
  # (plus the narrowly-scoped cross-namespace Testkube grants in
  # templates/testkube/rbac-and-secret.yaml).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pipeline-runner }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ $appNamespace }}
---
# Lets the shared broker (platform-system/cdevents-broker) create the next-stage
# PipelineRun as this Application's pipeline-runner SA only, in this namespace only -
# not a cluster-wide impersonate grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-broker-impersonate-pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["pipeline-runner"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-broker-impersonate-pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-broker-impersonate-pipeline-runner }
subjects:
  - kind: ServiceAccount
    name: cdevents-broker
    namespace: platform-system
