{{- $appNamespace := include "glidepath-app.namespace" . }}
# Unconditional - every Application needs this identity regardless of declared stages.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
# Reuses the image build's registry-credentials Secret so TaskRun pods can pull the private
# glidepath-toolbox image from this deployment's own registry.
imagePullSecrets:
  - name: registry-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
rules:
  # Read only. stage-debrief and comment-pr-check-result read this run's own PipelineRun/TaskRun
  # results. It cannot create a run: a pod running as this account could otherwise submit a TaskRun
  # (or a PipelineRun) of its own shape - any image, any projected-token audience (the Clearance one
  # included), any Secret of this namespace mounted. Creating runs is pipeline-trigger's, below.
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Added for run-testworkflow.yaml's Testkube step: it reads this namespace's own
  # app-secrets via the API (to re-materialize it into Testkube's shared namespace,
  # see glidepath-app's templates/testkube/rbac-and-secret.yaml) rather than a
  # volume mount, since which keys to forward isn't known until runtime. get-only,
  # resourceNames-restricted to the one Secret this Role's own namespace already trusts
  # this pipeline with - not a general secrets-read grant.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-secrets"]
    verbs: ["get"]
  # release-tracking ConfigMaps (open-release-pr.yaml writes release-tracking-<chain-id>
  # holding pr-url/pr-created-at, since those can't be committed to git before the PR
  # exists - see that Task's own header; release-outcome-notify.yaml's
  # resolve-release-tracking Task reads + deletes it). Can't be resourceNames-restricted
  # like the app-secrets grant above - the name is dynamic per chain-id - so this is
  # genuinely configmaps-wide within this one namespace, not just one object.
  # list: mark-release-merged.yaml finds a release's record by its PR URL (ADR-0021 phase 2).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Deliberately no apps/deployments rule (that's deploy-rbac.yaml, a peer namespace),
  # no impersonate, no wildcards, no cluster-scoped rules, no run creation - this plus the configmaps
  # grant above is the entire blast radius of a compromised pipeline-runner identity
  # (plus the narrowly-scoped cross-namespace Testkube grants in
  # templates/testkube/rbac-and-secret.yaml).
  #
  # Trust model (docs/admin/security.md, "Pipeline identities"): pipeline-runner runs the CATALOG's
  # tasks, whose code the platform ships. It never runs the app repository's code: build-source,
  # unit-test and the artifact builds run as source-runner, which has no credentials at all.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pipeline-runner }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ $appNamespace }}
---
# The identity that CREATES PipelineRuns in this namespace: the Triggers that chain the next stage
# (impersonated by the shared broker, below) and the one-time onboarding bootstrap Job. No task runs
# as it, so no source code and no catalog task ever holds a token that can create a run. The run
# it creates executes as pipeline-runner (taskRunTemplate.serviceAccountName), not as this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-trigger
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-trigger
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-trigger
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pipeline-trigger }
subjects:
  - kind: ServiceAccount
    name: pipeline-trigger
    namespace: {{ $appNamespace }}
---
# Runs the app repository's own code: the build stage's build-source, unit-test and artifact builds
# (build.sh, test.sh, dependency installs, `python -m build`, `go build`). It has NO Role and NO
# RoleBinding, and its token is not mounted: code from a pull request that runs there cannot read or
# write the Kubernetes API, cannot touch the release records (release-tracking-*), and has no
# projected token for any audience. Nothing must ever bind this account to a Role; the chart test
# (tests/pipeline_least_privilege_test.py) fails if anything does. It carries the registry pull
# secret only so its pod can pull the same toolbox image the other tasks pull.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: source-runner
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
automountServiceAccountToken: false
imagePullSecrets:
  - name: registry-credentials
---
# Lets the shared broker (platform-system/cdevents-broker) create the next-stage
# PipelineRun as this Application's pipeline-trigger SA only, in this namespace only -
# not a cluster-wide impersonate grant. (The run itself executes as pipeline-runner.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-broker-impersonate-pipeline-trigger
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["pipeline-trigger"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-broker-impersonate-pipeline-trigger
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-broker-impersonate-pipeline-trigger }
subjects:
  - kind: ServiceAccount
    name: cdevents-broker
    namespace: platform-system
