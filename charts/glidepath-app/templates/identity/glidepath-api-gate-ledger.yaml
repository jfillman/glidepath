{{- $appNamespace := include "glidepath-app.namespace" . }}
# Pipeline trust T4, W-8 (hangar specs/plans/w8-gate-verdict-record-service.md). glidepath-api (platform-system) writes the gate
# ledger of this app's release records itself (POST /v1/apps/{app}/pipelineruns/{name}/gate-verdict, docs/admin/api.md "Gate
# verdicts"), so no task account needs a ConfigMap write for it. patch only, in this one namespace: no create, update or delete,
# and no read beyond what glidepath-api's own ClusterRole already has (configmaps get, list). RBAC cannot narrow a patch to the
# release records or to the ledger keys; the control plane's gate-ledger-writes admission policy does (Deny).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glidepath-api-gate-ledger
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glidepath-api-gate-ledger
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: glidepath-api-gate-ledger }
subjects:
  - kind: ServiceAccount
    name: glidepath-api
    namespace: platform-system
