{{- /*
The cluster's observability facts for this app, as ConfigMap glidepath-observability (data key values.yaml): the very
`observability` block the environment ApplicationSets give airframe-application (glidepath-app.observabilityValues),
so the clearance-gate task can render with exactly what Argo CD renders with. Without it a tenant on a cluster that
sets observability would have a tree at PR time that differs from the one Argo CD's plugin registers at sync, and no
clearance would be found. Not rendered when the cluster sets none (the gate then injects nothing, as Argo CD does),
or for an app that does not deploy to Kubernetes (the gate covers k8s-rollout only).
*/ -}}
{{- if eq (include "glidepath-app.isKubernetesTarget" .) "true" }}
{{- $block := include "glidepath-app.observabilityValues" (dict "ctx" $ "chart" (include "glidepath-app.defaultChart" $ | fromYaml)) }}
{{- if and (or (($.Values.observability | default dict).namespace) (($.Values.observability | default dict).instrumentation)) $block }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: glidepath-observability
  labels:
    {{- include "glidepath-app.labels" $ | nindent 4 }}
    hangar.io/subcomponent: "identity"
  namespace: {{ include "glidepath-app.namespace" $ }}
data:
  values.yaml: |
    {{- $block | nindent 4 }}
{{- end }}
{{- end }}
