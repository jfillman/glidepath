# Only rendered when this app has a cluster-mapped deploy.upperEnvironments entry
# (docs/multi-cluster.md). Lets pipeline-runner read the control-plane chart's
# cluster-registry ConfigMap (platform-system) so open-release-pr.yaml can resolve a
# cluster name to its outcomeRelayURL at release time, instead of duplicating that fact
# into every app's values. get-only, scoped to this one ConfigMap; it holds no secret
# material (a URL and a Secret name to look up separately), so a read grant isn't a
# credential exposure.
{{- if eq (include "glidepath-app.hasClusterMappedUpperEnv" .) "true" }}
{{- $appNamespace := include "glidepath-app.namespace" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  # Per-app name, not shared - two Helm releases owning one identically-named object in
  # the same namespace is a real ownership conflict, not just style.
  name: allow-read-cluster-registry-{{ .Values.platformIdentity.appName }}
  namespace: platform-system
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "clusters"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-registry"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-read-cluster-registry-{{ .Values.platformIdentity.appName }}
  namespace: platform-system
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "clusters"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-read-cluster-registry-{{ .Values.platformIdentity.appName }} }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ $appNamespace }}
{{- end }}
