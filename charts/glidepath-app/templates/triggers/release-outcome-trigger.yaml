# Consumes the environment.deployed CDEvent argocd-outcome-relay forwards once a
# cluster-mapped release env's ArgoCD confirms a sync outcome. Only rendered for apps
# with a cluster-mapped upper env (docs/admin/multi-cluster.md).
#
# Unlike flow-triggers.yaml, this CEL filter does not check extensions.app_namespace -
# the caller is always argocd-outcome-relay's own platform-system SA forwarding on
# behalf of any app, so that extension would just read "platform-system" here. Matches
# on the event's claimed body.subject.content.appNamespace instead - a deliberate,
# bounded trust difference from the TokenReview path (see argocd-outcome-relay/main.go).
{{- if eq (include "glidepath-app.hasClusterMappedUpperEnv" .) "true" }}
{{- $appNamespace := include "glidepath-app.namespace" . }}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: release-outcome-binding
  namespace: {{ $appNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "triggers"
spec:
  params:
    - { name: pipeline-run-name, value: {{ printf "release-outcome-$(body.context.id)" | quote }} }
    - { name: app-namespace, value: "$(body.subject.content.appNamespace)" }
    - { name: app-name, value: "$(body.subject.content.appName)" }
    - { name: env, value: "$(body.subject.content.env)" }
    - { name: cluster, value: "$(body.subject.content.cluster)" }
    - { name: status, value: "$(body.subject.content.status)" }
    - { name: git-url, value: "$(body.subject.content.gitUrl)" }
    - { name: git-revision, value: "$(body.subject.content.gitRevision)" }
    - { name: config-json, value: "$(body.subject.content.configJson)" }
    - { name: chain-id, value: "$(body.context.chainId)" }
    - { name: flow-start-time, value: "$(body.subject.content.flowStartTime)" }
    - { name: finished-at, value: "$(body.subject.content.finishedAt)" }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: release-outcome-template
  namespace: {{ $appNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "triggers"
spec:
  params:
    - name: pipeline-run-name
    - name: app-namespace
    - name: app-name
    - name: env
    - name: cluster
    - name: status
    - name: git-url
    - name: git-revision
    - name: config-json
    - name: chain-id
    - name: flow-start-time
    - name: finished-at
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: $(tt.params.pipeline-run-name)
        labels:
          hangar.io/subcomponent: "release-outcome"
      spec:
        pipelineRef:
          resolver: cluster
          params:
            - { name: kind, value: pipeline }
            - { name: name, value: release-outcome-notify }
            - { name: namespace, value: {{ .Values.platformIdentity.catalogNamespace }} }
        params:
          - { name: app-namespace, value: $(tt.params.app-namespace) }
          - { name: app-name, value: $(tt.params.app-name) }
          - { name: env, value: $(tt.params.env) }
          - { name: cluster, value: $(tt.params.cluster) }
          # Already Succeeded/Failed by the time it gets here - the relay precomputes
          # this since a TriggerTemplate has no ternary to derive it here.
          - { name: status, value: $(tt.params.status) }
          - { name: git-url, value: $(tt.params.git-url) }
          - { name: git-revision, value: $(tt.params.git-revision) }
          - { name: config-json, value: $(tt.params.config-json) }
          - { name: chain-id, value: $(tt.params.chain-id) }
          - { name: flow-start-time, value: $(tt.params.flow-start-time) }
          - { name: finished-at, value: $(tt.params.finished-at) }
        taskRunTemplate:
          serviceAccountName: pipeline-runner
        {{- /* Same cross-cluster DNS gap as flow-triggers.yaml's identical block - see
        values.yaml's own backstageHostAliasIP comment. This PipelineRun also runs on
        the dev cluster (fired by argocd-outcome-relay, itself dev-hosted), so
        notify-backstage's Task pod here needs the same fix. */ -}}
        {{- if .Values.backstageHostAliasIP }}
        taskRunSpecs:
          - pipelineTaskName: notify-backstage
            podTemplate:
              hostAliases:
                - ip: {{ .Values.backstageHostAliasIP }}
                  hostnames:
                    - backstage.prod.kiac.local
        {{- end }}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: release-outcome
  namespace: {{ $appNamespace }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "triggers"
spec:
  serviceAccountName: pipeline-runner
  interceptors:
    - ref: { name: cdevents-broker-auth, kind: ClusterInterceptor }
      params: [{ name: audience, value: cdevents-broker }]
    - ref: { name: cel, kind: ClusterInterceptor }
      params:
        - name: filter
          value: >-
            body.context.type == 'dev.cdevents.environment.deployed.0.1.0' &&
            body.subject.content.appNamespace == '{{ $appNamespace }}'
  bindings:
    - { ref: release-outcome-binding }
  template:
    ref: release-outcome-template
{{- end }}
