# One ExternalSecret per Application, aggregating every secrets: entry into one target
# Secret (app-secrets) rather than one ExternalSecret per entry, so a consuming Task
# always mounts one Secret name regardless of key count. `key` defaults to `name` for
# the common case where the two already match.
#
# 2026-08-19: references airframe's own ClusterSecretStore directly
# (<appName>-<devClusterName>, e.g. checkout-api-kind-dev) - NOT a platform-cicd-
# rendered mirror any more. A real, live redundancy caught after the previous fix:
# control-plane's own app-secret-stores.yaml used to render a SEPARATE
# "<type>-<appName>-secret-store" object, mirrored field-for-field from this exact
# same idp-managed store - confirmed live, byte-identical specs, except idp's own
# store also carries a namespaceRegexes scope the mirror never had (a real
# least-privilege gap: the mirror was strictly WIDER than the original, not just
# duplicated). Referencing idp's object directly removes both problems - one real
# ClusterSecretStore per app, not two, and this Application's own store's own real
# namespace scoping applies automatically.
#
# No remoteRef.property - ESO's `infisical` provider treats `property` as "extract
# this field from a structured/JSON secret value", not "which flat secret to read" -
# confirmed live by airframe against a real Infisical instance (every
# Infisical secret here is an ordinary flat value). `key` alone is both necessary and
# sufficient.
#
# Only rendered when secrets: is non-empty, to avoid a dangling ExternalSecret pointed
# at a ClusterSecretStore that may not exist yet (e.g. an app not yet onboarded through
# idp's NodeJSApplication XR). See docs/app-secrets.md.
{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secrets"
  namespace: {{ include "glidepath-app.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ printf "%s-%s" .Values.platformIdentity.appName .Values.devClusterName }}
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key | default .name }}
    {{- end }}
{{- end }}
