{{- if and .Values.ephemeralEnvironments .Values.ephemeralEnvironments.pullRequest .Values.ephemeralEnvironments.pullRequest.enabled }}
{{- $appNamespace := include "glidepath-app.namespace" . }}
# Rendered only if ephemeralEnvironments.pullRequest.enabled.
#
# IMPORTANT: the `template:` block below uses ArgoCD ApplicationSet's own Go-template
# syntax (goTemplate: true - `.number`, `.head_sha`, etc), which collides with Helm's
# templating since Helm renders this file first. Every ArgoCD expression is escaped
# (curly braces as quoted strings) so Helm emits literal double-curly-brace text for
# ArgoCD to evaluate later - do not remove the escaping, or Helm will try to resolve
# those as its own (nonexistent) values.
#
# Ported from a prior production pattern, fixing two real issues in it: cleanup was
# disabled (finalizer commented out - fixed below with a real one) and RBAC used
# cluster-admin (fixed - no elevated identity needed; ArgoCD's own trusted
# applicationset-controller creates the namespace/Application).
#
# Lives in this app's -cicd namespace, not argocd-apps, via ArgoCD's ApplicationSet-in-
# any-namespace feature - lets the tokenRef Secret live here too, without a cross-
# namespace RBAC grant into argocd-apps. tokenRef strict mode requires that Secret carry the
# argocd.argoproj.io/secret-type: scm-creds label (set by the refresher CronJob below;
# the Secret itself is minted live, never persisted, and isn't part of this chart's
# rendered manifest).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.platformIdentity.appName }}-pr-envs
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "argocd"
  namespace: {{ $appNamespace }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - pullRequest:
        github:
          owner: {{ .Values.platformIdentity.githubOwner }}
          repo: {{ .Values.platformIdentity.appName }}
          tokenRef:
            secretName: {{ .Values.platformIdentity.appName }}-pr-generator-token
            key: token
          # Opt-in via label - avoids a full namespace+Deployment for every WIP PR.
          labels:
            - preview
        requeueAfterSeconds: 180
  template:
    metadata:
      name: "{{ .Values.platformIdentity.appName }}-pr-{{ "{{" }}.number{{ "}}" }}"
      # Cascade-delete removes the Deployment/Rollout/Service etc. airframe-application
      # renders, AND the namespace itself - airframe-application now renders an explicit
      # Namespace object (templates/namespace/namespace.yaml, v0.3.40+), which ArgoCD
      # tracks and prunes like any other resource, unlike a namespace that only exists
      # via CreateNamespace=true. Fixes a real leftover-namespace bug found live:
      # app-checkout-api-pr-9 sat around after its Application was cascade-deleted
      # (2026-08-24) - the hangar.io/ephemeral-env=true label below (now set via
      # source 0's namespace.labels, not managedNamespaceMetadata - an explicit
      # Namespace manifest overwrites that field rather than merging with it) still
      # feeds pr-namespace-ttl-sweep-cronjob.yaml, kept as a backstop for a stuck
      # finalizer, not the primary cleanup path anymore.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      # Matches appproject.yaml's ephemeral AppProject name (deliberately not
      # {{ $appNamespace }} alone - see that file's header comment).
      project: {{ $appNamespace }}-pr
      sources:
        # Source 0: airframe's shared airframe-application chart, same pattern
        # (and same helm.valuesObject-beats-helm.valueFiles precedence, live-attack-
        # tested elsewhere in this project) as the lower-env tier's own
        # lower-envs-applicationset.yaml. envName/rollout.image are stamped here,
        # per-PR, computed rather than developer-supplied - they can't be overridden by
        # platform/pr-env.yaml below, only everything else can.
        - repoURL: {{ .Values.idpServiceCatalog.repoUrl }}
          targetRevision: {{ .Values.idpServiceCatalog.chartVersion }}
          path: charts/airframe-application
          helm:
            valuesObject:
              appName: {{ .Values.platformIdentity.appName }}
              cluster: {{ .Values.devClusterName }}
              envName: "pr-{{ "{{" }}.number{{ "}}" }}"
              rollout:
                image:
                  repository: ghcr.io/{{ .Values.platformIdentity.githubOwner }}/{{ .Values.platformIdentity.appName }}-pr
                  # trunc 12 matches build-image.yaml's own <app>-pr:<12-char-sha> tag.
                  tag: "{{ "{{" }} trunc 12 .head_sha {{ "}}" }}"
              # Moved here from managedNamespaceMetadata.labels (removed below) - an
              # explicit Namespace manifest (airframe-application v0.3.40+) overwrites
              # managedNamespaceMetadata rather than merging with it, so it's a no-op
              # once the chart renders its own Namespace object.
              namespace:
                labels:
                  # Selected by pr-namespace-ttl-sweep-cronjob.yaml's 24h backstop sweep.
                  hangar.io/ephemeral-env: "true"
                  # Lets platform-cicd's registry-credentials ClusterExternalSecret select
                  # this namespace so the private ghcr.io/<owner>/<app>-pr image can
                  # actually be pulled.
                  hangar.io/managed-secrets: "true"
            valueFiles:
              # Not platform/envs/pr.yaml - lower-envs-applicationset.yaml's own git
              # generator already watches platform/envs/*.yaml on every onboarded app's
              # repo (for the dev-tier lower env), so a file there would ALSO spawn a
              # bogus static "pr" lower env via THAT ApplicationSet, on top of this
              # one's real per-PR-numbered ones. platform/pr-env.yaml, one level up,
              # avoids the collision while staying next to platform/envs/dev.yaml's
              # own convention. Read from the PR's own head_sha (not main, see source 1
              # below), so editing this file inside a PR customizes that PR's own
              # preview environment - ports/probes/resources/secrets/etc, anything
              # except envName/rollout.image above.
              - $appsrc/platform/pr-env.yaml
        # Source 1: $ref-only into the same app repo the pullRequest generator above
        # already reads from - same "referenced values file needs its own source"
        # multi-source pattern lower-envs-applicationset.yaml uses, pinned to this PR's
        # own commit (not main) so platform/pr-env.yaml is read from the PR branch.
        - repoURL: {{ .Values.platformIdentity.appRepoUrl }}
          targetRevision: "{{ "{{" }}.head_sha{{ "}}" }}"
          ref: appsrc
          directory:
            exclude: "*"
        # Source 2: a single PostSync hook Job (charts/glidepath-pr-preview-notify) that posts/
        # edits a PR comment once this exact Application syncs - see that chart's own
        # header for why it's a separate chart (structural scoping: nothing outside
        # this ApplicationSet template ever references it, so it can't fire for a
        # regular env) rather than a conditional resource inside airframe-application
        # (shared by every tier) or a Tekton Task (runs before ArgoCD has even
        # attempted to deploy, so it can't know whether the sync will succeed).
        - repoURL: {{ .Values.platformCicdRepoUrl }}
          targetRevision: main
          path: charts/glidepath-pr-preview-notify
          helm:
            valuesObject:
              appName: {{ .Values.platformIdentity.appName }}
              prNumber: "{{ "{{" }}.number{{ "}}" }}"
              githubOwner: {{ .Values.platformIdentity.githubOwner }}
              appRepoName: {{ .Values.platformIdentity.appName }}
              namespace: "app-{{ .Values.platformIdentity.appName }}-pr-{{ "{{" }}.number{{ "}}" }}"
              argocdAppName: "{{ .Values.platformIdentity.appName }}-pr-{{ "{{" }}.number{{ "}}" }}"
              serviceName: {{ .Values.platformIdentity.appName }}
              ingressBaseDomain: {{ .Values.platformIdentity.previewIngressBaseDomain | default "" | quote }}
              argocdUIBaseURL: {{ .Values.platformIdentity.argocdUIBaseURL | default "" | quote }}
              toolboxImage: {{ .Values.toolboxImage }}
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{ .Values.platformIdentity.appName }}-pr-{{ "{{" }}.number{{ "}}" }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Harmless to leave set - a no-op once airframe-application's own Namespace
          # manifest already declares the namespace (only fires when the destination
          # namespace isn't in the source manifests at all).
          - CreateNamespace=true
---
# The ApplicationSet pullRequest generator needs a static Secret to read a GitHub token
# from. Rather than a long-lived PAT, this CronJob periodically mints a fresh,
# single-repo-scoped GitHub App installation token via the shared broker's
# /github-installation-token endpoint (same trust model as the release stage). 20-minute
# schedule stays well inside the token's 1-hour lifetime.
#
# Runs as a dedicated SA in the Application's own namespace - minting authorization
# depends on the caller's namespace owning a Repository CR for this app. The Secret is
# written to this same namespace, so no cross-namespace grant into argocd is needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pr-env-token-refresher
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "argocd"
  namespace: {{ $appNamespace }}
---
# Lets this SA write (not read/list arbitrary) exactly one named Secret. `create` can't
# be resourceName-scoped (object doesn't exist yet), so only get/update/patch are
# restricted by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-pr-token-refresher-{{ .Values.platformIdentity.appName }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "argocd"
  namespace: {{ $appNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.platformIdentity.appName }}-pr-generator-token"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-pr-token-refresher-{{ .Values.platformIdentity.appName }}
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "argocd"
  namespace: {{ $appNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-pr-token-refresher-{{ .Values.platformIdentity.appName }} }
subjects:
  - kind: ServiceAccount
    name: pr-env-token-refresher
    namespace: {{ $appNamespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.platformIdentity.appName }}-pr-token-refresher
  labels:
    {{- include "glidepath-app.labels" . | nindent 4 }}
    hangar.io/subcomponent: "argocd"
  namespace: {{ $appNamespace }}
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: pr-env-token-refresher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: github-token-broker-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: github-token-broker-token
                      audience: github-installation-token
                      expirationSeconds: 600
          containers:
            - name: refresh
              image: {{ .Values.toolboxImage }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: github-token-broker-token
                  mountPath: /var/run/secrets/platform
                  readOnly: true
              env:
                - name: GITHUB_TOKEN_BROKER_URL
                  value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  sa_token="$(cat /var/run/secrets/platform/github-token-broker-token)"
                  resp="$(curl --fail --silent --show-error --max-time 15 \
                    -X POST "${GITHUB_TOKEN_BROKER_URL}" \
                    -H "Authorization: Bearer ${sa_token}" \
                    -H "Content-Type: application/json" \
                    -d '{"owner":"{{ .Values.platformIdentity.githubOwner }}","repo":"{{ .Values.platformIdentity.appName }}"}')"
                  token="$(jq -er '.token' <<<"${resp}")"
                  # scm-creds label required by ArgoCD's tokenRef strict mode for a
                  # Secret read by an ApplicationSet outside the argocd namespace.
                  kubectl create secret generic {{ .Values.platformIdentity.appName }}-pr-generator-token \
                    -n {{ $appNamespace }} --from-literal=token="${token}" \
                    --dry-run=client -o yaml \
                    | kubectl label --local -f - argocd.argoproj.io/secret-type=scm-creds -o yaml \
                    | kubectl apply -f -
{{- end }}
