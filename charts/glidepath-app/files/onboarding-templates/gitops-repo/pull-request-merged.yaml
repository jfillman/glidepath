# BOILERPLATE - runs after a gitops-repo PR merges: the break-glass audit (does not report a
# GitHub Check) and the release record's merge signal (ADR-0021 phase 2). Both hand off to
# bypass-merge-check.
#
# Triggered by the PUSH to main that the merge produces, not by the pull_request "closed" event
# this file used to match. PaC handles a closed PR itself (it cancels that PR's in-flight runs,
# logging "no pipelinerun found for repository ... and pullRequest N") and never matches a
# template against it, so the old trigger never fired (found live 2026-10-06). The Pipeline
# turns the pushed commit back into a PR number and skips pushes that are not PR merges.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: bypass-check-
  labels:
    hangar.io/app: "<APP_NAME>"
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: bypass-merge-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "10m"
