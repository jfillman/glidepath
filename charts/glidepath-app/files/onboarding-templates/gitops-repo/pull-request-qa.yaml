# BOILERPLATE - real (not stub) since 2026-10-19. See pull-request-sast.yaml for the full
# pattern explanation. References the dedicated qa-check Pipeline, which resolves the
# promoted image and verifies, from that image's own Chains-signed test provenance, that
# a check ride from the shared check-rides repository ran against it and passed recently
# (docs/admin/testing.md, phase 3; policy in the catalog's qa.* values).
#
# No <APP_NAMESPACE> substitution or workspace needed (an <APP_NAME> substitution now exists, for the hangar.io/app label below) - same reasons as
# pull-request-sast.yaml. pr-number anchors the promoted-image lookup and feeds the
# finally-block PR comment.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: qa-
  labels:
    hangar.io/app: "<APP_NAME>"
  annotations:
    # See pull-request-sast.yaml for why this is on-cel-expression (release-branch-only)
    # and why has() guards the pull_request field.
    pipelinesascode.tekton.dev/on-cel-expression: 'event == "pull_request" && target_branch == "main" && source_branch.startsWith("release-") && !source_branch.startsWith("release-record-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: qa-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: pr-number, value: "{{ pull_request_number }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    # tasks/finally split - see pull-request-sast.yaml's own header (2026-08-23) for
    # why finally/comment-pr must never share a budget with the real check tasks.
    tasks: "14m"
    # finally bumped 2m->4m - see pull-request-sast.yaml's own header (2026-08-24)
    # for the live comment-pr cancellation this fixes.
    finally: "4m"
    pipeline: "18m"
