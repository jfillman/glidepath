# BOILERPLATE - real since 2026-10-26 (was the shared governance-check stub). The policy-validation gate: renders
# this release PR's environments and evaluates them offline against the target cluster's admission policies, read
# from that cluster's GitOps repo (glidepath ADR-0028, docs/admin/policy-validation.md). Only a Deny/Enforce
# policy's violation fails the check; Audit/Warn policies are reported as warnings.
#
# Release branches only, like every release gate. Delivered only to apps whose deploy.target is k8s-rollout (the
# registry entry's `targets`): a cloud target has no Kubernetes manifest to admit. app-name picks the app repo's
# cicd.yaml (the environment's chart) and the namespace each environment renders into.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: policy-validation-
  labels:
    hangar.io/app: "<APP_NAME>"
  annotations:
    # See pull-request-sast.yaml for why this is on-cel-expression (release-branch-only)
    # and why has() guards the pull_request field.
    pipelinesascode.tekton.dev/on-cel-expression: 'has(body.pull_request) && body.pull_request.base.ref == "main" && body.pull_request.head.ref.startsWith("release-") && !body.pull_request.head.ref.startsWith("release-record-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: policy-validation-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: app-name, value: "<APP_NAME>" }
    - { name: pr-number, value: "{{ pull_request_number }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    # tasks/finally split - see pull-request-sast.yaml's own header (2026-08-23) for
    # why finally/comment-pr must never share a budget with the real check tasks.
    tasks: "8m"
    # finally bumped 2m->4m - see pull-request-sast.yaml's own header (2026-08-24)
    # for the live comment-pr cancellation this fixes.
    finally: "4m"
    pipeline: "12m"
