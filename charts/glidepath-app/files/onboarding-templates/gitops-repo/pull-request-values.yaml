# BOILERPLATE - real. The values-validation gate: runs the validator image (default: Airframe's
# airframe-validate) against the values files this PR changes. See pull-request-sbom.yaml for the shared pattern.
#
# Unlike the release-branch-only gates, this runs on EVERY pull request to main that touches a values.yaml, so a
# human's or an agent's hand edit is checked the same as a release PR. `files.all` is PaC's changed-file list.
# It also runs when only a release.yaml changes (deploy.releaseFile, D9/AF-5), so every release PR carries this
# check and detect-bypass-merge never reads it as "missing". With no values.yaml in the change, validate-values
# passes with a note.
# And when a cluster's shared base.yaml changes (`<cluster>/base.yaml`, Tower App Configuration's Flight shared values):
# validate-values checks it and every environment on that cluster (2026-10-09: such a PR ran no check at all).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: values-
  labels:
    hangar.io/app: "<APP_NAME>"
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: 'event == "pull_request" && target_branch == "main" && files.all.exists(f, f.endsWith("values.yaml") || f.endsWith("release.yaml") || f.endsWith("/base.yaml"))'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: values-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: app-name, value: "<APP_NAME>" }
    - { name: pr-number, value: "{{ pull_request_number }}" }
  # The Pipeline renders the chart in its own task, as source-runner (no token, no Secret): the control plane's admission policy
  # refuses a run that gives `render` to another account (docs/admin/security.md, "Rendering is not done where the credentials are").
  # The gate's task and the render task hand data to each other on this one volume (inputs, what the gate trusts, what was rendered).
  workspaces:
    - name: gate
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  taskRunSpecs:
    - pipelineTaskName: render
      serviceAccountName: source-runner
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    tasks: "12m"
    finally: "4m"
    pipeline: "16m"
