# BOILERPLATE - the deployment gate (Clearance docs/gate.md, decided 2026-10-31; glidepath docs/admin/clearance-gate.md):
# every release PR to a protected environment (cicd.yaml deploy.environments[].production: true) is registered with
# Clearance as a change, classified into a tier 0-3 from what its rendered manifests change, and cleared by policy
# (tiers 0-1, at once) or by named people in Tower (2-3: the app's owner group, and for tier 3 an outside group,
# never the proposer). The check is green once cleared; while the change holds it is red and the comment names who
# may clear it (then `/retest clearance-gate-`). An environment that is not protected is skipped.
#
# Release branches only, like every release gate. Delivered only to apps whose deploy.target is k8s-rollout (the
# registry entry's `targets`). app-name picks the app repo's cicd.yaml (the environment's chart, which environments
# are protected) and the namespace each environment renders into.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: clearance-gate-
  labels:
    hangar.io/app: "<APP_NAME>"
  annotations:
    # See pull-request-sast.yaml for why this is on-cel-expression (release-branch-only)
    # and why has() guards the pull_request field.
    pipelinesascode.tekton.dev/on-cel-expression: 'event == "pull_request" && target_branch == "main" && source_branch.startsWith("release-") && !source_branch.startsWith("release-record-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: clearance-gate-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: app-name, value: "<APP_NAME>" }
    - { name: pr-number, value: "{{ pull_request_number }}" }
  # The Pipeline renders the chart in its own task, as source-runner (no token, no Secret): the control plane's admission policy
  # refuses a run that gives `render` to another account (docs/admin/security.md, "Rendering is not done where the credentials are").
  # The gate's task and the render task hand data to each other on this one volume (inputs, what the gate trusts, what was rendered).
  workspaces:
    - name: gate
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  # Pipeline trust T4 (step 3): the Tasks that present the Clearance token (fetch, and the register task) run as clearance-gate,
  # the one account Clearance trusts as a verifier; join-release writes the change's id into the release record as
  # release-record-writer; the comment and everything else stay on pipeline-runner. The register task is `register`, or
  # `register-advisory` and `render-check` where the gate is not required; the onboarding task fills in <CLEARANCE_REGISTER_TASK>
  # and keeps or drops the `# <IF_...>` lines from what the catalog renders, because Tekton refuses a name the Pipeline lacks.
  taskRunSpecs:
    - pipelineTaskName: render
      serviceAccountName: source-runner
    - { pipelineTaskName: fetch, serviceAccountName: clearance-gate }
    - { pipelineTaskName: <CLEARANCE_REGISTER_TASK>, serviceAccountName: clearance-gate }
    - { pipelineTaskName: render-check, serviceAccountName: clearance-gate } # <IF_CLEARANCE_ADVISORY>
    - { pipelineTaskName: join-release, serviceAccountName: release-record-writer }
    - { pipelineTaskName: record-gate-verdict, serviceAccountName: release-record-writer }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    # tasks/finally split - see pull-request-sast.yaml's own header (2026-08-23) for
    # why finally/comment-pr must never share a budget with the real check tasks.
    tasks: "14m"
    finally: "4m"
    pipeline: "18m"
