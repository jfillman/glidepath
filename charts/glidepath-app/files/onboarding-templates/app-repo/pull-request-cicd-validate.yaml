# BOILERPLATE - the cicd-validate check (glidepath docs/admin/contract.md): `glidepath validate` on the cicd.yaml a
# pull request changes, before it merges; an agent's PR also meets the GP-SCOPE rules against the merge base.
# On every PR to main, like the agent gates: a required check that only ran when cicd.yaml changed would block every
# other PR forever. A PR that leaves cicd.yaml alone passes in seconds as "unchanged", with no comment.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cicd-validate-
  labels:
    hangar.io/app: "<APP_NAME>"
  annotations:
    # event and the branches are PaC's own variables, not the webhook body: a push (this PR merging) is not
    # "pull_request", and a /retest comment, whose issue_comment body has no pull_request key, still matches (PaC
    # reads the PR's branches for it). has(body.pull_request) skipped every check on a bare /retest (2026-11-01).
    pipelinesascode.tekton.dev/on-cel-expression: 'event == "pull_request" && target_branch == "main"'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: cicd-validate-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: pr-number, value: "{{ pull_request_number }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    tasks: "5m"
    finally: "4m"
    pipeline: "10m"
