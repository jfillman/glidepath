# BOILERPLATE - see flow-ci.yaml for the general pattern. Unlike flow-ci.yaml/
# flow-pr-build.yaml, this re-invokes the onboarding-delivery mechanism itself
# (deliver-onboarding-files.yaml) whenever cicd.yaml changes on a push to main, via PaC's
# `"cicd.yaml".pathChanged()` CEL extension. This is what keeps this Application's own
# onboarding boilerplate in sync when the platform's templates change too - one re-sync
# path handles both cases. Templates live at
# charts/glidepath-app/files/onboarding-templates/, delivered via a ConfigMap (not
# baked into the toolbox image), so an edit takes effect on this app's next `helm upgrade`.
#
# has(body.ref) && body.ref == "refs/heads/main" (2026-08-24, found live: onboarding-
# resync-88ggt fired off a `pull_request` synchronize event on a preview PR's feature
# branch, not a push to main) - on-event/on-target-branch above are decorative once
# on-cel-expression is set (PaC uses the CEL as the sole match authority, same as every
# release-guardrail gate's own `has(body.pull_request)` guard - see flow-ci.yaml's own
# push CEL for the same pattern in the opposite direction). pathChanged() alone matches
# any event carrying a cicd.yaml diff, pull_request included, so a plain path check was
# never enough to keep this push-only.
#
# <APP_NAMESPACE>, <APP_NAME>, <APP_TYPE>, <GITHUB_OWNER>, and (if a release stage is
# declared) <GITOPS_REPO_URL> are filled in by deliver-onboarding-files.yaml's own
# substitution loop when it delivers this file.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: onboarding-resync-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: 'has(body.ref) && body.ref == "refs/heads/main" && "cicd.yaml".pathChanged()'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: onboarding-resync }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: git-url, value: "{{ repo_url }}" }
    - { name: app-namespace, value: "<APP_NAMESPACE>" }
    - { name: app-name, value: "<APP_NAME>" }
    - { name: app-type, value: "<APP_TYPE>" }
    - { name: github-owner, value: "<GITHUB_OWNER>" }
    - { name: gitops-repo-url, value: "<GITOPS_REPO_URL>" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "10m"
