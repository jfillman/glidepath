# BOILERPLATE - the propose-class merge audit (glidepath docs/admin/contract.md, "propose"): after a push to main that a PR
# merged, a PR an agent marked for a person to merge (Hangar-Merge: person) that a bot or an agents' login merged is
# reported to Slack, as detect-bypass-merge does for gitops repos. Quiet for a person's merge and for every other push.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: propose-merge-check-
  labels:
    hangar.io/app: "<APP_NAME>"
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: 'has(body.ref) && body.ref == "refs/heads/main"'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: propose-merge-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "5m"
