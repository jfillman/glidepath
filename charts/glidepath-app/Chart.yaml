apiVersion: v2
name: glidepath-app
description: >-
  Installs/configures a new CI/CD execution environment for one Application - one Helm
  release per Application. cicd.yaml (schemas/cicd.schema.json, unmodified) is passed
  directly as a values file; every resource here conditionally renders off cicd.yaml's
  declared pipeline stages, governance toggles, and ephemeralEnvironments settings, so a
  stage a tenant never declared can't fire. See docs/admin/onboarding-mechanics.md for
  the install command (cicd.yaml plus a platform-controlled platform-identity.yaml,
  namespaced under a key the app-facing schema structurally cannot contain).
type: application
version: 0.1.0
appVersion: "1.0.0"
