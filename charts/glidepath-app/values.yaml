# charts/glidepath-app/values.yaml
#
# Real installs merge three sources, later wins on key collision:
#   helm install <app-name> charts/glidepath-app \
#     -f <this file> -f <app-repo>/cicd.yaml -f platform-identity.yaml
#
# platform-identity.yaml supplies platformIdentity: below. It's not authoritative because
# it's loaded last - it's authoritative because `platformIdentity` isn't a key
# schemas/cicd.schema.json permits, so validate-cicd-config's additionalProperties:false
# check rejects any cicd.yaml that tries to define it.
#
# Non-platformIdentity defaults below mirror schemas/cicd.schema.json's own defaults, so
# `helm template`/`helm lint` work standalone without a real cicd.yaml (see
# docs/admin/catalog-versioning.md's fixture-matrix testing).

build:
  # Which Tekton buildpack/image family compiles+lints this Application - see
  # templates/pipelines-as-code catalog wiring for the agent->Task mapping.
  agent: nodejs-20
  # Path to a multi-stage Containerfile kaniko builds directly - only consulted
  # when build.script is omitted (whole build inside the Containerfile, no
  # separate build-source stage). "Containerfile" is this platform's
  # deliberate, vendor-neutral term for the same file Docker calls a
  # Dockerfile - renamed from `dockerfile:` 2026-09-22, app repos migrate on
  # their own schedule (each app renames its own Dockerfile -> Containerfile).
  containerfile: ./Containerfile
  # Which architecture(s) kaniko builds+pushes, then crane assembles into one
  # multi-arch manifest (build-image.yaml). Matches cicd.schema.json's own
  # default - added here 2026-09-22 alongside build-image.yaml's own
  # containerfile-default fix, since this fixture file had drifted from the
  # schema (platforms was added in a later schema/pipeline change than this
  # file's last update, so `helm template`/`helm lint` against this file
  # alone weren't exercising a real platforms value the way every other
  # build.* field here is).
  platforms: [arm64, amd64]
  unitTest:
    # Renders the unit-test step in the build stage. Set false for an Application whose
    # build pipeline shouldn't fail on missing/red unit tests yet (e.g. mid-migration).
    enabled: true
    # Command the unit-test step runs inside the agent image.
    command: ./test.sh
  # Renders a SonarQube scan step in the build stage. Off by default - requires a real
  # SonarQube server + token wired up (see docs/admin) before an Application can turn
  # this on.
  sonar: false
  cache:
    # Enables the per-app dependency-download cache (npm/yarn package cache, Maven local
    # repository - not node_modules) that build-source and run-tests both mount. The PVC
    # itself is rendered regardless, see templates/env/build-cache-pvc.yaml.
    enabled: false
    # PVC size class for the build cache above - only meaningful when cache.enabled is
    # true. One of the platform's standard size classes (small/medium/large), same
    # convention as sourceVolume.size below.
    size: small
  sourceVolume:
    # PVC size class for the workspace that holds the checked-out source across every
    # step in a PipelineRun. Bump for an Application with a large checkout or big
    # generated build artifacts that overflow the small default.
    size: small

test:
  # Renders the test stage's Task(s) for this Application.
  enabled: true
  # Shared test name used to tell apart repeated test steps in one flow when a step
  # doesn't set its own `testName` in pipelines.<flow>.steps[] (see _helpers.tpl's
  # resolveFlowSteps/validateFlows and triggers/flow-triggers.yaml). Empty by default -
  # a flow with more than one test step MUST set either this or each step's own
  # `testName`, or template rendering fails loudly (_helpers.tpl:425).
  name: ""

deploy:
  # cicd.yaml's deploy: block. Every field, explained: docs/user/cicd-yaml-reference.md ("Everything, annotated"
  # and "The deploy: block"); complete files to copy: docs/user/examples/ (11-aws-ecs.yaml, 12-aws-lambda.yaml
  # for cloud apps). The fields below are commented out on purpose: they have no chart default.
  #
  # target: k8s-rollout           # or aws-ecs / aws-lambda / azure-container-apps; per app
  #
  # environments:                  # every environment once, in promotion order (ADR-0019). Unset: one Ground
  #   - name: dev                  # environment, dev. The removed lowerEnvironments/upperEnvironments/
  #     tier: ground               # promotionOrder keys are refused (glidepath-app.validateEnvironments).
  #   - name: prod
  #     tier: flight               # deployed only through an approved release
  #     cluster: kind-prod         # Kubernetes flight env on another cluster
  #     production: true
  #     # ecs / lambda / azureContainerApps: this env's cloud resource (overrides the app-level block below)
  #
  # ecs:                           # target aws-ecs: from the AwsEcsTarget's status.cicd
  #   cluster: my-app
  #   service: my-app-dev
  #   containerName: my-app
  #   region: us-east-1
  # lambda:                        # target aws-lambda: from the AwsLambdaTarget's status.cicd
  #   functionName: my-fn
  #   region: us-east-1
  # azureContainerApps:            # target azure-container-apps
  #   resourceGroup: my-rg
  #   appName: my-app
  #
  # releaseFile: "glidepath/envs/{env}.release.yaml"   # Kubernetes: where the release record is written
  # chart: {}                      # Kubernetes: the chart environments render (unset: the cluster default)
  #
  # How this Application's workload is deployed - "rollout" (an Argo Rollout via the
  # airframe-application chart) is the only supported value today, and the default.
  strategy: rollout

ephemeralEnvironments:
  branch:
    # Renders a per-branch ephemeral environment (not just per-PR) for this
    # Application, deployed via Airframe's idp-application chart.
    enabled: false
    # Branch-name glob patterns that trigger a branch-based ephemeral environment.
    patterns: ["preview/*"]
  pullRequest:
    # Renders a per-PR ephemeral environment (templates/env/ephemeral-envs.yaml),
    # sourcing charts/glidepath-pr-preview-notify as a third Application source to post
    # the preview's access instructions back to the PR.
    enabled: false
    # A PR only gets an ephemeral environment once it carries ALL of these GitHub
    # labels.
    labels: ["preview"]
  # How long an ephemeral environment survives after its branch/PR goes idle before the
  # TTL sweep (glidepath-control-plane) tears it down. Accepts Go duration-like
  # shorthand (e.g. "5d", "12h").
  ttl: 5d

governance:
  # Renders a Semgrep static-analysis gate on the promoted commit's source.
  sast: false
  # Renders a Trivy vulnerability-scan gate on the promoted image.
  imageScan: false
  # Renders a Gatekeeper/Kyverno admission-policy validation gate on the rendered
  # manifest before promotion.
  policyCheck: false
  # Renders a software-bill-of-materials generation+attestation gate on the promoted
  # image.
  sbom: false
  # GPG/Sigstore identities allowed to sign commits that reach a release PR -
  # enforced by detect-bypass-merge.yaml's break-glass check. Empty means no
  # commit-signer allowlist is enforced for this Application.
  allowedCommitSigners: []

notifications:
  slack:
    # Renders a Slack-webhook notification step (build/deploy/release outcomes) -
    # requires a `slack-webhook-url` entry under `secrets:` below to actually deliver.
    enabled: false
    # Shift-left notifications from sast-scan/image-scan the moment each real scan
    # produces a result, separate from the general build/test/deploy/release pass-fail
    # notification above. Only takes effect when slack.enabled is also true. Defaults
    # on; turn off just this if the per-scan notifications are too frequent/verbose.
    scanResults: true
  backstage:
    # Same general per-stage pass/fail notification as slack.enabled above, sent into
    # Backstage's own Notifications plugin (broadcast, visible in Tower's Notifications
    # tab) instead - independent toggle, either/both/neither. Requires the cluster's
    # glidepath-catalog chart to have backstageBaseUrl and a glidepath-backstage-notify
    # token Secret configured (see docs/admin/notifications.md); no-ops otherwise.
    enabled: false

# Optional named pipeline flows. Each entry defines a root trigger plus an ordered list
# of stages (build -> deploy -> test -> release) without hand-writing Tekton YAML.
#
# Example explicit trigger shape:
# pipelines:
#   ci:
#     trigger:
#       source: git
#       event: push
#       branch: main
#       filePathPattern:
#         - "src/**"
#     steps:
#       - stage: build
#       - stage: deploy
#         env: dev
#
pipelines: {}

# Stage presence is derived from `.Values.pipelines`; the older top-level `pipeline:`
# array is no longer used.

# Optional. Each entry pulls one key out of this Application's own idp-managed
# Infisical project into an ExternalSecret-synced app-secrets Kubernetes Secret. Empty
# by default - the ExternalSecret template only renders when non-empty. Every secret
# declared here is this Application's OWN, read directly from the SAME
# ClusterSecretStore idp's own NodeJSApplication XR already provisions for it (see
# app-secrets-external-secret.yaml's own header) - nothing declared here needs
# planting twice, and platform-cicd itself never owns or copies it.
#
# - name: slack-webhook-url  # key inside the synced Secret's data, and the secret's
#                              # own name in Infisical (same key airframe-application's own
#                              # notify-external-secret.yaml already reads)
#   key: slack-webhook-url    # optional - only needed if the two differ (defaults to
#                              # `name`)
secrets: []

# The dev cluster's name: the control-plane cluster this app's pipelines, Ground environments and PR previews run
# on. Its cluster-registry name, which is also its kubectl context (one name per cluster, chosen when Apron builds
# it) - never a default here. Normally left empty: glidepath-control-plane forwards clusterTaxonomy.self (its own
# clusterName) and the chart uses that. Set it only for a standalone install that passes no clusterTaxonomy; when
# both are set they must agree. Used for the cluster: (and clusterType: dev) passed to airframe-application, and for
# this Application's idp-managed ClusterSecretStore name (<appName>-<dev cluster>). The render fails when neither
# is set (templates/_helpers.tpl, glidepath-app.devCluster).
devClusterName: ""

# PR-based ephemeral environments (ephemeral-envs.yaml) deploy through
# Airframe's airframe-application chart - same chart/pin-update discipline the
# lower-env tier already uses (gitops-cluster-dev's lower-envs-applicationset.yaml),
# so a preview env behaves like any other tier instead of a bespoke Kustomize-only
# path. v0.3.40 (2026-08-24): airframe-application now renders an explicit Namespace
# object, fixing the leftover-namespace-after-cascade-delete bug - bumped alongside
# every other consumer's pin (lower-envs-applicationset.yaml,
# tenant-onboarding/applicationset.yaml, both clusters) the same day.
# The cluster's default environment chart, passed in by the control plane from the cluster repo's
# cluster-defaults.yaml (ADR-0023 slice 1). Unset: idpServiceCatalog below.
defaultChart: {}

# The cluster taxonomy (ADR-0024), passed in by the control plane: {self: <control-plane cluster>, zones: {<cluster>:
# lower|upper}}. Used only by the deploy.environments checks (a named cluster must be registered; a production
# environment must run on an upper cluster). Unset: those checks are skipped.
clusterTaxonomy: {}

# The fleet's cloud identity, passed in by the control plane from clusters.yaml's aws: block. With awsAccountId set,
# this chart renders the ServiceAccount glidepath-cloud-deployer and the ConfigMap glidepath-cloud-identity
# (templates/identity/cloud-deployer.yaml), and the deploy stage runs deploy-aws-lambda and deploy-aws-ecs as that ServiceAccount, so
# the deploy assumes the function's own IAM role instead of using an access key. Unset: access keys, as before.
cloudIdentity:
  awsAccountId: ""

# The fallback default chart for an install that passes no defaultChart (above). repoUrl has no default: the fleet's
# Airframe repo is input (the cluster repo's cluster-defaults.yaml, forwarded as defaultChart), so a render with
# neither fails rather than pointing at someone else's repo.
idpServiceCatalog:
  repoUrl: ""
  # 2026-09-23: v0.3.63 -> v0.3.83, in step with every other consumer (gitops-cluster-dev's
  # lower-envs/tenant-onboarding, gitops-cluster-kind-prod, apron). Checked first: each onboarded
  # app's preview environment (real glidepath/pr-env.yaml where the app has one) renders
  # byte-identically under both chart versions, 7 objects each. Between v0.3.63 and v0.3.68 only
  # the release-tracking RBAC/relay-token templates changed (a preview sets no releaseTracking),
  # and v0.3.69 moved that identity into a separate airframe-identity chart, which previews do
  # not need.
  # 2026-09-27: v0.3.94 -> v0.3.95, M1's AF-2/AF-3/AF-4b/AF-1b batch (strict generated schema,
  # fromComponent, dead-end validate rules, contract bundle) - chart-render-affecting only in that
  # values.yaml is now generated rather than hand-authored; no live env file's rendered output
  # changed (verified: byte-identical helm output across all 8 live fleet files before/after).
  # 2026-09-28: v0.3.95 -> v0.3.96, AF-6a (ComponentReady status condition) + SP-3 (MongoDB
  # component) - both land in the XRD/Composition layer, not the airframe-application chart, so
  # no chart-rendered manifest changes either (verified: byte-identical helm output across all 8
  # live fleet files before/after).
  # 2026-10-05: v0.3.110 -> v0.3.115, airframe#48 (optional rollout.labels/annotations, podLabels/podAnnotations,
  # serviceLabels/serviceAnnotations; additive). All 8 live Flight env files render byte-identically under both
  # versions (helm template of each chart version, diffed). Moves the per-app PR-preview ApplicationSets with it.
  # 2026-10-09: v0.3.118 -> v0.3.135 (airframe review C12: one Airframe version on every pin). The chart's templates are
  # byte-identical between the two; values.schema.json only gained descriptions and x-hangar-owner/x-hangar-risk
  # annotations (A7), which do not change validation. Same version as each cluster's cluster-defaults.yaml.
  # 2026-10-10: v0.3.135 -> v0.3.139, airframe#82 (rollout.rollbackWindow {revisions: 3}: fast-track rollback, ADR-0021
  # phase 4). Rendering all 9 live kind-prod Flight envs on both versions: 8 Rollouts gain only spec.rollbackWindow,
  # skyport-broker (no Rollout) is byte-identical. Same version as each cluster's cluster-defaults.yaml.
  # 2026-10-10: v0.3.139 -> v0.3.140, airframe#83 (rollout.enabled: false = this environment runs no service; rollout: null
  # still means the same). All 23 live envs on both clusters render byte-identically on both versions. Same version as
  # each cluster's cluster-defaults.yaml.
  # 2026-10-11: v0.3.140 -> v0.3.141, airframe#84 (Rollouts run non-root, UID/GID 65532, by default, so Tower break-glass
  # process access can read the app's files). All 22 live envs on both clusters rendered on both versions: the 18
  # Rollouts gain only pod/container securityContext; the rest are byte-identical. Same version as each cluster's
  # cluster-defaults.yaml.
  chartVersion: v0.3.141

# Platform-wide constants every Application install shares (not per-app identity, so
# kept outside platformIdentity). Defaults to this repo's own published image (real,
# public, working) - override if you've built and published your own copy.
toolboxImage: ghcr.io/jfillman/glidepath-toolbox:2026-10-13-chain-slug-256

# The single shared namespace Testkube CE installs into on this cluster - see
# templates/testkube/rbac-and-secret.yaml's own header for why this Application
# renders resources into it. Same value/default as charts/glidepath-control-plane's
# own testkubeNamespace - kept in sync across both charts deliberately, not duplicated
# by accident.
testkubeNamespace: testkube

# This chart's own repo (Glidepath, wherever this fleet installs it from): the Ground environments' deploy-RBAC
# source (charts/glidepath-env), the PR-preview comment hook (charts/glidepath-pr-preview-notify) and both
# AppProjects' sourceRepos. No default: glidepath-control-plane forwards its own platformCicdRepoUrl (required there).
# Required whenever a deploy stage or PR previews are rendered.
platformCicdRepoUrl: ""

# Backstage host alias for the Task pods that post to Backstage (notify-backstage). Every PipelineRun runs on the
# dev cluster; Backstage may run elsewhere under a hostname a pod's DNS cannot resolve. When backstageHostAliasIP is
# set, every generated PipelineRun (flow-triggers.yaml, release-outcome-trigger.yaml, release-progress-trigger.yaml,
# release-rollback-trigger.yaml, promote-release-template.yaml, rollback-release-template.yaml) carries a run-wide
# taskRunTemplate.podTemplate.hostAliases entry pinning backstageHostAliasHostname to that IP.
#
# Both empty by default, and that is the normal case (Backstage reachable by real DNS): no hostAliases entry is
# rendered. Setting the IP without the hostname fails the render. glidepath-control-plane forwards both from its own
# backstageBaseUrl/backstageHostAliasIP (the hostname is backstageBaseUrl's host), so they match glidepath-catalog's
# copy (deliver-onboarding-files.yaml) - set them there, not per app. A lab IP that changes on restart must be
# updated there when it changes; a stale IP points pods at the wrong address, an empty one only skips the alias.
backstageHostAliasIP: ""
backstageHostAliasHostname: ""

# Placeholder only - a real install MUST override every field here via
# `-f platform-identity.yaml`. Left empty rather than a fake example so an accidental
# install without that file fails loudly instead of deploying to a plausible-looking
# wrong place. catalogNamespace may be overridden alone, e.g. for a canary Application
# pointed at platform-catalog-canary (docs/admin/catalog-versioning.md).
#
# No `tenantNamespace` field - the Application's namespace is always computed from
# type+appName via _helpers.tpl's namespace/envNamespace helpers, so it can't drift from
# the <type>-<app-name>-<env> convention.
platformIdentity:
  appName: ""
  type: app
  gitopsRepoUrl: ""
  appRepoUrl: ""
  githubOwner: ""
  catalogNamespace: platform-catalog
  # Extra Repository CRs beyond gitops-<app-name> (full URLs), for an app whose
  # gitops-image-bump stage targets a repo it doesn't itself own by naming convention
  # (e.g. a hand-deployed singleton writing into a shared gitops-cluster-* repo - see
  # docs/backstage-design.md). Deliberately lives here, in the operator-owned tenant
  # identity.yaml, not in the app's own self-served cicd.yaml - granting write access
  # to a repo an app doesn't already own by convention is a trust decision, not
  # something the app owner should be able to self-grant by editing their own repo.
  extraGitopsRepos: []
  # Renders templates/pipelines-as-code/repository.yaml's Repository CR(s). Defaults true;
  # set false to deregister a repo without the chart recreating the CR on next sync.
  registerPipelinesAsCode: true
  # Both stubs for real ingress/DNS, not yet present on this platform (docs/admin/
  # ephemeral-environments.md's own "Access" section) - empty by default, so
  # glidepath-pr-preview-notify's PR comment falls back to kubectl port-forward instructions for
  # both. Platform-level facts (which cluster has which URLs), not per-app choices, so
  # they live here rather than in cicd.yaml's schema-validated, app-owner-facing surface.
  previewIngressBaseDomain: ""
  argocdUIBaseURL: ""
