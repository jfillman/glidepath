# catalog/pipelines/sast-check.yaml
#
# Real (not stub) SAST governance check - Phase 3 item 8.4, redesigned into a shift-left
# shape after a real, user-caught redundancy: this originally re-ran Semgrep against the
# promoted commit's source at release time, duplicating work build.yaml's own sast-scan
# Task already did (and already gated the build on - Phase 3 item 8.4's DAG fix makes
# build-image wait on it). The commit's source never changes, so a re-scan could only
# ever reproduce the same result at real cost (both wall-clock time and Semgrep's own
# registry-fetch overhead), not catch anything new the way image-scan-check.yaml's
# re-scan legitimately can (vulnerability databases update continuously; source code at
# a fixed commit does not).
#
# Now resolves the promoted image (same mechanism image-scan-check.yaml uses - both need
# "which image is this PR promoting", just do different things with it) and looks up
# whether that image's own SLSA provenance attestation shows sast-scan passed at build
# time - a real, cryptographically-verified fact, not a re-run. See
# verify-sast-attestation.yaml's own header for the full design and the
# not-configured-means-pass handling for Applications with governance.sast: false.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sast-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Resolves the promoted image from a gitops PR's staging manifest, then verifies sast-scan's real, attested build-time outcome for it.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's raw pull_request.number webhook body field - only used to post the PR comment in this Pipeline's finally block."
  tasks:
    - name: extract-promoted-image
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: extract-promoted-image }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        # CG-3: the classify step decides whether this gate runs, advises or does not apply (applicability).
        - { name: classify-gate, value: sast }
        - { name: classify-refuse-multiple-images, value: "true" }

    # CG-3 (docs/admin/release-guardrails.md "Change kinds"): extract-promoted-image's classify step answers run, advisory or
    # n/a for this gate from the PR head's change kind and the registry's matrix row (glidepath-catalog.gatePlan renders only
    # the paths the row can take). A content gate runs on an image release, runs the -advisory copy (onError: continue, and
    # comment-pr says what it found) on an eligible rollback (ADR-0021 decision 8) or everywhere when the registry says
    # required: false (advisory-reason not-required), and is n/a on a config or no-op change: only `not-applicable` runs.
    {{- $plan := include "glidepath-catalog.gatePlan" (dict "root" . "gate" "sast") | fromJson }}
    {{- if $plan.run }}
    - name: verify-sast-attestation
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "extract-promoted-image" "values" (list "run")) | nindent 8 }}
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-sast-attestation }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }

    {{- end }}
    {{- if $plan.advisory }}
    - name: verify-sast-attestation-advisory
      onError: continue
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "extract-promoted-image" "values" (list "advisory")) | nindent 8 }}
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-sast-attestation }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }
    {{- end }}
    {{- if $plan.na }}
    {{- include "glidepath-catalog.notApplicableTask" (dict "root" . "gate" "sast" "from" "extract-promoted-image") | nindent 4 }}
    {{- end }}

  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: sast }
        - { name: advisory-reason, value: {{ ternary "rollback" "not-required" $plan.required | quote }} }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
