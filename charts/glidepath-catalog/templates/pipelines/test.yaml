# catalog/pipelines/test.yaml
#
# Second stage of the flow, normally event-chained off build's artifact.published
# event (see glidepath/broker/), but can also be git-rooted directly (e.g. a
# test-only flow on a scratch branch). preflight's generate-or-pass-through id minting
# (stage-preflight.yaml) makes both cases uniform - every downstream task reads
# preflight's results, never the incoming params directly. See docs/tracing.md.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: is-flow-root
      type: string
      default: "false"
      description: "true if this is a git-rooted test-only flow (new trace root); false if event-chained from build"
    - name: is-flow-terminal
      type: string
      default: "false"
      description: "true if this stage is the LAST step in its flow (computed at generation time - see flow-triggers.yaml); its finally block then closes the flow-root span. See docs/tracing.md."
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag passed by PaC for a tag-triggered test-only flow. Accepted for param-list consistency with the other three stages - not otherwise used, since test has nothing to version."
    - name: image-repo
      type: string
      default: ""
      description: "Destination registry/repo. Accepted for the same consistency reason as git-tag - not otherwise used."
    - name: image-ref
      type: string
      default: ""
      description: "Event-chained image-ref from build's artifact.published event. Empty for a git-rooted test-only flow with nothing built yet."
    - name: env
      type: string
      description: "Which environment's build this test run is exercising - required by validateFlows on every test step, since a test result is meaningless without knowing what it ran against."
    - name: test-name
      type: string
      description: "TestWorkflow name - the step's own `testName`, or cicd.yaml's top-level test.name. validateFlows requires one of the two to resolve."
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: flow-traceparent
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or minted by preflight (git-rooted)"
    - name: chain-id
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or minted by preflight (git-rooted)"
    - name: flow-start-time
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or minted by preflight (git-rooted)"
  workspaces:
    - name: source
  tasks:
    # Everything that precedes the stage's real work, in one pod: flow/stage trace ids,
    # pipelinerun.started, the clone (when the workspace is bound) and cicd.yaml
    # validation. Replaced five single-purpose Tasks on 2026-10-09 - see stage-preflight.yaml.
    - name: preflight
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: stage-preflight }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: stage-name, value: test }
        - { name: chain-id, value: $(params.chain-id) }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: app-name, value: $(params.app-name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    - name: run-testworkflow
      runAfter: [preflight]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: run-testworkflow }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.preflight.results.config-json) }
        - { name: agent-image, value: $(tasks.preflight.results.agent-image) }
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: test-name, value: $(params.test-name) }
        - { name: app-name, value: $(params.app-name) }

  # One finally Task, one pod (2026-10-08) - replaces the six separate finally tasks this
  # Pipeline used to carry (end-test-stage-span, end-flow, notify, notify-backstage,
  # send-cdevent, pipelinerun-finished). Same side effects in the same order; see
  # stage-debrief.yaml's header for what is preserved and why its result references are
  # deliberately fewer than the old tasks' were.

  finally:
    - name: debrief
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: stage-debrief }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: test }
        - { name: status, value: $(tasks.status) }
        - { name: is-flow-terminal, value: $(params.is-flow-terminal) }
        - { name: flow-name, value: "$(params.app-namespace)/$(params.app-name)" }
        - { name: flow-traceparent, value: $(tasks.preflight.results.traceparent) }
        - { name: chain-id, value: $(tasks.preflight.results.chain-id) }
        - { name: flow-start-time, value: $(tasks.preflight.results.start-time) }
        - { name: stage-span-id, value: $(tasks.preflight.results.span-id) }
        - { name: stage-start-time, value: $(tasks.preflight.results.stage-start-time) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: config-json-from-task, value: preflight }
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: domain-event-type, value: "dev.cdevents.testcaserun.finished.0.3.0" }
        - { name: domain-subject-type, value: "testCaseRun" }
        # Fires pass OR fail (on-success-only false) with the outcome in its content -
        # test is the one stage whose domain event carries its own verdict, and the
        # from-test Trigger in flow-triggers.yaml is the one that checks it
        # (docs/admin/chaining.md).
        - name: domain-subject-content-json
          value: >-
            {"outcome": "$(tasks.status)", "image": "$(params.image-ref)", "revision": "$(params.git-revision)", "git-url": "$(params.git-url)", "env": "$(params.env)", "test-name": "$(params.test-name)"}
        - { name: domain-event-on-success-only, value: "false" }
