# catalog/pipelines/test.yaml
#
# Second stage of the flow, normally event-chained off build's artifact.published
# event (see glidepath/broker/), but can also be git-rooted directly (e.g. a
# test-only flow on a scratch branch). start-flow's generate-or-pass-through behavior
# (start-flow-root-span.yaml) makes both cases uniform - every downstream task reads
# start-flow's results, never the incoming params directly. See docs/tracing.md.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: is-flow-root
      type: string
      default: "false"
      description: "true if this is a git-rooted test-only flow (new trace root); false if event-chained from build"
    - name: is-flow-terminal
      type: string
      default: "false"
      description: "true if this stage is the LAST step in its flow (computed at generation time - see flow-triggers.yaml); its finally block then closes the flow-root span. See docs/tracing.md."
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag passed by PaC for a tag-triggered test-only flow. Accepted for param-list consistency with the other three stages - not otherwise used, since test has nothing to version."
    - name: image-repo
      type: string
      default: ""
      description: "Destination registry/repo. Accepted for the same consistency reason as git-tag - not otherwise used."
    - name: image-ref
      type: string
      default: ""
      description: "Event-chained image-ref from build's artifact.published event. Empty for a git-rooted test-only flow with nothing built yet."
    - name: env
      type: string
      description: "Which environment's build this test run is exercising - required by validateFlows on every test step, since a test result is meaningless without knowing what it ran against."
    - name: test-name
      type: string
      description: "TestWorkflow name - the step's own `testName`, or cicd.yaml's top-level test.name. validateFlows requires one of the two to resolve."
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: flow-traceparent
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: chain-id
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: flow-start-time
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
  workspaces:
    - name: source
  tasks:
    # 2026-08-22: switched off the hub-resolved git-clone Task (+ basic-auth
    # workspace) - real gap, not a style choice: test is normally event-chained off
    # build's CDEvent (created by the broker's TriggerTemplate, not Pipelines-as-Code),
    # so there was never anything to auto-inject real credentials into that workspace
    # for the common case - only a git-rooted, PaC-triggered test-only flow ever
    # actually worked. clone-repo-authenticated mints its own token per run instead
    # (catalog/lib/github-app.sh, same pattern deploy-manifests.yaml/open-release-pr.yaml
    # already use), which works identically regardless of what created the
    # PipelineRun. See that Task's own header for the full story.
    - name: clone-repo
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: clone-repo-authenticated }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: output, workspace: source }
      params:
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: app-name, value: $(params.app-name) }

    - name: start-flow
      runAfter: [clone-repo]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-flow-root-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
      # Idempotent passthrough-or-generate - see start-flow-root-span.yaml.

    # Generic pipelinerun.started signal, independent of the domain-specific
    # testcaserun.finished event below (docs/chaining.md).
    - name: pipelinerun-started
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.started.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"test\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    - name: validate-config
      runAfter: [clone-repo]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: validate-cicd-config }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }

    - name: start-test-stage-span
      runAfter: [start-flow, validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }

    - name: run-testworkflow
      runAfter: [start-test-stage-span]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: run-testworkflow }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: agent-image, value: $(tasks.validate-config.results.agent-image) }
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: test-name, value: $(params.test-name) }
        - { name: app-name, value: $(params.app-name) }

  # One finally Task, one pod (2026-10-08) - replaces the six separate finally tasks this
  # Pipeline used to carry (end-test-stage-span, end-flow, notify, notify-backstage,
  # send-cdevent, pipelinerun-finished). Same side effects in the same order; see
  # stage-finish.yaml's header for what is preserved and why its result references are
  # deliberately fewer than the old tasks' were.
  finally:
    - name: finish
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: stage-finish }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: test }
        - { name: status, value: $(tasks.status) }
        - { name: is-flow-terminal, value: $(params.is-flow-terminal) }
        - { name: flow-name, value: "$(params.app-namespace)/$(params.app-name)" }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: stage-span-id, value: $(tasks.start-test-stage-span.results.span-id) }
        - { name: stage-start-time, value: $(tasks.start-test-stage-span.results.start-time) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: config-json-from-task, value: validate-config }
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: domain-event-type, value: "dev.cdevents.testcaserun.finished.0.3.0" }
        - { name: domain-subject-type, value: "testCaseRun" }
        # Fires pass OR fail (on-success-only false) with the outcome in its content -
        # test is the one stage whose domain event carries its own verdict, and the
        # from-test Trigger in flow-triggers.yaml is the one that checks it
        # (docs/admin/chaining.md).
        - name: domain-subject-content-json
          value: >-
            {"outcome": "$(tasks.status)", "image": "$(params.image-ref)", "revision": "$(params.git-revision)", "git-url": "$(params.git-url)", "env": "$(params.env)", "test-name": "$(params.test-name)"}
        - { name: domain-event-on-success-only, value: "false" }
