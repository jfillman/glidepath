# catalog/pipelines/qa-check.yaml
#
# The `qa` gate's Pipeline - real since 2026-10-19 (docs/admin/testing.md, phase 3). It
# had its own Pipeline while still a stub, scaffolded for exactly this graduation; the
# shape is now sast-check.yaml's: extract-promoted-image resolves which image the PR
# promotes (and whether it is an eligible rollback target), then qa-gate reads that
# image's Chains-signed test provenance for a passing, recent check ride from the shared
# check-rides repository. A finally: comment-pr block reports either way.
#
# ADR-0021 decision 8 / phase 4: `qa` is a content gate (it judges the image, not the
# release's integrity), so on an eligible rollback the -advisory copy runs with
# onError: continue and the run succeeds while the finding is recorded - a rollback is
# precisely where the newest check ride may be older than qa.maxAge.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: qa-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Resolves the promoted image from a gitops release PR, then verifies that a check ride from the shared check-rides repository ran against it and passed recently, from the image's own test provenance.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's raw pull_request.number webhook body field - anchors the promoted-image lookup on the PR's base and addresses the finally-block PR comment."
  tasks:
    - name: extract-promoted-image
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: extract-promoted-image }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }

    {{- /* qa.required (values.yaml): true runs the hard task on a normal release and the
    advisory copy on an eligible rollback; false runs only the advisory copy, always, so
    the gate reports without failing while apps get their check rides. comment-pr is told
    which reason applies (advisory-reason) so the comment says why it did not block. */}}
    {{- if .Values.qa.required }}
    - name: verify-check-ride
      when:
        - { input: $(tasks.extract-promoted-image.results.rollback-eligible), operator: notin, values: ["true"] }
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: qa-gate }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }

    {{- end }}
    - name: verify-check-ride-advisory
      onError: continue
      {{- if .Values.qa.required }}
      when:
        - { input: $(tasks.extract-promoted-image.results.rollback-eligible), operator: in, values: ["true"] }
      {{- end }}
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: qa-gate }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }

  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: qa }
        - { name: advisory-reason, value: {{ ternary "rollback" "not-required" .Values.qa.required | quote }} }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
