# catalog/pipelines/qa-check.yaml
#
# The `qa` gate's own dedicated Pipeline - see qa-gate.yaml's own header for why this
# gate gets one ahead of having real logic, rather than sharing governance-check.yaml
# the way itsm/policy-validation still do. Same shape every other real (or
# real-shaped) gate's Pipeline has: one check task, a finally: comment-pr block - see
# sbom-check.yaml for the closest match (also a single-task gate with no
# extract-promoted-image step of its own... though qa's future real logic will likely
# need one, see qa-gate.yaml's own repo-url/revision params).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: qa-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
    hangar.io/stub: "true"
spec:
  description: Placeholder for real QA/test-completion verification - always succeeds today, dedicated Pipeline ready for real logic to land in qa-gate.yaml.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's raw pull_request.number webhook body field - only used to post the PR comment in this Pipeline's finally block."
  tasks:
    - name: check
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: qa-gate }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: qa }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
