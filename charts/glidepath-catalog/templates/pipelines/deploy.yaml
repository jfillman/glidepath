# catalog/pipelines/deploy.yaml
#
# Third stage of the flow (of four - see release.yaml). Normally event-chained, fired by
# test's testcaserun.finished event; deploys to dev via a direct commit to the app's own
# repo (glidepath/envs/<env>.yaml), picked up by argocd-apps' selfHeal. Deliberately not
# PR-gated like release.yaml's staging promotion - dev favors fast inner-loop feedback
# over governance. See catalog/tasks/deploy-manifests.yaml and docs/release.md.
#
# Can also be git-rooted (e.g. a tag push deploying straight to prod with no build/test
# in this run) - preflight's and resolve-image-ref's generate-or-pass-through behavior
# makes both cases uniform.
#
# The source workspace is only needed for the git-rooted case (deploy-manifests.yaml
# does its own clone via the GitHub App token broker rather than reading this
# workspace). It's `optional: true` and left unbound for the event-chained case,
# skipping PVC provisioning. preflight clones into it only when it is bound; its own
# workspace is optional too, the only shape Tekton accepts alongside an optional
# Pipeline workspace (docs/admin/chaining.md).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: is-flow-root
      type: string
      default: "false"
      description: "true if this is a git-rooted deploy flow (new trace root); false if event-chained from test"
    - name: is-flow-terminal
      type: string
      default: "false"
      description: "true if this step is the LAST step in its flow's steps: list (computed at generation time - see deliver-onboarding-files.yaml/flow-triggers.yaml); this stage's finally block closes the flow-root span iff true. See docs/tracing.md."
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag passed by PaC for a git-rooted deploy (e.g. refs/tags/v1.2.3). Used to construct image-ref alongside image-repo. Empty for event-chained deploy."
    - name: image-repo
      type: string
      default: ""
      description: "Destination registry/repo, e.g. ghcr.io/<org>/<app>. Only needed for the git-rooted case (paired with git-tag to reconstruct image-ref)."
    - name: image-ref
      type: string
      default: ""
      description: "Event-chained image-ref from test's testcaserun.finished event. Empty for a git-rooted deploy."
    - name: pin-file
      type: string
      default: ""
      description: "ADR-0020: set by a cloud Flight environment's generated promote-<env> flow to its release pin (glidepath/releases/<env>.yaml); the image comes from the pin."
    - name: env
      type: string
      default: dev
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: app-type
      type: string
      description: >-
        platformIdentity.type ("app"/"infra"/...) - used with app-name to construct the
        deploy-target namespace <app-type>-<app-name>-<env>, a peer of app-namespace
        under the same flat pattern. See docs/concepts.md.
    - name: flow-traceparent
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or minted by preflight (git-rooted)"
    - name: chain-id
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or minted by preflight (git-rooted)"
    - name: flow-start-time
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or minted by preflight (git-rooted)"
    - name: config-json
      type: string
      default: "{}"
      description: >-
        Event-chained: cicd.yaml's already-validated content, forwarded from test's
        testcaserun.finished event (test always validates its own config - see
        test.yaml). "{}" for a git-rooted deploy - preflight clones and validates
        cicd.yaml itself instead (see stage-preflight.yaml).
  workspaces:
    - name: source
      optional: true
      description: >-
        Only bound for a git-rooted deploy, left unbound for the common event-chained
        case. preflight clones into it when it is bound (stage-preflight.yaml) - its
        own workspace is optional too, the only shape Tekton accepts alongside an
        optional Pipeline workspace (see docs/admin/chaining.md).
  tasks:
    # Everything that precedes the stage's real work, in one pod: flow/stage trace ids,
    # pipelinerun.started, the clone (when the workspace is bound) and cicd.yaml
    # validation. Replaced five single-purpose Tasks on 2026-10-09 - see stage-preflight.yaml.
    - name: preflight
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: stage-preflight }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: stage-name, value: deploy }
        - { name: chain-id, value: $(params.chain-id) }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: app-name, value: $(params.app-name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: config-json, value: $(params.config-json) }

    - name: resolve-image-ref
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: resolve-image-ref }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(params.image-ref) }
        - { name: image-repo, value: $(params.image-repo) }
        - { name: git-tag, value: $(params.git-tag) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: pin-file, value: $(params.pin-file) }
        - { name: git-url, value: $(params.git-url) }

    # Drives the when: gates on the two deploy-task entries below - see this Task's own
    # header for why it exists separately from validate-cicd-config.
    - name: resolve-deploy-target
      runAfter: [preflight]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: resolve-deploy-target }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: config-json, value: $(tasks.preflight.results.config-json) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: env, value: $(params.env) }
        - { name: app-name, value: $(params.app-name) }

    # Default/common path - see docs/user/cicd-yaml-reference.md's deploy.target.
    - name: deploy
      runAfter: [resolve-image-ref, resolve-deploy-target]
      when:
        - { input: $(tasks.resolve-deploy-target.results.target), operator: in, values: ["k8s-rollout"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: deploy-manifests }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: app-name, value: $(params.app-name) }
        - { name: app-type, value: $(params.app-type) }
        - { name: git-url, value: $(params.git-url) }

    # Phase 6 (2026-10-03/04) - render-verified only, no cloud account in this
    # environment to live-verify any of the three against. See each Task's own header
    # for what it does and doesn't replicate from deploy-manifests.yaml. All three
    # source config-json from resolve-deploy-target's OWN resolved result, not
    # $(params.config-json) directly - that param is "{}" for a git-rooted deploy, the
    # exact problem resolve-deploy-target already solved once; reusing its resolution
    # here instead of re-deriving (and re-breaking) it per Task.
    - name: deploy-aws-ecs
      runAfter: [resolve-image-ref, resolve-deploy-target]
      when:
        - { input: $(tasks.resolve-deploy-target.results.target), operator: in, values: ["aws-ecs"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: deploy-ecs }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }
        - { name: config-json, value: $(tasks.resolve-deploy-target.results.config-json) }
        - { name: env, value: $(params.env) }
        - { name: app-name, value: $(params.app-name) }

    - name: deploy-aws-lambda
      runAfter: [resolve-image-ref, resolve-deploy-target]
      when:
        - { input: $(tasks.resolve-deploy-target.results.target), operator: in, values: ["aws-lambda"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: deploy-lambda }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }
        - { name: config-json, value: $(tasks.resolve-deploy-target.results.config-json) }

    - name: deploy-azure-container-apps
      runAfter: [resolve-image-ref, resolve-deploy-target]
      when:
        - { input: $(tasks.resolve-deploy-target.results.target), operator: in, values: ["azure-container-apps"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: deploy-azure-container-apps }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }
        - { name: config-json, value: $(tasks.resolve-deploy-target.results.config-json) }

  finally:
    - name: debrief
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: stage-debrief }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: deploy }
        - { name: status, value: $(tasks.status) }
        - { name: is-flow-terminal, value: $(params.is-flow-terminal) }
        - { name: flow-name, value: "$(params.app-namespace)/$(params.app-name)" }
        - { name: flow-traceparent, value: $(tasks.preflight.results.traceparent) }
        - { name: chain-id, value: $(tasks.preflight.results.chain-id) }
        - { name: flow-start-time, value: $(tasks.preflight.results.start-time) }
        - { name: stage-span-id, value: $(tasks.preflight.results.span-id) }
        - { name: stage-start-time, value: $(tasks.preflight.results.stage-start-time) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: config-json-from-task, value: preflight }
        # Looked up live rather than $(tasks.resolve-image-ref.results.image-ref): the old
        # notify task's hard reference meant a failed resolve-image-ref produced no
        # notification at all. See stage-debrief.yaml's header.
        - { name: image-ref-from-task, value: resolve-image-ref }
        - { name: env, value: $(params.env) }
        - { name: domain-event-type, value: "dev.cdevents.service.deployed.0.3.0" }
        - { name: domain-subject-type, value: "service" }
        - name: domain-subject-content-json
          value: >-
            {"environment": {"id": "$(params.env)"}, "artifactId": "${IMAGE_REF}", "git-url": "$(params.git-url)", "revision": "$(params.git-revision)"}
