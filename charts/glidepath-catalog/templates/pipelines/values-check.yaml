# catalog/pipelines/values-check.yaml
#
# The values-validation gate (decision D10, "enforce now"): runs a validator image against the values files a
# gitops-repo PR changes. Referenced from the gitops repo's .tekton/pull-request-values.yaml (an onboarding
# template). Like the other gates it is its own PaC PipelineRun, so it is its own GitHub Check. It only becomes
# REQUIRED once `values` is in `releaseGuardrails` with required: true (see docs/admin/release-guardrails.md);
# register it only after every gitops repo has the .tekton file, or detect-bypass-merge reports it "missing" on
# every merge. required: false keeps it reporting without blocking.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: values-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Runs the validator image against the values files a gitops PR changes.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: app-name
      type: string
      default: ""
    - name: pr-number
      type: string
      default: ""
      description: "PaC's pull_request.number - only used to post the PR comment in the finally block."
  tasks:
    {{- /* The registry's `required` for this gate (values.yaml releaseGuardrails): false renders the
    -advisory copy alone (onError: continue), so the check stays green and comment-pr reports what the
    validator found with advisory-reason not-required. The values gate has no rollback case. */}}
    {{- $required := eq (include "glidepath-catalog.gateRequired" (dict "root" . "gate" "values")) "true" }}
    - name: {{ ternary "validate" "validate-advisory" $required }}
      {{- if not $required }}
      onError: continue
      {{- end }}
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: validate-values }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-name, value: $(params.app-name) }
  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: values }
        - { name: advisory-reason, value: {{ ternary "rollback" "not-required" $required | quote }} }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
