# catalog/pipelines/policy-validation-check.yaml
#
# The `policy-validation` gate's Pipeline - real since 2026-10-26 (ADR-0028, docs/admin/policy-validation.md); before
# that the gate ran the shared governance-check stub. One task, policy-validation-gate: render the release PR's
# environments and evaluate them offline against the target cluster's admission policies from its GitOps repo. A
# finally: comment-pr block reports either way (the full report travels in the gate-report ConfigMap).
#
# Three tasks on one workspace volume, in order (nothing runs beside them: the gate reads what the render task wrote, after it has
# finished, and nothing else writes the volume in between): `fetch` and `evaluate` are the same Task, policy-validation-gate, in its
# two phases (credentialed: the PR head, the charts and the policy bundle; then the evaluation); `render` is render-manifests, run as
# source-runner (the onboarding template's taskRunSpecs, and the control plane's cicdRunAdmission.sourceTasks, make a run say so): the
# chart is rendered where there is no token, and the gate reads the output as data (docs/admin/security.md).
#
# class integrity, like values-check.yaml: no rollback-advisory copy. Whether a manifest is admissible does not
# depend on the image having run healthy before; the cluster's admission makes no exception for a rollback.
# The registry's `required` still applies: false renders only the -advisory copy (onError: continue).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: policy-validation-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Renders a gitops release PR's environments and evaluates them offline against the target cluster's admission policies.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: app-name
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's pull_request.number - picks the changed environments and addresses the finally-block PR comment."
  workspaces:
    - name: gate
      description: One volume per run (the onboarding template's volumeClaimTemplate), used in three places by subPath - inputs/, trusted/, rendered/.
  tasks:
    {{- $required := eq (include "glidepath-catalog.gateRequired" (dict "root" . "gate" "policy-validation")) "true" }}
    - name: fetch
      {{- if not $required }}
      onError: continue
      {{- end }}
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: policy-validation-gate }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-name, value: $(params.app-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: phase, value: fetch }
      workspaces:
        - { name: publish, workspace: gate }
    - name: render
      {{- if not $required }}
      onError: continue
      {{- end }}
      runAfter: [fetch]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: render-manifests }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: profile, value: policy-validation }
        - { name: app-name, value: $(params.app-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
      workspaces:
        - { name: inputs, workspace: gate, subPath: inputs }
        - { name: output, workspace: gate, subPath: rendered }
    - name: {{ ternary "evaluate" "evaluate-advisory" $required }}
      {{- if not $required }}
      onError: continue
      {{- end }}
      runAfter: [render]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: policy-validation-gate }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-name, value: $(params.app-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: phase, value: decide }
      workspaces:
        - { name: trusted, workspace: gate, subPath: trusted }
        - { name: rendered, workspace: gate, subPath: rendered }
  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: policy-validation }
        - { name: advisory-reason, value: {{ ternary "rollback" "not-required" $required | quote }} }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
