# catalog/pipelines/clearance-gate-check.yaml
#
# The `clearance-gate` guardrail's Pipeline (Clearance docs/gate.md, decided 2026-10-31): one task, clearance-gate,
# registers the release PR's protected environments with Clearance's deployment gate and fails while the change holds
# for people or is denied; a finally comment-pr block reports either way (the full report travels in the gate-report
# ConfigMap). class process, like itsm: whether people have cleared a change is a decision, not a property of the
# image, so a rollback is judged like any release (its tree is a change too); no rollback-advisory copy. The
# registry's `required` applies: false renders only the -advisory copy (onError: continue) plus a render-check task
# (the same Task, render-only, no onError) so a release that cannot be rendered is never green.
#
# Three tasks on one workspace volume, in order (nothing runs beside them: the gate reads what the render task wrote, after it has
# finished, and nothing else writes the volume in between; render-check runs after register, not beside it): `fetch` is the Task
# clearance-gate-fetch (credentialed: classify, then the PR, the charts and the facts, published onto the volume) and `register` the
# Task clearance-gate (the decide phase: ingest, admission, register, report). They were one Task run in two phases until 2026-11-26,
# when its step scripts outgrew the 131072-byte argument Tekton's place-scripts hands to sh (tests/task_script_size_test.py); they
# share nothing but this volume, as before (trusted/ with the marker naming this run, rendered/ read-only). `render` is
# render-manifests, run as source-runner (the onboarding template's taskRunSpecs, and the control plane's cicdRunAdmission.sourceTasks,
# make a run say so): the chart is rendered where there is no token, and the gate reads the output as data (docs/admin/security.md).
# A failure to fetch or to render is never green, advisory or not: the advisory copy's onError applies to the decide phase only.
#
# join-release (pipeline trust T4, step 3) is a finally task: it writes the Clearance change id and tree digest of each environment
# into that release's record, from the `joins` result of the register task, as release-record-writer (the onboarding template's
# taskRunSpecs). The register task holds the Clearance token and no longer writes the record. It is a finally task, not a task after
# register, because a holding or denied change fails register, which would skip a task that runs after it, and a held change is
# the one whose join matters most. A finally task cannot read results of another finally task, so it reads the register task's.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: clearance-gate-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Registers a gitops release PR's protected environments with Clearance's deployment gate (tier 0-3 from the rendered diff) and fails while the change holds or is denied.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: app-name
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's pull_request.number - the change registered is this PR's head; addresses the finally-block PR comment."
  workspaces:
    - name: gate
      description: One volume per run (the onboarding template's volumeClaimTemplate), used in three places by subPath - inputs/, trusted/, rendered/.
  tasks:
    {{- /* CG-3: fetch runs the classify step first (applicability); render and the decide task run only where the gate applies,
    and with n/a only `not-applicable` follows. */}}
    {{- $plan := include "glidepath-catalog.singlePathPlan" (dict "root" . "gate" "clearance-gate") | fromJson }}
    {{- $required := $plan.required }}
    - name: fetch
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: clearance-gate-fetch }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-name, value: $(params.app-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: phase, value: fetch }
        - { name: classify-gate, value: clearance-gate }
      workspaces:
        - { name: publish, workspace: gate }
    - name: render
      runAfter: [fetch]
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "fetch" "values" (list "run" "advisory")) | nindent 8 }}
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: render-manifests }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: profile, value: clearance-gate }
        - { name: app-name, value: $(params.app-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
      workspaces:
        - { name: inputs, workspace: gate, subPath: inputs }
        - { name: output, workspace: gate, subPath: rendered }
    - name: {{ ternary "register" "register-advisory" $required }}
      {{- if not $required }}
      onError: continue
      {{- end }}
      runAfter: [render]
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "fetch" "values" (list "run" "advisory")) | nindent 8 }}
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: clearance-gate }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-name, value: $(params.app-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: phase, value: decide }
      workspaces:
        - { name: trusted, workspace: gate, subPath: trusted }
        - { name: rendered, workspace: gate, subPath: rendered }
    {{- if not $required }}
    # The advisory copy ignores its task's failure (onError: continue), so a change that is holding or denied stays
    # green by design. A gate that could not read the rendered release saw nothing, and must not show green: this sibling
    # runs the decide phase's ingest only, with no onError, and fails the run when an environment's render is refused. It runs
    # after the register task, not beside it: both read the one volume.
    - name: render-check
      runAfter: [register-advisory]
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "fetch" "values" (list "run" "advisory")) | nindent 8 }}
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: clearance-gate }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-name, value: $(params.app-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: render-only, value: "true" }
        - { name: phase, value: decide }
      workspaces:
        - { name: trusted, workspace: gate, subPath: trusted }
        - { name: rendered, workspace: gate, subPath: rendered }
    {{- end }}
    {{- if $plan.na }}
    {{- include "glidepath-catalog.notApplicableTask" (dict "root" . "gate" "clearance-gate" "from" "fetch") | nindent 4 }}
    {{- end }}
  finally:
    - name: join-release
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: join-release }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: joins, value: $(tasks.{{ ternary "register" "register-advisory" $required }}.results.joins) }
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: clearance-gate }
        - { name: advisory-reason, value: {{ ternary "rollback" "not-required" $required | quote }} }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
