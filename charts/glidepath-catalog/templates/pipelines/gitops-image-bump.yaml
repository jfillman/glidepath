# catalog/pipelines/gitops-image-bump.yaml
#
# For a hand-deployed singleton/cluster-config component with no gitops-<app-name> repo
# and no dev/upper promotion flow (e.g. Backstage on kind-man - see
# idp/docs/backstage-design.md). Always event-chained from build's artifact.published
# (never git-rooted, never chained-from by anything else today) - a much smaller
# Pipeline than release.yaml on purpose: no flow-root span/DORA/Slack plumbing, since
# this stage doesn't participate in that release-outcome tracking (its target isn't an
# airframe-application Application for a PostSync hook to report from). If a future need
# adds tracing/notify here, follow release.yaml's shape rather than growing this one
# in place.
#
# gitops-repo/manifest-path come from this app's own cicd.yaml step (gitopsRepo/
# manifestPath - see schemas/cicd.schema.json), threaded through by flow-triggers.yaml
# only for this one stage name (see that file's own gitops-image-bump conditional).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitops-image-bump
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    # Threaded uniformly to every stage Pipeline by flow-triggers.yaml regardless of
    # use - see release.yaml's app-type param for the precedent/reasoning.
    - { name: is-flow-root, type: string, default: "false" }
    - { name: is-flow-terminal, type: string, default: "false" }
    - { name: app-namespace, type: string }
    - { name: app-name, type: string }
    - { name: app-type, type: string, default: "" }
    - { name: env, type: string, default: "" }
    - { name: test-name, type: string, default: "" }
    - { name: cluster, type: string, default: "" }
    - { name: name, type: string, default: "" }
    - { name: git-url, type: string }
    - { name: git-revision, type: string }
    - { name: image-ref, type: string }
    - { name: chain-id, type: string, default: "" }
    - { name: flow-traceparent, type: string, default: "" }
    - { name: flow-start-time, type: string, default: "" }
    - { name: config-json, type: string, default: "{}" }
    - name: gitops-repo
      type: string
      description: Name of the target gitops repo (cicd.yaml step's gitopsRepo) - see bump-manifest-pr.yaml.
    - name: manifest-path
      type: string
      description: Path within gitops-repo to the manifest to patch (cicd.yaml step's manifestPath).
  tasks:
    - name: bump-manifest-pr
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: bump-manifest-pr }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(params.image-ref) }
        - { name: git-url, value: $(params.git-url) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: gitops-repo, value: $(params.gitops-repo) }
        - { name: manifest-path, value: $(params.manifest-path) }
