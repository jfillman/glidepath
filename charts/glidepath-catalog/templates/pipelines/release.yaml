# catalog/pipelines/release.yaml
#
# Fourth stage of the flow, and the last automated one. Fired by the shared broker on
# the deploy Pipeline's dev.cdevents.service.deployed event (previously unconsumed).
# Opens a PR against the Application's GitOps repo promoting the already-built image to
# whichever upper env this release step declared (env:, e.g. "staging" - see
# docs/multi-cluster.md) - see catalog/tasks/open-release-pr.yaml and docs/release.md
# for the full GitOps-PR-promotion design, ported from a real prior production pattern.
#
# Deliberately does NOT deploy anything itself, and does NOT run governance checks
# inline - governance (sast/image-scan/provenance/sbom) now runs as independent,
# individually-required GitHub Checks triggered by the PR itself (see the gitops repo's
# own .tekton/pull_request-*.yaml files, reusing the same governance-gate-stub Task).
# ArgoCD is the only thing that ever touches that env's cluster for this tier, and only
# once a human has approved the PR per that repo's branch protection rule - see
# docs/release.md.
#
# This is also where the flow-root span - covering the entire build->test->deploy->
# release run - is finally sent (see end-flow-root-span.yaml), since release is now the
# last stage in the chain. Note this measures the AUTOMATED portion of the flow only
# (through PR-open); the PR's own review/merge/ArgoCD-sync afterward is unbounded human-
# process time, not pipeline execution time, and deliberately isn't part of this trace -
# see docs/tracing.md.
#
# Performance note (see docs/release.md): the source workspace is only actually needed
# for the git-rooted case - open-release-pr.yaml/mark-release-pending.yaml never touch
# this Pipeline's own source workspace (open-release-pr does its own separate clone of
# the GITOPS repo, a different repo entirely). It's `optional: true` and left unbound by
# flow-triggers.yaml for the common event-chained case (chained from deploy), skipping
# PVC provisioning entirely - there's no dedicated clone-repo task here any more, only
# resolve-notify-config.yaml's own internal clone (only when its workspace is actually
# bound); see that Task's own header for why a separate clone-repo task alongside an
# optional Pipeline workspace doesn't work (a real, admission-time-checked Tekton
# constraint, confirmed live).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: is-flow-root
      type: string
      default: "false"
      description: "true if this is a git-rooted release flow (new trace root); false if event-chained from deploy"
    - name: is-flow-terminal
      type: string
      default: "false"
      description: "true if this step is the LAST step in its flow's steps: list (computed at generation time - see deliver-onboarding-files.yaml/flow-triggers.yaml); this stage's finally block closes the flow-root span iff true. See docs/tracing.md. NOT assumed true by default here any more - an event-chained release may have steps after it (e.g. release -> test), so release closing the flow-root span unconditionally would close it early."
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag passed by PaC for a tag event (e.g., v1.2.3). Used to construct image-ref for git-rooted release."
    - name: image-repo
      type: string
      default: ""
      description: "Destination registry/repo, e.g. ghcr.io/<org>/<app>. Only needed for git-rooted release (paired with git-tag to reconstruct image-ref); event-chained release gets image-ref directly."
    - name: image-ref
      type: string
      default: ""
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: app-type
      type: string
      description: >-
        platformIdentity.type ("app"/"infra"/...) - declared because
        flow-triggers.yaml/deliver-onboarding-files.yaml thread it through uniformly to
        every stage Pipeline's PipelineRun regardless of whether that stage actually
        uses it (admission requires every param a generator passes to be declared).
        Currently unused within this Pipeline itself - open-release-pr.yaml's own
        GitOps-delivered Application-manifest writing (the previous consumer) was
        removed 2026-08-16, see that Task's own header.
    - name: flow-traceparent
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: chain-id
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: flow-start-time
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: config-json
      type: string
      default: "{}"
      description: >-
        Event-chained: cicd.yaml's already-validated content, forwarded from deploy's
        service.deployed event (itself forwarded from test originally, or freshly read
        if deploy was git-rooted). "{}" for a git-rooted release - resolve-notify-config
        reads cicd.yaml itself instead. See resolve-notify-config.yaml.
    - name: env
      type: string
      default: "staging"
      description: >-
        The upper environment being promoted to (this release step's own cicd.yaml
        env:, already validated against deploy.upperEnvironments by validateFlows).
        Already threaded through unconditionally by flow-triggers.yaml/
        deliver-onboarding-files.yaml for every stage - this Pipeline just didn't
        declare (or use) it before. See docs/multi-cluster.md.
    - name: cluster
      type: string
      default: ""
      description: >-
        Name of a cluster-registry entry (docs/multi-cluster.md), set only when env is
        mapped to a different physical cluster. Empty for the common same-cluster case.
  workspaces:
    - name: source
      optional: true
      description: >-
        Only bound for a git-rooted release (see flow-triggers.yaml), left unbound for
        the common event-chained case. No dedicated clone-repo task here any more - see
        resolve-notify-config.yaml's own header for the real, admission-time-checked
        Tekton constraint that ruled that out (a Pipeline-level optional workspace is
        only valid when every task referencing it also declares that workspace
        optional, which the shared hub-resolved git-clone Task's required workspace
        can't satisfy). resolve-notify-config does its own clone instead, only when
        this workspace is actually bound.
  tasks:
    - name: start-flow
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-flow-root-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
      # start-flow-root-span must be idempotent: if flow tracing params are already
      # populated (event-chained case), it passes them through; if empty (git-rooted
      # case), it generates new root span data. This keeps the rest of the pipeline
      # uniform - all downstream tasks reference start-flow results.

    # Deeper CDEvents coverage (Phase 3 item 1, see docs/chaining.md): a generic
    # pipelinerun.started signal, independent of release's own domain-specific
    # change.created event below. References start-flow results (which are either
    # generated for git-rooted or passed through for event-chained).
    - name: pipelinerun-started
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.started.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"release\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
    - name: start-release-stage-span
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }

    - name: resolve-image-ref
      runAfter: [start-release-stage-span]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: resolve-image-ref }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(params.image-ref) }
        - { name: image-repo, value: $(params.image-repo) }
        - { name: git-tag, value: $(params.git-tag) }
        - { name: git-revision, value: $(params.git-revision) }

    - name: open-release-pr
      runAfter: [resolve-image-ref]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: open-release-pr }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }
        - { name: git-url, value: $(params.git-url) }
        - { name: app-name, value: $(params.app-name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: env, value: $(params.env) }
        - { name: cluster, value: $(params.cluster) }
        # Threaded through so open-release-pr can write airframe-application's
        # releaseTracking block (see that Task's own 2026-08-17 header note) - the
        # same values notify/end-flow below already use, no new plumbing upstream of
        # this Pipeline needed.
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: config-json, value: $(tasks.resolve-notify-config.results.config-json) }

    # Hands off to the DORA exporter (platform/dora-exporter) - only runs if
    # open-release-pr actually succeeded (standard Tekton DAG failure propagation, no
    # `when` guard needed). See docs/dora-metrics.md for the full mechanism: this stamps
    # tracking annotations on the Application's own ArgoCD Application object that the exporter reads
    # back once ArgoCD confirms the sync succeeded or failed.
    - name: mark-release-pending
      runAfter: [open-release-pr]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: mark-release-pending }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: env, value: $(params.env) }
        - { name: cluster, value: $(params.cluster) }
    # Never when-gated/skipped and has no result-dependency on clone-repo - see this
    # Task's own header for why that's load-bearing (notify below must always be able
    # to reference its result, regardless of git-rooted vs event-chained).
    - name: resolve-notify-config
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: resolve-notify-config }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(params.config-json) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }

  finally:
    - name: end-release-stage-span
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: end-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: release }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: span-id, value: $(tasks.start-release-stage-span.results.span-id) }
        - { name: start-time, value: $(tasks.start-release-stage-span.results.start-time) }
        - { name: status, value: $(tasks.status) }

    # Real bug, fixed live 2026-08-11: this used to fire unconditionally, on the
    # assumption release is always the flow's last stage (true in Phase 1/2's fixed
    # chain). Phase 3 item 7 made flow ordering free-form - a flow's release step can be
    # followed by more steps (e.g. release -> test, confirmed live), and plenty of real
    # flows never reach release at all (e.g. build -> test -> deploy, no release
    # configured). Closing the flow-root span here unconditionally meant: (a) any later
    # stage's own span, sent after this one already closed the root, had a start/end
    # time AFTER the trace's supposed end - a real, live-confirmed symptom; and (b) every
    # non-release-terminal flow simply never closed its flow-root span at all, showing
    # "running/incomplete" in the dashboard forever even after finishing successfully -
    # also live-confirmed (5 of 12 real recent traces). is-flow-terminal (see above) is
    # now computed per-flow at generation time and is the single source of truth for
    # which stage actually closes the span - every stage Pipeline carries an identical
    # copy of this task, gated the same way. See docs/tracing.md.
    - name: end-flow
      when:
        - { input: $(params.is-flow-terminal), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: end-flow-root-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-name, value: "$(params.app-namespace)/$(params.app-name)" }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: status, value: $(tasks.status) }

    - name: notify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: notify-slack }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: config-json, value: $(tasks.resolve-notify-config.results.config-json) }
        - { name: stage-name, value: release }
        - { name: status, value: $(tasks.status) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }

    # Rounds out the CDEvents chain for trace/dashboard completeness (so "release" shows
    # up in Tempo/pipeline-detail the same way build/test/deploy already do) - NOT
    # load-bearing for DORA metrics, which are sourced from ArgoCD's own Application
    # status via mark-release-pending above, not from this event. See
    # docs/dora-metrics.md. change.created is CDEvents' actual vocabulary for "a change
    # (PR) was created", not a reuse of service.deployed for something that isn't
    # deployed yet.
    - name: send-cdevent
      when:
        - { input: $(tasks.status), operator: in, values: ["Succeeded", "Completed"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.change.created.0.3.0" }
        - { name: subject-type, value: "change" }
        - name: subject-content-json
          value: >-
            {"image": "$(tasks.resolve-image-ref.results.image-ref)", "revision": "$(params.git-revision)", "git-url": "$(params.git-url)"}
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        # Forwarded so a step chained after release (e.g. release-then-test's own
        # release -> test, confirmed live in cicd-flow-test-app's flow config) can
        # still inherit cicd.yaml's content downstream - same reasoning as build's
        # artifact.published event (fixed alongside this) and test's/deploy's
        # pre-existing forwarding. See resolve-notify-config.yaml.
        - { name: config-json, value: $(tasks.resolve-notify-config.results.config-json) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    # Deeper CDEvents coverage (Phase 3 item 1) - generic completion signal, deliberately
    # NOT gated on success like the domain-specific event above. See docs/chaining.md.
    - name: pipelinerun-finished
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.finished.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"release\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tekton-status, value: $(tasks.status) }
