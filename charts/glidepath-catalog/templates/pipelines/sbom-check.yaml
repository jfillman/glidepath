# catalog/pipelines/sbom-check.yaml
#
# Real (not stub) SBOM governance check - Phase 3 item 8.7. Runs as a PR-triggered Check
# on an Application's gitops repo, generating+attesting an SBOM for the actual image about to
# be promoted - same image-resolution mechanism as image-scan-check.yaml (they scan the
# same artifact, just doing different things with it).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sbom-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Resolves the promoted image from a gitops PR's staging manifest, then generates+attests a real SBOM for it.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's raw pull_request.number webhook body field - only used to post the PR comment in this Pipeline's finally block."
  tasks:
    - name: extract-promoted-image
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: extract-promoted-image }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        # CG-3: the classify step decides whether this gate runs, advises or does not apply (applicability).
        - { name: classify-gate, value: sbom }
        - { name: classify-refuse-multiple-images, value: "true" }

    # CG-3 (docs/admin/release-guardrails.md "Change kinds"): extract-promoted-image's classify step answers run, advisory or
    # n/a for this gate from the PR head's change kind and the registry's matrix row (glidepath-catalog.gatePlan renders only
    # the paths the row can take). A content gate runs on an image release, runs the -advisory copy (onError: continue, and
    # comment-pr says what it found) on an eligible rollback (ADR-0021 decision 8) or everywhere when the registry says
    # required: false (advisory-reason not-required), and is n/a on a config or no-op change: only `not-applicable` runs.
    {{- $plan := include "glidepath-catalog.gatePlan" (dict "root" . "gate" "sbom") | fromJson }}
    {{- if $plan.run }}
    - name: generate-sbom
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "extract-promoted-image" "values" (list "run")) | nindent 8 }}
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: generate-sbom }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }

    {{- end }}
    {{- if $plan.advisory }}
    - name: generate-sbom-advisory
      onError: continue
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "extract-promoted-image" "values" (list "advisory")) | nindent 8 }}
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: generate-sbom }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }
    {{- end }}
    {{- if $plan.na }}
    {{- include "glidepath-catalog.notApplicableTask" (dict "root" . "gate" "sbom" "from" "extract-promoted-image") | nindent 4 }}
    {{- end }}

  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: sbom }
        - { name: advisory-reason, value: {{ ternary "rollback" "not-required" $plan.required | quote }} }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
