# catalog/pipelines/provenance-check.yaml
#
# Wraps two independent real gates (Phase 3 item 2) - the real (not stub) `provenance`
# gate (renamed from `policy-check` 2026-08-23 - the old name was the only gate whose
# own identity redundantly baked in "check", and didn't say what it actually verifies;
# see docs/admin/release-guardrails.md). Referenced from an Application's GitOps repo's
# own .tekton/pull-request-provenance.yaml, matching the exact structural shape
# governance-check.yaml already established for the still-stub gates - one Check per
# file, dedicated Pipeline per real gate, not a shared do-everything Pipeline.
#
# `verify` (sub-item 1, docs/commit-signing.md) checks the human's gitsign commit
# signature against the Application's allowed-emails list. `verify-provenance` (sub-item 3,
# docs/provenance-policy.md) is a genuinely separate, additive gate: the promoted
# *image*'s own signature + SLSA provenance attestation, checked against Conforma's
# policy engine - it doesn't re-check emails (deliberate, see that doc). Both must pass;
# neither `runAfter`s the other - independent checks, not a pipeline.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: provenance-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's raw pull_request.number webhook body field - only used to post the PR comment in this Pipeline's finally block."
    - name: commit-signature
      type: string
      default: "true"
      description: >-
        "false" skips the commit-signature half (verify-commit-signature) and keeps the image
        provenance half. A cloud target's pin PR (ADR-0020) passes "false": commit signing is
        not required for cloud targets, and a pin commit carries no X-App-Commit trailer.
  tasks:
    # CG-3 (docs/admin/release-guardrails.md "Change kinds"): the classify step as a small first task of its own, since the
    # two checks below run in parallel (the one extra pod of change kinds). provenance is locked to run for an image
    # release, a rollback and a config change (its config variant is CG-5; until then a config change meets the image
    # release checks), and is n/a only for a change with nothing deployable in it.
    {{- $plan := include "glidepath-catalog.singlePathPlan" (dict "root" . "gate" "provenance") | fromJson }}
    - name: classify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: classify-change }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: classify-gate, value: provenance }

    - name: verify
      runAfter: [classify]
      when:
        - { input: $(params.commit-signature), operator: notin, values: ["false"] }
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "classify" "values" (list "run")) | nindent 8 }}
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-commit-signature }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }

    - name: verify-provenance
      runAfter: [classify]
      when:
        {{- include "glidepath-catalog.applicabilityWhen" (dict "from" "classify" "values" (list "run")) | nindent 8 }}
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-image-provenance }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
    {{- if $plan.na }}
    {{- include "glidepath-catalog.notApplicableTask" (dict "root" . "gate" "provenance" "from" "classify") | nindent 4 }}
    {{- end }}

  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: provenance }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
