# catalog/pipelines/build.yaml
#
# First stage of every flow, always the flow root - the only stage triggered directly
# by a git event (via PaC); every later stage is triggered by a CDEvent this stage's
# `finally` block emits. See docs/tracing.md and docs/chaining.md. Referenced via
# Tekton's cluster resolver from each app's onboarding-generated .tekton/*.yaml.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: is-flow-root
      type: string
      default: "true"
      description: "true if this pipeline initializes root span data (chain-id, traceparent); false if it inherits from upstream CDEvent"
    - name: is-flow-terminal
      type: string
      default: "false"
      description: "true if this step is the LAST step in its flow's steps: list (computed at generation time - see deliver-onboarding-files.yaml/flow-triggers.yaml); this stage's finally block closes the flow-root span iff true. See docs/tracing.md."
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag passed by PaC for tag-triggered builds (e.g., refs/tags/v1.2.3). Empty for branch-based triggers."
    - name: pr-tag-only
      type: string
      default: "false"
      description: "Passed straight through to build-image - see that Task's own param for what this controls."
    - name: image-repo
      type: string
    - name: app-namespace
      type: string
    - name: app-name
      type: string
  workspaces:
    - name: source
  # IMAGE_URL/IMAGE_DIGEST and CHAINS-GIT_URL/CHAINS-GIT_COMMIT are Tekton Chains' own
  # documented "type hinting" result names (exact names, case-sensitive) that tell
  # Chains which image/commit a PipelineRun's provenance and signature belong to.
  # Without them Chains silently skips signing (no image subject to attest) despite
  # reporting chains.tekton.dev/signed: "true". IMAGE_URL/IMAGE_DIGEST must reference a
  # $(tasks.*.results.*) - a plain $(params.*) is rejected by Tekton's admission webhook,
  # which is why build-image.yaml carries a dedicated `image-repo` result just for this.
  # See docs/image-signing.md and docs/provenance-policy.md.
  results:
    - name: IMAGE_URL
      value: $(tasks.build-image.results.image-repo)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image.results.image-digest)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repo.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repo.results.commit)
  tasks:
    # Switched off the hub-resolved git-clone Task (+ required basic-auth workspace,
    # a real design mistake - see clone-repo-authenticated.yaml's own header, already
    # applied to test.yaml the same week): a non-optional Pipeline workspace must be
    # bound by every PipelineRun at admission time, but no onboarding-generated
    # `.tekton/*.yaml` template ever bound `basic-auth`, so every build PipelineRun
    # was rejected outright with InvalidWorkspaceBindings before it could even start -
    # this is what actually broke every build, not just private-repo auth.
    # clone-repo-authenticated mints its own token per run instead
    # (catalog/lib/github-app.sh), same established pattern as test/deploy/release.
    - name: clone-repo
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: clone-repo-authenticated }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: output, workspace: source }
      params:
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: app-name, value: $(params.app-name) }

    - name: validate-config
      runAfter: [clone-repo]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: validate-cicd-config }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }

    - name: start-flow
      runAfter: [validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-flow-root-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      # build is always the first, git-rooted stage of any flow, so is-flow-root is
      # always true in practice; the param exists only for consistency with other stages.

    - name: start-build-stage-span
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }

    # Generic pipelinerun.started CDEvent (docs/chaining.md), independent of build's own
    # artifact.published event below. Fires after start-flow (not earlier) because
    # chain-id/traceparent don't exist until start-flow generates them - unlike
    # test/deploy/release, which receive them as incoming params. So build's
    # pipelinerun.started fires later than the other stages' - accepted asymmetry.
    - name: pipelinerun-started
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.started.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"build\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    # runAfter deliberately doesn't include build-image: sast-scan reads source, not the
    # built image, so it only needs clone-repo and runs concurrently with unit-test/
    # build-source. Shares the same `source` workspace those tasks touch - safe because
    # Semgrep's default rulesets already exclude node_modules/vendor dependency dirs, so
    # a concurrent `npm ci` doesn't change what gets scanned.
    - name: sast-scan
      runAfter: [start-build-stage-span]
      when:
        - { input: $(tasks.validate-config.results.sast), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: sast-scan }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
    - name: unit-test
      runAfter: [start-build-stage-span]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: run-tests }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: agent-image, value: $(tasks.validate-config.results.agent-image) }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

    # Optional, runs concurrently with unit-test - the two are independent (run-tests.yaml
    # runs test.sh directly against checked-out source, sharing no output with this Task).
    # Skipped entirely for teams building inside a multi-stage Containerfile instead (see
    # validate-cicd-config.yaml's has-build-script result). build-image still waits for
    # both (real or skipped) before kaniko builds+pushes, so nothing publishes unless
    # tests pass - the compile step is just no longer serialized behind tests.
    - name: build-source
      runAfter: [start-build-stage-span]
      when:
        - { input: $(tasks.validate-config.results.has-build-script), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: build-source }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: agent-image, value: $(tasks.validate-config.results.agent-image) }
        - { name: app-name, value: $(params.app-name) }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

    # sast-scan starts concurrently for speed (runAfter clone-repo, not build-image), but
    # build-image still waits for it before publishing - without this a failing sast-scan
    # wouldn't block the image push, since nothing downstream depended on it. When sast is
    # disabled, sast-scan's when: clause skips it, which Tekton treats as satisfied.
    - name: build-image
      runAfter: [build-source, unit-test, sast-scan]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: build-image }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: image-repo, value: $(params.image-repo) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: git-tag, value: $(params.git-tag) }
        - { name: git-url, value: $(params.git-url) }
        - { name: pr-tag-only, value: $(params.pr-tag-only) }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }


    # Unlike sast-scan, runAfter stays build-image - there's no image to scan until
    # kaniko has pushed one. A failing scan can't unpublish the already-pushed dev image,
    # but it still fails this Task, which fails the whole PipelineRun (red build).
    - name: image-scan
      runAfter: [build-image]
      when:
        - { input: $(tasks.validate-config.results.image-scan), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: image-scan }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.build-image.results.image-ref) }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }

    # Two independent task entries against the same build-artifact Task, each gated on
    # its own cicd.yaml build.artifacts entry - see build-artifact.yaml's header comment
    # for why this is two entries rather than one type-branching entry. runAfter
    # build-image for its resolved `version` result, not the image itself - see that
    # comment.
    - name: build-python-wheel-artifact
      runAfter: [build-image]
      when:
        - { input: $(tasks.validate-config.results.artifacts-python-wheel), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: build-artifact }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: artifact-type, value: "python-wheel" }
        - { name: agent-image, value: $(tasks.validate-config.results.agent-image) }
        - { name: image-repo, value: $(params.image-repo) }
        - { name: version, value: $(tasks.build-image.results.version) }
        - { name: app-name, value: $(params.app-name) }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

    - name: build-go-binary-artifact
      runAfter: [build-image]
      when:
        - { input: $(tasks.validate-config.results.artifacts-go-binary), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: build-artifact }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: artifact-type, value: "go-binary" }
        - { name: agent-image, value: $(tasks.validate-config.results.agent-image) }
        - { name: image-repo, value: $(params.image-repo) }
        - { name: version, value: $(tasks.build-image.results.version) }
        - { name: app-name, value: $(params.app-name) }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

    # Real (not stub) as of Phase 3 item 8.7. runAfter stays build-image, same reasoning
    # as image-scan - nothing to attest until the image is pushed.
    - name: generate-sbom
      runAfter: [build-image]
      when:
        - { input: $(tasks.validate-config.results.sbom), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: generate-sbom }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.build-image.results.image-ref) }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

  # One finally Task, one pod (2026-10-08) - replaces the six separate finally tasks this
  # Pipeline used to carry (end-build-stage-span, end-flow, notify, notify-backstage,
  # send-cdevent, pipelinerun-finished). Same side effects in the same order; see
  # stage-finish.yaml's header for what is preserved and why its result references are
  # deliberately fewer than the old tasks' were.
  finally:
    - name: finish
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: stage-finish }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: build }
        - { name: status, value: $(tasks.status) }
        - { name: is-flow-terminal, value: $(params.is-flow-terminal) }
        - { name: flow-name, value: "$(params.app-namespace)/$(params.app-name)" }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }
        - { name: stage-start-time, value: $(tasks.start-build-stage-span.results.start-time) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        # Looked up live from the TaskRun results (never a $(tasks.*.results.*)
        # reference - see stage-finish.yaml's header) so a failed validate-config or
        # build-image still gets its span, notifications and pipelinerun.finished.
        - { name: config-json-from-task, value: validate-config }
        - { name: image-ref-from-task, value: build-image }
        - { name: domain-event-type, value: "dev.cdevents.artifact.published.0.3.0" }
        - { name: domain-subject-type, value: "artifact" }
        # ${IMAGE_REF} is substituted by stage-finish from build-image's looked-up
        # result. config-json rides along so a flow chaining straight off build (e.g.
        # build -> release) inherits cicd.yaml's validated content - real bug, found
        # live 2026-08-12, see resolve-notify-config.yaml.
        - { name: domain-subject-content-json, value: "{\"image\": \"${IMAGE_REF}\", \"revision\": \"$(params.git-revision)\", \"git-url\": \"$(params.git-url)\", \"env\": \"dev\"}" }
