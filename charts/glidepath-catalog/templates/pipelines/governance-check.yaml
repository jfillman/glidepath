# catalog/pipelines/governance-check.yaml
#
# Minimal single-task Pipeline wrapping governance-gate-stub, referenced from an
# Application's GitOps repo's own .tekton/pull-request-<name>.yaml files - one file per
# still-stub gate declared in .Values.releaseGuardrails (docs/admin/release-guardrails.md)
# - so PaC reports each as its own independently-required, independently-re-triggerable
# GitHub Check (confirmed live: each matching .tekton/*.yaml file gets its own Check,
# keyed by the PipelineRun/file, not by Task). A shared Pipeline kept generic by
# gate-name rather than one near-duplicate Pipeline per gate, matching
# governance-gate-stub's own "one Task, parameterized" precedent.
#
# This is the platform's extension point for a brand-new gate (ADR-0003): wire a new
# .tekton/pull-request-<name>.yaml onboarding template at this Pipeline with its own
# gate-name, and that gate exists, loud-stub and all, with zero new Pipeline/Task code.
# Once real logic is ready, promote it to its own dedicated Pipeline (see sbom-check.yaml
# for the shape a promoted gate takes) - this Pipeline stays the stub-only home.
#
# No flow-traceparent/stage-span-id params - PR-triggered checks have no flow/stage
# context (they're not part of the CDEvents-chained PipelineRun sequence at all, just an
# independent, human-paced PR review) - governance-gate-stub already treats both as
# optional for exactly this case.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: governance-check
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
    hangar.io/stub: "true"
spec:
  params:
    - name: gate-name
      type: string
      description: Any still-stub name from .Values.releaseGuardrails, e.g. itsm/qa/policy-validation.
    - name: repo-url
      type: string
      default: ""
      description: "The gitops repo's own URL - PaC's repo_url. Only used to post the PR comment in this Pipeline's finally block, so left optional/empty for any future non-PR trigger of this same stub Pipeline."
    - name: revision
      type: string
      default: ""
      description: "The gitops PR's head commit - PaC's revision. Only used as a fallback to resolve the real PR number when pr-number arrives unsubstituted (see comment-pr-check-result.yaml)."
    - name: pr-number
      type: string
      default: ""
      description: "PaC's raw pull_request.number webhook body field - only used to post the PR comment in this Pipeline's finally block."
  tasks:
    - name: check
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: governance-gate-stub }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: gate-name, value: $(params.gate-name) }
  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: $(params.gate-name) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
