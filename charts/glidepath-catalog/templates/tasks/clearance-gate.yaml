# catalog/tasks/clearance-gate.yaml
#
# The deployment gate's check (Clearance docs/gate.md, decided 2026-10-31; ADR to follow): every release PR to a
# protected environment is registered with Clearance as a *change*, classified into a tier 0-3 from what its
# rendered diff touches, and cleared by policy (tiers 0-1, at once) or by named people (tiers 2-3, in Tower). This
# task describes the change; Clearance decides and records (`deploy.request`, `deploy.clear`, `deploy.deny`). Nothing
# here enforces anything but the check itself: phase 1 is the soft gate (the PaC check, the release guardrail).
#
# The gate is three Tasks in the clearance-gate-check Pipeline, on one workspace volume:
#   clearance-gate-fetch          (pipeline task `fetch`) classify, fetch, publish: the PR, its environments' charts and facts,
#                                 fetched with the credentials and published onto the workspace (tasks/clearance-gate-fetch.yaml)
#   render-manifests              (pipeline task `render`, as `source-runner`: no token, no Secret, no projected token)
#                                 `helm template` of base and head per protected environment exactly as Argo CD (and Clearance's Argo CD
#                                 plugin) renders it: release <app>-<env>, the destination namespace, the same value files and injected values
#                                 the Flight ApplicationSet layers (the destination cluster's observability included). docs/admin/security.md,
#                                 "Rendering is not done where the credentials are"
#   clearance-gate (this Task)    (pipeline task `register`, or `register-advisory` and `render-check`) the decide steps below
# Until 2026-11-26 fetch and decide were two phases of this one Task, run twice. Tekton's place-scripts init container passes every step
# script of a Task to `sh -c` as ONE argument, capped by Linux at 131072 bytes; CG-3's classify step took the one Task to 131559 bytes
# on eks-dev and every gate pod failed with "argument list too long". Each Task now carries only its own steps' scripts
# (tests/task_script_size_test.py holds every Task to 75% of the cap). The two hand each other nothing but the workspace's trusted/
# subPath (and the rendered/ one the render task writes), as before; this Task refuses data a fetch of another run published.
#
# Four steps:
#   ingest    (validator image)  reads what clearance-gate-fetch published (trusted/, the marker naming this run required) and what the
#                                render wrote as DATA (bounded YAML parse, no tags, every
#                                file digest recomputed, no symlink followed), then the object diff: every rendered object, unchanged ones
#                                marked, each added, removed or changed object with the JSON pointers of the fields that changed and its
#                                new images, each object's digest and the tree's digest (what a grant binds to), computed here from the
#                                bytes it read
#   admission (toolbox)          the offline admission verdict per protected environment: `kyverno apply` of the
#                                target cluster's policy bundle (the broker's /policy-bundle, fetched by clearance-gate-fetch) to the
#                                rendered head, the policy-validation gate's own evaluation (files/lib/policy-eval*), sent with the
#                                change as `admission` {engine, verdict, bundle, deny, warn} and `checks.admission`, and
#                                recorded by Clearance in every deploy.* record's `policy` group (C-8). Recorded, not
#                                enforced here: the policy-validation- check is the gate for an admission failure
#   register  (toolbox)          POST /v1/clearances per environment with the verifier token; the answer is the
#                                change's state: cleared (green), holding (red until people clear it in Tower, then
#                                /retest clearance-gate-), denied (red, the rule). The report goes to the PR comment.
#   report    (toolbox)          exits 1 when any environment holds or is denied (a failed step's results are not
#                                reported, so the verdict is written first)
#
# A PaC check is only green or red. "Holding" is red with the people who may clear it named in the comment; once
# they clear in Tower, `/retest clearance-gate-` re-registers the same head and finds it cleared. A new push is a new
# change (Clearance supersedes the old one). Which environments are protected is the platform's to say, never the app's
# (files/lib/protection.sh): every environment the PR changes is registered, and Clearance's core clears one it does not
# protect at tier 0 (unprotected). cicd.yaml's production: true is compared with that answer, and a disagreement is a
# warning in the comment. Only a cluster with no Clearance still skips an environment that is not production: true.
#
# The full report goes to a ConfigMap owned by the PipelineRun, labelled glidepath.io/gate-report=clearance-gate;
# comment-pr-check-result posts it (the policy-validation-gate convention).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clearance-gate
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
    # Clearance's ingress NetworkPolicy admits pods with this label (apron 55-clearance).
    hangar.io/clearance-client: clearance-gate
spec:
  description: Registers a gitops release PR's protected environments with Clearance's deployment gate (the rendered diff, classified 0-3) and fails while the change holds for people or is denied.
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's repo_url.
    - name: revision
      type: string
      description: The PR head commit - PaC's revision.
    - name: pr-number
      type: string
      default: ""
      description: PaC's body.pull_request.number. Empty or unsubstituted (a /retest) is resolved from the commit.
    - name: app-name
      type: string
      description: The application's name.
    - name: pipeline-run-name
      type: string
      default: ""
      description: Owner of the report ConfigMap; empty writes none.
    - name: validator-image
      type: string
      default: {{ include "glidepath-catalog.validatorImage" . | quote }}
      description: The values gate's validator image (helm, python3 + pyyaml, the default chart under /opt/airframe/charts).
    - name: clearance-url
      type: string
      default: {{ .Values.agentGates.clearanceUrl | quote }}
      description: "Clearance's in-cluster URL (agentGates.clearanceUrl). Empty fails the check - a protected environment's release needs the gate."
    - name: tower-url
      type: string
      default: {{ .Values.clearanceGate.towerUrl | quote }}
      description: Where people clear a change (Backstage's URL); empty leaves the link out of the comment.
    - name: render-only
      type: string
      default: "false"
      description: "\"true\" runs ingest only (what fetch and render produced) and fails when an environment cannot be rendered. The advisory copy of the check (onError: continue, whose findings stay green) runs one beside the register task so a render failure is never green."
    - name: phase
      type: string
      description: "decide. The Pipeline still names the phase each gate task runs: this Task's steps (ingest, admission, register, report) run only for `decide`; any other value does nothing. The fetch phase is its own Task, clearance-gate-fetch. The decide phase reads the rendered output read-only."
  results:
    - name: outcome
      description: cleared | holding | denied | skipped | fail
    - name: findings-summary
      description: One line for the PR comment's headline.
    - name: change-ids
      description: The Clearance change ids registered, comma-separated.
    - name: joins
      description: 'JSON array of {cluster, env, id, tree, pr}, one per environment registered with a change id (at most 20); "[]" when none. The Pipeline hands it to join-release, which writes it into the release records (pipeline trust T4: this Task holds the Clearance token and no record write).'
  # Only the Clearance token: the GitHub installation token and the policy-bundle token are clearance-gate-fetch's, and this pod no longer mounts them.
  volumes:
    - name: clearance-token
      projected:
        sources:
          - serviceAccountToken:
              path: clearance-token
              audience: {{ .Values.agentGates.audience | quote }}
              expirationSeconds: 1200
    - name: work
      emptyDir: {}
  # The run's workspace, in two read-only bindings (the Pipeline's subPaths): `trusted` (what clearance-gate-fetch published for this gate)
  # and `rendered` (what render-manifests wrote).
  workspaces:
    - name: trusted
      readOnly: true
      mountPath: /trusted
    - name: rendered
      readOnly: true
      mountPath: /rendered
  stepTemplate:
    env:
      - name: PHASE
        value: $(params.phase)
      - name: PIPELINE_RUN
        value: $(params.pipeline-run-name)
  steps:
    - name: ingest
      image: $(params.validator-image)
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: work, mountPath: /work }
      env:
        - name: APP_NAME
          value: $(params.app-name)
        - name: NAMESPACE
          value: $(context.taskRun.namespace)
        - name: RENDER_ONLY
          value: $(params.render-only)
        - name: GATE
          value: clearance-gate
        {{- include "glidepath-catalog.ingestLimits" . | nindent 8 }}
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        # The fetch phase ends at publish: the steps after this one skip on the marker, as they do for render-only.
        [[ "${PHASE}" == decide ]] || { : > /work/skip-rest; exit 0; }
        # Data the render task wrote can only be read where this run's own fetch published: a volume without the marker is refused.
        [[ -f /trusted/PUBLISHED && "$(cat /trusted/PUBLISHED)" == "${PIPELINE_RUN}" ]] || { echo "FAIL: the fetch phase's data for this run is not on the workspace"; exit 1; }
        cp -a /trusted/. /work/
        [[ -s /work/plan.txt ]] || { [[ "${RENDER_ONLY:-}" == true ]] && : > /work/skip-rest; exit 0; }
        mkdir -p /work/eval
        rc=0
        # What the render task wrote, as data: verified, bounded, and written to /work/eval from the bytes read.
        python3 - <<'PY' || rc=1
        {{- include "glidepath-catalog.renderedIngest" . | nindent 8 }}
        PY

        # The object diff and each environment's change request (clearance gate.py ChangeRequest).
        python3 - <<'PY' || rc=1
        import glob, hashlib, json, os, re, sys, yaml

        meta = json.load(open("/work/meta.json"))
        policy = json.load(open("/work/clearance.json")) if os.path.exists("/work/clearance.json") else None
        IMAGE = re.compile(r"^/spec/(template/spec/|jobTemplate/spec/template/spec/)?(init)?[cC]ontainers/\d+/image$")
        MAX_FIELDS = 400

        def docs(path):
            out = []
            for d in yaml.safe_load_all(open(path)):
                if isinstance(d, dict) and d.get("kind") and isinstance(d.get("metadata"), dict):
                    out.append(d)
            return out

        def key(d):
            m = d["metadata"]
            return (d.get("apiVersion", ""), d["kind"], m.get("namespace") or "", m.get("name", ""))

        def digest(d):
            return hashlib.sha256(json.dumps(d, sort_keys=True, separators=(",", ":"), default=str).encode()).hexdigest()

        def esc(k):
            return str(k).replace("~", "~0").replace("/", "~1")

        def leaves(a, b, ptr, out):
            if isinstance(a, dict) and isinstance(b, dict):
                for k in sorted(set(a) | set(b)):
                    leaves(a.get(k), b.get(k), f"{ptr}/{esc(k)}", out)
            elif isinstance(a, list) and isinstance(b, list):
                for i in range(max(len(a), len(b))):
                    leaves(a[i] if i < len(a) else None, b[i] if i < len(b) else None, f"{ptr}/{i}", out)
            elif a != b:
                out.append(ptr or "/")

        def at(d, ptr):
            cur = d
            for part in ptr.split("/")[1:]:
                part = part.replace("~1", "/").replace("~0", "~")
                if isinstance(cur, list):
                    cur = cur[int(part)] if part.isdigit() and int(part) < len(cur) else None
                elif isinstance(cur, dict):
                    cur = cur.get(part)
                else:
                    return None
            return cur

        # CI's state from the head's check runs, this gate's own runs excluded.
        # A gate's check is "<PaC application name> / <gate>-", under the current name or an earlier one (catalog
        # pipelinesAsCode).
        pac_apps = {{ include "glidepath-catalog.pacAppNames" . }}
        def checks_named(gate):
            return [f"{a} / {gate}-" for a in pac_apps]
        runs = [r for r in meta.get("checkRuns", []) if not any(r["name"].startswith(n) for n in checks_named("clearance-gate"))]
        def status_of(names):
            rs = [r for r in runs if any(r["name"].startswith(n) for n in names)] if names else runs
            if not rs:
                return "unknown" if names else "pending"
            if any(r["status"] != "completed" for r in rs):
                return "pending"
            if any(r["conclusion"] in ("failure", "cancelled", "timed_out", "action_required", "startup_failure") for r in rs):
                return "fail"
            return "pass"
        prov = meta.get("provenance") or {}
        identity = ((prov.get("identity") or {}).get("status")) or ("unknown" if meta.get("looksAgent") else "not-agent")
        rec = prov.get("record") or {}
        if identity == "confirmed":
            kind, agent = "agent", rec.get("agent")
            proposer = f"autopilot-runs/{agent}" if agent else f"user:{meta['author']}"
        elif identity in ("not-agent", "unattested"):
            # unattested = a person's change with an AI co-author trailer outside Clearance (a warning, never a tier):
            # Clearance's gate counts it as not-agent, so the change is a person's, not `unknown`.
            kind, agent, proposer = "person", None, f"user:{meta['author']}"
        else:
            kind, agent, proposer = "unknown", rec.get("agent"), f"user:{meta['author']}"
        extra_checks = {}
        # A release PR the pipeline opened (the fetch step's /work/source.json, from the release record): its own author is
        # the pipeline's GitHub App, so the proposer, its kind and the provenance are the SOURCE change's (the commits
        # between the previous release and this one in the app repo). Unresolvable source: the PR author, kind unknown
        # (never person), which Clearance denies (DG-PROVENANCE) - nothing is vouched for that could not be established.
        src = json.load(open("/work/source.json")) if os.path.exists("/work/source.json") else {"applicable": False}
        why_unknown = {}
        if src.get("applicable"):
            if src.get("resolved"):
                proposer, kind, agent, identity = src["proposer"], src["proposerKind"], src.get("agent"), src["provenance"]
                # Why the proposer is unknown (release-source.sh): unvouched-commits holds for two people, unrecorded-agent
                # denies. Only with kind unknown, as Clearance requires; a core that does not know the fields gets the
                # change without them (register step) and denies it, as before.
                if kind == "unknown" and src.get("provenanceReason") in ("unvouched-commits", "unrecorded-agent"):
                    why_unknown = {"provenanceReason": src["provenanceReason"]}
                    if src["provenanceReason"] == "unvouched-commits":
                        why_unknown["unvouchedCommits"] = list(src.get("unvouchedCommits") or [])[:250]
                        if not why_unknown["unvouchedCommits"]:
                            why_unknown = {}
                # Clearance's change request has one proposer. Every author is kept in checks, which the change stores.
                extra_checks = {"sourceAuthors": ",".join(a["login"] for a in src["authors"])[:900],
                                "sourceMergers": ",".join(a["login"] for a in src["mergers"])[:900],
                                "sourceRange": f"{src['sourceRepo']}@{(src.get('previousCommit') or '')[:12]}..{src['releasedCommit'][:12]} ({src['mode']}, {src['commits']} commits)"}
            else:
                kind, agent, proposer, identity = "unknown", None, f"user:{meta['author']}", "unknown"
                extra_checks = {"sourceUnresolved": src.get("reason", "")[:900]}
        checks = {"ci": status_of(None), "provenance": identity, "render": "ok", "admission": status_of(checks_named("policy-validation")), **extra_checks}
        paths = sorted({f["filename"] for f in meta["files"]} | {f["previous_filename"] for f in meta["files"] if f.get("previous_filename")})
        lines = sum(int(f.get("additions") or 0) + int(f.get("deletions") or 0) for f in meta["files"])

        for out in sorted(glob.glob("/work/eval/*")):
            if os.path.exists(f"{out}/status") or not os.path.exists(f"{out}/env"):
                continue
            cluster, env = open(f"{out}/env").read().split("\n")[:2]
            head = {key(d): d for d in docs(f"{out}/head.yaml")}
            base = {key(d): d for d in docs(f"{out}/base.yaml")} if os.path.getsize(f"{out}/base.yaml") else {}
            objects = []
            for k in sorted(set(head) | set(base)):
                h, b = head.get(k), base.get(k)
                api_version, kind_, ns, name = k
                if h is not None and b is None:
                    objects.append({"apiVersion": api_version, "kind": kind_, "namespace": ns, "name": name, "op": "added", "fields": [], "images": [], "digest": digest(h)})
                elif h is None:
                    objects.append({"apiVersion": api_version, "kind": kind_, "namespace": ns, "name": name, "op": "removed", "fields": [], "images": [], "digest": ""})
                else:
                    dh, db = digest(h), digest(b)
                    if dh == db:
                        # Listed anyway: a grant covers the whole rendered tree, not only what this PR touched.
                        objects.append({"apiVersion": api_version, "kind": kind_, "namespace": ns, "name": name, "op": "unchanged", "fields": [], "images": [], "digest": dh})
                        continue
                    fields = []
                    leaves(b, h, "", fields)
                    images = [at(h, f) for f in fields if IMAGE.match(f)]
                    objects.append({"apiVersion": api_version, "kind": kind_, "namespace": ns, "name": name, "op": "changed",
                                    "fields": fields[:MAX_FIELDS], "images": [i for i in images if isinstance(i, str)], "digest": dh})
            tree = hashlib.sha256("\n".join(sorted(f"{'/'.join(k)}:{digest(d)}" for k, d in head.items())).encode()).hexdigest()
            if len(objects) > 2000:  # Clearance's MaxObjects
                sys.exit(f"{cluster}/{env}: {len(objects)} rendered objects; Clearance registers at most 2000")
            change = {"app": os.environ["APP_NAME"], "env": env, "cluster": cluster, "repo": f"{meta['owner']}/{meta['repo']}".lower(),
                      "pr": meta["pr"], "head": meta["head"], "base": meta["base"], "proposer": proposer, "proposerKind": kind,
                      "protected": True, "treeDigest": tree, "paths": paths, "linesChanged": lines, "objects": objects,
                      "checks": checks}
            if agent:
                change["agent"] = agent
            change.update(why_unknown)
            if policy is not None:
                change["policy"] = policy
                if meta.get("policyCommit"):
                    change["policyCommit"] = meta["policyCommit"]
            with open(f"{out}/change.json", "w") as f:
                json.dump(change, f)
            print(f"{cluster}/{env}: {sum(o['op'] != 'unchanged' for o in objects)} object(s) changed of {len(head)} (all listed); tree {tree[:12]}; proposer {proposer} ({kind}); checks {checks}")
        PY

        # The Kyverno CLI's inputs for the admission step (the policy-validation gate's normalization). A failure
        # here makes every environment's admission verdict `error`; it does not fail the check.
        python3 - <<'PY' || { echo "warning: could not prepare the offline admission evaluation"; : > /work/policies/prepare-failed; }
        {{- include "glidepath-catalog.policyEvalPrepare" . | nindent 8 }}
        PY
        chmod -R a+rwX /work/eval /work/policies 2>/dev/null || true
        # render-only (the advisory copy's companion): nothing after this step runs when every environment rendered
        [[ "${RENDER_ONLY:-}" == true && "${rc}" == 0 ]] && : > /work/skip-rest
        exit "${rc}"
    - name: admission
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: work, mountPath: /work }
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        {{- include "glidepath-catalog.policyEvalLib" . | nindent 8 }}
        [[ -f /work/skip-rest ]] && exit 0
        ls /work/eval/*/change.json >/dev/null 2>&1 || exit 0
        # The offline admission verdict per protected environment, the policy-validation gate's evaluation of the same
        # rendered head, sent with the change as a check result (C-8): Clearance records engine, verdict and the rule
        # set's commit in every deploy.* record. pass | warn (Audit/Warn findings, or a rule offline evaluation could
        # not decide) | fail (a Deny/Enforce policy fails) | skipped (the cluster has no admission policy) | error.
        engine="$(kyverno_engine)"
        if [[ -z "${engine}" ]]; then
          echo "warning: the Kyverno CLI did not say its version: the changes are registered without an admission result"
          exit 0
        fi
        for f in /work/eval/*/change.json; do
          out="$(dirname "${f}")"; cluster="$(jq -r .cluster "${f}")"; env="$(jq -r .env "${f}")"
          : > "${out}/findings.jsonl"
          deny=0; warn=0
          if [[ -f /work/policies/prepare-failed ]] || grep -qxF "${cluster}" /work/policies/unreadable 2>/dev/null; then
            verdict=error
          else
            policy_eval_env "${cluster}" "${env}" "${out}/findings.jsonl"
            case $? in
              0) deny="$(jq -s '[.[] | select(.level == "deny")] | length' "${out}/findings.jsonl")"
                 warn="$(jq -s '[.[] | select(.level == "warn")] | length' "${out}/findings.jsonl")"
                 if (( deny > 0 )); then verdict=fail; elif (( warn > 0 )); then verdict=warn; else verdict=pass; fi ;;
              2) verdict=skipped ;;
              *) verdict=error ;;
            esac
          fi
          bundle="$(policy_bundle_ref "${cluster}")"
          jq --arg engine "${engine}" --arg verdict "${verdict}" --arg bundle "${bundle}" --argjson deny "${deny}" --argjson warn "${warn}" \
            '.admission = ({engine: $engine, verdict: $verdict, deny: $deny, warn: $warn} + (if $bundle != "" then {bundle: $bundle} else {} end))
             | .checks.admission = $verdict' "${f}" > "${f}.new" && mv "${f}.new" "${f}"
          echo "${cluster}/${env}: admission ${verdict} (${engine}: ${deny} deny, ${warn} warn) against ${bundle:-no policy bundle}"
        done
        chmod -R a+rwX /work/eval 2>/dev/null || true
    - name: register
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: clearance-token, mountPath: /var/run/secrets/clearance, readOnly: true }
        - { name: work, mountPath: /work }
      env:
        - name: APP_NAME
          value: $(params.app-name)
        - name: CLEARANCE_URL
          value: $(params.clearance-url)
        - name: TOWER_URL
          value: $(params.tower-url)
        - name: PIPELINE_RUN
          value: $(params.pipeline-run-name)
        - name: REPO_URL
          value: $(params.repo-url)
        - name: NAMESPACE
          value: $(context.taskRun.namespace)
        - name: PROTECTION_LIB
          value: {{ include "glidepath-catalog.protectionLib" . | toJson }}
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        rm -f /work/no-provenance-reason
        # Always written, so the Pipeline's join-release task (a finally task that reads it) is never skipped for a missing result.
        printf '[]' > "$(results.joins.path)"
        eval "${PROTECTION_LIB}"
        [[ -f /work/skip-rest ]] && exit 0
        report=/work/report.md
        # collect_join <cluster> <env> <change id> <tree digest> <pr>: the PR is change.json .pr (resolved by fetch; the raw
        # pr-number param is empty or unsubstituted on a /retest); G-ARGO-6. This step no longer writes the release record
        # (pipeline trust T4, step 3): it hands the joins to the `joins` result, and the join-release Task, a finally task of
        # the Pipeline that runs as release-record-writer, patches the clearance id and tree digest into the release's own
        # record (release-tracking-<chainId>, found by this PR's URL, cluster and environment), so glidepath-api's
        # GET /v1/apps/{app}/releases/{chainId} and the release log (release-log-emit) carry the join to Clearance.
        # Best effort, as before: a PR with no record (a hand-made one, a swept record) is not a failed check.
        collect_join() {
          local cluster="$1" renv="$2" id="$3" tree="$4" prn="$5"
          [[ -n "${id}" && "${prn}" =~ ^[1-9][0-9]*$ ]] || return 0
          jq -nc --arg c "${cluster}" --arg e "${renv}" --arg id "${id}" --arg t "${tree}" --arg pr "${prn}" \
            '{cluster: $c, env: $e, id: $id, tree: $t, pr: $pr}' >> /work/joins.jsonl
        }
        write_results() { # <outcome> <summary>
          printf '%s' "$1" > "$(results.outcome.path)"
          printf '%s' "$2" | head -c 900 > "$(results.findings-summary.path)"
        }
        printf '' > "$(results.change-ids.path)"
        printf 0 > /work/failed
        if [[ ! -s /work/plan.txt ]] || ! ls /work/eval/*/change.json >/dev/null 2>&1; then
          if ls /work/eval/*/status >/dev/null 2>&1 && grep -lq render-failed /work/eval/*/status 2>/dev/null; then
            echo "FAIL: an environment did not render; the gate cannot classify what it cannot see" > /work/report
            write_results fail "an environment did not render (the render task's log says why)"; printf 1 > /work/failed; exit 0
          fi
          if [[ -n "${CLEARANCE_URL}" ]]; then
            echo "This PR changes no environment: nothing to register."
            write_results skipped "no environment changes in this PR"
          else
            echo "No Clearance on this cluster (agentGates.clearanceUrl is empty) and no production: true environment changes in this PR: nothing to register."
            write_results skipped "no Clearance on this cluster, and no production: true environment changes in this PR"
          fi
          exit 0
        fi
        if [[ -z "${CLEARANCE_URL}" ]]; then
          echo "FAIL: clearance-gate - no Clearance on this cluster (agentGates.clearanceUrl is empty), and this PR changes a protected environment" > /work/report
          write_results fail "no Clearance to register the change with"; printf 1 > /work/failed; exit 0
        fi
        : > /work/rows.jsonl
        : > /work/joins.jsonl
        : > /work/protection.jsonl
        for f in /work/eval/*/change.json; do
          out="$(curl --silent --show-error --max-time 30 --retry 2 --retry-connrefused -w '\n%{http_code}' \
                   -H "Authorization: Bearer $(cat /var/run/secrets/clearance/clearance-token)" \
                   -H "Content-Type: application/json" --data @"${f}" "${CLEARANCE_URL%/}/v1/clearances" || true)"
          code="$(tail -n1 <<<"${out}")"; body="$(sed '$d' <<<"${out}")"
          # A Clearance older than this task refuses what it does not know yet: register without the newer part rather
          # than fail the check over a rollout order (one fallback per refusal, at most three).
          cur="${f}"
          for attempt in 1 2 3; do
            [[ "${code}" == 400 ]] || break
            if grep -qE "unknown field [^A-Za-z]{0,3}(provenanceReason|unvouchedCommits)" <<<"${body}"; then
              # Before clearance#213: without the reason Clearance denies a proposer it cannot name (DG-PROVENANCE), the
              # behaviour before this field, so dropping it fails closed. The comment says so.
              echo "Clearance does not take provenanceReason yet (before clearance#213): registering without it, so an unknown proposer is denied, not held"
              filter='del(.provenanceReason, .unvouchedCommits)'
              touch /work/no-provenance-reason
            elif grep -qE "unknown field [^A-Za-z]{0,3}(admission|policyCommit)" <<<"${body}"; then
              # Before C-8: the record then says engine none, verdict not-evaluated.
              echo "Clearance does not take the admission result yet (a release before C-8): registering without it"
              filter='del(.admission, .policyCommit)'
            elif grep -qE 'objects\[\]\.op is' <<<"${body}"; then
              echo "Clearance does not take unchanged objects yet: registering the changed ones only (a grant will not cover the rest of the tree)"
              filter='del(.objects[] | select(.op == "unchanged"))'
            else
              break
            fi
            jq "${filter}" "${cur}" > "${f}.try${attempt}"; cur="${f}.try${attempt}"
            out="$(curl --silent --show-error --max-time 30 --retry 2 --retry-connrefused -w '\n%{http_code}' \
                     -H "Authorization: Bearer $(cat /var/run/secrets/clearance/clearance-token)" \
                     -H "Content-Type: application/json" --data @"${cur}" "${CLEARANCE_URL%/}/v1/clearances" || true)"
            code="$(tail -n1 <<<"${out}")"; body="$(sed '$d' <<<"${out}")"
          done
          env="$(jq -r '"\(.cluster)/\(.env)"' "${f}")"
          # What the platform said against what cicd.yaml declares. No answer (any status but 200) is unknown, which counts as
          # protected; the row below is an error, which fails the check, so nothing is skipped for want of an answer.
          declared="$(awk -F'|' -v k="${env}" '$1 "/" $2 == k {print $3; exit}' /work/declared.txt 2>/dev/null)"
          if [[ "${code}" == 200 ]]; then platform="$(protection_platform <<<"${body}")"; else platform=unknown; fi
          protection_verdict "${env}" "${declared:-missing}" "${platform}" | jq -c --arg env "${env}" '{env: $env} + .' >> /work/protection.jsonl
          if [[ "${code}" != 200 ]]; then
            echo "{\"env\":\"${env}\",\"state\":\"error\",\"detail\":$(jq -Rs . <<<"HTTP ${code:-none}: $(head -c 300 <<<"${body}")")}" >> /work/rows.jsonl
            continue
          fi
          jq -c --arg env "${env}" --arg tower "${TOWER_URL%/}" --arg adm "$(jq -r '.admission.verdict // ""' "${f}")" '{env: $env, id, state, tier, admission: $adm, why: ([.reasons[] | select(.tier == (.tier)) | "\(.rule) (\(.subject))"] | unique | join(", ")),
             requirement: (if .requirement then "\(.requirement.owner) from \(.requirement.ownerGroup)" + (if .requirement.outside > 0 then " and \(.requirement.outside) from \(.requirement.outsideGroups | join(", "))" else "" end) else "none" end),
             approvals: ([.approvals[] | "\(.person) (\(.role))"] | join(", ")), cleared_by, deny_reason, expires_at,
             link: (if $tower != "" then "\($tower)/clearance?view=clearances&change=\(.id)" else "" end)}' <<<"${body}" >> /work/rows.jsonl
          collect_join "$(jq -r '.cluster' "${f}")" "$(jq -r '.env' "${f}")" "$(jq -r '.id // empty' <<<"${body}")" "$(jq -r '.tree_digest // empty' <<<"${body}")" "$(jq -r '.pr // empty' "${f}")"
        done
        ids="$(jq -r 'select(.id) | .id' /work/rows.jsonl | paste -sd ',' -)"
        printf '%s' "${ids}" > "$(results.change-ids.path)"
        # At most 20 environments (about 150 bytes each), well under Tekton's 4 KiB result limit.
        jq -sc '.[0:20]' /work/joins.jsonl > "$(results.joins.path)" || printf '[]' > "$(results.joins.path)"
        # The cap is loud, not silent. A result cannot carry more, and a workspace file would let this Clearance-token task write the run's
        # volume, which the tokenless-render split forbids (tests/tokenless_render_test.py). Past 20, the later environments keep no join.
        njoins="$(jq -s 'length' /work/joins.jsonl 2>/dev/null || echo 0)"
        if [[ "${njoins}" -gt 20 ]]; then
          echo "warning: ${njoins} environments registered; only the first 20 joins (clearanceId, clearanceTree) reach release records, the rest keep no join" >&2
        fi
        holding="$(jq -s '[.[] | select(.state == "holding")] | length' /work/rows.jsonl)"
        denied="$(jq -s '[.[] | select(.state == "denied")] | length' /work/rows.jsonl)"
        errors="$(jq -s '[.[] | select(.state == "error")] | length' /work/rows.jsonl)"
        cleared="$(jq -s '[.[] | select(.state == "cleared")] | length' /work/rows.jsonl)"
        total="$(jq -s 'length' /work/rows.jsonl)"
        nwarn="$(jq -s '[.[] | select(.warning)] | length' /work/protection.jsonl)"
        if (( errors > 0 )); then outcome=fail; title="### ❌ \`clearance-gate\` could not register ${errors} environment(s) with Clearance"
        elif (( denied > 0 )); then outcome=denied; title="### ❌ \`clearance-gate\`: ${denied} environment(s) denied"
        elif (( holding > 0 )); then outcome=holding; title="### ⏳ \`clearance-gate\`: ${holding} environment(s) holding for people"
        else outcome=cleared; title="### ✅ \`clearance-gate\`: cleared (${cleared} environment(s))"; fi
        {
          echo "${title}"
          echo
          echo "Clearance's deployment gate classified this release of \`${APP_NAME}\` by what its rendered manifests change (tier 0 nothing a cluster runs, 1 an image bump, 2 runtime shape, 3 secrets, identity and policy). Tiers 0 and 1 clear by policy; 2 and 3 are cleared by people in Tower, never by the proposer."
          echo
          echo "| | Environment | Tier | State | Admission | Why | Needs | Cleared by |"
          echo "|---|---|---|---|---|---|---|---|"
          jq -r '"| \(if .state == "cleared" then "✅" elif .state == "holding" then "⏳" else "❌" end) | \(.env) | \(.tier // "") | \(.state)\(if .state == "error" then ": " + .detail else "" end) | \(.admission // "") | \((.why // "") | .[0:200]) | \(.requirement // "") | \(if .cleared_by == "policy" then "policy" elif (.approvals // "") != "" then .approvals else "" end)\(if .deny_reason then " · denied: " + .deny_reason else "" end) |"' /work/rows.jsonl
          links="$(jq -r 'select(.link != "") | "[\(.env)](\(.link))"' /work/rows.jsonl | paste -sd ' ' -)"
          if [[ "${nwarn}" -gt 0 ]]; then
            echo
            echo "**Protection:** the platform decides which environments are protected, not cicd.yaml (Clearance's protected environments, and the pairs its Argo CD agents report). cicd.yaml and Clearance disagree here:"
            jq -r 'select(.warning) | "> **Warning:** " + .warning' /work/protection.jsonl
          fi
          if [[ -s /work/source.json ]] && jq -e '.warning' /work/source.json >/dev/null; then
            echo
            jq -r '"> **Warning:** " + .warning' /work/source.json
          fi
          if [[ -s /work/source.json && "$(jq -r '.applicable // false' /work/source.json)" == true ]]; then
            echo
            echo "**Source of this release** (the pipeline opened this PR, so the proposer is a person who wrote the change it releases, not the PR's author):"
            jq -r --arg held "$([[ -f /work/no-provenance-reason ]] || echo yes)" '
              (.provenanceReason == "unvouched-commits" and $held == "yes") as $held
              | if .resolved then
                "- Registered with Clearance as proposer `\(.proposer)` (\(.proposerKind)), provenance `\(.provenance)`: the \(.proposerRule). Released: `\(.sourceRepo)` \(if .mode == "range" then "`\(.previousCommit[0:7])`..`\(.releasedCommit[0:7])`, \(.commits) commit(s)" elif .mode == "rollback" then "`\(.releasedCommit[0:7])` alone (a rollback restores one earlier commit)" elif .mode == "first" then "`\(.releasedCommit[0:7])` alone (the first release to this environment)" else "`\(.releasedCommit[0:7])` alone (the same commit as the release it replaces)" end)."
                + "\n- Openers of the source PRs: \([.authors[] | "`\(.login)` (\(.prs))"] | join(", ")); mergers: \([.mergers[] | "`\(.login)` (\(.prs))"] | join(", ")). **An owner other than the proposer must clear; the other openers and the mergers are recorded in the change'"'"'s `sourceAuthors` and `sourceMergers` checks but are not yet excluded** (Clearance takes one proposer). Identity is the PR'"'"'s opener and merger, never a commit'"'"'s author (a pusher chooses that)."
                + "\n- Source pull requests: \([.prs[] | "#\(.number) by `\(.author)` merged by `\(.merger)`: \(.identity)\(if .agent != "" then " (agent \(.agent))" else "" end)"] | join("; ")). The release is only as attested as its weakest source PR (unknown, then unattested, then not-agent, then confirmed)."
                + (if (.noPr | length) > 0 then "\n- **No merged pull request contains " + ([.noPr[] | "`" + . + "`"] | join(", ")) + ":** a direct push, or a merge commit made outside a PR. Nobody can vouch for it, so provenance is `unknown`" + (if $held then ": the release is held for two people (below), who clear it in Tower, then `/retest clearance-gate-`. Once the cleared release lands, the next range starts after it." else " and Clearance does not clear the release by policy while it is in the range. It stays in the range of every later release until an owner decides how to baseline it." end) else "" end)
                + (if $held then "\n- **Why it holds for two people:** registered with `provenanceReason: unvouched-commits` (the \((.unvouchedCommits // []) | length) commit(s) no merged pull request contains, above, are the only reason the proposer is unknown), so Clearance holds it at tier 3 for one owner-group and one outside-group person instead of denying it." elif .provenanceReason == "unrecorded-agent" then "\n- Registered with `provenanceReason: unrecorded-agent`: a source pull request is `unknown` to Clearance, so it denies the release (`DG-PROVENANCE`)." else "" end)
                + (if ((.platformCommits // []) | length) > 0 then "\n- platform release-file commits, not counted: " + ([.platformCommits[] | "`" + .[0:7] + "`"] | join(", ")) + " (signed by GitHub for the pipeline'"'"'s App, changing only the release file of an environment other than this one)." else "" end)
              else
                "- **Source unresolved: registered as proposer unknown, which Clearance denies.** \(.reason)"
              end
              + "\n- Promoter: \(if (.promoter // "") != "" then "`\(.promoter)`" else "not recorded (a pipeline-driven release, or a record from before the promoter was kept)" end). Clearance has no field for it yet, so it is named here only."' /work/source.json
          fi
          if [[ -f /work/no-provenance-reason ]]; then
            echo
            echo "> **Note:** this Clearance does not take \`provenanceReason\` yet (clearance#213), so the change was registered without it: an unknown proposer is denied (\`DG-PROVENANCE\`) rather than held for two people."
          fi
          if (( holding > 0 )); then
            echo
            echo "**Holding:** someone the requirement names clears it in Tower${links:+ (${links})}, then comment \`/retest clearance-gate-\` here: the same head is re-registered and found cleared. A new push is a new change. A holding change expires after the gate's TTL (7 days by default)."
          fi
          if (( denied > 0 )); then
            # What DG-PROVENANCE (provenance could not be vouched for) means here, from what this check registered: a release's
            # source names its own cause; only a person's PR with no source behind it is the agent case.
            prov_why="the PR looks like an agent's and Clearance has no record of opening it"
            if [[ -s /work/source.json && "$(jq -r '.applicable // false' /work/source.json)" == true ]]; then
              prov_why="$(jq -r 'if (.resolved | not) then "the source of this release could not be established (above)"
                elif ((.noPr // []) | length) > 0 then "provenance is unknown because the release carries \((.noPr | length)) commit(s) no merged pull request contains (above)"
                elif .provenance == "unknown" then "provenance is unknown because Clearance could not vouch for a source pull request (above)"
                else "Clearance could not vouch for the source of this release (provenance \(.provenance))" end' /work/source.json)"
            fi
            echo
            echo "**Denied:** the reason is in the row. A \`DG-PROVENANCE\` denial here means ${prov_why}; \`DG-POLICY\` means the repo's \`clearance.yaml\` tried to loosen the platform baseline. A person's denial names them and their reason."
          fi
          echo
          echo "Clearance ids: \`${ids:-none}\`. Design: clearance docs/gate.md; the record is in Clearance's evidence (\`deploy.*\`, boundary \`deployment\`)."
        } > "${report}"
        cat "${report}"
        if [[ -n "${PIPELINE_RUN}" ]]; then
          uid="$(kubectl get pipelinerun "${PIPELINE_RUN}" -n "${NAMESPACE}" -o jsonpath='{.metadata.uid}' 2>/dev/null)"
          kubectl create configmap "gate-report-${PIPELINE_RUN}" -n "${NAMESPACE}" \
            --from-file=body="${report}" --from-literal=title="${title}" --dry-run=client -o json \
            | jq --arg run "${PIPELINE_RUN}" --arg uid "${uid}" \
                '.metadata.labels = {"glidepath.io/gate-report": "clearance-gate", "tekton.dev/pipelineRun": $run}
                 | if $uid != "" then .metadata.ownerReferences = [{apiVersion: "tekton.dev/v1", kind: "PipelineRun", name: $run, uid: $uid}] else . end' \
            | kubectl apply -f - >/dev/null || echo "warning: could not write the report ConfigMap; the PR comment falls back to the summary" >&2
        fi
        write_results "${outcome}" "${title#\#\#\# } (${total} environment(s): ${cleared} cleared, ${holding} holding, ${denied} denied, ${errors} error(s))$(if [[ "${nwarn}" -gt 0 ]]; then echo "; ${nwarn} protection warning(s): cicd.yaml and Clearance disagree"; fi)"
        [[ "${outcome}" == cleared ]] || printf 1 > /work/failed
        echo "outcome=${outcome}"
    - name: report
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: work, mountPath: /work }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -f /work/skip-rest ]] && exit 0
        [[ -f /work/report ]] && cat /work/report
        if [[ "$(cat /work/failed 2>/dev/null || echo 0)" == 1 ]]; then
          echo "FAIL: clearance-gate - see the report above (holding: clear it in Tower, then /retest clearance-gate-)"
          exit 1
        fi
