# catalog/tasks/qa-gate.yaml
#
# The `qa` release-guardrail gate (docs/admin/release-guardrails.md), given its own
# dedicated Task/Pipeline (qa-check.yaml) ahead of having any real logic, rather than
# routing through the fully-generic, shared governance-check Pipeline the way itsm/
# policy-validation still do. Both are legitimate ways to stand up a stub gate - this
# one is for when you already know the gate's eventual real shape (what it'll need to
# check, what params it'll take) and want graduating it later to be a single-file
# swap of this Task's own step, matching exactly how sast/image-scan/provenance/sbom
# themselves graduated (see docs/admin/governance-stubs.md's "Landing a real
# implementation" section) - not a three-file change (new Task + new Pipeline +
# repointed onboarding template) done all at once later.
#
# repo-url/revision are accepted now (unused by the stub step below) so the eventual
# real QA-verification logic - reading back the test stage's own recorded outcome for
# this commit, per the still-open design question in pull-request-qa.yaml's own header
# - has them already threaded through without any Pipeline/onboarding-template rewiring.
#
# Still calls the shared governance-stub StepAction, not a bespoke inline script - same
# loud "no real check implemented yet" logging + governance.stub=true child span +
# literal "stub" result as every other not-yet-real gate (ADR-0003). "Always returns
# true" (never fails, never blocks a merge) is exactly what that StepAction already
# does - reused here, not reimplemented, so this stays honestly indistinguishable from
# any other stub in Grafana's pipeline-detail panel until real logic actually lands.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: qa-gate
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
    hangar.io/stub: "true"
spec:
  description: Placeholder for real QA/test-completion verification - always succeeds, loudly marked as not yet a real check.
  params:
    - name: repo-url
      type: string
      default: ""
      description: The gitops repo's own URL - PaC's repo_url. Unused by the stub step; threaded through for the real implementation to come.
    - name: revision
      type: string
      default: ""
      description: The gitops PR's head commit - PaC's revision. Unused by the stub step; threaded through for the real implementation to come.
    - name: flow-traceparent
      type: string
      default: ""
      description: Leave empty when there's no flow/stage context (e.g. a PR-triggered GitOps-repo check) - see governance-stub.yaml for the same convention.
    - name: stage-span-id
      type: string
      default: ""
      description: The calling stage's own span id (from start-stage-span) - this gate's span is parented to it. Ignored when flow-traceparent is empty.
  results:
    - name: outcome
      value: $(steps.stub.results.outcome)
  steps:
    - name: stub
      ref:
        resolver: cluster
        params:
          - { name: kind, value: stepaction }
          - { name: name, value: governance-stub }
          - { name: namespace, value: {{ .Release.Namespace }} }
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      params:
        - { name: gate-name, value: qa }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: stage-span-id, value: $(params.stage-span-id) }
