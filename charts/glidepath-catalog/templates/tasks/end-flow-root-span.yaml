# catalog/tasks/end-flow-root-span.yaml
#
# Pipeline-level wrapper around otel-span-send that closes the FLOW-ROOT span
# (covering the entire flow, whatever stages it declares), not a stage span - see
# docs/tracing.md "Shape: flat, not nested". Called exactly once per flow, from an
# identical `end-flow` finally task present in EVERY stage Pipeline (build/test/deploy/
# release), gated on that Pipeline's own is-flow-terminal param - see docs/tracing.md's
# "Which stage closes the flow-root span" for why this isn't hardcoded to one stage:
# flow ordering is free-form since Phase 3 item 7, so which stage is actually last
# varies per flow, not just per Phase.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: end-flow-root-span
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: flow-name
      type: string
    - name: flow-traceparent
      type: string
    - name: flow-start-time
      type: string
    - name: status
      type: string
      default: "Succeeded"
      description: Pass $(tasks.status) from the calling Pipeline's finally block.
  steps:
    - name: end-span
      ref:
        resolver: cluster
        params:
          - { name: kind, value: stepaction }
          - { name: name, value: otel-span-send }
          - { name: namespace, value: {{ .Release.Namespace }} }
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      params:
        - { name: name, value: $(params.flow-name) }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: start-time, value: $(params.flow-start-time) }
        - { name: status, value: $(params.status) }
