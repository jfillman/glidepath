# catalog/tasks/update-dora-metrics.yaml
#
# Calls dora-exporter's own /argocd-outcome endpoint for a cluster-mapped release's
# confirmed outcome - the same call argocd-outcome-relay used to make directly,
# best-effort, from inside handleOutcome (docs/admin/multi-cluster.md). Moved here,
# added 2026-08-22, for two real reasons, not just relocation for its own sake:
#
#   1. Visibility: the relay's own direct call logged a failure and dropped it - a
#      Grafana panel would just silently under-count with no PipelineRun anywhere
#      showing it happened. As a Task inside release-outcome-notify (the same
#      PipelineRun `notify`/`span` already run in), a failure here is a real, visible
#      TaskRun failure like any other step in this platform.
#   2. MTTR: dora-exporter runs on the dev cluster and has no live API access to a
#      remote cluster's Application object to patch a last-failure-time annotation
#      onto (the same-cluster path's mechanism) - so MTTR was a known, dead gap for
#      every cluster-mapped app (docs/admin/dora-metrics.md). Running this call as a
#      Task changes nothing about that constraint by itself, but it's what motivated
#      giving dora-exporter its OWN state store on ITS OWN cluster instead
#      (dora-cluster-mapped-state ConfigMap, platform-system) - see
#      platform/dora-exporter/cmd/dora-exporter/main.go's handleArgoCDOutcome.
#
# No runAfter against notify/span - all three are independent consumers of the same
# confirmed outcome, exactly like notify and span already were.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-dora-metrics
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: status
      type: string
      description: "Succeeded or Failed - dora-exporter's /argocd-outcome expects this in its 'phase' field, same vocabulary."
    - name: finished-at
      type: string
      default: ""
    - name: flow-start-time
      type: string
      default: ""
  steps:
    - name: update
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      env:
        - name: DORA_EXPORTER_URL
          value: http://dora-exporter.platform-system.svc.cluster.local:8080/argocd-outcome
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
        - name: PHASE
          value: $(params.status)
        - name: FINISHED_AT
          value: $(params.finished-at)
        - name: FLOW_START_TIME
          value: $(params.flow-start-time)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ -z "${FINISHED_AT}" ]]; then
          echo "[update-dora-metrics] no finished-at (app onboarded before this field existed) - skipping, nothing dora-exporter can record without it" >&2
          exit 0
        fi

        payload="$(jq -n \
          --arg appNamespace "${APP_NAMESPACE}" \
          --arg appName "${APP_NAME}" \
          --arg phase "${PHASE}" \
          --arg finishedAt "${FINISHED_AT}" \
          --arg flowStartTime "${FLOW_START_TIME}" \
          '{appNamespace: $appNamespace, appName: $appName, phase: $phase, finishedAt: $finishedAt, flowStartTime: $flowStartTime}')"

        curl --fail --silent --show-error --max-time 15 \
          --retry 3 --retry-connrefused \
          -X POST "${DORA_EXPORTER_URL}" \
          -H "Content-Type: application/json" \
          -d "${payload}"
        echo
