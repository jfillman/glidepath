# catalog/tasks/validate-cicd-config.yaml
#
# Always the FIRST Task in every Pipeline. Reads cicd.yaml fresh from the triggering
# commit's workspace and validates it against schemas/cicd.schema.json, failing fast
# with a developer-readable error instead of surfacing a malformed-config problem as a
# cryptic failure deep inside build/deploy. There is deliberately no separate
# synced/cached copy of this config anywhere - see docs/user-guide/cicd-yaml-reference.md.
#
# Also extracts build.agent (-> agent-image) and the governance.* toggles (-> sast/
# image-scan/policy-check/sbom) as additional results - these used to be two separate
# Tasks (resolve-build-agent-image.yaml, extract-governance-flags.yaml), each spinning up
# its own Pod just to run one more jq query against the SAME config-json this Task
# already has sitting in hand. Folded in here instead (performance pass, see
# docs/chaining.md's "Task-count/Pod-count" note) - build.yaml and test.yaml both used to
# call resolve-agent-image separately; build.yaml also called extract-governance-flags.
# Both standalone Tasks are deleted, not left around unused.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-cicd-config
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Validates the developer-facing cicd.yaml against the platform schema, and extracts the handful of fields downstream Tasks need most often.
  workspaces:
    - name: source
  params:
    - name: config-path
      type: string
      default: cicd.yaml
  results:
    - name: config-json
      description: cicd.yaml converted to JSON, so downstream Tasks read it with jq instead of re-parsing YAML.
    - name: has-build-script
      description: "'true'/'false' - whether build.script is present in cicd.yaml. Drives build.yaml's when: gate on the build-source Task, for teams doing the whole build inside a multi-stage Dockerfile instead. See docs/user-guide/cicd-yaml-reference.md."
    - name: agent-image
      description: "build.agent resolved to a real image reference via build-agents.env - formerly resolve-build-agent-image.yaml's own result."
    - name: sast
      description: "governance.sast - 'true'/'false'. Formerly extract-governance-flags.yaml's own result."
    - name: image-scan
      description: "governance.imageScan - 'true'/'false'."
    - name: policy-check
      description: "governance.policyCheck - 'true'/'false'."
    - name: sbom
      description: "governance.sbom - 'true'/'false'."
  steps:
    - name: validate
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CONFIG_FILE="$(workspaces.source.path)/$(params.config-path)"

        if [[ ! -f "${CONFIG_FILE}" ]]; then
          echo "error: ${CONFIG_FILE} not found." >&2
          echo "Every app repo needs a cicd.yaml at its root - see docs/user-guide/cicd-yaml-reference.md" >&2
          exit 1
        fi

        yq -o=json '.' "${CONFIG_FILE}" > /tmp/cicd.json

        if ! yajsv -s /opt/platform/schemas/cicd.schema.json /tmp/cicd.json; then
          echo "" >&2
          echo "error: cicd.yaml failed schema validation (see above)." >&2
          echo "Reference: docs/user-guide/cicd-yaml-reference.md" >&2
          exit 1
        fi

        cp /tmp/cicd.json "$(results.config-json.path)"

        HAS_BUILD_SCRIPT="$(jq -r 'if .build.script != null and .build.script != "" then "true" else "false" end' /tmp/cicd.json)"
        echo -n "${HAS_BUILD_SCRIPT}" | tee "$(results.has-build-script.path)" > /dev/null

        # Formerly resolve-build-agent-image.yaml's own step - same lookup, same error
        # message, just reading the config-json this Task already validated instead of
        # re-parsing it in a second Pod.
        AGENT="$(jq -r '.build.agent' /tmp/cicd.json)"
        AGENT_IMAGE="$(grep -E "^${AGENT}=" /opt/platform/lib/build-agents.env | cut -d= -f2-)"
        if [[ -z "${AGENT_IMAGE}" ]]; then
          echo "error: build.agent '${AGENT}' has no entry in build-agents.env - this should be impossible if schema validation passed, file a platform bug." >&2
          exit 1
        fi
        echo -n "${AGENT_IMAGE}" | tee "$(results.agent-image.path)" > /dev/null

        # Formerly extract-governance-flags.yaml's own step. echo -n, not a bare
        # `jq -r ... | tee` - jq's raw output is newline-terminated, and that trailing
        # newline was once silently written into the result value, which broke Tekton's
        # exact-string `when: { operator: in, values: ["true"] }` gates - see
        # extract-governance-flags.yaml's own former header (git history) for the real,
        # previously-live bug this comment is preserving the memory of.
        echo -n "$(jq -r '.governance.sast // false' /tmp/cicd.json)" | tee "$(results.sast.path)" > /dev/null
        echo -n "$(jq -r '.governance.imageScan // false' /tmp/cicd.json)" | tee "$(results.image-scan.path)" > /dev/null
        echo -n "$(jq -r '.governance.policyCheck // false' /tmp/cicd.json)" | tee "$(results.policy-check.path)" > /dev/null
        echo -n "$(jq -r '.governance.sbom // false' /tmp/cicd.json)" | tee "$(results.sbom.path)" > /dev/null

        echo "cicd.yaml is valid."
