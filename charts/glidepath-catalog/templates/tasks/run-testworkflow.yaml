# catalog/tasks/run-testworkflow.yaml
#
# Deliberately not "run-integration-tests" (its original name through 2026-08-24) - a
# TestWorkflow isn't necessarily a test. It's whatever the step says it is (its `role`,
# docs/admin/testing.md): the team's own test, an ops action with no assertions at all
# (clearing a cache before release, warming something up), or the app's check ride, the
# one workflow a release depends on. This Task's job is "run the named TestWorkflow,
# record what happened, report pass/fail," not "test the code" specifically.
#
# Where the workflow comes from, by role:
#
# - test / execute: the app repo's own glidepath/<name>.yaml, applied into Testkube CE's
#   single shared `testkube` namespace (see gitops-cluster-dev/50-platform-cicd/testkube/
#   application.yaml's own header for why it's one shared namespace, not one per tenant -
#   executionNamespaces is a Testkube Pro/Enterprise-only feature, confirmed live + in
#   source, so CE genuinely cannot run this inside the app's own -cicd namespace).
#   metadata.name is ALWAYS overwritten to "<app-name>-<test-name>" before applying,
#   regardless of what's in the file - Testkube's shared namespace means TestWorkflow
#   names must be unique across every onboarded Application, and app-name here comes
#   from the PipelineRun's own trusted platformIdentity-derived param, not anything a
#   developer's commit controls, so this can't be spoofed by editing the workflow file.
#   With no such file, ./integration-test.sh (the phase 1 fallback, run in the app's own
#   agent image) still works; with neither, the step FAILS (2026-10-19 - it used to
#   report `skipped` and succeed, which made a typo in test.name indistinguishable from
#   a passed test). `skipped` now only ever means cicd.yaml's `test.enabled: false`.
#
# - check-ride: the TestWorkflow <app-name>-<check-ride-name> that Argo CD synced into
#   the testkube namespace from the shared check-rides repository (apps/<app>/
#   check-ride.yaml, reviewed by the team and an SDET; the template it uses, by SDETs and
#   product owners). Nothing is applied from this repo: what runs is what both owners
#   reviewed, and this Task refuses a workflow that was not synced (no Argo CD tracking
#   annotation) or that carries another app's hangar.io/app label. A missing check ride
#   is a failure that names the file to add.
#
# Application secrets reach a workflow by re-materializing this namespace's own
# app-secrets into a pre-seeded, per-Application placeholder Secret in the testkube
# namespace (rendered by this Application's own onboarding chart - glidepath-app's
# templates/testkube/rbac-and-secret.yaml) immediately before the run and blanking it
# after; the workflow references it via the literal placeholder "__APP_SECRETS_NAME__",
# substituted for the real name before applying (ADR-0007; a Kyverno policy makes any
# other Secret name unadmittable, ADR-0008, extended 2026-10-19 for the sync identity).
#
# The platform's context reaches the workflow two ways (docs/user/cicd-yaml-reference.md,
# "The test: block"):
# - as `config`, for every key the workflow declares under spec.config out of app, env,
#   image, url, revision, gitUrl, chain. Undeclared keys are not passed. `url` is the
#   in-cluster address of the step's environment Service.
# - as execution tags (app, env, test, role, image, revision, chain), always, so a run
#   can be found later by what it tested (Testkube's tagSelector).
# Every applied workflow also gets registry-credentials in spec.pod.imagePullSecrets, so
# a workflow may run inside the private app image under test.
#
# What it records (the contract, docs/admin/testing.md): outcome, step-summary,
# execution-id, role, workflow-source, workflow-digest, tests-total/passed/failed/
# skipped (from the JUnit report the workflow left under data/artifacts/ - Testkube CE
# stores the artifact but does not parse it, checked live on 2.13.1), report-path, and
# the tested image's repo + digest. The last two double as Tekton Chains type hints
# (IMAGE_URL/IMAGE_DIGEST, and test.yaml's Pipeline-level pair): Chains signs this
# PipelineRun's provenance and attaches it to the image, carrying every result above in
# buildConfig.tasks[] - the evidence the qa gate verifies, the same way the sast gate
# reads sast-scan's outcome from the build's provenance. The image digest is resolved
# with oras through the same registry-credentials build-image pushes with.
#
# Triggering/polling uses the official `testkube` CLI (added to the toolbox image
# 2026-09-05), not a hand-crafted TestWorkflowExecution CR + raw REST polling - see the
# execute-testworkflow step's own comment for why that switch alone didn't fix the
# false-"aborted" bug it was hoped to, and what actually works around it.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-testworkflow
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  workspaces:
    - name: source
  params:
    - name: config-json
      type: string
    - name: agent-image
      type: string
    - name: image-ref
      type: string
    - name: env
      type: string
    - name: test-name
      type: string
    - name: app-name
      type: string
    - name: app-namespace
      type: string
      default: ""
      description: "This Application's CI namespace (<type>-<app>-cicd); the environment's namespace for `url` is derived from it. Empty: no url is passed."
    - name: git-url
      type: string
      default: ""
    - name: git-revision
      type: string
      default: ""
    - name: chain-id
      type: string
      default: ""
    - name: timeout
      type: string
      default: "10m"
      description: "How long to wait for the TestWorkflowExecution to reach a terminal status, as Ns, Nm or Nh. Polled every 10s. Past it the outcome is `timeout` and the Task fails; the execution itself is left running (Testkube's own job timeout, if the workflow sets one, still applies)."
    - name: role
      type: string
      default: "test"
      description: "test, execute or check-ride - cicd.yaml steps[].role, see the header."
    - name: required
      type: string
      default: "true"
      description: "\"false\": a failed run is recorded (outcome failed) but this Task exits 0, so the flow continues. Ignored for check-ride (always required)."
    - name: check-ride-name
      type: string
      default: "check-ride"
      description: "The check ride's name suffix: the synced TestWorkflow is <app-name>-<check-ride-name>. From the catalog's checkRide.workflowName."
  results:
    - name: outcome
      description: "'passed'/'failed'/'timeout'/'skipped' - from the Testkube TestWorkflowExecution's own result.status (aborted-but-really-passed already corrected below), or the fallback script's exit code translated the same way. 'skipped' only ever means cicd.yaml's test.enabled is false; a missing workflow is 'failed'. Same outcome/findings-summary shape as catalog/tasks/sast-scan.yaml and image-scan.yaml, not a new convention."
    - name: step-summary
      description: "One line per Testkube step: '<step-name>: <status>' - empty for the fallback-script path and for 'skipped'."
    - name: execution-id
      description: "The TestWorkflowExecution id (Testkube's own), so the run's record - tags, step tree, logs, artifacts - can be found again from Tower or the CLI (`testkube get twe <id>`). Empty for the fallback path and for 'skipped'."
    - name: role
      description: "The step's role, echoed so the provenance carries it: test, execute or check-ride."
    - name: workflow-source
      description: "Where the workflow came from: 'argocd:<application>' for a synced check ride (the Argo CD tracking-id's application name), 'repo:<git-url>@<revision>' for a file from this repo, 'script' for integration-test.sh."
    - name: workflow-digest
      description: "sha256 of the canonical JSON of the TestWorkflow spec that ran (after name/secret substitution), so the evidence names exactly which workflow it is evidence of."
    - name: tests-total
      description: "Test cases in the JUnit report the workflow left at data/artifacts/junit.xml (or the first *.xml artifact with a <testsuite). Empty when there is no report."
    - name: tests-passed
    - name: tests-failed
      description: "Failures plus errors."
    - name: tests-skipped
    - name: report-path
      description: "The artifact path of the JUnit report that was parsed, empty when none."
    - name: image-repo
      description: "The tested image's repository, no tag (test.yaml's Pipeline-level IMAGE_URL result, Tekton Chains' type hint). Empty for a flow with no image."
    - name: image-digest
      description: "The tested image's digest, sha256:... (test.yaml's IMAGE_DIGEST). Resolved with oras; empty when the image could not be resolved."
    - name: IMAGE_URL
      description: "Same as image-repo, under Chains'/Conforma's exact-cased Task-level type-hint name - see build-image.yaml's identical pair."
    - name: IMAGE_DIGEST
      description: "Same as image-digest, under the exact-cased Task-level type-hint name."
  # Registry read credentials for oras (digest resolution): the same
  # kubernetes.io/dockerconfigjson Secret build-image pushes with, consumed via
  # DOCKER_CONFIG the same way build-artifact.yaml does.
  volumes:
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        optional: true
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: resolve-enabled
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      results:
        - name: enabled
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # NOT `.test.enabled // true` - a real, previously-undiscovered bug found live
        # (see run-tests.yaml's own identical fix for the full explanation): jq's `//`
        # treats `false` the same as missing/null, so an explicit `test.enabled: false`
        # was silently ignored - no Application has ever actually been able to disable the
        # test stage via cicd.yaml.
        #
        # Second, separate bug found live in THIS step while wiring up test env/name
        # (2026-08-09): this used to pipe jq's own output straight into `tee` with no `-n`
        # anywhere, so the result file held "true\n", not "true" - a real cross-step env
        # var substitution (unlike a $(...) command substitution) does NOT strip that
        # trailing newline (same gotcha build-image.yaml's own header already documents
        # for span-start-time). `[[ "${TEST_ENABLED}" != "true" ]]` in the next step was
        # therefore ALWAYS true regardless of cicd.yaml's actual value - confirmed live,
        # every test run ever reported "disabled...skipping" even with test.enabled
        # defaulting true. run-tests.yaml's equivalent step already avoided this by
        # capturing into a variable first; mirrored here.
        ENABLED="$(jq -r 'if .test.enabled == false then "false" else "true" end' <<< '$(params.config-json)')"
        echo -n "${ENABLED}" | tee "$(step.results.enabled.path)"

    - name: execute-testworkflow
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      workingDir: $(workspaces.source.path)
      results:
        - name: fallback-needed
      # Cross-step result references only work in env/command/args, not inline script -
      # see the comment in catalog/tasks/build-image.yaml's run-build-script step.
      env:
        - name: TEST_ENABLED
          value: $(steps.resolve-enabled.results.enabled)
        - name: TEST_NAME
          value: $(params.test-name)
        - name: APP_NAME
          value: $(params.app-name)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: TEST_ENV
          value: $(params.env)
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: CHAIN_ID
          value: $(params.chain-id)
        - name: TIMEOUT
          value: $(params.timeout)
        - name: ROLE
          value: $(params.role)
        - name: REQUIRED
          value: $(params.required)
        - name: CHECK_RIDE_NAME
          value: $(params.check-ride-name)
        # Not under /tekton/: Tekton's validation webhook refuses any volumeMount there
        # (found live 2026-10-19, the catalog sync failed on it).
        - name: DOCKER_CONFIG
          value: /var/run/registry-credentials
      volumeMounts:
        - name: registry-credentials
          mountPath: /var/run/registry-credentials
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Every result is written up front with its failure value, so an early exit (a
        # CLI error under set -e, a kubectl refusal) still leaves a complete, honest
        # result set rather than an unset `outcome` - same reasoning as sast-scan.yaml's
        # own onError: continue. The paths are shared with the next step, which
        # overwrites `outcome` when the fallback script runs instead.
        R="$(results.outcome.path)"; echo -n "failed" > "${R}"
        for r in step-summary execution-id workflow-source workflow-digest tests-total tests-passed tests-failed tests-skipped report-path image-repo image-digest IMAGE_URL IMAGE_DIGEST; do
          echo -n "" > "/tekton/results/${r}"
        done
        echo -n "${ROLE}" > "$(results.role.path)"
        echo -n "false" > "$(step.results.fallback-needed.path)"

        if [[ "${TEST_ENABLED}" != "true" ]]; then
          echo "test stage disabled in cicd.yaml (test.enabled: false), skipping"
          echo -n "skipped" | tee "$(results.outcome.path)"
          exit 0
        fi

        case "${ROLE}" in
          test|execute|check-ride) ;;
          *) echo "error: role '${ROLE}' is not test, execute or check-ride" >&2; exit 1 ;;
        esac
        if [[ "${ROLE}" == "check-ride" ]]; then REQUIRED="true"; fi

        # The tested image's repo and digest, for Chains' type hints (see the header). A
        # git-rooted test-only flow has no image; a digest that can't be resolved is left
        # empty and said so, never guessed.
        IMAGE_REPO=""; IMAGE_DIGEST=""
        if [[ -n "${IMAGE_REF}" ]]; then
          IMAGE_REPO="${IMAGE_REF%%@*}"; IMAGE_REPO="$(sed -E 's#:[^/:]+$##' <<< "${IMAGE_REPO}")"
          if [[ "${IMAGE_REF}" == *@sha256:* ]]; then
            IMAGE_DIGEST="sha256:${IMAGE_REF##*@sha256:}"
          # oras, not crane: crane is not in the toolbox (open-release-pin-pr.yaml does the
          # same). For a multi-arch image this is the index digest, the one build-image pins.
          elif ! IMAGE_DIGEST="$(oras resolve "${IMAGE_REF}" 2>/dev/null | tr -d '\n')" || [[ "${IMAGE_DIGEST}" != sha256:* ]]; then
            echo "warn: could not resolve the digest of ${IMAGE_REF} (oras resolve gave '${IMAGE_DIGEST:-nothing}') - the provenance will carry no image digest" >&2
            IMAGE_DIGEST=""
          fi
          echo -n "${IMAGE_REPO}" > "$(results.image-repo.path)"; echo -n "${IMAGE_REPO}" > "$(results.IMAGE_URL.path)"
          echo -n "${IMAGE_DIGEST}" > "$(results.image-digest.path)"; echo -n "${IMAGE_DIGEST}" > "$(results.IMAGE_DIGEST.path)"
          echo "image ${IMAGE_REF} -> ${IMAGE_REPO} ${IMAGE_DIGEST:-(no digest)}"
        fi

        SECRET_NAME="${APP_NAME}-app-secrets"
        WORKFLOW_SPEC_JSON=""   # the spec that runs, for workflow-digest
        DECLARED=""             # spec.config keys the workflow declares

        if [[ "${ROLE}" == "check-ride" ]]; then
          WORKFLOW_NAME="${APP_NAME}-${CHECK_RIDE_NAME}"
          if ! TW_JSON="$(kubectl -n testkube get testworkflow "${WORKFLOW_NAME}" -o json 2>/dev/null)"; then
            echo "error: no check ride for ${APP_NAME}: TestWorkflow testkube/${WORKFLOW_NAME} does not exist." >&2
            echo "error: add apps/${APP_NAME}/check-ride.yaml (metadata.name ${WORKFLOW_NAME}) to the check-rides repository; Argo CD syncs it here. See docs/admin/testing.md." >&2
            exit 1
          fi
          TRACKING="$(jq -r '.metadata.annotations["argocd.argoproj.io/tracking-id"] // ""' <<< "${TW_JSON}")"
          LABEL_APP="$(jq -r '.metadata.labels["hangar.io/app"] // ""' <<< "${TW_JSON}")"
          if [[ -z "${TRACKING}" ]]; then
            echo "error: testkube/${WORKFLOW_NAME} was not synced by Argo CD (no argocd.argoproj.io/tracking-id) - a check ride must come from the check-rides repository, not be applied by hand." >&2
            exit 1
          fi
          if [[ "${LABEL_APP}" != "${APP_NAME}" ]]; then
            echo "error: testkube/${WORKFLOW_NAME} carries hangar.io/app=${LABEL_APP:-(none)}, not ${APP_NAME} - refusing to run another app's workflow as this app's check ride." >&2
            exit 1
          fi
          WORKFLOW_SOURCE="argocd:${TRACKING%%:*}"
          WORKFLOW_SPEC_JSON="$(jq -cS '.spec' <<< "${TW_JSON}")"
          DECLARED="$(jq -r '.spec.config // {} | keys | .[]' <<< "${TW_JSON}")"
          echo "check ride: ${WORKFLOW_NAME} (synced, ${WORKFLOW_SOURCE})"
        else
          WORKFLOW_FILE="glidepath/${TEST_NAME}.yaml"
          if [[ ! -f "${WORKFLOW_FILE}" ]]; then
            if [[ -f ./integration-test.sh ]]; then
              echo "no ${WORKFLOW_FILE} - falling back to ./integration-test.sh"
              echo -n "script" > "$(results.workflow-source.path)"
              echo -n "true" | tee "$(step.results.fallback-needed.path)"
              exit 0
            fi
            echo "error: test '${TEST_NAME}' names no workflow: ${WORKFLOW_FILE} does not exist in this commit and there is no ./integration-test.sh." >&2
            echo "error: write ${WORKFLOW_FILE} (a Testkube TestWorkflow, see docs/user/cicd-yaml-reference.md), fix test.name / the step's testName, or set test.enabled: false to run the stage without a test." >&2
            exit 1
          fi
          WORKFLOW_NAME="${APP_NAME}-${TEST_NAME}"
          WORKFLOW_SOURCE="repo:${GIT_URL}@${GIT_REVISION}"
          DECLARED="$(yq eval '.spec.config // {} | keys | .[]' "${WORKFLOW_FILE}" 2>/dev/null || true)"
        fi
        echo -n "${WORKFLOW_SOURCE}" > "$(results.workflow-source.path)"

        echo "materializing this namespace's app-secrets into testkube/${SECRET_NAME}"
        if kubectl get secret app-secrets >/dev/null 2>&1; then
          PATCH_DATA="$(kubectl get secret app-secrets -o json | jq -c '{data: .data}')"
          kubectl -n testkube patch secret "${SECRET_NAME}" --type merge -p "${PATCH_DATA}"
        else
          echo "no app-secrets in this namespace - leaving ${SECRET_NAME} empty"
        fi

        if [[ "${ROLE}" != "check-ride" ]]; then
          echo "applying ${WORKFLOW_FILE} as TestWorkflow/${WORKFLOW_NAME} in testkube namespace"
          APPLIED="$(yq eval ".metadata.name = \"${WORKFLOW_NAME}\"
            | .spec.pod.imagePullSecrets = ((.spec.pod.imagePullSecrets // []) + [{\"name\": \"registry-credentials\"}] | unique_by(.name))" "${WORKFLOW_FILE}" \
            | sed "s/__APP_SECRETS_NAME__/${SECRET_NAME}/g")"
          kubectl -n testkube apply -f - <<< "${APPLIED}"
          WORKFLOW_SPEC_JSON="$(yq eval -o=json '.spec' <<< "${APPLIED}" | jq -cS '.')"
        fi
        WORKFLOW_DIGEST="sha256:$(printf '%s' "${WORKFLOW_SPEC_JSON}" | sha256sum | cut -d' ' -f1)"
        echo -n "${WORKFLOW_DIGEST}" > "$(results.workflow-digest.path)"
        echo "workflow-digest=${WORKFLOW_DIGEST}"

        # The platform's context for the workflow. `url` is only derivable for a
        # Kubernetes environment: <type>-<app>-cicd -> <type>-<app>-<env>, Service named
        # after the app (airframe-application's convention). The port is read from the
        # Service when this identity is allowed to (it is not, today - glidepath-env's
        # deploy RBAC covers Rollouts only - so 8080 is the usual answer); a wrong port
        # shows up as a failed wait step in the workflow, not a silent pass.
        TARGET_URL=""
        if [[ -n "${APP_NAMESPACE}" && -n "${TEST_ENV}" ]]; then
          ENV_NAMESPACE="${APP_NAMESPACE%-cicd}-${TEST_ENV}"
          TARGET_PORT="$(kubectl -n "${ENV_NAMESPACE}" get svc "${APP_NAME}" -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || true)"
          TARGET_URL="http://${APP_NAME}.${ENV_NAMESPACE}.svc.cluster.local:${TARGET_PORT:-8080}"
        fi

        # Pass a config value only when the workflow declares the key (spec.config), so a
        # workflow written before this existed, or one that wants none of it, is run as
        # before. The declared set is the contract; docs/user/cicd-yaml-reference.md lists it.
        CONFIG_ARGS=()
        add_config() {
          local key="$1" value="$2"
          if grep -qx -- "${key}" <<< "${DECLARED}"; then
            CONFIG_ARGS+=(--config "${key}=${value}")
            echo "config ${key}=${value}"
          fi
        }
        add_config app "${APP_NAME}"
        add_config env "${TEST_ENV}"
        add_config image "${IMAGE_REF}"
        add_config url "${TARGET_URL}"
        add_config revision "${GIT_REVISION}"
        add_config gitUrl "${GIT_URL}"
        add_config chain "${CHAIN_ID}"

        # Tags are always set (empty values skipped - the CLI rejects "key=").
        TAG_ARGS=()
        add_tag() { [[ -n "$2" ]] && TAG_ARGS+=(--tag "$1=$2") || true; }
        add_tag app "${APP_NAME}"
        add_tag env "${TEST_ENV}"
        add_tag test "${TEST_NAME}"
        add_tag role "${ROLE}"
        add_tag image "${IMAGE_REF}"
        add_tag revision "${GIT_REVISION}"
        add_tag chain "${CHAIN_ID}"

        # --client direct talks straight to the in-cluster Service over plain HTTP, no
        # RBAC or auth needed in standalone/CE mode (confirmed live 2026-09-05) - the
        # alternative "cluster" client mode proxies through the k8s API server's
        # services/proxy subresource instead, which this Task's ServiceAccount was
        # never granted and doesn't need.
        API="http://testkube-api-server.testkube.svc.cluster.local:8088"
        TK="testkube --client direct --api-uri ${API} --namespace testkube"

        echo "triggering execution via testkube CLI"
        # NOT `${TK} run tw ... -f` (follow/watch) - live-verified 2026-09-05 that -f's
        # log-streaming path spams "failed to create fsnotify watcher: too many open
        # files" dozens of times per run in this toolbox image and adds nothing we don't
        # already get by polling `get twe` below. Trigger and poll are kept as separate
        # calls, same shape as the old kubectl+curl version.
        EXECUTION_ID="$(${TK} run tw "${WORKFLOW_NAME}" "${CONFIG_ARGS[@]}" "${TAG_ARGS[@]}" -o json | jq -r '.id')"
        echo -n "${EXECUTION_ID}" > "$(results.execution-id.path)"
        echo "TestWorkflowExecution ${EXECUTION_ID} started, polling for a terminal status (timeout ${TIMEOUT})"

        # Ns / Nm / Nh -> polls of 10s. A malformed value fails here, loudly, rather
        # than polling forever or not at all.
        case "${TIMEOUT}" in
          *s) TIMEOUT_SECONDS="${TIMEOUT%s}" ;;
          *m) TIMEOUT_SECONDS="$(( ${TIMEOUT%m} * 60 ))" ;;
          *h) TIMEOUT_SECONDS="$(( ${TIMEOUT%h} * 3600 ))" ;;
          *) echo "error: timeout '${TIMEOUT}' is not Ns, Nm or Nh" >&2; exit 1 ;;
        esac
        POLLS="$(( (TIMEOUT_SECONDS + 9) / 10 ))"

        # Live-verified 2026-09-05 this is a genuine, near-deterministic testkube
        # 2.12.2/2.13.1 bug (10 of 11 real executions hit it), NOT the node-capacity
        # theory from earlier incidents (reproduced with the node at 12% CPU / 48% mem)
        # and NOT fixed by triggering via the CLI instead of a hand-crafted
        # TestWorkflowExecution CR (reproduced identically via `testkube run tw -f`
        # too, same "Job has been aborted" message). testkube's own watch declares the
        # execution "aborted" the instant a step's container reports terminated/
        # Completed but the pod's Ready/ContainersReady conditions (which, for a
        # restartPolicy:Never pod, go permanently False on successful exit - not a
        # readiness-probe symptom) and the parent Job's `status.active` haven't yet
        # been rolled by the native Job controller - a race against Job-status
        # reconciliation, not container runtime, so a longer-running step (tested with
        # an explicit `sleep 10` step) hits it identically. The saved execution record
        # still carries the real per-step result underneath: `result.initialization`
        # is what falsely reports "aborted" while `result.steps.<ref>.status` shows
        # the step's true outcome ("passed" in every reproduction) - so a truly aborted
        # run (a real OOMKill, eviction, or manual abort) is distinguishable from this
        # false one by checking whether every step still says "passed" underneath.
        STATUS=""
        RESULT_JSON=""
        for i in $(seq 1 "${POLLS}"); do
          RESULT_JSON="$(${TK} get twe "${EXECUTION_ID}" -o json)"
          STATUS="$(jq -r '.result.status // empty' <<< "${RESULT_JSON}")"
          case "${STATUS}" in
            passed|failed|aborted) break ;;
          esac
          sleep 10
        done

        echo "blanking ${SECRET_NAME} again (never deleting it - it's owned by this Application's own onboarding chart, not this Task)"
        # NOT `-p '{"data":{}}'` - live-verified 2026-08-24 that's a no-op against an
        # already-populated map under RFC 7396 JSON merge patch semantics (an empty
        # object in the patch means "nothing to merge", not "clear this field") - the
        # secret's real data silently survived every "blank" for as long as this bug
        # existed. `data: null` is what actually clears it - a null in a merge patch
        # means "remove this key", confirmed against the live object.
        kubectl -n testkube patch secret "${SECRET_NAME}" --type merge -p '{"data":null}' || true

        if [[ "${STATUS}" == "aborted" ]]; then
          STEP_STATUSES="$(jq -r '.result.steps // {} | to_entries[].value.status' <<< "${RESULT_JSON}" | sort -u)"
          if [[ -n "${STEP_STATUSES}" && "${STEP_STATUSES}" == "passed" ]]; then
            echo "TestWorkflowExecution ${EXECUTION_ID} reported aborted, but every real step passed - treating as passed (see the comment above this loop for the known testkube race this works around)"
            STATUS="passed"
          fi
        fi

        case "${STATUS}" in
          passed|failed|aborted) ;;
          *) STATUS="timeout" ;;
        esac
        echo "TestWorkflowExecution ${EXECUTION_ID} finished with status: ${STATUS}"

        # Per-step breakdown, named by the signature (result.steps is keyed by ref).
        STEP_SUMMARY="$(jq -r '[.signature // [] | .. | objects | select(has("ref")) | {ref, name}] as $sig
          | (.result.steps // {}) | to_entries
          | map((.key) as $ref | "\(($sig[] | select(.ref == $ref) | .name) // $ref): \(.value.status)")
          | join("\n")' <<< "${RESULT_JSON}" 2>/dev/null || echo "")"
        echo -n "${STATUS}" | tee "$(results.outcome.path)"; echo
        echo "${STEP_SUMMARY}" | tee "$(results.step-summary.path)"

        # The JUnit report, from the artifacts the workflow left: Testkube CE stores them
        # and does not parse them (execution `reports` is null on 2.13.1, checked live),
        # so the counts are read here. data/artifacts/junit.xml by convention
        # (check-ride templates require it), else the first *.xml that looks like JUnit.
        REPORT_PATH=""
        ARTIFACTS="$(curl -fsS "${API}/v1/test-workflow-executions/${EXECUTION_ID}/artifacts" 2>/dev/null || echo '[]')"
        REPORT_PATH="$(jq -r '[.[] | .name] | (map(select(. == "data/artifacts/junit.xml")) + map(select(endswith(".xml")))) | .[0] // ""' <<< "${ARTIFACTS}")"
        if [[ -n "${REPORT_PATH}" ]]; then
          ENCODED="$(jq -rn --arg p "${REPORT_PATH}" '$p | @uri')"
          if curl -fsS -o /tmp/junit.xml "${API}/v1/test-workflow-executions/${EXECUTION_ID}/artifacts/${ENCODED}" 2>/dev/null && grep -q '<testsuite' /tmp/junit.xml; then
            # `|| true` inside each pipeline: grep -o exits 1 on zero matches, and under
            # pipefail that turned a report with no failures into a silent exit 1 of the
            # whole step (the first live run, 2026-10-19: every test passed, Task failed).
            count() { { grep -o "$1" /tmp/junit.xml || true; } | wc -l | tr -d ' '; }
            TOTAL="$(count '<testcase')"
            FAILED="$(count '<failure')"
            ERRORS="$(count '<error')"
            SKIPPED="$(count '<skipped')"
            FAILED=$(( FAILED + ERRORS ))
            PASSED=$(( TOTAL - FAILED - SKIPPED )); [[ ${PASSED} -lt 0 ]] && PASSED=0
            echo -n "${TOTAL}" > "$(results.tests-total.path)"; echo -n "${PASSED}" > "$(results.tests-passed.path)"
            echo -n "${FAILED}" > "$(results.tests-failed.path)"; echo -n "${SKIPPED}" > "$(results.tests-skipped.path)"
            echo -n "${REPORT_PATH}" > "$(results.report-path.path)"
            echo "junit ${REPORT_PATH}: total=${TOTAL} passed=${PASSED} failed=${FAILED} skipped=${SKIPPED}"
          else
            echo "warn: artifact ${REPORT_PATH} could not be read as a JUnit report" >&2
          fi
        else
          echo "no JUnit report among the artifacts (data/artifacts/junit.xml or any *.xml) - no test counts recorded"
        fi

        if [[ "${STATUS}" != "passed" ]]; then
          echo "${RESULT_JSON}" >&2
          if [[ "${REQUIRED}" == "false" ]]; then
            echo "run '${WORKFLOW_NAME}' ${STATUS}, but this step is required: false - recorded as ${STATUS}, the flow continues"
            exit 0
          fi
          exit 1
        fi

    - name: fallback-script
      image: $(params.agent-image)
      workingDir: $(workspaces.source.path)
      env:
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: FALLBACK_NEEDED
          value: $(steps.execute-testworkflow.results.fallback-needed)
        - name: TEST_ENV
          value: $(params.env)
        - name: TEST_NAME
          value: $(params.test-name)
        - name: REQUIRED
          value: $(params.required)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [[ "${FALLBACK_NEEDED}" != "true" ]]; then
          exit 0
        fi
        # The previous step only sets fallback-needed when ./integration-test.sh exists.
        echo "running '${TEST_NAME}' against env '${TEST_ENV}', image ${IMAGE_REF}"
        chmod +x ./integration-test.sh
        # set +e, not the whole script under set -e: `outcome` must still be written
        # on a real failure - same reasoning as execute-testworkflow's own comment
        # above on this Task's result contract.
        set +e
        ./integration-test.sh
        FALLBACK_EXIT_CODE=$?
        set -e
        if [[ "${FALLBACK_EXIT_CODE}" -eq 0 ]]; then
          echo -n "passed" | tee "$(results.outcome.path)"
        else
          echo -n "failed" | tee "$(results.outcome.path)"
          if [[ "${REQUIRED}" == "false" ]]; then
            echo "integration-test.sh failed, but this step is required: false - recorded as failed, the flow continues"
            exit 0
          fi
        fi
        exit "${FALLBACK_EXIT_CODE}"
