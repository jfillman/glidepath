# catalog/tasks/image-scan.yaml
#
# Real (not stub) image vulnerability scanning via Trivy - Phase 3 item 8.5. Replaces
# governance-gate-stub for the `image-scan` gate in both build.yaml's image-scan Task
# and (via extract-promoted-image.yaml + catalog/pipelines/image-scan-check.yaml) the
# gitops repo's PR-triggered image-scan Check.
#
# Trivy, not a second SAST-style source scanner: scans the actual built OCI image (OS
# packages + language deps), no server/license needed, single static binary (a real
# GitHub-release binary confirmed live for linux/arm64, unlike Semgrep - see
# sast-scan.yaml's own header for that contrast) - pinned into the toolbox image
# (catalog/toolbox/Dockerfile) the same way as gitsign/ec/cosign. Runs entirely inside
# the toolbox image (unlike sast-scan's dedicated non-toolbox step image) - no
# start/end-timestamp handoff needed, otel-cli is right there, so this wraps the trivy
# invocation directly in otel_child_span.
#
# --severity HIGH,CRITICAL: MEDIUM/LOW findings are real but not build-blocking at this
# phase - a real, deliberate bar, not "scan everything and never fail." Revisit if this
# proves too loose/strict once run against more real images.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-scan
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Runs Trivy against the given image reference; fails closed on HIGH/CRITICAL vulnerabilities.
  params:
    - name: image-ref
      type: string
      description: Full image reference (repo:tag) to scan - must already be pushed to the registry, Trivy pulls it directly.
    - name: flow-traceparent
      type: string
      default: ""
      description: Leave empty when there's no flow/stage context (e.g. a PR-triggered GitOps-repo check) - see governance-stub.yaml for the same convention.
    - name: stage-span-id
      type: string
      default: ""
      description: The calling stage's own span id - this scan's span is parented to it. Ignored when flow-traceparent is empty.
    - name: config-json
      type: string
      default: ""
      description: Output of validate-cicd-config's config-json result - read for notifications.slack.* only (same as notify-slack.yaml). Left empty in the gitops-repo PR-check context, same as flow-traceparent above.
    - name: app-name
      type: string
      default: ""
    - name: git-url
      type: string
      default: ""
    - name: git-revision
      type: string
      default: ""
    - name: exceptions-repo-url
      type: string
      default: ""
      description: >-
        The gitops repo whose DEFAULT BRANCH may carry a .trivyignore.yaml of accepted findings (the PR-check Pipeline passes its repo-url).
        Empty means no exceptions: the build-time scan never reads one. See docs/admin/image-scan-exceptions.md.
    - name: exceptions-max-days
      type: string
      default: "90"
      description: The furthest ahead an exception's expired_at may be, in days. A file with an entry beyond it is refused and the gate fails.
  results:
    - name: outcome
      description: "'passed'/'failed'/'error' - a real result, never 'stub' (this is a real implementation, not governance-gate-stub). 'error' means trivy itself failed (timeout, registry/DB fetch error, ...) rather than finding a HIGH/CRITICAL vulnerability - since 2026-10-09 the scan runs without --exit-code, so any non-zero Trivy exit is an error and the verdict comes from the JSON finding count."
    - name: findings-summary
      description: 'Total finding count plus up to 8 real CVE entries (severity/ID/package), extracted from the JSON scan output for the shift-left Slack notification below - not just Trivy''s own "Total: N" count line, a real gap the user caught live in the first version of this Task.'
  volumes:
    # Read-only GitHub App token for fetch-exceptions - the identity extract-promoted-image already uses (audience
    # github-installation-token, single repo, minted by the broker). fetch-exceptions hands the scan step its files here.
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
    - name: exceptions
      emptyDir: {}
    - name: slack-webhook
      secret:
        secretName: app-secrets
        optional: true
    # Registry pull credentials for trivy's remote image fetch - same Secret/key mapping
    # generate-sbom.yaml already uses for cosign, consumed the same way (DOCKER_CONFIG),
    # since trivy's remote scanner is also built on go-containerregistry. Missing until
    # now: trivy was always attempting an anonymous pull, which 401s the moment a
    # package is private - GHCR's real default visibility for a freshly-pushed package
    # (see generate-sbom.yaml's own build-image.yaml sibling comment on this).
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    # Accepted findings (docs/admin/image-scan-exceptions.md). Reads .trivyignore.yaml from the gitops repo's DEFAULT BRANCH at
    # its current commit, never from the PR head: this Task runs on a release PR, and a PR must not be able to accept its own
    # findings - accepting one is a separate reviewed change to the default branch. Same read-only, single-repo GitHub App token
    # extract-promoted-image uses. Validates the file (every entry needs a statement and an expired_at, none further ahead than
    # exceptions-max-days) and writes the verdict for the scan step to /exceptions; it never fails itself, so the scan step can
    # fail the gate with the reason in findings-summary. No file on the default branch means no exceptions.
    - name: fetch-exceptions
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      computeResources:
        requests: { cpu: 50m, memory: 64Mi }
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
        - name: exceptions
          mountPath: /exceptions
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: EXC_REPO_URL
          value: $(params.exceptions-repo-url)
        - name: EXC_MAX_DAYS
          value: $(params.exceptions-max-days)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        source "${PLATFORM_LIB}/github-app.sh"
        set +e   # github-app.sh sets -e at module level; this step reports through /exceptions/status instead of exiting non-zero
        X=/exceptions
        finish() {  # <none|ok|refused|error> <message>
          printf '%s' "$1" > "${X}/status"; printf '%s' "$2" > "${X}/message"
          echo "exceptions: $1 - $2"
          exit 0
        }
        [[ -n "${EXC_REPO_URL}" ]] || finish none "no exceptions repo given (a build-time scan reads no exceptions)"
        [[ "${EXC_MAX_DAYS}" =~ ^[0-9]+$ && "${EXC_MAX_DAYS}" -gt 0 ]] || finish error "exceptions-max-days must be a positive whole number, got '${EXC_MAX_DAYS}'"

        owner="$(sed -E 's#https?://github\.com/([^/]+)/.*#\1#' <<<"${EXC_REPO_URL}")"
        repo="$(sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#' <<<"${EXC_REPO_URL}")"
        token="$(github_app_installation_token "${owner}" "${repo}")" || finish error "could not get a read token for ${owner}/${repo}"
        base="https://api.github.com/repos/${owner}/${repo}"
        get() {  # <url> <accept> <outfile> - prints the HTTP status
          curl --silent --show-error --retry 3 --retry-connrefused --max-time 20 -o "$3" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" -H "X-GitHub-Api-Version: 2022-11-28" -H "Accept: $2" "$1"
        }
        code="$(get "${base}" application/vnd.github+json "${X}/repo.json")"
        [[ "${code}" == 200 ]] || finish error "GitHub answered ${code} for ${owner}/${repo}"
        branch="$(jq -r '.default_branch // empty' "${X}/repo.json")"
        [[ -n "${branch}" ]] || finish error "${owner}/${repo} reports no default branch"
        code="$(get "${base}/commits/${branch}" application/vnd.github+json "${X}/commit.json")"
        [[ "${code}" == 200 ]] || finish error "GitHub answered ${code} for ${owner}/${repo} branch ${branch}"
        sha="$(jq -r '.sha // empty' "${X}/commit.json")"
        [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || finish error "no commit sha for ${owner}/${repo} branch ${branch}"
        printf '%s' "${sha}" > "${X}/commit"; printf '%s' "${branch}" > "${X}/branch"
        where="${owner}/${repo} ${branch} @ ${sha:0:12}"

        # Always the default branch's commit, by sha: never the PR head, whatever the PR contains.
        code="$(get "${base}/contents/.trivyignore.yaml?ref=${sha}" application/vnd.github.raw+json "${X}/raw.yaml")"
        if [[ "${code}" == 404 ]]; then finish none "no .trivyignore.yaml on ${where}"; fi
        [[ "${code}" == 200 ]] || finish error "GitHub answered ${code} for .trivyignore.yaml on ${where}"

        refuse() { finish refused "$1 (.trivyignore.yaml on ${where}) - fix it on ${branch}; every entry needs an id, a statement and an expired_at no more than ${EXC_MAX_DAYS} days ahead"; }
        yq -o=json '(.[] | select(tag == "!!seq") | .[] | select(tag == "!!map")) |= (.expired_tag = (.expired_at | tag))' "${X}/raw.yaml" > "${X}/raw.json" 2> "${X}/yq.err" \
          || refuse "not valid YAML: $(head -c 200 "${X}/yq.err" | tr '\n' ' ')"
        problems="$(jq -r --argjson now "$(date -u +%s)" --argjson max "${EXC_MAX_DAYS}" '
          def secs: ["vulnerabilities","misconfigurations","secrets","licenses"];
          def blank: (. == null) or (type != "string") or (gsub("\\s";"") == "");
          (. // {}) as $f
          | if ($f | type) != "object" then ["the file must be a YAML map with a vulnerabilities: list"]
            else
              [ ($f | keys - secs)[] | "unknown top-level key \"\(.)\" (allowed: \(secs | join(", ")))" ],
              [ secs[] as $s | ($f[$s] // []) as $list
                | if ($list | type) != "array" then "\($s): must be a list"
                  else $list | to_entries[] | .key as $i | .value as $e
                    | ("\($s)[\($i)]" + (if ($e | type) == "object" and ($e.id | type) == "string" then " " + $e.id else "" end)) as $label
                    | if ($e | type) != "object" or ($e.id | blank) then "\($label): id is required"
                      else
                        (if ($e.statement | blank) then "\($label): statement (the reason) is required" else empty end),
                        (if $e.expired_at == null then "\($label): expired_at is required"
                         elif $e.expired_tag != "!!timestamp" then "\($label): expired_at must be an unquoted YAML date such as 2026-12-31 (a quoted string means no expiry to Trivy)"
                         else
                           (try ($e.expired_at[0:10] + "T00:00:00Z" | fromdateiso8601) catch null) as $t
                           | if $t == null then "\($label): expired_at \($e.expired_at) is not a date"
                             elif $t > $now + $max * 86400 then "\($label): expired_at \($e.expired_at[0:10]) is more than \($max) days ahead"
                             else empty end
                         end)
                      end
                  end ]
            end
          | flatten | .[]' "${X}/raw.json")"
        if [[ -n "${problems}" ]]; then
          refuse "$(head -5 <<<"${problems}" | paste -sd ';' - | sed 's/;/; /g')$([[ "$(wc -l <<<"${problems}")" -gt 5 ]] && echo "; and $(( $(wc -l <<<"${problems}") - 5 )) more")"
        fi
        # What the scan step reports from: the vulnerability entries with their expiry as an epoch (UTC midnight of the date).
        jq '[(.vulnerabilities // [])[] | {id, statement, expires: .expired_at[0:10], epoch: (.expired_at[0:10] + "T00:00:00Z" | fromdateiso8601)}]' "${X}/raw.json" > "${X}/entries.json"
        # Trivy gets the file exactly as it is on the default branch.
        cp "${X}/raw.yaml" "${X}/.trivyignore.yaml"
        finish ok "$(jq 'length' "${X}/entries.json") entr(ies) from .trivyignore.yaml on ${where}"

    # onError: continue - a real bug found live: Tekton's DEFAULT behavior is to skip
    # every subsequent step once one fails ("Skipping step because a previous step
    # failed" in the pod logs), not run them regardless the way this file's own
    # emit-span/notify-slack steps need to. The otel span still appeared on a failed
    # scan before this fix, but only because that send happens *inside* this step
    # (wrapping trivy directly), before its own exit 1 - a genuinely separate later
    # step, like notify-slack, was never reached on failure until this was added. The
    # notify-slack step below re-raises this step's real failure explicitly (reading the
    # outcome result) - onError: continue means this step no longer fails the Task on
    # its own, so something still has to.
    - name: scan
      onError: continue
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      # Requests only, no limits (2026-10-09): see docs/admin/pipeline-performance.md "Step resources".
      computeResources:
        requests: { cpu: 100m, memory: 256Mi }
      volumeMounts:
        - name: registry-credentials
          mountPath: /var/run/secrets/registry
          readOnly: true
        - name: exceptions
          mountPath: /exceptions
          readOnly: true
      env:
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: DOCKER_CONFIG
          value: /var/run/secrets/registry
        - name: TRIVY_SERVER_URL
          value: {{ .Values.trivyServerUrl | quote }}
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        source "${PLATFORM_LIB}/otel.sh"
        # otel.sh itself does `set -euo pipefail` at module level (catalog/lib/otel.sh) -
        # sourcing it silently forces -e onto THIS script too, since `source` runs in the
        # same shell, not a subshell. A real, previously-undiscovered bug found live via
        # a throwaway debug pod: this script deliberately wants -e OFF (it needs to
        # survive trivy's own real exit-1 on findings and keep going to build the
        # findings summary below), but explicitly re-declaring `set -uo pipefail` again
        # does NOT clear an already-set -e (set's flags are independent toggles - `-o
        # pipefail`/`-u` don't touch `-e` either way). Only an explicit `set +e` does.
        set +e

        # One Trivy analysis (2026-10-09, report item 4). It used to run `trivy image` twice - a table run whose
        # --exit-code 1 decided the verdict, then a JSON run for the findings list - and each pod downloaded the
        # ~120 MiB vulnerability DB first. Now: one JSON run against the shared trivy-server (glidepath-control-plane,
        # templates/trivy/trivy-server.yaml), which holds the DB, then `trivy convert` renders the same table for
        # this log from the JSON. The verdict comes from the JSON's HIGH/CRITICAL count, which is exactly what
        # --exit-code 1 with --severity HIGH,CRITICAL used to signal. Measured on gate-api: 14 s standalone, 3 s
        # against the server. If the server does not answer /healthz, or fails mid-scan, the scan runs standalone
        # (its own DB download) - slower, never a false failure.
        #
        # No --exit-code on the scan itself, so a non-zero exit now means only "Trivy failed" (DB, registry, timeout)
        # - the case the old code had to recover by grepping the log for FATAL / "context deadline exceeded".
        TRIVY_SCAN_ARGS=(image --skip-version-check --timeout 10m --severity HIGH,CRITICAL --scanners vuln --format json --output /tmp/scan-results.json)
        # Accepted findings: fetch-exceptions (above) read .trivyignore.yaml from the gitops repo's default branch and
        # validated it. A refused file or an unreadable default branch fails the gate here with the reason in the summary.
        # Trivy drops entries whose expired_at is in the past itself (pkg/result/ignore.go, ParseIgnoreFile -> Prune, v0.73.0),
        # and --show-suppressed keeps what it dropped in the JSON as ExperimentalModifiedFindings, which the report below lists.
        EXC_STATUS="$(cat /exceptions/status 2>/dev/null || echo none)"
        EXC_MESSAGE="$(cat /exceptions/message 2>/dev/null || true)"
        EXC_WHERE="$(printf '%s %s' "$(cat /exceptions/branch 2>/dev/null)" "$(cut -c1-12 /exceptions/commit 2>/dev/null)")"
        case "${EXC_STATUS}" in
          refused|error)
            if [[ "${EXC_STATUS}" == refused ]]; then
              echo "image-scan: exceptions file refused - ${EXC_MESSAGE}" | tee "$(results.findings-summary.path)"
            else
              echo "image-scan: could not read the exceptions file, so cannot tell what is accepted - ${EXC_MESSAGE}" | tee "$(results.findings-summary.path)"
            fi
            echo "image-scan: ${EXC_MESSAGE}" >&2
            printf '%s' "$([[ "${EXC_STATUS}" == refused ]] && echo failed || echo error)" > "$(results.outcome.path)"
            echo "outcome=$(cat "$(results.outcome.path)")"
            exit 1 ;;
          ok) TRIVY_SCAN_ARGS+=(--ignorefile /exceptions/.trivyignore.yaml --show-suppressed) ;;
        esac
        run_scan() {
          local mode="$1" rc; shift
          rm -f /tmp/scan-results.json
          if [[ -n "${FLOW_TRACEPARENT}" ]]; then
            otel_child_span "image-scan" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" "image=${IMAGE_REF},trivy.mode=${mode}" -- \
              trivy "${TRIVY_SCAN_ARGS[@]}" "$@" "${IMAGE_REF}" 2>&1 | tee /tmp/scan-output.txt
            rc=${PIPESTATUS[0]}
          else
            trivy "${TRIVY_SCAN_ARGS[@]}" "$@" "${IMAGE_REF}" 2>&1 | tee /tmp/scan-output.txt
            rc=${PIPESTATUS[0]}
          fi
          return "${rc}"
        }
        [[ -n "${FLOW_TRACEPARENT}" ]] || echo "no flow-traceparent provided - skipping span emission (expected for PR-triggered GitOps-repo checks)" >&2

        if [[ -n "${TRIVY_SERVER_URL}" ]] && curl -fsS --max-time 5 "${TRIVY_SERVER_URL}/healthz" >/dev/null 2>&1; then
          echo "scanning ${IMAGE_REF} against the shared Trivy server (${TRIVY_SERVER_URL})"
          run_scan server --server "${TRIVY_SERVER_URL}"
          EXIT_CODE=$?
          if [[ "${EXIT_CODE}" -ne 0 ]]; then
            echo "warn: the scan against the Trivy server failed (exit ${EXIT_CODE}) - retrying standalone" >&2
            run_scan standalone
            EXIT_CODE=$?
          fi
        else
          echo "warn: Trivy server ${TRIVY_SERVER_URL:-<unset>} is not answering - scanning standalone (downloads the DB in this pod)" >&2
          run_scan standalone
          EXIT_CODE=$?
        fi

        if [[ "${EXIT_CODE}" -ne 0 || ! -s /tmp/scan-results.json ]]; then
          echo "trivy scan error - no findings available, see the step log above" | tee "$(results.findings-summary.path)"
          echo "image-scan: trivy itself failed before completing the scan (exit ${EXIT_CODE}) - not a vulnerability finding, see step log" >&2
          printf '%s' "error" > "$(results.outcome.path)"
          echo "outcome=error"
          exit 1
        fi

        # The human-readable report this log always showed, rendered from the same JSON (no second analysis).
        trivy convert --format table --scanners vuln --severity HIGH,CRITICAL /tmp/scan-results.json 2>&1 | grep -v 'No enabled scanners found'

        # Real findings, not just Trivy's "Total: N" summary count - a real gap the user
        # caught live: the first version of this Task's Slack message only ever showed a
        # count, never which CVEs. Built from the scan's JSON (.Results[].Vulnerabilities[]
        # with VulnerabilityID/PkgName/InstalledVersion/Severity/Title, confirmed live).
        TOTAL_COUNT="$(jq -r '[.Results[]?.Vulnerabilities[]?] | length' /tmp/scan-results.json 2>/dev/null || echo 0)"
        TOP_FINDINGS="$(jq -r '
          [.Results[]?.Vulnerabilities[]?]
          | sort_by(if .Severity == "CRITICAL" then 0 else 1 end)
          | .[:8]
          | map("*" + .Severity + "* " + .VulnerabilityID + " - " + .PkgName + "@" + .InstalledVersion)
          | join("\n")
          ' /tmp/scan-results.json 2>/dev/null || echo "")"
        # Accepted findings, listed apart from the failing ones and never silently: id, package, statement and expiry of each,
        # then warnings (expiring within 14 days, expired, matching nothing in this image). Only when a valid file was read.
        ACCEPTED_TEXT=""; ACCEPTED_COUNT=0
        if [[ "${EXC_STATUS}" == ok ]]; then
          ACCEPTED_COUNT="$(jq -r '[.Results[]?.ExperimentalModifiedFindings[]? | select(.Type == "vulnerability" and .Status == "ignored")] | unique_by([.Finding.VulnerabilityID, .Finding.PkgName, .Finding.InstalledVersion]) | length' /tmp/scan-results.json 2>/dev/null || echo 0)"
          ACCEPTED_TEXT="$(jq -r --argjson ent "$(cat /exceptions/entries.json)" --argjson now "$(date -u +%s)" '
            def clip(n): gsub("\\s+"; " ") | if length > n then .[0:n] + "..." else . end;
            [.Results[]?.ExperimentalModifiedFindings[]? | select(.Type == "vulnerability" and .Status == "ignored")
              | {id: .Finding.VulnerabilityID, pkg: .Finding.PkgName, ver: .Finding.InstalledVersion, sev: .Finding.Severity, statement: .Statement}]
            | unique_by([.id, .pkg, .ver]) as $acc
            | ($ent | map(select(.epoch >= $now))) as $live
            | ($ent | map(select(.epoch < $now))) as $lapsed
            | ($acc | map(.id)) as $accIds
            | (($acc[:10] | map("- " + .id + " " + .pkg + "@" + .ver + " (" + .sev + "): " + (.statement | clip(140)) + " - expires "
                + ((. as $a | $live | map(select(.id == $a.id) | .expires) | sort | .[0]) // "?")))
              + (if ($acc | length) > 10 then ["- +\(($acc | length) - 10) more accepted, see this Task'"'"'s log"] else [] end)) as $lines
            | ([$live[] | select(.epoch - $now <= 14 * 86400) | "WARNING " + .id + " expires in " + ((((.epoch - $now) / 86400) | floor) | tostring) + " day(s) (" + .expires + "): re-check it before then"]
              + [$live[] | select(.id as $i | $accIds | index($i) | not) | "unused: " + .id + " matches nothing in this image (HIGH/CRITICAL); remove it"]
              + [$lapsed[] | "expired: " + .id + " on " + .expires + " - it no longer accepts anything, any finding counts again"]) as $warn
            | ($lines + (if ($warn | length) > 0 then ["Warnings:"] + ($warn | map("- " + .)) else [] end)) | join("\n")
            ' /tmp/scan-results.json 2>/dev/null || echo "(could not list the accepted findings - see this Task's log)")"
        fi
        {
          if [[ "${EXC_STATUS}" == ok ]]; then
            echo "${TOTAL_COUNT} finding(s) (HIGH/CRITICAL, vuln scanner only) after ${ACCEPTED_COUNT} accepted by .trivyignore.yaml"
          else
            echo "${TOTAL_COUNT} finding(s) (HIGH/CRITICAL, vuln scanner only)"
          fi
          if [[ -n "${TOP_FINDINGS}" ]]; then
            echo "${TOP_FINDINGS}"
            [[ "${TOTAL_COUNT}" -gt 8 ]] && echo "_+$((TOTAL_COUNT - 8)) more - see the full report in this Task's own log_"
          fi
          if [[ "${EXC_STATUS}" == ok ]]; then
            echo "Accepted, not counted above: .trivyignore.yaml on ${EXC_WHERE} (${ACCEPTED_COUNT} finding(s))"
            [[ -n "${ACCEPTED_TEXT}" ]] && echo "${ACCEPTED_TEXT}"
          fi
        } | head -c 3000 | tee "$(results.findings-summary.path)"

        if [[ "${TOTAL_COUNT}" -eq 0 ]]; then
          printf '%s' "passed" > "$(results.outcome.path)"
          echo "outcome=passed"
        else
          echo "image-scan: trivy found ${TOTAL_COUNT} HIGH/CRITICAL vulnerabilities" >&2
          printf '%s' "failed" > "$(results.outcome.path)"
          echo "outcome=failed"
          exit 1
        fi

    # Shift-left visibility (prompted directly by the user, same as sast-scan.yaml's own
    # notify-slack step - see that file's header for the full reasoning on why this
    # lives inside the Task rather than as a separate pipeline-level notify step).
    - name: notify-slack
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: slack-webhook
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: APP_NAME
          value: $(params.app-name)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: IMAGE_REF
          value: $(params.image-ref)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # Read this first, and re-check it at the very end regardless of what happens
        # in between - scan (above) has onError: continue, so a real failure there no
        # longer fails this Task on its own; every early-exit path below must fall
        # through to that final check rather than `exit 0` directly, or a real scan
        # failure would silently report as a passing Task.
        OUTCOME_VALUE="$(cat /tekton/results/outcome 2>/dev/null || echo unknown)"

        CFG='$(params.config-json)'
        if [[ -z "${CFG}" ]]; then
          echo "no config-json provided - skipping notification (expected for PR-triggered GitOps-repo checks, this Task isn't called there)" >&2
        elif [[ "$(jq -r '.notifications.slack.enabled // false' <<< "${CFG}")" != "true" ]]; then
          echo "slack notifications disabled in cicd.yaml, skipping"
        elif [[ "$(jq -r 'if .notifications.slack.scanResults == false then "false" else "true" end' <<< "${CFG}")" != "true" ]]; then
          echo "notifications.slack.scanResults is false in cicd.yaml - shift-left scan notifications disabled for this Application (general per-stage notifications are unaffected), skipping"
        else
          CHANNEL="$(jq -r '.notifications.slack.channel // empty' <<< "${CFG}")"
          WEBHOOK_URL="$(cat /var/run/secrets/platform/slack-webhook-url 2>/dev/null || true)"
          if [[ -z "${WEBHOOK_URL}" ]]; then
            echo "warn: notifications.slack.enabled=true but no slack-webhook-url secret is mounted for this Application - skipping, not failing the pipeline" >&2
          else
            FINDINGS="$(cat /tekton/results/findings-summary 2>/dev/null || echo "")"

            if [[ "${OUTCOME_VALUE}" == "passed" ]]; then
              COLOR="#2563EB"
              HEADER_TEXT="${APP_NAME} · Image Scan Passed"
            elif [[ "${OUTCOME_VALUE}" == "error" ]]; then
              # trivy itself failed (timeout/FATAL) - an infra flake, not a security
              # finding, so this deliberately does not reuse "Image Scan Failed"'s
              # wording/color (see scan step's own comment above).
              COLOR="#B45309"
              HEADER_TEXT="⚠ ${APP_NAME} · Image Scan Error (infra, not a finding)"
            else
              COLOR="#B91C1C"
              HEADER_TEXT="⚠ ${APP_NAME} · Image Scan Failed"
            fi
            REPO_SHORT="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/([^/.]+).*#\1/\2#')"
            SHORT_SHA="${GIT_REVISION:0:12}"
            COMMIT_URL="${GIT_URL}/commit/${GIT_REVISION}"

            # Scan parameters are fixed platform policy right now (not per-app
            # configurable), so this is a plain string, not derived from anything
            # dynamic - the user asked to see it alongside findings for context on what
            # was actually checked.
            SCAN_PARAMS="severity: HIGH,CRITICAL · scanners: vuln"

            payload="$(jq -n \
              --arg channel "${CHANNEL}" \
              --arg color "${COLOR}" \
              --arg headerText "${HEADER_TEXT}" \
              --arg app "${APP_NAME}" \
              --arg repoShort "${REPO_SHORT}" \
              --arg repoUrl "${GIT_URL}" \
              --arg shortSha "${SHORT_SHA}" \
              --arg commitUrl "${COMMIT_URL}" \
              --arg image "${IMAGE_REF}" \
              --arg scanParams "${SCAN_PARAMS}" \
              --arg findings "${FINDINGS:-no summary available}" \
              --arg footer "glidepath · $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '
              def field(fieldLabel; fieldValue): {type: "mrkdwn", text: ("*" + fieldLabel + "*\n" + fieldValue)};
              {
                channel: $channel,
                attachments: [{
                  color: $color,
                  blocks: [
                    {type: "header", text: {type: "plain_text", text: $headerText, emoji: true}},
                    {type: "section", fields: [
                      field("App"; $app),
                      field("Repo"; "<" + $repoUrl + "|" + $repoShort + ">"),
                      field("Commit"; "<" + $commitUrl + "|" + $shortSha + ">"),
                      field("Image"; "`" + $image + "`"),
                      field("Scan parameters"; $scanParams)
                    ]},
                    {type: "section", text: {type: "mrkdwn", text: ("*Findings*\n" + $findings)}},
                    {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
                  ]
                }]
              }
              ')"

            curl --fail --silent --show-error --max-time 10 --retry 3 --retry-connrefused \
              -X POST "${WEBHOOK_URL}" \
              -H 'Content-Type: application/json' \
              -d "${payload}"
          fi
        fi

        # Re-raise scan's own real failure - see that step's onError: continue comment.
        if [[ "${OUTCOME_VALUE}" != "passed" ]]; then
          exit 1
        fi
