# catalog/tasks/promote.yaml
#
# Promotes the image an open release PR pins from Ground to Flight and reports it as the PR's image-promotion check
# (ADR-0029 phase 2, docs/admin/registries.md). Runs in the catalog namespace as glidepath-promoter, never in an app's
# -cicd namespace: the identity that can start Flight's writer must not be reachable from a tenant's build scripts.
# The fan-in (phase 3: comment-pr-check-result.yaml's promotion-ready step and rbac/promote-trigger.yaml) starts it
# when the last required gate turns green; an admin can still start it by hand (docs/admin/registries.md).
#
#   release  reads the PR and its release file and refuses, with the reason, anything the rules forbid: a closed or
#            merged PR (PROM-08: a merge before promotion is a bypass, never repaired afterwards), a release without
#            a digest, a release that does not pin the Flight repository (PROM-01: the merge would deploy the Ground
#            copy, so promoting it proves nothing), a source outside the app's own Ground repository (PROM-06), a
#            required gate that is not green on the PR's current head commit (PROM-03). It opens the check run as
#            in_progress.
#   copy     the promote-image StepAction: dispatch, wait, verify in Flight.
#   report   concludes the check run with the outcome, leaves the gate's PR comment (what was promoted, or why not),
#            and fails the TaskRun when the promotion did not happen.
#
# The check run is named exactly as Pipelines as Code names a gate's ("<pipelinesAsCode.applicationName> / <gate>-") and posted by
# the same App, so the guardrail registry, detect-bypass-merge and the PR's gate table read it like any other gate.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: promote
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Promotes an open release PR's image from Ground to Flight and posts its image-promotion check.
  params:
    - name: repo-url
      type: string
      description: The gitops repo, https://github.com/<owner>/gitops-<app>.
    - name: pr-number
      type: string
      description: The open release PR.
  results:
    - name: flight-ref
      description: <flight repo>@<digest> when promoted, else empty.
    - name: outcome
      description: success or failure.
  volumes:
    - name: promote-work
      emptyDir: {}
    - name: promoter-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: glidepath-promoter
              expirationSeconds: 3600
    - name: flight-read
      secret:
        secretName: flight-registry-read
        optional: true
        items:
          - key: .dockerconfigjson
            path: config.json
  stepTemplate:
    env:
      - name: PROMOTER_TOKEN_URL
        value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/promoter-token
      - name: REPO_URL
        value: $(params.repo-url)
      - name: PR_NUMBER
        value: $(params.pr-number)
      - name: RUN_NAME
        value: $(context.taskRun.name)
  steps:
    - name: release
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      onError: continue
      volumeMounts:
        - { name: promote-work, mountPath: /workspace/promote }
        - { name: promoter-token, mountPath: /var/run/secrets/promoter, readOnly: true }
      env:
        - name: GROUND_HOST
          value: {{ .Values.registries.ground.host | quote }}
        {{- with .Values.registries.ground.namespace }}
        # Unset means the repo owner; an empty value would be dropped by the API server and leave Argo CD OutOfSync.
        - name: GROUND_NAMESPACE
          value: {{ . | quote }}
        {{- end }}
        - name: FLIGHT_HOST
          value: {{ .Values.registries.flight.host | quote }}
        {{- with .Values.registries.flight.namespace }}
        - name: FLIGHT_NAMESPACE
          value: {{ . | quote }}
        {{- end }}
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        W="${PROMOTE_WORK:-/workspace/promote}"
        refuse() { printf '%s' "$1" > "${W}/reason"; echo "error: $1" >&2; exit 1; }
        {{- include "glidepath-catalog.promoterGitHub" . | nindent 8 }}
        {{- include "glidepath-catalog.advisoryGatesByApp" . | nindent 8 }}

        [[ "${REPO_URL}" =~ ^https://github\.com/([A-Za-z0-9-]+)/(gitops-([a-z0-9][a-z0-9-]*))(\.git)?/?$ ]] \
          || refuse "${REPO_URL} is not a gitops-<app> repository"
        owner="${BASH_REMATCH[1]}"; repo="${BASH_REMATCH[2]}"; app="${BASH_REMATCH[3]}"
        [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || refuse "pr-number ${PR_NUMBER} is not a number"
        printf 'OWNER=%q\nREPO=%q\n' "${owner}" "${repo}" > "${W}/repo.env"
        release_pr_token "${owner}" "${repo}" || refuse "the broker refused a release-pr token for ${owner}/${repo}"

        pr="$(gh_ "https://api.github.com/repos/${owner}/${repo}/pulls/${PR_NUMBER}")" || refuse "could not read ${owner}/${repo}#${PR_NUMBER}"
        head_sha="$(jq -r .head.sha <<<"${pr}")"
        printf 'HEAD_SHA=%q\n' "${head_sha}" >> "${W}/repo.env"
        # PROM-08: never after a merge. A merged release whose image is not in Flight is a bypass, and promoting it
        # now would make the bypass deploy.
        [[ "$(jq -r .merged <<<"${pr}")" != true ]] || refuse "#${PR_NUMBER} is already merged: a merge before promotion is a bypass and is not promoted afterwards (PROM-08)"
        [[ "$(jq -r .state <<<"${pr}")" == open ]] || refuse "#${PR_NUMBER} is closed"
        check_run_start "${owner}" "${repo}" "${head_sha}"

        manifest="$(gh_ "https://api.github.com/repos/${owner}/${repo}/pulls/${PR_NUMBER}/files?per_page=100" \
          | jq -r '[.[].filename | select(test("^[^/]+/[^/]+/release\\.yaml$"))][0] // empty')"
        [[ -n "${manifest}" ]] || refuse "#${PR_NUMBER} changes no <cluster>/<env>/release.yaml: not a release PR"
        gh_ -H "Accept: application/vnd.github.raw+json" \
          "https://api.github.com/repos/${owner}/${repo}/contents/${manifest}?ref=${head_sha}" > "${W}/release.yaml" \
          || refuse "could not read ${manifest} at ${head_sha}"
        read_field() { yq -r "$1 // \"\"" "${W}/release.yaml"; }
        repository="$(read_field .release.image.repository)"; tag="$(read_field .release.image.tag)"
        digest="$(read_field .release.image.digest)"; source_repo="$(read_field .release.image.source)"
        release_id="$(read_field .releaseTracking.releaseId)"
        [[ -n "${tag}" ]] || refuse "${manifest} has no release.image.tag"
        [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || refuse "${manifest} pins no digest (catalog promotion.pinDigest): only a digest is promotable"
        source_repo="${source_repo:-${repository}}"
        # PROM-06: only the app's own Ground repository; never <app>-pr (ephemeral builds) or another app's image.
        ground="${GROUND_HOST}/${GROUND_NAMESPACE:-${owner}}/${app}"
        [[ "${source_repo}" == "${ground}" ]] || refuse "the release's source ${source_repo} is not ${ground}, the app's Ground repository (PROM-06)"
        # PROM-01: the release must pull what is promoted. A Ground pin would deploy the unpromoted copy, so a green
        # check would vouch for an image the cluster never pulls (catalog promotion.enabled pins Flight at PR open).
        [[ -n "${FLIGHT_NAMESPACE:-}" ]] || refuse "registries.flight.namespace is not set in the catalog"
        flight="${FLIGHT_HOST}/${FLIGHT_NAMESPACE}/${app}"
        [[ "${repository}" == "${flight}" ]] || refuse "${manifest} pins ${repository}, not the Flight repository ${flight}: merging it would deploy the Ground copy (PROM-01; catalog promotion.enabled)"

        # PROM-03: every required gate green on the PR's current head commit. A /retest leaves several runs per gate;
        # the newest counts. The fan-in starts this run from the last gate's finally, while that gate's own check run
        # is still in progress, so a gate that is queued or in progress is waited for (GATE_WAIT_SECONDS); a red or
        # missing one refuses at once. A gate advisory for this app (catalog releaseGuardrailOverridesByApp) is left
        # out: its check stays red on the PR, but it does not hold this app's release.
        required_gates="{{ range (include "glidepath-catalog.guardrails" . | fromJsonArray) }}{{ if and .required (ne .name "image-promotion") }}{{ .name }} {{ end }}{{ end }}"
        [[ -z "$(advisory_gates_for_app "${app}")" ]] || echo "advisory for ${app} (catalog releaseGuardrailOverridesByApp), not required: $(advisory_gates_for_app "${app}")"
        # "<PaC application name> / <gate>-", under the current name or an earlier one (catalog pipelinesAsCode).
        pac_apps={{ include "glidepath-catalog.pacAppNames" . | squote }}
        deadline=$(( SECONDS + ${GATE_WAIT_SECONDS:-300} ))
        while :; do
          checks="$(gh_ "https://api.github.com/repos/${owner}/${repo}/commits/${head_sha}/check-runs?per_page=100")" \
            || refuse "could not read the gates on ${head_sha}"
          gates=""; red=""; pending=""
          for gate in ${required_gates}; do
            gate_advisory_for_app "${app}" "${gate}" && continue
            c="$(jq -r --argjson apps "${pac_apps}" --arg g "${gate}" \
              '[.check_runs[] | select(.name as $x | any($apps[]; . + " / " + $g + "-" == $x))] | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then .status else .conclusion end' <<<"${checks}")"
            gates="${gates}${gates:+,}${gate}=${c}"
            case "${c}" in
              success) ;;
              queued|in_progress) pending="${pending}${pending:+, }${gate} (${c})" ;;
              *) red="${red}${red:+, }${gate} (${c})" ;;
            esac
          done
          [[ -z "${red}" ]] || refuse "required gates are not green on ${head_sha:0:7}: ${red} (PROM-03)"
          [[ -n "${pending}" ]] || break
          (( SECONDS < deadline )) || refuse "required gates still running on ${head_sha:0:7} after ${GATE_WAIT_SECONDS:-300}s: ${pending} (PROM-03)"
          echo "waiting for ${pending}"
          sleep "${GATE_POLL_SECONDS:-15}"
        done

        printf 'SOURCE=%q\nPACKAGE=%q\nTAG=%q\nDIGEST=%q\nRELEASE_ID=%q\nPULL_REQUEST=%q\nGATES=%q\n' \
          "${source_repo}@${digest}" "${app}" "${tag}" "${digest}" "${release_id}" \
          "${owner}/${repo}#${PR_NUMBER}@${head_sha}" "${gates}" > "${W}/release.env"
        echo "promoting ${source_repo}@${digest} (${tag}) for ${owner}/${repo}#${PR_NUMBER}; gates: ${gates}"
    - name: copy
      ref:
        resolver: cluster
        params:
          - { name: kind, value: stepaction }
          - { name: name, value: promote-image }
          - { name: namespace, value: {{ .Release.Namespace }} }
      onError: continue
      params:
        - { name: request-id, value: $(context.taskRun.name) }
        - { name: work-volume, value: promote-work }
        - { name: token-volume, value: promoter-token }
        - { name: flight-read-volume, value: flight-read }
    - name: report
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: promote-work, mountPath: /workspace/promote }
        - { name: promoter-token, mountPath: /var/run/secrets/promoter, readOnly: true }
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        W="${PROMOTE_WORK:-/workspace/promote}"
        {{- include "glidepath-catalog.promoterGitHub" . | nindent 8 }}
        # The PR comment every gate leaves (comment-pr-check-result.yaml's marker, edited in place on the next run), so
        # the conversation says what happened to the image and what to do about a refusal.
        pr_comment() { # owner repo outcome summary
          local marker="<!-- glidepath:gate:image-promotion -->" body id
          if [[ "$3" == success ]]; then
            body="$(printf '### ✅ `image-promotion` passed\n\n%s\n\nPromote run: `%s`%s' "$4" "${RUN_NAME}" "${run_url:+ · workflow run: ${run_url}}")"
          else
            body="$(printf '### ❌ `image-promotion` failed\n\n**Why:** %s\n\n**To retry:** promotion starts again when a gate finishes on this commit and every required gate is green. Fix the cause, then comment `/retest <gate>-` for any gate (for example `/retest sbom-`). Merging before promotion is a bypass and is never promoted afterwards (PROM-08). Promote run: `%s`%s' \
              "$4" "${RUN_NAME}" "${run_url:+ · workflow run: ${run_url}}")"
          fi
          body="${marker}"$'\n'"${body}"
          id="$(gh_ "https://api.github.com/repos/$1/$2/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r --arg m "${marker}" '[.[] | select(.body | startswith($m))][0].id // empty')" || return 1
          if [[ -n "${id}" ]]; then
            gh_ -X PATCH "https://api.github.com/repos/$1/$2/issues/comments/${id}" -d "$(jq -n --arg b "${body}" '{body: $b}')" >/dev/null
          else
            gh_ -X POST "https://api.github.com/repos/$1/$2/issues/${PR_NUMBER}/comments" -d "$(jq -n --arg b "${body}" '{body: $b}')" >/dev/null
          fi
        }
        flight_ref="$(cat "${W}/flight-ref" 2>/dev/null || true)"
        run_url="$(cat "${W}/run-url" 2>/dev/null || true)"
        if [[ -n "${flight_ref}" && ! -e "${W}/reason" ]]; then
          outcome=success; title="Promoted to ${flight_ref%%@*}"
          summary="\`${flight_ref}\` holds the release's image with its signatures and attestations, and a promotion attestation for this request verifies."
        else
          outcome=failure; title="Not promoted"
          summary="$(cat "${W}/reason" 2>/dev/null || echo "the promotion stopped without a reason; see the TaskRun ${RUN_NAME}")"
        fi
        printf '%s' "${flight_ref}" > "$(results.flight-ref.path)"
        printf '%s' "${outcome}" > "$(results.outcome.path)"
        echo "${outcome}: ${summary}"

        # The check run: concluded if the release step opened one, else opened and concluded now (a refusal before
        # the PR was read leaves nothing to attach it to, and only the TaskRun says why).
        if [[ -f "${W}/repo.env" ]]; then
          # shellcheck disable=SC1091
          source "${W}/repo.env"
          if [[ -n "${HEAD_SHA:-}" ]] && release_pr_token "${OWNER}" "${REPO}"; then
            [[ -f "${W}/check-id" ]] || check_run_start "${OWNER}" "${REPO}" "${HEAD_SHA}" || true
            if [[ -f "${W}/check-id" ]]; then
              gates="$(. "${W}/release.env" 2>/dev/null; echo "${GATES:-}")"
              text="Promote run: \`${RUN_NAME}\`${run_url:+ · workflow run: ${run_url}}${gates:+ · gates seen: ${gates}}"
              gh_ -X PATCH "https://api.github.com/repos/${OWNER}/${REPO}/check-runs/$(cat "${W}/check-id")" \
                -d "$(jq -n --arg c "${outcome}" --arg t "${title}" --arg s "${summary}" --arg x "${text}" --arg u "${run_url}" \
                  '{status: "completed", conclusion: $c, output: {title: $t, summary: $s, text: $x}} + (if $u == "" then {} else {details_url: $u} end)')" >/dev/null \
                || echo "warn: could not conclude the image-promotion check run" >&2
            fi
            pr_comment "${OWNER}" "${REPO}" "${outcome}" "${summary}" || echo "warn: could not comment on #${PR_NUMBER}" >&2
          fi
        fi
        [[ "${outcome}" == success ]]
