# catalog/tasks/build-source.yaml
#
# Runs the app's own build.sh inside its resolved build-agent image, before
# build-image.yaml packages the result with kaniko. Split into its own Task so it can run
# concurrently with unit-test, host the dependency-cache workspace, and get its own
# retry/observability separate from the image push. Optional - build.yaml's when: clause
# skips it for apps building entirely inside a Containerfile (see has-build-script result).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-source
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Runs build.script (if cicd.yaml defines one) inside the resolved build-agent image, before kaniko packages the result.
  workspaces:
    - name: source
  # Per-app dependency-download cache PVC (charts/glidepath-app/templates/env/
  # build-cache-pvc.yaml) - one per Application since build.cache.size is a per-app
  # choice. claimName is param-substituted (Tekton allows $(params.*) in volume
  # claimNames).
  #
  # A plain volume, not a Tekton *workspace*: a workspace-backed PVC here would collide
  # with Tekton's Affinity Assistant, which only allows one PVC-backed workspace per
  # TaskRun pod - and unit-test/build-source already share the `source` workspace and run
  # concurrently. Real error hit: "more than one PersistentVolumeClaim is bound". A raw
  # volume sidesteps Affinity Assistant (same pattern build-image.yaml uses for
  # registry-credentials). Always mounted; actual use is gated on build.cache.enabled in
  # the script below.
  volumes:
    - name: build-cache
      persistentVolumeClaim:
        claimName: build-cache-$(params.app-name)
  params:
    - name: config-json
      type: string
      description: Output of validate-cicd-config's config-json result.
    - name: agent-image
      type: string
      description: Resolved build-agent image (catalog/tasks/validate-cicd-config.yaml's agent-image result) - build.sh runs inside this, same image run-tests.yaml uses.
    - name: app-name
      type: string
      description: Selects this app's own build-cache-<app-name> PVC (charts/glidepath-app/templates/env/build-cache-pvc.yaml) - not used for anything else in this Task.
    - name: flow-traceparent
      type: string
      description: Root traceparent for the whole flow (from start-flow-root-span) - gives this Task's span its trace id. Always provided by build.yaml, unlike governance-gate-stub which also runs from context-less PR checks.
    - name: stage-span-id
      type: string
      description: The current stage's own span id (from start-stage-span) - this Task's span is parented to it.
  results:
    - name: span-start-time
      description: Set only if run-build-script's own step ran (i.e. a real build.script was configured, not skipped). Consumed by emit-span below.
    - name: span-end-time
      description: Set only if run-build-script's real work succeeded - see emit-span's own header comment for the honest limit this implies.
  steps:
    - name: resolve-build-script-path
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      results:
        - name: build-script-path
        - name: cache-type
          description: "'npm'/'yarn'/'maven'/'' - derived from build.agent's prefix rather than a separate cicd.yaml field. Empty when caching is disabled or the agent has no cache support yet (python-*/go-1.22)."
        - name: cache-subdir
          description: "Same as cache-type ('npm'/'yarn'/'maven') when caching is active, '' otherwise. One shared directory per tool, never keyed by a lockfile hash - see the script's own comment for why a hash-keyed directory was the wrong shape for all three tools. Kept as a separate result (not just cache-type) so run-build-script's 'is caching on' check stays one env var."
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CFG='$(params.config-json)'
        BUILD_SCRIPT_PATH="$(jq -r '.build.script' <<< "${CFG}")"
        echo -n "${BUILD_SCRIPT_PATH}" | tee "$(step.results.build-script-path.path)"

        CACHE_ENABLED="$(jq -r '.build.cache.enabled // false' <<< "${CFG}")"
        AGENT="$(jq -r '.build.agent' <<< "${CFG}")"
        CACHE_TYPE=""
        LOCKFILE=""
        case "${AGENT}" in
          nodejs-*)
            # A yarn.lock without a package-lock.json means yarn (classic or berry), not npm.
            if [[ -f "$(workspaces.source.path)/yarn.lock" && ! -f "$(workspaces.source.path)/package-lock.json" ]]; then
              CACHE_TYPE="yarn"; LOCKFILE="$(workspaces.source.path)/yarn.lock"
            else
              CACHE_TYPE="npm"; LOCKFILE="$(workspaces.source.path)/package-lock.json"
            fi
            ;;
          openjdk-*) CACHE_TYPE="maven"; LOCKFILE="$(workspaces.source.path)/pom.xml" ;;
          *) echo "build.cache: no cache support yet for agent '${AGENT}' - enabled flag is a no-op" ;;
        esac
        CACHE_SUBDIR=""
        if [[ "${CACHE_ENABLED}" == "true" && -n "${CACHE_TYPE}" ]]; then
          # One shared directory per tool, NOT keyed by a lockfile hash (2026-10-08). npm
          # and Maven used to get '<tool>/<sha256(lockfile)>' so a dependency change could
          # never serve stale packages - but neither tool can serve stale packages from its
          # own download cache in the first place: npm's cacache is content-addressed (a
          # tarball is looked up by integrity hash from the lockfile, so a changed version
          # is simply a different entry), and Maven's local repository is laid out by
          # exact groupId/artifactId/version (a bumped version is a new path, and
          # resolution is driven by the pom, never by what else is on disk). Keying by the
          # lockfile hash therefore bought no correctness and cost every warm run: any
          # dependency bump - and for Maven any pom.xml edit at all, including the version
          # bump every release makes - started from an empty directory and re-downloaded
          # everything. Yarn already took this shape (commit f71fa04); the same reasoning
          # was always true of the other two. Measured on this platform: run-build-script
          # p50 287s / p90 1031s (Tekton Results, 143 runs), dominated by dependency fetch.
          # The directory only ever grows as versions are added; delete the PVC to reset it.
          CACHE_SUBDIR="${CACHE_TYPE}"
          if [[ ! -f "${LOCKFILE}" ]]; then
            # Informational only - the cache works without a lockfile, it just can't be
            # as effective (an unpinned dependency set may resolve differently per run).
            echo "build.cache: no ${LOCKFILE} found - caching anyway, but pin dependencies for repeatable builds" >&2
          fi
        fi
        echo -n "${CACHE_TYPE}" | tee "$(step.results.cache-type.path)"
        echo -n "${CACHE_SUBDIR}" | tee "$(step.results.cache-subdir.path)"

    - name: run-build-script
      image: $(params.agent-image)
      # Requests only, no limits (2026-10-09): see docs/admin/pipeline-performance.md "Step resources".
      computeResources:
        requests: { cpu: 250m, memory: 256Mi }
      workingDir: $(workspaces.source.path)
      volumeMounts:
        - name: build-cache
          mountPath: /cache
      # Cross-step result refs ($(steps.X.results.Y)) are only allowed in env/command/args,
      # not inline in `script:` - Tekton's admission webhook rejects that. Routed through
      # env vars instead.
      env:
        - name: BUILD_SCRIPT_PATH
          value: $(steps.resolve-build-script-path.results.build-script-path)
        - name: CACHE_TYPE
          value: $(steps.resolve-build-script-path.results.cache-type)
        - name: CACHE_SUBDIR
          value: $(steps.resolve-build-script-path.results.cache-subdir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # Plain `date`, not catalog/lib/otel.sh - this step runs inside the app's own
        # generic build-agent image, which has neither otel-cli nor $PLATFORM_LIB.
        # Timestamps are handed off as results; emit-span below sends the actual span
        # later from the toolbox image where otel-cli exists.
        date -u +"%Y-%m-%dT%H:%M:%S.%NZ" | tee "$(results.span-start-time.path)"

        # Points the build tool's own dependency-download cache at the persistent `cache`
        # workspace, not node_modules/target directly - the tool's own incremental logic
        # (npm's tarball cache, Maven's local repo) is what avoids re-downloading, and
        # `npm ci` rebuilds node_modules from scratch every run anyway.
        #
        # Cache is per-APP, not per-branch/per-PipelineRun, so concurrent builds of the
        # same app share it - expected, not an edge case. npm's cache store is
        # content-addressable and safe for concurrent access (run-tests.yaml's unit-test
        # step shares the npm/yarn directory concurrently with this step for exactly that
        # reason); Maven's local repo is NOT (concurrent `mvn` writes corrupt it), so
        # MAVEN_LOCK_DIR below is a portable mkdir-based lock serializing every Maven
        # build of this app. Now that the directory is shared across pom.xml revisions
        # (see resolve-build-script-path above) the lock covers concurrent builds of
        # different commits too, which is the correct scope - Maven's repo layout is
        # per-version so they never overwrite each other's artifacts, only the
        # metadata/index files the lock exists to protect.
        if [[ -n "${CACHE_SUBDIR}" ]]; then
          CACHE_DIR="/cache/${CACHE_SUBDIR}"
          mkdir -p "${CACHE_DIR}"
          # One-time migration from the pre-2026-10-08 layout: the old
          # '<tool>/<16-hex-lockfile-hash>/' directories now sit inside the shared
          # directory as dead weight on a PVC that is often only 1Gi. Neither npm's
          # cacache (_cacache/, _logs/) nor Maven's repository (groupId segments) ever
          # creates a bare 16-hex top-level directory, so this matches only the old keys.
          find "${CACHE_DIR}" -mindepth 1 -maxdepth 1 -type d -regex '.*/[0-9a-f]\{16\}$' -exec rm -rf {} + 2>/dev/null || true
          case "${CACHE_TYPE}" in
            npm) export NPM_CONFIG_CACHE="${CACHE_DIR}" ;;
            yarn)
              # Classic reads YARN_CACHE_FOLDER. Berry (2+) keeps its cache under the global
              # folder, and only when the global cache is on - the env var overrides an
              # `enableGlobalCache: false` in the repo's .yarnrc.yml. Berry writes cache
              # files atomically, so concurrent builds of one app can share the directory.
              export YARN_CACHE_FOLDER="${CACHE_DIR}"
              export YARN_GLOBAL_FOLDER="${CACHE_DIR}"
              export YARN_ENABLE_GLOBAL_CACHE=true
              ;;
            maven)
              export MAVEN_OPTS="-Dmaven.repo.local=${CACHE_DIR} ${MAVEN_OPTS:-}"
              MAVEN_LOCK_DIR="${CACHE_DIR}/.build-lock"
              WAITED=0
              until mkdir "${MAVEN_LOCK_DIR}" 2>/dev/null; do
                if (( WAITED >= 600 )); then
                  echo "error: timed out waiting for build-cache lock at ${MAVEN_LOCK_DIR} (another concurrent Maven build holding it too long?)" >&2
                  exit 1
                fi
                sleep 2
                WAITED=$((WAITED + 2))
              done
              trap 'rmdir "${MAVEN_LOCK_DIR}" 2>/dev/null || true' EXIT
              echo "build.cache: acquired Maven local-repo lock at ${MAVEN_LOCK_DIR} (concurrent-write protection)"
              ;;
          esac
          echo "build.cache: enabled (${CACHE_TYPE}, keyed at ${CACHE_SUBDIR})"
        fi

        SCRIPT="${BUILD_SCRIPT_PATH}"
        if [[ ! -f "${SCRIPT}" ]]; then
          echo "error: build.script '${SCRIPT}' (from cicd.yaml) not found in repo." >&2
          exit 1
        fi
        chmod +x "${SCRIPT}" || true
        bash "${SCRIPT}"
        date -u +"%Y-%m-%dT%H:%M:%S.%NZ" | tee "$(results.span-end-time.path)"

    # Only reached on success - `set -euo pipefail` above halts the TaskRun before this
    # runs if build.script fails, so a failed build-source gets no span (same documented
    # gap as clone-repo not being instrumented, see docs/tracing.md). Tekton's own
    # TaskRun timestamps still show that a failure happened, just not as a Tempo span.
    - name: emit-span
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: SPAN_START
          value: $(results.span-start-time.path)
        - name: SPAN_END
          value: $(results.span-end-time.path)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/otel.sh"
        # otel_child_span (used elsewhere) wraps a *live* command - not applicable here
        # since the real work already finished in the previous step. Send the known
        # start/end times directly instead.
        otel_task_span_send "build-source" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" \
          "$(cat "${SPAN_START}")" "$(cat "${SPAN_END}")" "Succeeded"
