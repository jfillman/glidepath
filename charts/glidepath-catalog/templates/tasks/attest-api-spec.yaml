# catalog/tasks/attest-api-spec.yaml
#
# Publishes the API an app serves with the image it was built into: reads cicd.yaml's api.spec (default
# openapi.yaml at the repo root) from the build's checkout and attaches it to the pushed image as a keyless-signed
# in-toto attestation, predicate type https://hangar.io/attestations/api-spec/v1. Each deployed version then
# carries the exact spec it was built with: Tower reads it by the digest an environment runs, and the api-compat
# release check diffs the candidate's spec against the target environment's.
#
# The predicate (JSON; a YAML spec is converted):
#   { "apiType": "openapi" | "asyncapi", "path": <api.spec>, "sha256": <the file's bytes>,
#     "specVersion": <openapi/asyncapi field>, "title": <info.title>, "version": <info.version>, "spec": {...} }
#
# A spec is optional, so this Task never fails the build. Its outcome result says what happened:
#   attested - signed and attached (or already attached to this digest: retries never pile up duplicates, the
#              same idempotency check as generate-sbom.yaml)
#   none     - no file at api.spec: the app publishes no API
#   invalid  - the file is not YAML/JSON, or has no top-level `openapi`/`asyncapi` field matching api.type
#   failed   - signing or the attestation push failed; logged loudly, the build still passes
#
# Signing is the same as generate-sbom.yaml (see its header): pipeline-runner's own projected SA token against the
# self-hosted Fulcio, real Rekor upload, rekor.pub fetched live.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: attest-api-spec
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Attaches the app's API spec (cicd.yaml api.spec) to the built image as a keyless-signed attestation. Never fails the build.
  params:
    - name: image-ref
      type: string
      description: Full image reference (repo@digest or repo:tag) the spec belongs to - must already be pushed.
    - name: spec-path
      type: string
      description: cicd.yaml api.spec, relative to the checkout root (schema-defaulted to openapi.yaml).
    - name: api-type
      type: string
      default: openapi
      description: cicd.yaml api.type - openapi or asyncapi.
    - name: flow-traceparent
      type: string
      default: ""
    - name: stage-span-id
      type: string
      default: ""
  workspaces:
    - name: source
      readOnly: true
  results:
    - name: outcome
      description: "'attested', 'none', 'invalid' or 'failed' - see the header."
  volumes:
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: sigstore-identity-token
      projected:
        sources:
          - serviceAccountToken:
              path: sigstore-token
              audience: sigstore
              expirationSeconds: 600
  steps:
    - name: attest
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      computeResources:
        requests: { cpu: 50m, memory: 64Mi }
      volumeMounts:
        - name: registry-credentials
          mountPath: /var/run/secrets/registry
          readOnly: true
        - name: sigstore-identity-token
          mountPath: /var/run/secrets/sigstore
          readOnly: true
      env:
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: SPEC_PATH
          value: $(params.spec-path)
        - name: API_TYPE
          value: $(params.api-type)
        - name: DOCKER_CONFIG
          value: /var/run/secrets/registry
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        source "${PLATFORM_LIB}/otel.sh"
        # otel.sh sets -e at module level; this script must reach the outcome writes below (see generate-sbom.yaml).
        set +e
        PREDICATE_TYPE="https://hangar.io/attestations/api-spec/v1"
        outcome() { printf '%s' "$1" > "$(results.outcome.path)"; echo "outcome=$1"; exit 0; }

        FILE="$(workspaces.source.path)/${SPEC_PATH}"
        if [[ ! -f "${FILE}" ]]; then
          echo "attest-api-spec: no ${SPEC_PATH} in the checkout - this app publishes no API (cicd.yaml api.spec; optional)"
          outcome none
        fi

        # YAML and JSON both parse with yq; -o=json normalizes either to the JSON the predicate needs.
        if ! yq -o=json '.' "${FILE}" > /tmp/spec.json 2>/tmp/yq.err || ! jq -e 'type == "object"' /tmp/spec.json >/dev/null 2>&1; then
          echo "attest-api-spec: ${SPEC_PATH} is not a YAML/JSON document: $(head -c 300 /tmp/yq.err)" >&2
          outcome invalid
        fi
        SPEC_VERSION="$(jq -r --arg t "${API_TYPE}" '.[$t] // "" | tostring' /tmp/spec.json)"
        if [[ -z "${SPEC_VERSION}" || "${SPEC_VERSION}" == "null" ]]; then
          echo "attest-api-spec: ${SPEC_PATH} has no top-level '${API_TYPE}:' field - not a ${API_TYPE} document (cicd.yaml api.type)" >&2
          outcome invalid
        fi

        jq -n \
          --arg apiType "${API_TYPE}" \
          --arg path "${SPEC_PATH}" \
          --arg sha256 "$(sha256sum "${FILE}" | cut -d' ' -f1)" \
          --arg specVersion "${SPEC_VERSION}" \
          --slurpfile spec /tmp/spec.json \
          '{apiType: $apiType, path: $path, sha256: $sha256, specVersion: $specVersion,
            title: ($spec[0].info.title // ""), version: (($spec[0].info.version // "") | tostring), spec: $spec[0]}' \
          > /tmp/predicate.json
        echo "attest-api-spec: ${SPEC_PATH} (${API_TYPE} ${SPEC_VERSION}, $(jq -r '.title' /tmp/predicate.json) $(jq -r '.version' /tmp/predicate.json), $(wc -c < /tmp/predicate.json | tr -d ' ') bytes)"

        # Idempotent per digest: a retried or redelivered build must not stack attestations (generate-sbom.yaml's
        # header has the incident). Same digest + same file = same predicate, so the existing one stands. cosign 3.x
        # downloads its own attestations as sigstore bundles (.dsseEnvelope.payload), older ones as plain envelopes.
        if cosign download attestation --predicate-type "${PREDICATE_TYPE}" "${IMAGE_REF}" 2>/dev/null \
            | jq -s -e --arg h "$(jq -r '.sha256' /tmp/predicate.json)" \
                'any(.[]; (.dsseEnvelope.payload // .payload) | @base64d | fromjson | .predicate.sha256 == $h)' >/dev/null 2>&1; then
          echo "attest-api-spec: ${IMAGE_REF} already carries this spec - not attaching a duplicate"
          outcome attested
        fi

        kubectl get configmap fulcio-root-ca -n platform-catalog -o jsonpath='{.data.cert\.pem}' > /tmp/fulcio-root.pem
        curl -fsSL --max-time 10 http://rekor-server.rekor-system.svc/api/v1/log/publicKey > /tmp/rekor.pub
        cosign signing-config create \
          --fulcio="url=http://fulcio-server.fulcio-system.svc,api-version=1,start-time=2020-01-01T00:00:00Z,operator=glidepath" \
          --oidc-provider="url=https://kubernetes.default.svc.cluster.local,api-version=1,start-time=2020-01-01T00:00:00Z,operator=glidepath" \
          --rekor="url=http://rekor-server.rekor-system.svc,api-version=1,start-time=2020-01-01T00:00:00Z,operator=glidepath" \
          --rekor-config="ANY" \
          --no-default-tsa \
          --out /tmp/signing-config.json
        cosign trusted-root create \
          --fulcio="url=http://fulcio-server.fulcio-system.svc,certificate-chain=/tmp/fulcio-root.pem" \
          --rekor="url=http://rekor-server.rekor-system.svc,public-key=/tmp/rekor.pub,start-time=2020-01-01T00:00:00Z" \
          --no-default-ctfe --no-default-tsa \
          --out /tmp/trusted-root.json

        cosign_attest() {
          cosign attest \
            --predicate /tmp/predicate.json \
            --type "https://hangar.io/attestations/api-spec/v1" \
            --signing-config /tmp/signing-config.json \
            --trusted-root /tmp/trusted-root.json \
            --identity-token /var/run/secrets/sigstore/sigstore-token \
            --yes \
            "${IMAGE_REF}"
        }
        export -f cosign_attest
        if [[ -n "${FLOW_TRACEPARENT}" ]]; then
          otel_child_span "attest-api-spec" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" "image=${IMAGE_REF}" -- bash -c cosign_attest
        else
          cosign_attest
        fi
        EXIT_CODE=$?
        if [[ "${EXIT_CODE}" -eq 0 ]]; then
          outcome attested
        fi
        echo "attest-api-spec: cosign attest failed (exit ${EXIT_CODE}) - the build passes, but this version carries no spec" >&2
        outcome failed
