# catalog/tasks/mark-release-merged.yaml
#
# ADR-0021 phase 2. Records on the release's dev-side record (release-tracking-<chain-id>,
# written by open-release-pr.yaml) that its gitops PR was merged or closed unmerged, so the
# release state machine (glidepath-relay) starts from "merged" and the stall detector
# can tell a merged release that never started deploying from a PR still waiting for review.
# Runs from bypass-merge-check, the Pipeline that already fires on every gitops PR close.
#
# The record is found by its PR URL. Only a record still "proposed" (or with no state, from
# before the state existed) moves: the relay owns every later transition and must not be
# overwritten by a late event (mergedAt is still recorded, see below). Always succeeds - no record (swept, or a release that
# predates records) is not an error, and this must never fail the break-glass check beside it.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mark-release-merged
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Marks the release record for a just-closed gitops PR as merged or closed.
  params:
    - name: repo-url
      type: string
    - name: pr-number
      type: string
    - name: merged
      type: string
      description: '"true" if the PR merged, anything else if it was closed unmerged.'
    - name: merged-at
      type: string
      default: ""
      description: When the PR merged, from GitHub. Empty means "now" (the Task starts tens of seconds after the merge, longer if the run was delayed or started by hand).'
  steps:
    - name: mark
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: PR_NUMBER
          value: $(params.pr-number)
        - name: MERGED
          value: $(params.merged)
        - name: MERGED_AT
          value: $(params.merged-at)
        - name: NAMESPACE
          # $(context.taskRun.namespace), not the pipelineRun form - see
          # resolve-release-tracking.yaml for the same documented gotcha.
          value: $(context.taskRun.namespace)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        slug="$(sed -E 's#^https?://github\.com/([^/]+/[^/.]+)(\.git)?/?$#\1#' <<<"${REPO_URL}")"
        pr_url="https://github.com/${slug}/pull/${PR_NUMBER}"

        name="$(kubectl get configmap -n "${NAMESPACE}" -l hangar.io/subcomponent=release-tracking -o json \
          | jq -r --arg u "${pr_url}" '[.items[] | select(.data.prUrl == $u)] | .[0].metadata.name // empty')"
        if [[ -z "${name}" ]]; then
          echo "no release record for ${pr_url} in ${NAMESPACE} (swept, or this release predates records) - nothing to mark."
          exit 0
        fi

        state="$(kubectl get configmap "${name}" -n "${NAMESPACE}" -o jsonpath='{.data.state}')"
        merged_at="$(kubectl get configmap "${name}" -n "${NAMESPACE}" -o jsonpath='{.data.mergedAt}')"
        now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        # the real merge time when GitHub told us, else now
        merge_time="${MERGED_AT:-${now}}"

        # mergedAt is recorded whatever state the release is in. This Task starts tens of seconds
        # after the merge (a pipeline pod and a GitHub lookup), and Argo CD can sync and the
        # Rollout report faster than that: seen live, the relay had already moved the record to
        # "progressing" when this ran. The state only moves from "proposed"; mergedAt is the
        # merge time either way (it is also the merge-to-deploy latency, and the stall alert's
        # clock for a release that never started).
        if [[ "${MERGED}" == "true" && -z "${merged_at}" ]]; then
          if [[ -z "${state}" || "${state}" == "proposed" ]]; then
            patch="$(jq -n --arg now "${now}" --arg mt "${merge_time}" '{data: {state: "merged", stateAt: $now, mergedAt: $mt}}')"
            echo "${name}: proposed -> merged"
          else
            patch="$(jq -n --arg mt "${merge_time}" '{data: {mergedAt: $mt}}')"
            echo "${name} is already '${state}' (the release started before this ran) - recording mergedAt only."
          fi
        elif [[ "${MERGED}" != "true" && ( -z "${state}" || "${state}" == "proposed" ) ]]; then
          patch="$(jq -n --arg now "${now}" '{data: {state: "closed", stateAt: $now}}')"
          echo "${name}: proposed -> closed (PR closed unmerged)"
        else
          echo "${name} is '${state}'${merged_at:+ and already has mergedAt} - nothing to record."
          exit 0
        fi
        kubectl patch configmap "${name}" -n "${NAMESPACE}" --type merge -p "${patch}"
