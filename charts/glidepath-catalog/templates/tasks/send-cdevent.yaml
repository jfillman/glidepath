# catalog/tasks/send-cdevent.yaml
#
# Thin Task wrapper around the cdevent-send StepAction (catalog/stepactions/
# cdevent-send.yaml, where the logic lives as of 2026-10-08). This is the standalone call
# shape for an event emitted mid-DAG - every stage Pipeline's pipelinerun.started, which
# has to be its own TaskRun because it runs in parallel with real work. The finally-block
# events (each stage's domain event plus pipelinerun.finished) no longer use this Task:
# they run as two steps of stage-debrief.yaml, in the same pod as the span send and the
# notifications, so a stage's finally block is one pod instead of six. See
# docs/chaining.md.
#
# Audience-bound projected ServiceAccount token, verified by the broker's TokenReview
# interceptor - declared here, not via any cluster-wide default, because Tekton has no
# mechanism to auto-mount a volume into every Task's containers; only the Tasks that
# actually call the broker carry it.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: send-cdevent
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: event-type
      type: string
      description: e.g. dev.cdevents.pipelinerun.started.0.3.0
    - name: subject-type
      type: string
      description: See cdevent-send.yaml - no default, every caller must be explicit.
    - name: subject-content-json
      type: string
      default: "{}"
    - name: chain-id
      type: string
    - name: traceparent
      type: string
    - name: flow-start-time
      type: string
    - name: namespace
      type: string
    - name: pipeline-run-name
      type: string
    - name: tekton-status
      type: string
      default: ""
      description: Optional - see cdevent-send.yaml.
    - name: config-json
      type: string
      default: "{}"
      description: Optional - see cdevent-send.yaml.
  volumes:
    - name: broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: broker-token
              audience: cdevents-broker
              expirationSeconds: 600
  steps:
    - name: send
      ref:
        resolver: cluster
        params:
          - { name: kind, value: stepaction }
          - { name: name, value: cdevent-send }
          - { name: namespace, value: {{ .Release.Namespace }} }
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      params:
        - { name: event-type, value: $(params.event-type) }
        - { name: subject-type, value: $(params.subject-type) }
        - { name: subject-content-json, value: $(params.subject-content-json) }
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
        - { name: namespace, value: $(params.namespace) }
        - { name: pipeline-run-name, value: $(params.pipeline-run-name) }
        - { name: tekton-status, value: $(params.tekton-status) }
        - { name: config-json, value: $(params.config-json) }
        - { name: token-volume, value: broker-token }
