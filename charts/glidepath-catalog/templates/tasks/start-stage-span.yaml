# catalog/tasks/start-stage-span.yaml
#
# Pipeline-level wrapper around the otel-stage-span-start StepAction. Every stage
# Pipeline (build/test/deploy/release) calls this once near the start. Only mints
# identifiers + a start timestamp here - the stage's own span isn't actually sent to
# the collector until this stage's `finally` block calls end-stage-span, since that's
# the only point the real end time is known. See docs/tracing.md.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: start-stage-span
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: flow-traceparent
      type: string
  results:
    - name: span-id
      value: $(steps.start-span.results.span-id)
    - name: start-time
      value: $(steps.start-span.results.start-time)
  steps:
    - name: start-span
      ref:
        resolver: cluster
        params:
          - { name: kind, value: stepaction }
          - { name: name, value: otel-stage-span-start }
          - { name: namespace, value: {{ .Release.Namespace }} }
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      params:
        - name: flow-traceparent
          value: $(params.flow-traceparent)
