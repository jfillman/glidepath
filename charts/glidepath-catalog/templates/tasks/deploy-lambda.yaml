# catalog/tasks/deploy-lambda.yaml
#
# Alternative to deploy-manifests.yaml/deploy-ecs.yaml for apps whose cicd.yaml sets
# deploy.target: aws-lambda - updates an existing Lambda function's container image and
# waits for the update to complete.
#
# Hard AWS constraint, not a Glidepath limitation: Lambda can only pull a container
# image from Amazon ECR, never an external registry like ghcr.io (confirmed AWS
# documentation, not assumed) - so image-ref must already resolve to an ECR URI for
# this target to work at all. Guarded below with a clear error rather than letting
# Lambda's own cryptic "ResourceConflictException"/image-pull failure surface - same
# fail-loud-with-a-useful-message philosophy as deploy-ecs.yaml's container-name guard.
# This Task does not copy/push into ECR itself - that would mean threading a second
# registry-credential concern through build-image.yaml for a target most apps won't
# use. An app on this target is expected to set build.agent's image-repo to an ECR
# repository directly.
#
# Does NOT create the function (PackageType: Image, the function's own role/VPC/memory
# config) - only updates its deployed code, same "update existing infra, never
# provision it" boundary deploy-ecs.yaml draws for the ECS service/task definition.
#
# Same dedicated-step-image reasoning as deploy-ecs.yaml: public.ecr.aws/aws-cli/aws-cli
# rather than toolboxImage (Alpine/musl vs. AWS CLI v2's glibc-targeted installer).
#
# NOT live-verified against a real AWS account/Lambda function - no AWS credentials
# exist in this environment to test against. Render-verified only (helm template) -
# see docs/admin/known-gaps.md.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-lambda
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Updates an existing Lambda function's container image to the newly built image and waits for the update to complete.
  params:
    - name: image-ref
      type: string
    - name: config-json
      type: string
      description: Reads .deploy.lambda.{functionName,region} from it directly, same pattern as deploy-ecs.yaml.
  # Same optional, mount-as-files app-secrets pattern as deploy-ecs.yaml - an app using
  # deploy.target: aws-lambda is expected to declare:
  #   secrets:
  #     - name: aws-access-key-id
  #     - name: aws-secret-access-key
  volumes:
    - name: app-secrets
      secret:
        secretName: app-secrets
        optional: true
  steps:
    - name: update-function
      image: public.ecr.aws/aws-cli/aws-cli:2.37.9
      volumeMounts:
        - name: app-secrets
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: CONFIG_JSON
          value: $(params.config-json)
      script: |
        #!/bin/bash
        set -euo pipefail

        FUNCTION_NAME="$(jq -r '.deploy.lambda.functionName // ""' <<<"${CONFIG_JSON}")"
        REGION="$(jq -r '.deploy.lambda.region // "us-east-1"' <<<"${CONFIG_JSON}")"

        if [[ -z "${FUNCTION_NAME}" ]]; then
          echo "error: deploy.target is aws-lambda but deploy.lambda.functionName is not set in cicd.yaml." >&2
          exit 1
        fi

        # Hard AWS constraint - see this file's header comment.
        if [[ ! "${IMAGE_REF}" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/ ]]; then
          echo "error: deploy.target is aws-lambda but image-ref '${IMAGE_REF}' is not an Amazon ECR URI. AWS Lambda can only pull container images from ECR, never an external registry (e.g. ghcr.io) - this app's build.image-repo must point at an ECR repository for this target to work." >&2
          exit 1
        fi

        export AWS_DEFAULT_REGION="${REGION}"

        if [[ -f /var/run/secrets/platform/aws-access-key-id && -f /var/run/secrets/platform/aws-secret-access-key ]]; then
          export AWS_ACCESS_KEY_ID="$(cat /var/run/secrets/platform/aws-access-key-id)"
          export AWS_SECRET_ACCESS_KEY="$(cat /var/run/secrets/platform/aws-secret-access-key)"
        else
          echo "error: deploy.target is aws-lambda but this app has no aws-access-key-id/aws-secret-access-key in its secrets: list - see docs/admin/app-secrets.md." >&2
          exit 1
        fi

        echo "updating Lambda function ${FUNCTION_NAME} to ${IMAGE_REF}..."
        aws lambda update-function-code --function-name "${FUNCTION_NAME}" --image-uri "${IMAGE_REF}" >/dev/null

        # function-updated-v2 (not the older function-updated waiter) - the current
        # AWS-documented waiter for a code/config update, confirmed via the CLI's own
        # bundled waiter definitions (aws lambda wait help) rather than assumed from
        # memory of an older CLI version.
        echo "waiting for the update to complete..."
        aws lambda wait function-updated-v2 --function-name "${FUNCTION_NAME}"
        echo "Lambda function ${FUNCTION_NAME} update complete"
