# catalog/tasks/start-flow-root-span.yaml
#
# Idempotent flow-root span initializer. Used by both build (always git-rooted, first
# stage) and release (can be either git-rooted or event-chained from deploy).
#
# For git-rooted flows (params empty): generates fresh chain-id, traceparent, and
# flow-start-time. For event-chained flows (params provided): passes them through
# unchanged. This keeps the release pipeline uniform - all downstream tasks reference
# start-flow results the same way regardless of whether release is the flow root or
# a downstream stage.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: start-flow-root-span
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: chain-id
      type: string
      default: ""
      description: "Incoming chain-id (event-chained case, passed through) or empty (git-rooted case, generates new)"
    - name: traceparent
      type: string
      default: ""
      description: "Incoming traceparent (event-chained case, passed through) or empty (git-rooted case, generates new)"
    - name: flow-start-time
      type: string
      default: ""
      description: "Incoming flow-start-time (event-chained case, passed through) or empty (git-rooted case, generates new)"
  results:
    - name: traceparent
      value: $(steps.check-and-start.results.traceparent)
    - name: start-time
      value: $(steps.check-and-start.results.start-time)
    - name: chain-id
      value: $(steps.check-and-start.results.chain-id)
  steps:
    - name: check-and-start
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      results:
        - name: traceparent
        - name: start-time
        - name: chain-id
      env:
        - name: INCOMING_CHAIN_ID
          value: $(params.chain-id)
        - name: INCOMING_TRACEPARENT
          value: $(params.traceparent)
        - name: INCOMING_FLOW_START_TIME
          value: $(params.flow-start-time)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/otel.sh"

        # Idempotency: if chain-id is provided (event-chained case), pass everything through.
        # Otherwise (git-rooted case), generate new tracing identifiers.
        if [[ -n "${INCOMING_CHAIN_ID}" ]]; then
          # Event-chained: use provided values
          printf '%s' "${INCOMING_TRACEPARENT}" > "$(step.results.traceparent.path)"
          printf '%s' "${INCOMING_FLOW_START_TIME}" > "$(step.results.start-time.path)"
          printf '%s' "${INCOMING_CHAIN_ID}" > "$(step.results.chain-id.path)"
        else
          # Git-rooted: generate new identifiers
          read -r traceparent start_time <<< "$(otel_flow_root_begin)"
          printf '%s' "${traceparent}" > "$(step.results.traceparent.path)"
          printf '%s' "${start_time}" > "$(step.results.start-time.path)"

          # printf, not `uuidgen | tee` - uuidgen's own trailing newline was landing in
          # the result verbatim. Harmless on its own, but once chain-id started being
          # joined into a comma-separated otel-cli --attrs string (end-stage-span.yaml),
          # that embedded newline broke otel-cli's CSV-based attrs parser: it silently
          # dropped everything after the newline (platform.stage never made it into the
          # span). Caught live by checking a real span's actual attributes in Tempo -
          # platform.chain_id was present, platform.stage silently wasn't.
          printf '%s' "$(uuidgen)" > "$(step.results.chain-id.path)"
        fi
