# catalog/tasks/clone-repo-authenticated.yaml
#
# Replaces test.yaml's use of the hub-resolved git-clone catalog Task (with a
# basic-auth workspace) - a real design mistake, fixed the same week it shipped.
# git-clone's basic-auth workspace only ever gets real credentials via Pipelines-as-
# Code's own mutating webhook, which auto-injects a pac-gitauth-* Secret into any
# workspace literally named basic-auth on a PipelineRun IT creates. test is normally
# event-chained off build's artifact.published CDEvent (see platform/broker/) -
# created by the CDEvents broker's TriggerTemplate, not PaC - so there's no webhook in
# play to inject anything, and the workspace was always going to stay unbound for that
# (the common) case, only actually working for a git-rooted test-only flow PaC
# happened to trigger directly. release.yaml's own header already documented exactly
# this Tekton constraint ("a Pipeline-level optional workspace is only valid when
# every task referencing it also declares that workspace optional, which the shared
# hub-resolved git-clone Task's required workspace can't satisfy") as the reason it
# never used git-clone for its own (also broker-triggered) clone either - this Task
# applies that same, already-established precedent to test.
#
# Same GitHub App installation-token broker pattern as deploy-manifests.yaml/
# open-release-pr.yaml (catalog/lib/github-app.sh) - a fresh, single-repo-scoped token
# minted per run, proven by the calling pod's own ServiceAccount identity regardless
# of what created the PipelineRun. Repo name assumed == app-name, same convention
# deploy-manifests.yaml already relies on.
#
# Shallow-fetches the exact requested revision (git fetch --depth=1 origin
# <revision>, then checkout FETCH_HEAD) rather than a full clone + checkout - mirrors
# what git-clone's own git-init does under the hood (confirmed live in this repo's own
# git-clone failure logs before this Task existed), not a full-history clone.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-repo-authenticated
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: app-name
      type: string
  workspaces:
    - name: output
  # url/commit - Tekton Chains' documented type-hint result names for a clone Task
  # (see build.yaml's own CHAINS-GIT_URL/CHAINS-GIT_COMMIT pipeline results, which
  # read these), same names the hub git-clone Task produces - needed so build.yaml
  # can use this Task as a drop-in replacement.
  results:
    - name: url
      description: The precise URL that was fetched by this Task.
    - name: commit
      description: The precise commit SHA that was fetched by this Task.
  # Audience-bound projected ServiceAccount token for the shared broker's GitHub
  # token-minting endpoint - same pattern as deploy-manifests.yaml's identical volume.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
  steps:
    - name: clone
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: APP_NAME
          value: $(params.app-name)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"

        owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        token="$(github_app_installation_token "${owner}" "${APP_NAME}")"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${APP_NAME}.git"

        cd "$(workspaces.output.path)"
        # Workspace volume is owned by a different uid than this step runs as - git
        # refuses to operate at all otherwise ("detected dubious ownership"). The
        # hub git-clone Task does the exact same thing for the exact same reason,
        # confirmed live in this repo's own earlier git-clone failure logs.
        git config --global --add safe.directory "$(workspaces.output.path)"
        git init --quiet
        git remote add origin "${clone_url}"
        git fetch --quiet --depth=1 origin "${GIT_REVISION}"
        git checkout --quiet FETCH_HEAD

        echo -n "${GIT_URL}" | tee "$(results.url.path)"
        git rev-parse FETCH_HEAD | tr -d '\n' | tee "$(results.commit.path)"
