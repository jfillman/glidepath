# catalog/tasks/end-stage-span.yaml
#
# Pipeline-level wrapper around otel-span-send. Referenced from every stage Pipeline's
# `finally` block so the stage span is sent - with its real start/end timestamps -
# whether the stage succeeded or failed. Needs flow-traceparent/span-id/start-time/
# chain-id/stage-name as explicit params because this Task runs in a different Pod
# than whichever Task called start-stage-span earlier in the same PipelineRun - see
# docs/tracing.md.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: end-stage-span
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: stage-name
      type: string
    - name: flow-traceparent
      type: string
    - name: chain-id
      type: string
    - name: span-id
      type: string
    - name: start-time
      type: string
    - name: status
      type: string
      default: "Succeeded"
      description: Pass $(tasks.status) from the calling Pipeline's finally block.
  steps:
    - name: end-span
      ref:
        resolver: cluster
        params:
          - { name: kind, value: stepaction }
          - { name: name, value: otel-span-send }
          - { name: namespace, value: {{ .Release.Namespace }} }
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      params:
        - { name: name, value: "stage:$(params.stage-name)" }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: span-id, value: $(params.span-id) }
        - { name: start-time, value: $(params.start-time) }
        - { name: status, value: $(params.status) }
        - { name: attrs, value: "platform.chain_id=$(params.chain-id),platform.stage=$(params.stage-name)" }
