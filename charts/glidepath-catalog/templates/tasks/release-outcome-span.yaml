# catalog/tasks/release-outcome-span.yaml
#
# Sends a standalone span reporting a cluster-mapped release's confirmed ArgoCD-sync
# outcome (docs/multi-cluster.md) - closes the loop release-outcome-notify.yaml only
# did for Slack.
#
# Deliberately its OWN trace, not a child of the original flow's trace: that flow's
# root span is already closed by PR-open time, and a human review/ArgoCD-sync gap of
# minutes-to-days would otherwise show a child span ending after the trace's root
# closed. Correlation instead comes from chain-id as a span ATTRIBUTE
# (platform.chain_id), so Tempo/Grafana can still group this span with the original
# flow's spans despite the separate trace. Empty for apps onboarded before this field
# existed.
#
# start-time is pr-created-at, not flow-start-time: flow-start-time only covers
# commit->PR-open (already visible as the release stage span's end time); anchoring
# there too would double-count that segment instead of isolating the human-review +
# ArgoCD-sync gap this span exists to measure. flow-start-time is still carried as an
# attribute for full commit-to-deploy DORA lead time, and used as a fallback start-time
# when pr-created-at is empty.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: release-outcome-span
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: env
      type: string
    - name: status
      type: string
      description: "Succeeded or Failed - see release-outcome-notify.yaml's own status param."
    - name: chain-id
      type: string
      default: ""
      description: The original flow's chain-id, empty when the reporting app/release predates this field. See header.
    - name: flow-start-time
      type: string
      default: ""
      description: The original flow's start time - carried as a span attribute and used as start-time fallback. See header.
    - name: pr-created-at
      type: string
      default: ""
      description: When this release's PR was created - the real start-time for this span. See header for why, not flow-start-time.
  steps:
    - name: send-span
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
        - name: ENV_NAME
          value: $(params.env)
        - name: STATUS
          value: $(params.status)
        - name: CHAIN_ID
          value: $(params.chain-id)
        - name: FLOW_START_TIME
          value: $(params.flow-start-time)
        - name: PR_CREATED_AT
          value: $(params.pr-created-at)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/otel.sh"

        # Standalone one-span trace (own trace-id/root span) - see header for why it's
        # not parented under the original flow's already-closed root.
        read -r traceparent _ <<< "$(otel_flow_root_begin)"
        start_time="${PR_CREATED_AT}"
        [[ -z "${start_time}" ]] && start_time="${FLOW_START_TIME}"
        [[ -z "${start_time}" ]] && start_time="$(otel_now)"

        attrs="platform.app_namespace=${APP_NAMESPACE},platform.app_name=${APP_NAME},platform.env=${ENV_NAME}"
        [[ -n "${CHAIN_ID}" ]] && attrs="${attrs},platform.chain_id=${CHAIN_ID}"
        [[ -n "${FLOW_START_TIME}" ]] && attrs="${attrs},platform.flow_start_time=${FLOW_START_TIME}"

        # Outcome baked into the span's own name, not just its OTel status code: Tempo's
        # TraceQL search API can't promote a span attribute/status to a flat
        # trace-level field Grafana can render directly - the span NAME (rootTraceName)
        # is one of the few fields that IS flat, so that's where status has to live
        # for the dashboard's Release outcomes panel to show it without a nested table.
        otel_span_send "release-outcome:${APP_NAME}/${ENV_NAME} [${STATUS}]" "${traceparent}" "" "${start_time}" "$(otel_now)" "${STATUS}" "${attrs}"
