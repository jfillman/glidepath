# catalog/tasks/deploy-ecs.yaml
#
# Alternative to deploy-manifests.yaml for apps whose cicd.yaml sets
# deploy.target: aws-ecs - copies the newly built image into the service's ECR repository,
# registers a new ECS task-definition revision with it, updates the service to that revision,
# and waits for ECS's own stability check (aws ecs wait services-stable) instead of polling an
# Argo Rollout's .status.phase.
#
# AWS access is a web identity, never a stored key (2026-10-16, docs/admin/cloud-deploy-identity.md): the deploy
# stage runs this Task as the ServiceAccount glidepath-cloud-deployer, and the steps assume
# glidepath-deploy-ecs-<service>, the role Airframe's AwsEcsTarget creates for this one service. It may push to the
# service's ECR repository, register task definitions, update this service and pass the target's execution role to
# ECS, nothing else. Until then this Task read aws-access-key-id/aws-secret-access-key from app-secrets.
#
# Why copy into ECR: Fargate can pull from ghcr.io, but only a public package without credentials (a private
# one needs a Secrets Manager secret per task definition). The platform's packages are private by default, so the
# image goes where the task's execution role can always pull it: the ECR repository the AwsEcsTarget creates,
# named after the service. The copy keeps the digest, so the signatures and attestations on ghcr.io still verify
# it. An ECS service accepts a multi-architecture image index, so the whole image-ref is copied (unlike Lambda).
#
# Three steps, sharing a scratch volume:
#   1. prepare:        validates, assumes the role, checks the repository exists, mints an ECR login.
#   2. copy-to-ecr:    crane copy of image-ref into <account>.dkr.ecr.<region>.amazonaws.com/<service>, digests compared.
#   3. update-service: re-registers the current task definition with only the image swapped (the ECR digest),
#                      points the service at it, and waits for steady state.
# An image-ref that is already an ECR URI (an app that builds to ECR directly) skips the copy.
#
# Deliberately does NOT replicate deploy-manifests.yaml's app-repo git-commit step
# (glidepath/envs/<env>.yaml / deploy.releaseFile) - that file exists so ArgoCD/
# airframe-application's chart knows what image to render into a Rollout. There is no
# equivalent GitOps-pull reconciler for ECS here; the ECS API call below IS the
# deployment. deploy.yaml's own `finally:` block already emits the dev.cdevents.
# service.deployed event (and Slack/Backstage notify) off resolve-image-ref's result.
#
# Dedicated step images, not toolboxImage (Alpine/musl vs. the AWS CLI v2 installer's glibc):
# public.ecr.aws/aws-cli/aws-cli for the AWS calls, and a digest-pinned crane image
# build-image.yaml and deploy-lambda.yaml run for the copy.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-ecs
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Copies the newly built image into the service's ECR repository, registers a new ECS task-definition revision with it, updates the service, and waits for it to stabilize.
  params:
    - name: image-ref
      type: string
    - name: config-json
      type: string
      description: validate-cicd-config's config-json result - this Task reads .deploy.ecs.{cluster,service,containerName,region,taskDefinitionFamily} from it directly rather than taking 5 separate params.
    - name: env
      type: string
    - name: app-name
      type: string
  # No app-secrets: AWS access is a web identity only (glidepath-catalog.awsCredentials).
  volumes:
    # Only matters when the ghcr.io package is private. Optional so its absence degrades to an
    # unauthenticated pull instead of a pod stuck on a missing Secret.
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        optional: true
        items:
          - key: .dockerconfigjson
            path: config.json
    # Web identity (see glidepath-catalog.awsCredentials in _helpers.tpl). The token is projected for whatever
    # ServiceAccount the pod runs as; only glidepath-cloud-deployer's is used.
    - name: aws-web-identity
      projected:
        sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: token
    - name: cloud-identity
      configMap:
        name: glidepath-cloud-identity
        optional: true
    - name: work
      emptyDir: {}
  steps:
    - name: prepare
      image: public.ecr.aws/aws-cli/aws-cli:2.37.9
      volumeMounts:
        - name: aws-web-identity
          mountPath: /var/run/secrets/aws-web-identity
          readOnly: true
        - name: cloud-identity
          mountPath: /var/run/glidepath-cloud-identity
          readOnly: true
        - name: registry-credentials
          mountPath: /var/run/secrets/registry
          readOnly: true
        - name: work
          mountPath: /work
      env:
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: CONFIG_JSON
          value: $(params.config-json)
        - name: TASKRUN_NAME
          value: $(context.taskRun.name)
      script: |
        #!/bin/bash
        set -euo pipefail

        CLUSTER="$(jq -r '.deploy.ecs.cluster // ""' <<<"${CONFIG_JSON}")"
        SERVICE="$(jq -r '.deploy.ecs.service // ""' <<<"${CONFIG_JSON}")"
        CONTAINER_NAME="$(jq -r '.deploy.ecs.containerName // ""' <<<"${CONFIG_JSON}")"
        REGION="$(jq -r '.deploy.ecs.region // "us-east-1"' <<<"${CONFIG_JSON}")"

        if [[ -z "${CLUSTER}" || -z "${SERVICE}" || -z "${CONTAINER_NAME}" ]]; then
          echo "error: deploy.target is aws-ecs but deploy.ecs.{cluster,service,containerName} is incomplete in cicd.yaml - all three are required (an AwsEcsTarget's status.cicd has them)." >&2
          exit 1
        fi

        export AWS_DEFAULT_REGION="${REGION}"

        {{- include "glidepath-catalog.awsCredentials" . | nindent 8 }}
        aws_credentials "glidepath-deploy-ecs-${SERVICE:0:43}"

        ECR_RE='^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/'

        # An app that already builds to ECR needs no copy.
        if [[ "${IMAGE_REF}" =~ ${ECR_RE} ]]; then
          echo "image-ref is already an Amazon ECR URI, no copy needed."
          touch /work/skip-copy
          printf '%s' "${IMAGE_REF}" > /work/final-image-uri
          exit 0
        fi

        # The AwsEcsTarget creates one repository per service, named after it.
        ACCOUNT="$(cat /var/run/glidepath-cloud-identity/awsAccountId)"
        REGISTRY_HOST="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com"
        REPO="${REGISTRY_HOST}/${SERVICE}"
        if ! aws ecr describe-repositories --repository-names "${SERVICE}" >/dev/null 2>/tmp/describe-error; then
          echo "error: no ECR repository '${SERVICE}' in ${REGION} ($(tail -1 /tmp/describe-error)). The service's AwsEcsTarget creates it; check the target's ecr-repository is Ready." >&2
          exit 1
        fi
        TAG="${IMAGE_REF##*:}"

        # ECR login token (valid 12h, minted per run, never stored). Merged over any ghcr.io
        # credentials so a private package can still be pulled by the same crane call.
        TOKEN="$(aws ecr get-login-password --region "${REGION}")"
        AUTH="$(printf 'AWS:%s' "${TOKEN}" | base64 -w0)"
        mkdir -p /work/docker
        if [[ -s /var/run/secrets/registry/config.json ]]; then
          jq --arg reg "${REGISTRY_HOST}" --arg auth "${AUTH}" '{auths: ((.auths // {}) + {($reg): {auth: $auth}})}' /var/run/secrets/registry/config.json > /work/docker/config.json
        else
          jq -n --arg reg "${REGISTRY_HOST}" --arg auth "${AUTH}" '{auths: {($reg): {auth: $auth}}}' > /work/docker/config.json
        fi

        printf '%s' "${IMAGE_REF}" > /work/src
        printf '%s' "${REPO}:${TAG}" > /work/dst
        printf '%s' "${REPO}" > /work/repo
        echo "will copy ${IMAGE_REF} -> ${REPO}:${TAG}"

    - name: copy-to-ecr
      # Pinned by digest, not the `:debug` tag alone: gcr.io/go-containerregistry/crane only
      # publishes one floating `debug` tag. `:debug` (not the distroless default) because this
      # step needs a shell; it is busybox-based, hence /busybox/sh.
      image: gcr.io/go-containerregistry/crane@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
      volumeMounts:
        - name: work
          mountPath: /work
      env:
        - name: DOCKER_CONFIG
          value: /work/docker
      script: |
        #!/busybox/sh
        set -eu
        if [ -f /work/skip-copy ]; then
          echo "nothing to copy."
          exit 0
        fi
        SRC="$(cat /work/src)"
        DST="$(cat /work/dst)"
        REPO="$(cat /work/repo)"

        crane copy "${SRC}" "${DST}"

        # A copy that changed the content would break the link to the signature and attestations
        # that stay on the source registry, so refuse to deploy anything but the same digest.
        SRC_DIGEST="$(crane digest "${SRC}")"
        DST_DIGEST="$(crane digest "${DST}")"
        if [ "${SRC_DIGEST}" != "${DST_DIGEST}" ]; then
          echo "error: copied image digest ${DST_DIGEST} differs from the source ${SRC_DIGEST}." >&2
          exit 1
        fi
        printf '%s' "${REPO}@${DST_DIGEST}" > /work/final-image-uri
        echo "copied ${SRC} -> ${DST} (${DST_DIGEST})"

    - name: update-service
      image: public.ecr.aws/aws-cli/aws-cli:2.37.9
      volumeMounts:
        - name: aws-web-identity
          mountPath: /var/run/secrets/aws-web-identity
          readOnly: true
        - name: cloud-identity
          mountPath: /var/run/glidepath-cloud-identity
          readOnly: true
        - name: work
          mountPath: /work
      env:
        - name: CONFIG_JSON
          value: $(params.config-json)
        - name: ENV
          value: $(params.env)
        - name: APP_NAME
          value: $(params.app-name)
        - name: TASKRUN_NAME
          value: $(context.taskRun.name)
      script: |
        #!/bin/bash
        set -euo pipefail

        CLUSTER="$(jq -r '.deploy.ecs.cluster // ""' <<<"${CONFIG_JSON}")"
        SERVICE="$(jq -r '.deploy.ecs.service // ""' <<<"${CONFIG_JSON}")"
        CONTAINER_NAME="$(jq -r '.deploy.ecs.containerName // ""' <<<"${CONFIG_JSON}")"
        export AWS_DEFAULT_REGION="$(jq -r '.deploy.ecs.region // "us-east-1"' <<<"${CONFIG_JSON}")"
        FAMILY="$(jq -r '.deploy.ecs.taskDefinitionFamily // ""' <<<"${CONFIG_JSON}")"
        [[ -z "${FAMILY}" ]] && FAMILY="${APP_NAME}-${ENV}"

        {{- include "glidepath-catalog.awsCredentials" . | nindent 8 }}
        aws_credentials "glidepath-deploy-ecs-${SERVICE:0:43}"

        IMAGE_URI="$(cat /work/final-image-uri)"

        echo "resolving current task definition for family ${FAMILY}..."
        # Re-registers the WHOLE current definition with only the image swapped, not a hand-picked
        # subset of its fields. The first live run (smoke-ecs, 2026-10-04) showed why the old
        # fixed projection was wrong twice over:
        #   - a field the definition does not set (taskRoleArn on a definition with only an
        #     execution role) came out as JSON null, which the CLI rejects before calling AWS
        #     ("Invalid type for parameter taskRoleArn, value: None"), so any definition missing
        #     an optional field could never be deployed;
        #   - fields outside the list (runtimePlatform, ephemeralStorage, tags, pidMode, ...) were
        #     silently dropped, e.g. an ARM64 Fargate task would have come back as X86_64.
        # So: take `taskDefinition` as returned (--include TAGS puts the tags beside it, not
        # inside it), delete only what describe adds and register refuses (taskDefinitionArn,
        # revision, status, requiresAttributes, compatibilities, registeredAt, registeredBy,
        # deregisteredAt), and drop any null-valued key.
        aws ecs describe-task-definition --task-definition "${FAMILY}" --include TAGS \
          --output json > /tmp/described.json

        jq --arg img "${IMAGE_URI}" --arg name "${CONTAINER_NAME}" '
          (.taskDefinition + (if ((.tags // []) | length) > 0 then {tags: .tags} else {} end))
          | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                .registeredAt, .registeredBy, .deregisteredAt)
          | walk(if type == "object" then with_entries(select(.value != null)) else . end)
          | .containerDefinitions = [.containerDefinitions[] | if .name == $name then .image = $img else . end]
        ' /tmp/described.json > /tmp/new-def.json

        if ! jq -e --arg name "${CONTAINER_NAME}" '.containerDefinitions[] | select(.name == $name)' /tmp/new-def.json >/dev/null; then
          echo "error: no container named '${CONTAINER_NAME}' in task definition family '${FAMILY}' - check deploy.ecs.containerName against the real task definition." >&2
          exit 1
        fi

        new_revision_arn="$(aws ecs register-task-definition --cli-input-json file:///tmp/new-def.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)"
        echo "registered new task definition revision: ${new_revision_arn} (image ${IMAGE_URI})"

        aws ecs update-service --cluster "${CLUSTER}" --service "${SERVICE}" --task-definition "${new_revision_arn}" >/dev/null
        echo "updated service ${SERVICE} in cluster ${CLUSTER} to ${new_revision_arn} - waiting for stability..."

        aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"
        echo "service ${SERVICE} is stable on ${new_revision_arn}"
