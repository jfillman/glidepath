# catalog/tasks/open-release-pr.yaml
#
# Opens a PR against the app's GitOps repo, promoting an already-built image to the
# declared upper env (validated against deploy.upperEnvironments - see
# docs/multi-cluster.md). A surgical `yq` patch of the manifest's image field, not a full
# re-render, then a plain GitHub REST PR creation call. ArgoCD does the actual deploy once
# the PR merges - this Task never touches the cluster directly. Uses a fresh,
# single-repo-scoped GitHub App installation token minted per-run (catalog/lib/
# github-app.sh), not a standing credential.
#
# GitOps repo is resolved by convention (gitops-<app-name>, same GitHub org as the app
# repo) - deliberately not assumed to equal app-namespace.
#
# The manifest path is <cluster>/<env>/values.yaml (airframe-application's Helm values,
# scaffolded by airframe's ApplicationEnvironment + tenant-onboarding
# ApplicationSet, which also owns that path's ArgoCD Application) - so `cluster` is a
# required param, not optional; this Task's own scope is just patch-the-image/open-the-PR.
#
# Exactly ONE commit per release PR. releaseTracking data (relay URL, chain-id, etc.)
# that airframe-application's own PostSync/SyncFail hook Jobs read to report DORA/Slack
# outcomes rides in the SAME commit as the image-tag patch - every field is known before
# the PR exists, except prUrl/prCreatedAt (the PR's own URL obviously can't be committed
# before the PR is created). Those two go to a short-lived ConfigMap on THIS cluster
# instead of a second git commit - see the note lower in this file. A second commit used
# to carry them, but that meant every governance gate on the gitops repo re-ran in full a
# second time on every single release (found live 2026-08-31: doubled Check Runs,
# doubled Trivy re-scans, for zero informational gain - the two commits never differed in
# anything those gates inspect). outcomeRelayURL is looked up live from platform-cicd's
# own cluster-registry ConfigMap via a narrow get-only Role; this Task still never calls
# the upper cluster's API directly, preserving the "only a reviewed git commit crosses
# from dev to an upper cluster" boundary. releaseTracking.relayHostAliasIP rides in the
# same commit (from this Task's own pod's downward-API status.hostIP, added 2026-09-04) -
# airframe-application's hook Job needs it as a literal hostAliases IP, since a pod's CoreDNS
# never sees the host machine's /etc/hosts that makes outcomeRelayURL's dev.kiac.local
# hostname resolvable everywhere else. See idp/docs/local-clusters.md.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: open-release-pr
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: image-ref
      type: string
      description: The already-built image reference (by digest) to promote.
    - name: git-url
      type: string
      description: The app repo's git-url - only its GitHub org/owner is used, to derive the gitops repo's owner.
    - name: app-name
      type: string
    - name: app-namespace
      type: string
      default: ""
      description: >-
        This app's dev-cluster platform-cicd namespace - rides into airframe-application's
        releaseTracking.appNamespace so release-outcome-trigger.yaml can match the
        outcome CDEvent back to the right app's Trigger. Not the upper-env namespace
        (the hook Job reads that itself via the downward API).
    - name: git-revision
      type: string
    - name: env
      type: string
      default: "staging"
      description: >-
        The upper environment being promoted to (from cicd.yaml's env: field). Default
        "staging" only for manual/direct invocation - a real release always passes this
        explicitly.
    - name: cluster
      type: string
      description: >-
        Name of the physical cluster this env is provisioned on (airframe's
        ApplicationEnvironment.spec.cluster). Required: the gitops-<app-name> repo's
        layout is <cluster>/<env>/values.yaml, so there's no manifest path without it.
        Threaded through from cicd.yaml's deploy.upperEnvironments object form, not
        derived - this Task doesn't read idp's own cluster registry (a deliberately
        separate source of truth). It does read platform-cicd's own cluster registry
        live, but only for outcomeRelayURL.
    - name: chain-id
      type: string
      default: ""
      description: This flow's chain-id (start-flow's result) - rides into releaseTracking.chainId for release-outcome-span.yaml's Tempo correlation.
    - name: flow-start-time
      type: string
      default: ""
      description: This flow's own start time (start-flow's result) - rides into releaseTracking.flowStartTime, the DORA lead-time attribute carried on the eventual outcome span.
    - name: config-json
      type: string
      default: "{}"
      description: cicd.yaml's resolved content (resolve-notify-config's result) - rides into releaseTracking.configJsonB64 (base64) so notify-slack can render the outcome message once the hook Job reports back.
  results:
    - name: pr-url
      description: URL of the opened (or already-open, on retry) release PR.
    - name: pr-created-at
      description: >-
        Wall-clock time this Task's PR-creation API call returned. Rides into
        releaseTracking.prCreatedAt - the start anchor for release-outcome-span.yaml's span.
  # Audience-bound projected ServiceAccount token for the shared broker's GitHub
  # token-minting endpoint - see catalog/lib/github-app.sh. Same pattern as
  # send-cdevent.yaml's broker-token volume, different audience/endpoint.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
  steps:
    - name: open-pr
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: GIT_URL
          value: $(params.git-url)
        - name: APP_NAME
          value: $(params.app-name)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: ENV
          value: $(params.env)
        - name: CLUSTER
          value: $(params.cluster)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: CHAIN_ID
          value: $(params.chain-id)
        - name: FLOW_START_TIME
          value: $(params.flow-start-time)
        - name: CONFIG_JSON
          value: $(params.config-json)
        - name: NAMESPACE
          # For the release-tracking ConfigMap (this cluster, this Application's own
          # namespace) - $(context.taskRun.namespace) is the correct Task-level
          # equivalent of $(context.pipelineRun.namespace), which does not resolve here.
          # Same gotcha comment-pr-check-result.yaml already documents.
          value: $(context.taskRun.namespace)
        - name: RELAY_HOST_ALIAS_IP
          # This Task's own pod runs on the dev cluster, same one hosting
          # argocd-outcome-relay - status.hostIP is that node's current address, exactly
          # what an upper-env cluster's hook Job needs in its hostAliases to resolve
          # registry_relay_url's dev.kiac.local hostname (a pod's CoreDNS never sees the
          # host machine's /etc/hosts - see idp/docs/local-clusters.md). Resolved fresh
          # via the downward API on every release, not re-derived from /etc/hosts or any
          # DNS lookup this pod couldn't make itself either.
          valueFrom: { fieldRef: { fieldPath: status.hostIP } }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"
        source "${PLATFORM_LIB}/retry.sh"

        if [[ -z "${CLUSTER}" ]]; then
          echo "error: cluster is required - gitops-${APP_NAME}'s layout is <cluster>/<env>/values.yaml, there's no manifest path to write without one. Set deploy.upperEnvironments' object form ({ name: ${ENV}, cluster: <cluster-name> }) in this app's cicd.yaml." >&2
          exit 1
        fi

        # GIT_URL is "https://github.com/<owner>/<repo>[.git]" - only the owner segment
        # is used; the gitops repo's own name is always gitops-<app-name> by convention.
        owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        gitops_repo="gitops-${APP_NAME}"

        token="$(github_app_installation_token "${owner}" "${gitops_repo}")"

        # Deliberately NOT timestamped (unlike this Task's original version) - a
        # deterministic branch name per (app, revision) is what makes the idempotency
        # check below actually work. A retried run (Tekton task retry, or a re-triggered
        # PipelineRun after a transient GitHub error) must compute the same branch name
        # as the run it's retrying, or it can never find that run's still-open PR and
        # just opens a duplicate release PR every time instead.
        #
        # ${ENV} is part of the branch name (not just ${GIT_REVISION}) because a single
        # revision can release to MULTIPLE upper envs (e.g. cicd.yaml's release steps for
        # both staging and prod off the same push) - without it, both envs computed the
        # same branch name, so whichever release step ran second found the first env's PR
        # already open on that branch and reused its URL instead of opening (or pushing
        # to) its own, silently never promoting its own env. Real bug, live-confirmed on
        # checkout-api (both staging and prod releases landed on one PR touching only
        # whichever env ran first), fixed 2026-09-04.
        branch="release-${ENV}-${GIT_REVISION:0:8}"

        # Check for an already-open PR from this exact branch before doing any work -
        # this Task's own result description has always claimed "(or already-open, on
        # retry)", but nothing enforced that until now (the old timestamped branch name
        # made every retry look like a brand new release). head=owner:branch scopes the
        # search to this repo's own branch, not every fork.
        existing_pr="$(curl --fail --silent --show-error --retry 3 --retry-connrefused --max-time 15 \
          -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${owner}/${gitops_repo}/pulls?head=${owner}:${branch}&state=open")"
        pr_url="$(jq -r '.[0].html_url // empty' <<<"${existing_pr}")"
        if [[ -n "${pr_url}" ]]; then
          echo "release PR for ${branch} is already open (retry) - reusing it instead of opening a duplicate: ${pr_url}"
          # GitHub's own created_at for the existing PR, not a fresh `date -u` - this IS
          # a retry, so the original PR's real creation time is the correct lead-time
          # anchor, not this attempt's (later) wall-clock time.
          pr_created_at="$(jq -r '.[0].created_at' <<<"${existing_pr}")"
          if [[ -n "${CHAIN_ID}" ]]; then
            kubectl create configmap "release-tracking-${CHAIN_ID}" \
              -n "${NAMESPACE}" \
              --from-literal="prUrl=${pr_url}" \
              --from-literal="prCreatedAt=${pr_created_at}" \
              --dry-run=client -o yaml \
              | kubectl apply -f -
            kubectl label configmap "release-tracking-${CHAIN_ID}" -n "${NAMESPACE}" \
              "hangar.io/subcomponent=release-tracking" --overwrite
          fi
          echo "${pr_url}" | tee "$(results.pr-url.path)"
          echo -n "${pr_created_at}" | tee "$(results.pr-created-at.path)"
          exit 0
        fi

        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${gitops_repo}.git"
        with_retry 3 -- git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"

        git checkout -b "${branch}"

        # <cluster>/<env>/values.yaml - airframe-application's Helm values (scaffolded by
        # airframe), not a raw Deployment manifest. repository/tag are split
        # fields in that schema, not a single image: string - same split
        # deploy-manifests.yaml uses for platform/envs/<env>.yaml.
        manifest="${CLUSTER}/${ENV}/values.yaml"
        image_repo="${IMAGE_REF%:*}"
        image_tag="${IMAGE_REF##*:}"

        # Release-tracking fields resolved up front, before the (only) commit - every
        # one of these is known without the PR existing. outcomeRelayURL is resolved
        # live from platform-cicd's own cluster-registry ConfigMap (platform-system) via
        # a get-only Role scoped to this ConfigMap only. A hard failure here (not
        # best-effort) is deliberate: CLUSTER is already required/validated above, so a
        # missing registry entry means this app's cluster mapping is genuinely
        # misconfigured - better to fail before opening a PR than open one with silently
        # broken outcome reporting.
        registry_entry="$(kubectl get configmap cluster-registry -n platform-system -o jsonpath="{.data.${CLUSTER}}")"
        if [[ -z "${registry_entry}" ]]; then
          echo "error: cluster '${CLUSTER}' has no entry in the platform-cicd cluster-registry ConfigMap (platform-system, charts/glidepath-control-plane's clusters:) - can't resolve outcomeRelayURL, so release-tracking can't be wired up for this release. A platform admin needs to add it before this app can release to ${ENV}." >&2
          exit 1
        fi
        registry_relay_url="$(jq -r '.outcomeRelayURL' <<<"${registry_entry}")"

        # Base64, not raw JSON - the one field here that can contain quotes/braces;
        # sidesteps yq mis-escaping it into the surrounding YAML. Decoded only at the
        # end, by catalog/lib/argocd-outcome-hook.sh.
        config_json_b64="$(printf '%s' "${CONFIG_JSON}" | base64 | tr -d '\n')"

        yq -i -e "
          .rollout.image.repository = \"${image_repo}\" |
          .rollout.image.tag = \"${image_tag}\" |
          .releaseTracking.relayUrl = \"${registry_relay_url}\" |
          .releaseTracking.relayHostAliasIP = \"${RELAY_HOST_ALIAS_IP}\" |
          .releaseTracking.cluster = \"${CLUSTER}\" |
          .releaseTracking.appNamespace = \"${APP_NAMESPACE}\" |
          .releaseTracking.gitUrl = \"${GIT_URL}\" |
          .releaseTracking.gitRevision = \"${GIT_REVISION}\" |
          .releaseTracking.flowStartTime = \"${FLOW_START_TIME}\" |
          .releaseTracking.chainId = \"${CHAIN_ID}\" |
          .releaseTracking.configJsonB64 = \"${config_json_b64}\"
        " "${manifest}"

        git config user.name "platform-cicd release automation"
        git config user.email "release@platform-cicd.invalid"

        # X-App-Repo/X-App-Commit trailers let verify-commit-signature.yaml, running as a
        # check on THIS gitops PR, find its way back to the app-repo commit that actually
        # needs a verified human signature - this gitops commit is machine-generated and
        # never signed itself. Full 40-char SHA, not the 12-char truncation used elsewhere,
        # since that's not reliably enough to unambiguously `git fetch` one commit. Built
        # with printf + \n escapes, not a raw multi-line string, which breaks YAML parsing.
        commit_message="$(printf 'Release: promote %s to %s @ %s\n\nX-App-Repo: %s\nX-App-Commit: %s' \
          "${APP_NAME}" "${ENV}" "${IMAGE_REF}" "${GIT_URL}" "${GIT_REVISION}")"
        git commit --quiet -am "${commit_message}"
        # --force is safe/correct here, not just convenient: this branch name is
        # deterministic and exclusively owned by this automation (see above), so the
        # only way a remote branch with this exact name already exists is a stale
        # leftover from an earlier attempt at this same (app, revision) pair - one this
        # run's fresh commit should simply replace, not be rejected by as a
        # non-fast-forward push.
        with_retry 3 -- git push --quiet --force "${clone_url}" "${branch}"

        # Field vocabulary/ordering matches the shared design language used in Slack
        # notifications (notify-slack.yaml), in GitHub-flavored markdown here. No color
        # (GitHub PR bodies can't carry it without a badge image). Tenant/Run are
        # Slack-only fields, not meaningful to a PR reviewer. repo_short uses the same
        # sed pattern as notify-slack.yaml so the two never diverge.
        repo_short="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/([^/.]+).*#\1/\2#')"
        commit_short="${GIT_REVISION:0:12}"
        # Explains what each required GitHub Check on this PR does and how to re-trigger
        # a failing one via PaC's native `/retest <name>` comment. The table rows below
        # are Helm-rendered from .Values.releaseGuardrails (the single source of truth
        # for the gate set, docs/admin/release-guardrails.md), not hand-listed here - a
        # stub gate's Status column says so plainly rather than glossing over it (this
        # platform's "stub-ness should be structurally loud" principle, ADR-0003). Same
        # printf+\n-escape technique as commit_message above, not a raw heredoc - a raw
        # heredoc at column 0 inside this already-indented `script: |` block previously
        # broke the surrounding Task's own YAML by terminating the block scalar early
        # (see docs/admin/multi-cluster.md's "Live end-to-end verification" section for
        # the real, live-confirmed bug this technique was adopted to avoid).
        governance_text="$(printf '\n\n## Governance checks\n\n| Check | What it verifies | Status |\n|---|---|---|\n{{ range .Values.releaseGuardrails }}| `{{ .name }}` | {{ .description | replace "'" "'\"'\"'" }} | {{ if eq .status "real" }}real{{ else }}not yet real - see docs/governance-stubs.md{{ end }} |\n{{ end }}\n**If a check fails**: comment `/retest <check-name>` on this PR to re-run just that one (e.g. `/retest sast`), or `/retest` alone to re-run all of them. Fix the underlying issue first if the failure is real - re-running does not bypass a check, it only re-evaluates it.')"
        pr_body_text="$(printf '**App**: %s\n**Env**: %s\n**Repo**: [%s](%s)\n**Commit**: [`%s`](%s/commit/%s)\n**Image**: `%s`\n\nMerging this PR triggers ArgoCD to sync it to %s. See docs/release.md.%s' \
          "${APP_NAME}" "${ENV}" "${repo_short}" "${GIT_URL}" "${commit_short}" "${GIT_URL}" "${GIT_REVISION}" "${IMAGE_REF}" "${ENV}" "${governance_text}")"
        pr_body="$(jq -n \
          --arg title "Release: ${APP_NAME} to ${ENV} @ ${image_tag}" \
          --arg body "${pr_body_text}" \
          --arg head "${branch}" \
          --arg base "main" \
          '{title: $title, body: $body, head: $head, base: $base}')"

        pr_response="$(curl --fail --silent --show-error --retry 3 --retry-connrefused --max-time 15 \
          -X POST -H "Authorization: Bearer ${token}" \
          -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${owner}/${gitops_repo}/pulls" \
          -d "${pr_body}")"
        pr_url="$(jq -r '.html_url' <<<"${pr_response}")"
        # Matches otel_now's format (catalog/lib/otel.sh) without sourcing that whole lib
        # for one timestamp.
        pr_created_at="$(date -u +"%Y-%m-%dT%H:%M:%S.%NZ")"

        # prUrl/prCreatedAt genuinely can't be known before the PR exists, and writing
        # them via a second git commit would re-trigger every governance gate on this PR
        # a second time (see this file's own header). A short-lived ConfigMap on THIS
        # (dev) cluster, keyed by chain-id, hands them to release-outcome-notify.yaml's
        # resolve-release-tracking Task instead - that Task runs here too, so this never
        # becomes a cross-cluster call. Self-cleaned on read (see that Task); the
        # pr-namespace-ttl-sweep CronJob is the backstop for a release whose PR never
        # merges, so that Task never runs. --dry-run=client|apply, not a raw heredoc -
        # see the pr_body_text comment above on why a heredoc at column 0 breaks this
        # Task's own surrounding YAML.
        if [[ -n "${CHAIN_ID}" ]]; then
          kubectl create configmap "release-tracking-${CHAIN_ID}" \
            -n "${NAMESPACE}" \
            --from-literal="prUrl=${pr_url}" \
            --from-literal="prCreatedAt=${pr_created_at}" \
            --dry-run=client -o yaml \
            | kubectl apply -f -
          kubectl label configmap "release-tracking-${CHAIN_ID}" -n "${NAMESPACE}" \
            "hangar.io/subcomponent=release-tracking" --overwrite
        else
          echo "warning: no chain-id for this release - pr-url/pr-created-at won't reach release-outcome-notify.yaml (app onboarded before chain-id existed, or a manual/direct invocation)." >&2
        fi

        echo "${pr_url}" | tee "$(results.pr-url.path)"
        echo -n "${pr_created_at}" | tee "$(results.pr-created-at.path)"
