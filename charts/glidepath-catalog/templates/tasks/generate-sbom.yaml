# catalog/tasks/generate-sbom.yaml
#
# Real (not stub) SBOM generation via Trivy, replacing governance-gate-stub for build.yaml's
# `sbom` gate. Generates a CycloneDX SBOM and attaches it as a keyless-signed in-toto
# attestation (cosign) - Conforma's sbom rule packages require a real SBOM attestation on
# the image, not just a file existing somewhere.
#
# Signs as pipeline-runner's own Kubernetes identity (not tekton-chains-controller's),
# against the same self-hosted Fulcio - `type: kubernetes` issuer trusts any in-cluster
# projected SA token, see docs/image-signing.md. Real Rekor upload, same as Chains'
# own transparency.enabled=true - reverted once, 2026-09-05, when cosign attest's own
# internal post-upload check failed against this self-hosted Rekor ("0 < 1 verified
# log entries") even though the entry genuinely got created. Root-caused and re-enabled
# 2026-09-06: the actual cause was a stale rekor-public-key ConfigMap (removed in
# verify-image-provenance.yaml/verify-sast-attestation.yaml's own fix that same day) -
# cosign's internal check was verifying the fresh entry's signature against the WRONG
# cached key. Confirmed live via a throwaway attest against this exact image once the
# key was fetched fresh instead: same command, same cluster, exit 0. Fetches
# rekor.pub live below for the same reason those two Tasks do.
#
# cosign 3.x's `attest` has no --fulcio-url/--rekor-url/--oidc-issuer flags - it needs a
# "signing-config" + "trusted-root" document instead, generated at runtime below via
# `cosign signing-config create`/`cosign trusted-root create`. The trusted-root step is
# required: without it cosign rejects the self-hosted Fulcio's cert as untrusted (not in
# the public Sigstore TUF root). fulcio-root-ca is the same ConfigMap
# verify-image-provenance.yaml reads for verification.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-sbom
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Generates a CycloneDX SBOM (Trivy) for the given image and attaches it as a real, keyless-signed cosign attestation.
  params:
    - name: image-ref
      type: string
      description: Full image reference (repo:tag) to generate an SBOM for and attest - must already be pushed.
    - name: flow-traceparent
      type: string
      default: ""
      description: Leave empty when there's no flow/stage context (e.g. a PR-triggered GitOps-repo check) - see governance-stub.yaml for the same convention.
    - name: stage-span-id
      type: string
      default: ""
      description: The calling stage's own span id - this step's span is parented to it. Ignored when flow-traceparent is empty.
  results:
    - name: outcome
      description: "'passed'/'failed' - a real result, never 'stub'. Fails only on a genuine generation/signing/push error, not on SBOM content - there's no security verdict to gate on here, unlike sast-scan/image-scan."
  # Registry push credentials for cosign's attestation upload - same Secret/key mapping
  # kaniko uses in build-image.yaml, consumed via DOCKER_CONFIG (cosign's standard
  # credential-resolution env var) instead of kaniko's hardcoded lookup path.
  volumes:
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
    # Audience "sigstore" matches Fulcio's configured client-id (platform/sigstore/
    # fulcio-config.yaml) - same audience Tekton Chains' controller uses, requested here
    # for pipeline-runner's identity instead.
    - name: sigstore-identity-token
      projected:
        sources:
          - serviceAccountToken:
              path: sigstore-token
              audience: sigstore
              expirationSeconds: 600
  steps:
    - name: generate-and-attest
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: registry-credentials
          mountPath: /var/run/secrets/registry
          readOnly: true
        - name: sigstore-identity-token
          mountPath: /var/run/secrets/sigstore
          readOnly: true
      env:
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: DOCKER_CONFIG
          value: /var/run/secrets/registry
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        source "${PLATFORM_LIB}/otel.sh"
        # otel.sh does `set -euo pipefail` at module level, which leaks -e into this
        # script since `source` runs in the same shell (same bug class as image-scan.yaml).
        # This script needs -e OFF so a cosign_attest failure falls through to the
        # EXIT_CODE check and outcome="failed" write below, instead of dying silently.
        # Re-declaring `set -uo pipefail` does NOT clear an already-set -e; only `set +e` does.
        set +e

        # Idempotency check: skip if this image digest already has a cyclonedx
        # attestation. This Task runs unconditionally on every release-PR check, so
        # duplicate/retried PRs against the same promoted commit (e.g. webhook
        # redelivery) were piling up a new attestation every check - one real image was
        # found with nine redundant SBOM attestations. That pileup also feeds
        # docs/provenance-policy.md's "cosign 3.x bundle format" verification conflict:
        # `cosign verify-attestation` walks all OCI-referrer attestations even with
        # --type restricted, and fails closed before reaching the real provenance
        # attestation. This stops making that worse on every retry; the deeper
        # verify-attestation fix is still open, see that doc.
        if cosign download attestation --predicate-type cyclonedx "${IMAGE_REF}" >/dev/null 2>&1; then
          echo "generate-sbom: a cyclonedx attestation already exists for ${IMAGE_REF} - skipping, not generating a redundant one"
          echo -n "passed" | tee "$(results.outcome.path)"
          exit 0
        fi

        trivy image --timeout 15m --format cyclonedx --output /tmp/sbom.json "${IMAGE_REF}"
        if [[ $? -ne 0 ]]; then
          echo "generate-sbom: trivy SBOM generation failed" >&2
          echo -n "failed" | tee "$(results.outcome.path)"
          exit 1
        fi

        kubectl get configmap fulcio-root-ca -n platform-catalog \
          -o jsonpath='{.data.cert\.pem}' > /tmp/fulcio-root.pem
        # Fetched live, not from a cached ConfigMap - see verify-image-provenance.yaml's
        # identical fix for the live incident that made this necessary (a stale cached
        # key was the real cause of this Task's own past "0 < 1" failure, see the header
        # comment above).
        curl -fsSL --max-time 10 http://rekor-server.rekor-system.svc/api/v1/log/publicKey > /tmp/rekor.pub

        cosign signing-config create \
          --fulcio="url=http://fulcio-server.fulcio-system.svc,api-version=1,start-time=2020-01-01T00:00:00Z,operator=platform-cicd" \
          --oidc-provider="url=https://kubernetes.default.svc.cluster.local,api-version=1,start-time=2020-01-01T00:00:00Z,operator=platform-cicd" \
          --rekor="url=http://rekor-server.rekor-system.svc,api-version=1,start-time=2020-01-01T00:00:00Z,operator=platform-cicd" \
          --rekor-config="ANY" \
          --no-default-tsa \
          --out /tmp/signing-config.json

        cosign trusted-root create \
          --fulcio="url=http://fulcio-server.fulcio-system.svc,certificate-chain=/tmp/fulcio-root.pem" \
          --rekor="url=http://rekor-server.rekor-system.svc,public-key=/tmp/rekor.pub,start-time=2020-01-01T00:00:00Z" \
          --no-default-ctfe --no-default-tsa \
          --out /tmp/trusted-root.json

        cosign_attest() {
          cosign attest \
            --predicate /tmp/sbom.json \
            --type cyclonedx \
            --signing-config /tmp/signing-config.json \
            --trusted-root /tmp/trusted-root.json \
            --identity-token /var/run/secrets/sigstore/sigstore-token \
            --yes \
            "${IMAGE_REF}"
        }
        export -f cosign_attest

        if [[ -n "${FLOW_TRACEPARENT}" ]]; then
          otel_child_span "generate-sbom" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" "image=${IMAGE_REF}" -- \
            bash -c cosign_attest
        else
          echo "no flow-traceparent provided - skipping span emission (expected for PR-triggered GitOps-repo checks)" >&2
          cosign_attest
        fi
        EXIT_CODE=$?

        if [[ "${EXIT_CODE}" -eq 0 ]]; then
          echo -n "passed" | tee "$(results.outcome.path)"
        else
          echo "generate-sbom: cosign attest failed (exit ${EXIT_CODE})" >&2
          echo -n "failed" | tee "$(results.outcome.path)"
          exit 1
        fi
