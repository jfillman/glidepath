# catalog/tasks/resolve-image-ref.yaml
#
# Determines the image-ref a deploy or release stage should act on. Shared by both
# (deploy grew the same git-rootability release already had). Two cases:
#   - Event-chained (deploy after test, release after deploy): image-ref arrives as a
#     Pipeline param from the upstream CDEvent. Passed through unchanged.
#   - Git-rooted (tag push fires deploy/release directly): reconstruct
#     <image-repo>:<version>-<short-sha> using build-image.yaml's own convention -
#     version from the git tag, short-sha the first 7 chars of git-revision. Must stay
#     in sync with build-image.yaml's SHORT_SHA length, or this silently reconstructs a
#     ref that was never pushed. Correct because PaC's tag-event revision is the same
#     commit build-image.yaml originally built from. See docs/release.md.
#
# The git-rooted-without-a-tag branch below still falls back to a fixed "0.0.0" instead
# of reading the manifest - no `source` workspace wired in yet, and every real git-rooted
# deploy/release use case is tag-triggered anyway. Revisit if that changes.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-image-ref
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Passes through an event-chained image-ref, or reconstructs one from image-repo + git-tag + git-revision for a git-rooted deploy or release.
  params:
    - name: image-ref
      type: string
      default: ""
      description: Event-chained image-ref from an upstream CDEvent. Empty for a git-rooted stage.
    - name: image-repo
      type: string
      default: ""
      description: Destination registry/repo, e.g. ghcr.io/<org>/<app>. Only needed for the git-rooted case.
    - name: git-tag
      type: string
      default: ""
      description: Git tag passed by PaC for a git-rooted stage (e.g. refs/tags/v1.2.3 or v1.2.3).
    - name: git-revision
      type: string
      default: ""
  results:
    - name: image-ref
  steps:
    - name: resolve
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        IMAGE_REF='$(params.image-ref)'
        if [[ -n "${IMAGE_REF}" ]]; then
          echo -n "${IMAGE_REF}" | tee "$(results.image-ref.path)"
          exit 0
        fi

        IMAGE_REPO='$(params.image-repo)'
        GIT_TAG='$(params.git-tag)'
        SHORT_SHA="$(cut -c1-7 <<< "$(params.git-revision)")"

        VERSION="0.0.0"
        if [[ -n "${GIT_TAG}" ]]; then
          # Same extraction as build-image.yaml: strip refs/tags/ and an optional 'v'.
          VERSION=$(echo "${GIT_TAG}" | sed -E 's|^refs/tags/v?||')
        fi

        echo -n "${IMAGE_REPO}:${VERSION}-${SHORT_SHA}" | tee "$(results.image-ref.path)"
