# catalog/tasks/resolve-image-ref.yaml
#
# Determines the image-ref a deploy or release stage should act on. Shared by both
# (deploy grew the same git-rootability release already had). Two cases:
#   - Event-chained (deploy after test, release after deploy): image-ref arrives as a
#     Pipeline param from the upstream CDEvent. Passed through unchanged.
#   - Git-rooted (tag push fires deploy/release directly): reconstruct
#     <image-repo>:<version>-<short-sha> using build-image.yaml's own convention -
#     version from the git tag, short-sha the first 7 chars of git-revision. Must stay
#     in sync with build-image.yaml's SHORT_SHA length, or this silently reconstructs a
#     ref that was never pushed. Correct because PaC's tag-event revision is the same
#     commit build-image.yaml originally built from. See docs/release.md.
#
# Git-rooted-without-a-tag now fails loudly (2026-09-29) instead of guessing "0.0.0" -
# it used to fall back to a fixed "0.0.0-<sha>" placeholder, but build-image.yaml never
# actually publishes under that tag for a manifest-carrying app (it derives a real
# version from package.json/pyproject.toml/pom.xml/VERSION for the same commit), so the
# reconstructed ref was frequently a real, un-pushed tag - a deploy/release would then
# fail far downstream (ImagePullBackOff) with no clue this Task's guess was the actual
# root cause. The comment this replaced already asserted "every real git-rooted use case
# is tag-triggered anyway" - this just makes that an enforced invariant instead of an
# assumption. No `source` workspace wired in here to read the manifest as a real
# fallback - revisit only if a genuine git-rooted-without-a-tag use case shows up.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-image-ref
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Passes through an event-chained image-ref, or reconstructs one from image-repo + git-tag + git-revision for a git-rooted deploy or release.
  params:
    - name: image-ref
      type: string
      default: ""
      description: Event-chained image-ref from an upstream CDEvent. Empty for a git-rooted stage.
    - name: image-repo
      type: string
      default: ""
      description: Destination registry/repo, e.g. ghcr.io/<org>/<app>. Only needed for the git-rooted case.
    - name: git-tag
      type: string
      default: ""
      description: Git tag passed by PaC for a git-rooted stage (e.g. refs/tags/v1.2.3 or v1.2.3).
    - name: git-revision
      type: string
      default: ""
    - name: pin-file
      type: string
      default: ""
      description: >-
        ADR-0020: a cloud Flight environment's release pin (glidepath/releases/<env>.yaml), set by
        the generated promote-<env> flow. When set, the image is the pinned one, read from the source
        repo at git-revision, and its tag must still resolve to the pinned digest.
    - name: git-url
      type: string
      default: ""
      description: Only read with pin-file - the source repo the pin lives in.
  results:
    - name: image-ref
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        optional: true
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: resolve
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
        - name: registry-credentials
          mountPath: /var/run/secrets/registry
          readOnly: true
      env:
        - name: DOCKER_CONFIG
          value: /var/run/secrets/registry
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        PIN_FILE='$(params.pin-file)'
        if [[ -n "${PIN_FILE}" ]]; then
          # The pin exactly as merged: read at this push's revision, not the branch tip.
          source "${PLATFORM_LIB}/github-app.sh"
          GIT_URL='$(params.git-url)'
          REVISION='$(params.git-revision)'
          owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
          repo="$(echo "${GIT_URL}" | sed -E 's#/$##; s#https?://github\.com/[^/]+/([^/]+)$#\1#; s#\.git$##')"
          token="$(github_app_installation_token "${owner}" "${repo}")"
          pin="$(curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${owner}/${repo}/contents/${PIN_FILE}?ref=${REVISION}")"
          repository="$(yq -r '.release.image.repository // ""' <<<"${pin}")"
          tag="$(yq -r '.release.image.tag // ""' <<<"${pin}")"
          digest="$(yq -r '.release.image.digest // ""' <<<"${pin}")"
          if [[ -z "${repository}" || -z "${tag}" || "${digest}" != sha256:* ]]; then
            echo "error: ${PIN_FILE} at ${REVISION} has no release.image.{repository,tag,digest}" >&2
            exit 1
          fi
          # R11: deploy exactly the artifact that was approved. A tag moved since the pin was
          # written would deploy something else, so refuse instead.
          current="$(oras resolve "${repository}:${tag}" | tr -d '\n')"
          if [[ "${current}" != "${digest}" ]]; then
            echo "error: ${repository}:${tag} now resolves to ${current}, not the pinned ${digest}; refusing to deploy a different image than the one approved" >&2
            exit 1
          fi
          echo "pinned image ${repository}:${tag} (${digest})"
          echo -n "${repository}:${tag}" | tee "$(results.image-ref.path)"
          exit 0
        fi

        IMAGE_REF='$(params.image-ref)'
        if [[ -n "${IMAGE_REF}" ]]; then
          echo -n "${IMAGE_REF}" | tee "$(results.image-ref.path)"
          exit 0
        fi

        IMAGE_REPO='$(params.image-repo)'
        GIT_TAG='$(params.git-tag)'
        SHORT_SHA="$(cut -c1-7 <<< "$(params.git-revision)")"

        if [[ -z "${GIT_TAG}" ]]; then
          echo "error: resolve-image-ref reached the git-rooted path (no event-chained" \
               "image-ref) with no git-tag either. Every git-rooted deploy/release is" \
               "expected to be tag-triggered - reconstructing a guessed 0.0.0-<sha> ref" \
               "here would very likely name an image build-image.yaml never actually" \
               "pushed. Refusing to guess; check the Pipeline's trigger config." >&2
          exit 1
        fi

        # Same extraction as build-image.yaml: strip refs/tags/ and an optional 'v'.
        VERSION=$(echo "${GIT_TAG}" | sed -E 's|^refs/tags/v?||')

        echo -n "${IMAGE_REPO}:${VERSION}-${SHORT_SHA}" | tee "$(results.image-ref.path)"
