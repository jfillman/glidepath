# catalog/tasks/resolve-release-tracking.yaml
#
# Reads pr-url/pr-created-at back out of the release-tracking-<chain-id> ConfigMap
# open-release-pr.yaml writes on this same (dev) cluster at PR-open time - see that
# Task's own header for why those two fields never round-trip through git/the outcome
# CDEvent the way every other releaseTracking field does (committing them would mean a
# second git commit on the release PR, which re-triggers every governance gate on the
# gitops repo a second time - found live 2026-08-31).
#
# Always succeeds, even when nothing is found - a missing ConfigMap (chain-id blank, the
# ConfigMap already consumed by an earlier/racing run, TTL-swept, or this release
# predates the mechanism) means pr-url/pr-created-at are just empty, same graceful
# degradation release-log-emit.yaml/release-outcome-span.yaml already apply downstream.
#
# Self-cleaning: deletes the ConfigMap once read, since release-outcome-notify.yaml only
# ever needs it once per confirmed outcome - pr-namespace-ttl-sweep is the backstop for a
# release whose PR never merges (this Task then never runs at all).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-release-tracking
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Reads pr-url/pr-created-at back out of the dev-cluster ConfigMap open-release-pr.yaml wrote at PR-open time, then deletes it.
  params:
    - name: chain-id
      type: string
      default: ""
      description: The release flow's chain-id (release-outcome-notify.yaml's own param, sourced from the outcome CDEvent) - the join key back to open-release-pr.yaml's own run.
  results:
    - name: pr-url
      description: The release PR's URL, or empty if not found.
    - name: pr-created-at
      description: When the release PR was created, or empty if not found.
  steps:
    - name: resolve
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: CHAIN_ID
          value: $(params.chain-id)
        - name: NAMESPACE
          # $(context.taskRun.namespace), not $(context.pipelineRun.namespace) - see
          # comment-pr-check-result.yaml/open-release-pr.yaml for the same documented
          # gotcha (the pipelineRun form only resolves inside a Pipeline's own spec).
          value: $(context.taskRun.namespace)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        pr_url=""
        pr_created_at=""

        if [[ -n "${CHAIN_ID}" ]]; then
          cm_name="release-tracking-${CHAIN_ID}"
          if kubectl get configmap "${cm_name}" -n "${NAMESPACE}" >/dev/null 2>&1; then
            pr_url="$(kubectl get configmap "${cm_name}" -n "${NAMESPACE}" -o jsonpath='{.data.prUrl}' 2>/dev/null || true)"
            pr_created_at="$(kubectl get configmap "${cm_name}" -n "${NAMESPACE}" -o jsonpath='{.data.prCreatedAt}' 2>/dev/null || true)"
            kubectl delete configmap "${cm_name}" -n "${NAMESPACE}" --ignore-not-found --wait=false
          else
            echo "no release-tracking ConfigMap for chain-id '${CHAIN_ID}' (already consumed, TTL-swept, or this release predates the mechanism) - pr-url/pr-created-at will be empty." >&2
          fi
        else
          echo "no chain-id on this outcome event - pr-url/pr-created-at will be empty (app onboarded before chain-id existed, or a manual/direct invocation)." >&2
        fi

        echo -n "${pr_url}" | tee "$(results.pr-url.path)"
        echo -n "${pr_created_at}" | tee "$(results.pr-created-at.path)"
