# catalog/tasks/comment-pr-check-result.yaml
#
# Posts a PR comment reporting a governance check's outcome, on top of the GitHub Check
# PaC already reports natively - failure detail, a gate-specific recommendation, and the
# `/retest` command, right in the PR conversation. Posts on success too, not just failure.
#
# Invoked from each governance-check Pipeline's `finally:` block, same placement as
# notify-slack.yaml, so it still runs when an earlier task failed. Auth via the same
# shared-broker GitHub App token mechanism as open-release-pr.yaml/detect-bypass-merge.yaml.
#
# Failure detail is a live, best-effort pod-log lookup rather than a per-Task result
# field - avoids adding a result to every gate's own verification Task(s) for
# information already sitting in their pod logs.
#
# Edits an existing comment in place (hidden `<!-- glidepath:gate:<name> -->` marker)
# instead of always posting new: every commit on a PR is now independently re-verified
# (a real Check Run each time), so without this dedup that would spam N appended comments
# for unchanged outcomes.
#
# Marker renamed from `platform-cicd:gate:<name>` 2026-10-03 (branding cleanup) - the
# lookup below matches EITHER marker so an already-open PR with an old-marker comment
# still gets edited in place on its next run instead of getting a duplicate new-marker
# comment posted alongside it. New comments always write the new marker only; drop the
# old-marker branch once confident no PR with an old-marker comment is still open.
#
# With promotion on (catalog promotion.enabled, ADR-0029 phase 3), a second step is the promotion fan-in: every gate
# ends here, so after this gate's verdict it records the verdict in the release record's gate ledger and, when every
# required gate is green on the release PR's head commit, sends `release.promotion-ready` to the broker. A Trigger in
# the catalog namespace turns that into the `promote` PipelineRun (rbac/promote-trigger.yaml), which re-checks
# everything itself; this step only decides when to ask.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: comment-pr-check-result
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Posts a PR comment reporting a governance check's real outcome - failure detail + a gate-specific recommendation + the /retest command on failure, a short confirmation on success.
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's `repo_url`.
    - name: pr-number
      type: string
      description: "PaC's raw pull_request.number webhook body field - the check Pipelines don't otherwise carry a PR number, only repo-url/revision."
    - name: revision
      type: string
      default: ""
      description: "The gitops PR's head commit - PaC's `revision`. Fallback source for the real PR number when pr-number arrives unsubstituted (see script header on PaC's pull_request.number webhook var only resolving for genuine pull_request webhooks)."
    - name: gate-name
      type: string
      description: Any name from .Values.releaseGuardrails (docs/admin/release-guardrails.md) - must match the real `/retest <name>-` PaC expects (docs/admin/release.md).
    - name: pipeline-run-name
      type: string
      description: $(context.pipelineRun.name) from the calling Pipeline - used to find which of its own child TaskRuns failed.
    - name: advisory-reason
      type: string
      default: "rollback"
      description: "Why an -advisory task ran instead of the hard one, for the comment's wording: rollback (ADR-0021 decision 8, the default every content gate uses) or not-required (the gate's releaseGuardrails entry has required: false - report-only, docs/admin/release-guardrails.md)."
    - name: status
      type: string
      description: $(tasks.status) from the calling Pipeline's finally block.
    - name: post-comment
      type: string
      default: "true"
      description: "\"false\" records the verdict (for the promotion fan-in) without posting the PR comment: agent-gates-check sets it from its agent-pr result, so a person's or a release PR gets no comment while its verdict still counts."
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
{{- if .Values.promotion.enabled }}
          - serviceAccountToken:
              path: broker-token
              audience: cdevents-broker
              expirationSeconds: 600
    # This gate's verdict and PR number, from the comment step to the promotion-ready step.
    - name: gate-work
      emptyDir: {}
{{- end }}
  steps:
    - name: comment
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
{{- if .Values.promotion.enabled }}
        - { name: gate-work, mountPath: /workspace/gate }
{{- end }}
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: REPO_URL
          value: $(params.repo-url)
        - name: PR_NUMBER
          value: $(params.pr-number)
        - name: REVISION
          value: $(params.revision)
        - name: GATE_NAME
          value: $(params.gate-name)
        - name: PIPELINE_RUN_NAME
          value: $(params.pipeline-run-name)
        - name: STATUS
          value: $(params.status)
        - name: ADVISORY_REASON
          value: $(params.advisory-reason)
        - name: POST_COMMENT
          value: $(params.post-comment)
        - name: NAMESPACE
          # $(context.pipelineRun.namespace) does NOT resolve here - that variable is only
          # valid inside a Pipeline's own spec, never inside a Task's field values
          # directly. It's left completely unsubstituted (a literal string, not an
          # error), so every kubectl call below would target a nonexistent namespace and
          # fail silently under set -e. $(context.taskRun.namespace) is the correct
          # Task-level equivalent - a TaskRun always runs in the same namespace as its
          # owning PipelineRun.
          value: $(context.taskRun.namespace)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"

        owner="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        repo="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        token="$(github_app_installation_token "${owner}" "${repo}")"

        # PaC's {{ "{{" }} body.pull_request.number {{ "}}" }} template var only resolves for a genuine
        # `pull_request` webhook - a `/retest <gate>`/`/test <gate>` PR comment fires an
        # `issue_comment` webhook instead, whose payload has no top-level `pull_request`
        # field, so PaC leaves the raw, unsubstituted template string in place (confirmed
        # live 2026-08-23: every retest-triggered check got that literal string as
        # PR_NUMBER, breaking every curl URL below). Fall back to the Commits API, which
        # finds the PR from the commit itself and works regardless of what triggered this
        # run.
        if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
          resolved=""
          if [[ -n "${REVISION}" ]]; then
            resolved="$(curl --fail --silent --show-error --max-time 10 --retry 3 --retry-connrefused \
              -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${owner}/${repo}/commits/${REVISION}/pulls" \
              | jq -r '.[0].number // empty')"
          fi
          if ! [[ "${resolved}" =~ ^[0-9]+$ ]]; then
            echo "pr-number param wasn't a real PR number ('${PR_NUMBER}') and couldn't resolve one from revision '${REVISION}' either - skipping PR comment (the native GitHub Check already reports this gate's outcome)." >&2
            exit 0
          fi
          PR_NUMBER="${resolved}"
        fi
        gate_work="${GATE_WORK:-/workspace/gate}"
        [[ -d "${gate_work}" ]] && printf '%s' "${PR_NUMBER}" > "${gate_work}/pr"

        taskrun_results="$(kubectl get taskrun -n "${NAMESPACE}" -l "tekton.dev/pipelineRun=${PIPELINE_RUN_NAME}" -o json 2>/dev/null)"
        # ADR-0021 phase 4: on an eligible rollback the content gates run their check as
        # <task>-advisory with onError: continue. The PipelineRun then succeeds, but
        # $(tasks.status) still reads "Failed" (Tekton 1.x counts an ignored failure as a
        # failure there - seen live 2026-10-19 on the qa gate's first advisory run, whose
        # comment said "failed" over a green check run), so STATUS alone cannot pick the
        # advisory wording. Decide from the TaskRuns: a failed TaskRun that is not an
        # -advisory one is a real failure; only -advisory failures means advisory.
        advisory_failed="$(echo "${taskrun_results}" | jq -r '[.items[] | select((.metadata.labels["tekton.dev/pipelineTask"] // "") | endswith("-advisory")) | select(.status.conditions[0].status == "False")][0].metadata.name // empty')"
        hard_failed="$(echo "${taskrun_results}" | jq -r '[.items[] | select((.metadata.labels["tekton.dev/pipelineTask"] // "") | endswith("-advisory") | not) | select(.status.conditions[0].status == "False")][0].metadata.name // empty')"
        if [[ "${STATUS}" == "Succeeded" || "${STATUS}" == "Completed" || ( -n "${advisory_failed}" && -z "${hard_failed}" ) ]]; then
          [[ -d "${gate_work}" ]] && echo success > "${gate_work}/verdict"
          # Best-effort: surface a Task result if one exists (image-scan and qa-gate produce
          # findings-summary) - never required, a plain pass is a complete comment too.
          summary="$(echo "${taskrun_results}" | jq -r '[.items[].status.results[]? | select(.name == "findings-summary")][0].value // empty')"
          # governance-gate-stub/qa-gate (ADR-0003) emit outcome=stub - a stub always
          # succeeds, so STATUS alone can't tell "really passed" from "not a real check
          # yet". Without this, a stubbed gate (currently itsm without a change tool)
          # posts the same "passed" wording as a genuine result, which
          # reads as the gate having actually verified something it never checked.
          outcome="$(echo "${taskrun_results}" | jq -r '[.items[].status.results[]? | select(.name == "outcome")][0].value // empty')"
          # Say what the advisory check found and why it did not block, instead of a plain "passed".
          rollback_note="$(echo "${taskrun_results}" | jq -r '[.items[].status.results[]? | select(.name == "rollback-note")][0].value // empty')"
          if [[ -n "${advisory_failed}" ]]; then
            pod_name="$(kubectl get taskrun "${advisory_failed}" -n "${NAMESPACE}" -o jsonpath='{.status.podName}' 2>/dev/null || true)"
            excerpt="(no log excerpt available)"
            if [[ -n "${pod_name}" ]]; then
              excerpt="$(kubectl logs "${pod_name}" -n "${NAMESPACE}" --all-containers --tail=20 2>/dev/null | tail -c 1200 || true)"
            fi
            if [[ "${ADVISORY_REASON}" == "not-required" ]]; then
              body="$(printf '### ⚠️ `%s` found a problem, advisory until the gate is required\n\nThis check would fail once the `%s` gate is required on this cluster (`required: true` on its `releaseGuardrails` entry in the Glidepath catalog, docs/admin/release-guardrails.md). It did not block because the gate runs report-only here. The finding is recorded here and on the check run.\n\n**What it found:**\n```\n%s\n```' \
                "${GATE_NAME}" "${GATE_NAME}" "${excerpt}")"
            else
              body="$(printf '### ⚠️ `%s` found a problem, advisory on this rollback\n\nThis check would fail on a normal release. It did not block because this PR rolls back to an image that already ran healthy here: %s (glidepath ADR-0021 decision 8). The finding is recorded here and on the check run.\n\n**What it found:**\n```\n%s\n```' \
                "${GATE_NAME}" "${rollback_note:-an eligible rollback target}" "${excerpt}")"
            fi
          elif [[ "${outcome}" == "stub" ]]; then
            body="### ⚠️ \`${GATE_NAME}\` — stub, not a real check yet"$'\n\n'"This gate always succeeds today; it hasn't verified anything real. See docs/admin/governance-stubs.md."
          else
            body="### ✅ \`${GATE_NAME}\` passed"
            if [[ -n "${summary}" ]]; then
              body="${body}"$'\n\n'"${summary}"
            fi
            if [[ "${rollback_note}" == *"ran healthy"* ]]; then
              body="${body}"$'\n\n'"Rollback: ${rollback_note}."
            fi
            # Provenance phase 3 (glidepath ADR-0027): the commit-signature half's v1 evidence as
            # one hidden, machine-readable line - Tower's backend parses it (only from this App's
            # comment) and seals it with the release record. Copied verbatim from the verify
            # TaskRun's signature-detail result; written only on a pass, only when that result is a
            # v1 object, and never with "--" inside (it could close the HTML comment early). A cloud
            # pin PR skips the commit check, so it has no result and gets no line.
            if [[ "${GATE_NAME}" == "provenance" ]]; then
              signature="$(echo "${taskrun_results}" | jq -r '[.items[].status.results[]? | select(.name == "signature-detail")][0].value // empty')"
              signature="$(jq -ce 'select(type == "object" and .v == 1)' <<<"${signature}" 2>/dev/null || true)"
              if [[ -n "${signature}" && "${signature}" != *"--"* ]]; then
                body="${body}"$'\n'"<!-- glidepath:signature ${signature} -->"
              fi
            fi
          fi
        else
          [[ -d "${gate_work}" ]] && echo failure > "${gate_work}/verdict"
          # Same failed-TaskRun + log-excerpt lookup notify-slack.yaml uses - best-effort,
          # naturally empty if no False-conditioned child exists yet.
          failed_taskrun="${hard_failed}"
          log_excerpt=""
          if [[ -n "${failed_taskrun}" ]]; then
            pod_name="$(kubectl get taskrun "${failed_taskrun}" -n "${NAMESPACE}" -o jsonpath='{.status.podName}' 2>/dev/null || true)"
            if [[ -n "${pod_name}" ]]; then
              log_excerpt="$(kubectl logs "${pod_name}" -n "${NAMESPACE}" --all-containers --tail=20 2>/dev/null | tail -c 1200 || true)"
            fi
          fi
          [[ -z "${log_excerpt}" ]] && log_excerpt="(no log excerpt available)"

          # Gate-specific guidance - each check fails for a different reason, so "push a
          # new commit and retest" isn't right for all of them (sast/image-scan need a new
          # build; provenance's two sub-checks need different fixes; sbom is usually transient).
          case "${GATE_NAME}" in
            sast)
              recommendation="This checks the SAST (Semgrep) result already recorded when the image was **built**, not a fresh scan - re-running this check alone can't change the outcome. Fix the findings in your source and push a new commit to trigger a fresh build; once that build's own sast-scan passes, this check will pass against the new image."
              ;;
            image-scan)
              recommendation="This is a live Trivy re-scan of the actual image about to be promoted. Update the vulnerable dependencies and push a new commit to trigger a fresh build+release - re-running this check alone re-scans the same unchanged image."
              ;;
            provenance)
              recommendation="The \`FAIL:\` line above names the check that failed. Signers, the GitHub-merge path and its allowed mergers are the admin-owned release-signing policy (\`releaseSigning\` in the cluster's glidepath-catalog values, docs/admin/commit-signing.md) - a platform admin changes it there, never in cicd.yaml. A commit GitHub's merge button made passes only when that path is on for the app and an allowed person merged it; otherwise land a gitsign-signed commit and release that. If the error instead mentions certificate/attestation verification of the image, see docs/admin/provenance-policy.md and contact platform admins."
              ;;
            sbom)
              recommendation="This usually indicates a transient generation/signing/push error, not a content problem."
              ;;
            qa)
              recommendation="This reads the check ride recorded on the promoted image's own test provenance (docs/admin/testing.md) - it never runs tests itself. The log above says what was missing: no check ride ran for this image, it failed, it was not the shared check-rides repository's \`<app>-check-ride\`, or it is older than the catalog's \`qa.maxAge\`. Run the flow's \`role: check-ride\` test step against this exact image (a new build gets a new digest and needs its own ride), then \`/retest qa-\` - the gate re-reads the registry."
              ;;
            api-compat)
              recommendation="A breaking change in the promoted image's API spec touches an operation observed in use in the target environment (the report below lists them). Either keep the change compatible (keep the operation or field, or ship it alongside the old one) and release a new build, or have an admin or maintainer of the app's repository accept it with a PR comment \`/api-break-ok <reason>\`, then \`/retest api-compat-\`. See Glidepath docs/admin/api-compat.md."
              ;;
            itsm)
              recommendation="The release's change request is not approved or scheduled in the change tool, or no change is linked to this PR (the log above names which). Get the change approved (its link is in the PR description and the log), or, for a PR made by hand, add \`<!-- glidepath:change-request:<id> -->\` to the PR body, then \`/retest itsm-\`. See Glidepath docs/admin/change-management.md."
              ;;
            policy-validation)
              recommendation="The table below lists each violation by environment, policy, rule and resource. A ❌ row is a Deny/Enforce admission policy of the target cluster (read from its GitOps repo, docs/admin/policy-validation.md): Argo CD's sync would be refused, so change the values (or the chart) so the rendered object complies, then push to the release branch or \`/retest policy-validation-\`. If the policy itself is wrong, that is a change to the cluster's GitOps repo by its admins, never an override here. \"could not evaluate\" means the render or the policy read failed (the log above says which): a platform problem, not a verdict."
              ;;
            agent-gates)
              recommendation="This PR was checked against Clearance's record of the PRs its agents opened (docs/admin/agent-gates.md). The \`FAIL\` lines name the rule: **AI*** rules mean the PR is not, or is no longer, exactly what the agent committed (commits added after it, edited or forged trailers, or an agents'-App PR Clearance never opened) - review it as a person's change or close it; **AS*** rules mean a path the agent may not change - revert it, or have a person make that change in their own PR. Re-running this check does not change Clearance's record."
              ;;
            clearance-gate)
              recommendation="Clearance's deployment gate classified this release by what its rendered manifests change (tier 0 nothing a cluster runs, 1 an image bump with green checks, 2 runtime shape, 3 secrets, identity and policy; glidepath docs/admin/clearance-gate.md, Clearance docs/gate.md). **Holding** means a tier-2 or tier-3 change waits for people: one from the app's owner group, and for tier 3 one from the outside group, never the proposer. Someone named clears it in Tower (the report's link), then \`/retest clearance-gate-\`: the same head is found cleared. **Denied** names why: \`DG-PROVENANCE\` is a PR that looks like an agent's with no Clearance record (the agent gates fail it too), \`DG-POLICY\` a \`clearance.yaml\` that tried to loosen the platform baseline (it may only tighten), a person's denial their reason. A new push is a new change."
              ;;
            agent-definitions)
              recommendation="Clearance reviewed each agent definition this PR changes (glidepath docs/admin/agent-definitions.md). A **DF-*** rule names why Clearance would not load the file or why its agent could not use what it lists: DF-SCHEMA (the schema), DF-NAME (the file name and the agent's name), DF-IDENTITY (a workload agent runs as autopilot-runs/<name>), DF-TOOL / DF-TRIPWIRE (an unknown or forbidden tool), DF-CEILING (a tool above the tier ceiling), DF-REPOS (a repo tool with no repos.allow), DF-MODEL (a model this deployment does not route), DF-IMAGE (not from the runtime catalog, or not pinned by digest). The tier in the table is what the release will be cleared by when it merges."
              ;;
            cicd-validate)
              recommendation="The lines above are \`glidepath validate\`'s findings on this PR's cicd.yaml (docs/admin/contract.md, docs/user/cicd-yaml-reference.md): each names the rule, the field and the fix. Run \`tools/glidepath-validate cicd.yaml\` from a Glidepath checkout to see them locally. **GP-SCOPE** rules apply to an agent's PR only: the field is one an agent may not change, or may only tighten - have a person make that change in their own PR."
              ;;
            *)
              recommendation="See the log excerpt above for detail."
              ;;
          esac

          body="$(printf '### ❌ `%s` failed\n\n**What happened:**\n```\n%s\n```\n\n**Recommendation:** %s\n\n**To retry:** comment `/retest %s-` on this PR once the underlying issue is fixed (the check name with its dash: PaC matches the PipelineRun generateName).' \
            "${GATE_NAME}" "${log_excerpt}" "${recommendation}" "${GATE_NAME}")"
        fi

        # A gate whose full report does not fit a Task result (4096 bytes) leaves it in a ConfigMap owned by its
        # PipelineRun, labelled glidepath.io/gate-report=<gate> (api-compat-gate.yaml). It replaces the plain
        # headline, or follows the failure text, so the comment carries the whole finding.
        report="$(kubectl get configmap -n "${NAMESPACE}" -l "glidepath.io/gate-report=${GATE_NAME},tekton.dev/pipelineRun=${PIPELINE_RUN_NAME}" -o json 2>/dev/null \
          | jq -r '.items[0].data.body // empty')"
        if [[ -n "${report}" ]]; then
          if [[ "${body}" == "### ❌"* ]]; then
            body="${body}"$'\n\n'"${report}"
          else
            body="${report}"
          fi
        fi

        # Hidden marker (HTML comment, invisible in rendered markdown) identifying which
        # gate this comment belongs to, so a later run can find and edit it in place.
        marker="<!-- glidepath:gate:${GATE_NAME} -->"
        body="${marker}"$'\n'"${body}"

        # The verdict is recorded above; a gate that comments only on some PRs (agent-gates: agent PRs) stops here.
        if [[ "${POST_COMMENT:-true}" != "true" ]]; then
          echo "${GATE_NAME}: verdict recorded, no PR comment (post-comment=${POST_COMMENT})"
          exit 0
        fi

        # Response captured via $(...), not streamed to stdout - GitHub's create-comment
        # response is a full ~4KB comment object; leaving it uncaptured made this step
        # fail with zero output. Matches this codebase's convention of capturing any large
        # API response (open-release-pr.yaml's pr_response, etc.) rather than streaming it raw.
        #
        # Look for this gate's prior comment on this PR (paginated, 100 is plenty) before
        # deciding whether to PATCH (edit in place) or POST (first report for this gate).
        existing_comment_id="$(curl --fail --silent --show-error --max-time 10 --retry 3 --retry-connrefused \
          -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${owner}/${repo}/issues/${PR_NUMBER}/comments?per_page=100" \
          | jq -r --arg marker "${marker}" \
              '[.[] | select(.body | startswith($marker))][0].id // empty')"

        if [[ -n "${existing_comment_id}" ]]; then
          comment_response="$(curl --fail --silent --show-error --max-time 10 --retry 3 --retry-connrefused \
            -X PATCH -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${owner}/${repo}/issues/comments/${existing_comment_id}" \
            -d "$(jq -n --arg body "${body}" '{body: $body}')")"
          echo "updated existing PR comment: $(jq -r '.html_url' <<<"${comment_response}")"
        else
          comment_response="$(curl --fail --silent --show-error --max-time 10 --retry 3 --retry-connrefused \
            -X POST -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${owner}/${repo}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -n --arg body "${body}" '{body: $body}')")"
          echo "posted new PR comment: $(jq -r '.html_url' <<<"${comment_response}")"

          # Self-heal a real race: since every commit on a release PR is independently
          # re-verified, ANY two check runs for the same gate landing close together
          # (e.g. a `/retest <gate>` racing a webhook redelivery of the original run, or -
          # before 2026-08-31 - open-release-pr.yaml's own two commits, back when it made
          # two) can both read "no existing comment" before either posts - two comments
          # with the same marker. No lock needed: re-list this gate's comments now and
          # collapse to the single earliest (lowest id) survivor. Every racing run
          # converges on the same decision off the same eventually-consistent list;
          # deleting an already-deleted duplicate is expected and tolerated (--fail
          # dropped on purpose here).
          dup_ids="$(curl --silent --show-error --max-time 10 --retry 3 --retry-connrefused \
            -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${owner}/${repo}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r --arg marker "${marker}" '[.[] | select(.body | startswith($marker))] | sort_by(.id) | .[1:][].id' \
            || true)"
          while IFS= read -r dup_id; do
            [[ -z "${dup_id}" ]] && continue
            echo "collapsing duplicate ${GATE_NAME} comment ${dup_id} (race with a concurrent check run)"
            curl --silent --show-error --max-time 10 --retry 3 --retry-connrefused -o /dev/null \
              -X DELETE -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${owner}/${repo}/issues/comments/${dup_id}" || true
          done <<<"${dup_ids}"
        fi
{{- if .Values.promotion.enabled }}
    # ADR-0029 phase 3: the promotion fan-in (header). Never fails the gate: a lost event is recovered by the next
    # gate that finishes (`/retest <gate>-`), and the promote pipeline re-checks every rule itself.
    - name: promotion-ready
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      onError: continue
      volumeMounts:
        - { name: github-token-broker-token, mountPath: /var/run/secrets/platform, readOnly: true }
        - { name: gate-work, mountPath: /workspace/gate }
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: CDEVENTS_BROKER_URL
          value: http://el-cdevents-broker.platform-system.svc.cluster.local:8080
        - { name: REPO_URL, value: $(params.repo-url) }
        - { name: REVISION, value: $(params.revision) }
        - { name: GATE_NAME, value: $(params.gate-name) }
        - { name: PIPELINE_RUN_NAME, value: $(params.pipeline-run-name) }
        - { name: NAMESPACE, value: $(context.taskRun.namespace) }
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        source "${PLATFORM_LIB}/github-app.sh"
        {{- include "glidepath-catalog.advisoryGatesByApp" . | nindent 8 }}
        W="${GATE_WORK:-/workspace/gate}"
        verdict="$(cat "${W}/verdict" 2>/dev/null || true)"
        pr_number="$(cat "${W}/pr" 2>/dev/null || true)"
        [[ -n "${verdict}" && "${pr_number}" =~ ^[0-9]+$ ]] || { echo "no verdict or PR for ${GATE_NAME}: nothing to record"; exit 0; }
        # Tekton (v1.15) measures timeouts.tasks from the run's start to the end of finally, not of the tasks: a run whose
        # tasks all succeeded still ends PipelineRunTimeout, its check run red, when this finally finishes past
        # startTime + timeouts.tasks (sbom-rntvj, gitops-backstage#159, 2026-10-29). Past that deadline a success is
        # recorded as the failure it will be; within a minute of it nothing is recorded or asked (the other gates read this
        # gate's check run instead, and `/retest` asks again). A run that cannot be read is not judged here: promote's
        # PROM-03 reads the check runs.
        if [[ "${verdict}" == success ]]; then
          left="$(kubectl get pipelinerun "${PIPELINE_RUN_NAME}" -n "${NAMESPACE}" -o json 2>/dev/null | jq -r --argjson now "$(date -u +%s)" '
            def secs: [scan("([0-9.]+)(h|ms|m|s)")] | map((.[0] | tonumber) * {"h": 3600, "m": 60, "s": 1, "ms": 0.001}[.[1]]) | add // empty;
            (.spec.timeouts.tasks // .spec.timeouts.pipeline // empty | secs) as $t
            | (.status.startTime // empty | fromdateiso8601) as $s
            | if $t > 0 then ($s + $t - $now | floor) else empty end' 2>/dev/null || true)"
          if [[ "${left}" =~ ^-?[0-9]+$ ]]; then
            if (( left < 0 )); then
              echo "${PIPELINE_RUN_NAME} is past its tasks timeout by $(( -left ))s: Tekton ends it timed out, recorded as a failure"
              verdict=failure
            elif (( left < 60 )); then
              echo "${PIPELINE_RUN_NAME} is ${left}s from its tasks timeout and may end timed out: nothing recorded, no promotion asked (\`/retest ${GATE_NAME}-\` asks again)"
              exit 0
            fi
          fi
        fi
        [[ "${REPO_URL}" =~ ^https://github\.com/([A-Za-z0-9-]+)/gitops-([a-z0-9][a-z0-9-]*)(\.git)?/?$ ]] \
          || { echo "${REPO_URL} is not a gitops-<app> repository: not a release"; exit 0; }
        owner="${BASH_REMATCH[1]}"; app="${BASH_REMATCH[2]}"; repo="gitops-${app}"
        token="$(github_app_installation_token "${owner}" "${repo}")" || { echo "no GitHub token: skipping" >&2; exit 0; }
        gh_() { curl --fail --silent --show-error --max-time 15 --retry 3 --retry-connrefused \
          -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" "$@"; }

        pr="$(gh_ "https://api.github.com/repos/${owner}/${repo}/pulls/${pr_number}")" || exit 0
        head_sha="$(jq -r .head.sha <<<"${pr}")"
        [[ "$(jq -r '.state + " " + (.merged | tostring)' <<<"${pr}")" == "open false" ]] || { echo "#${pr_number} is not open"; exit 0; }
        [[ "$(jq -r .head.ref <<<"${pr}")" == release-* ]] || { echo "#${pr_number} is not a release PR"; exit 0; }
        # A newer commit's gates decide; this run verified an older one.
        [[ -z "${REVISION}" || "${REVISION}" == "${head_sha}" ]] || { echo "${GATE_NAME} ran on ${REVISION:0:7}, the PR is at ${head_sha:0:7}"; exit 0; }
        # Only a Flight environment's release file is promoted (a cloud pin PR keeps its own copy at deploy).
        gh_ "https://api.github.com/repos/${owner}/${repo}/pulls/${pr_number}/files?per_page=100" \
          | jq -e '[.[].filename | select(test("^[^/]+/[^/]+/release\\.yaml$"))] | length > 0' >/dev/null \
          || { echo "#${pr_number} changes no <cluster>/<env>/release.yaml: nothing to promote"; exit 0; }

        # The gate ledger: this gate's verdict for this commit in the release record, written with the record's
        # resourceVersion so two gates finishing together are serialized - the second one sees both verdicts. A
        # gate's check run is still in progress while its finally runs, so the check runs alone would let two
        # simultaneous last gates each wait for the other and nobody would ask.
        key="gate.${head_sha:0:12}.${GATE_NAME}"
        pr_url="$(jq -r .html_url <<<"${pr}")"
        ledger="{}"
        for attempt in 1 2 3 4 5; do
          record="$(kubectl get configmap -n "${NAMESPACE}" -l hangar.io/subcomponent=release-tracking -o json 2>/dev/null \
            | jq -c --arg u "${pr_url}" '[.items[] | select(.data.prUrl == $u)] | .[0] // empty')"
          [[ -n "${record}" ]] || { echo "no release record for ${pr_url}: deciding from the check runs alone"; break; }
          patch="$(jq -nc --arg rv "$(jq -r .metadata.resourceVersion <<<"${record}")" --arg k "${key}" --arg v "${verdict}" \
            '{metadata: {resourceVersion: $rv}, data: {($k): $v}}')"
          if kubectl patch configmap "$(jq -r .metadata.name <<<"${record}")" -n "${NAMESPACE}" --type merge -p "${patch}" >/dev/null; then
            ledger="$(jq -c --arg k "${key}" --arg v "${verdict}" '.data + {($k): $v}' <<<"${record}")"
            break
          fi
          echo "release record changed underneath (attempt ${attempt}); retrying"
          sleep 1
        done
        # A gate advisory for this app (releaseGuardrailOverridesByApp) keeps its red check, but finishing last it must
        # still ask, or a release whose advisory gate happened to finish after the required ones would never promote.
        advisory="$(advisory_gates_for_app "${app}")"
        [[ -z "${advisory}" ]] || echo "advisory for ${app} (catalog releaseGuardrailOverridesByApp), not waited for: ${advisory}"
        [[ "${verdict}" == success ]] || gate_advisory_for_app "${app}" "${GATE_NAME}" \
          || { echo "${GATE_NAME} is not green: no promotion"; exit 0; }

        checks="$(gh_ "https://api.github.com/repos/${owner}/${repo}/commits/${head_sha}/check-runs?per_page=100")" || exit 0
        newest() { jq -r --arg n "Pipelines as Code CI / $1-" \
          '[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then .status else .conclusion end' <<<"${checks}"; }
        waiting=""
        for gate in {{ range (include "glidepath-catalog.guardrails" . | fromJsonArray) }}{{ if and .required (ne .name "image-promotion") }}{{ .name }} {{ end }}{{ end }}; do
          gate_advisory_for_app "${app}" "${gate}" && continue
          if [[ "${gate}" == "${GATE_NAME}" ]]; then c=success
          else c="$(jq -r --arg k "gate.${head_sha:0:12}.${gate}" '.[$k] // empty' <<<"${ledger}")"; [[ -n "${c}" ]] || c="$(newest "${gate}")"
          fi
          [[ "${c}" == success ]] || waiting="${waiting}${waiting:+, }${gate} (${c})"
        done
        [[ -z "${waiting}" ]] || { echo "not every required gate is green on ${head_sha:0:7} yet: ${waiting}"; exit 0; }
        case "$(newest image-promotion)" in
          success) echo "already promoted on ${head_sha:0:7}"; exit 0 ;;
          queued|in_progress) echo "a promotion is already running on ${head_sha:0:7}"; exit 0 ;;
        esac

        # One event id per commit and attempt: two gates that both see the set complete send the same id, and the
        # Trigger names the PipelineRun after it, so only one runs; after a refused or failed promotion the next
        # attempt (a new image-promotion check run) gets a new id.
        attempts="$(jq -r '[.check_runs[] | select(.name == "Pipelines as Code CI / image-promotion-")] | length' <<<"${checks}")"
        id="$(printf '%s' "${owner}/${repo}#${pr_number}@${head_sha}#${attempts}" | sha256sum | cut -c1-20)"
        event="$(jq -nc --arg id "${id}" --arg ns "${NAMESPACE}" --arg pr "${PIPELINE_RUN_NAME}" --arg app "${app}" \
          --arg url "https://github.com/${owner}/${repo}" --arg n "${pr_number}" --arg sha "${head_sha}" --arg g "${GATE_NAME}" \
          --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{context: {version: "0.4.1", id: $id, source: ("/glidepath/" + $ns + "/" + $pr), type: "dev.hangar.release.promotion-ready.0.1.0", timestamp: $ts},
            subject: {id: ($url + "/pull/" + $n), source: ("/glidepath/" + $ns + "/" + $pr), type: "release",
              content: {appName: $app, repoUrl: $url, prNumber: $n, headSha: $sha, lastGate: $g}}}')"
        if curl --fail --silent --show-error --max-time 10 --retry 3 --retry-connrefused -X POST "${CDEVENTS_BROKER_URL}" \
            -H "Authorization: Bearer $(cat /var/run/secrets/platform/broker-token)" -H "Content-Type: application/cloudevents+json" \
            -d "${event}" >/dev/null; then
          echo "every required gate is green on ${head_sha:0:7}: asked for promotion (event ${id})"
        else
          echo "warn: the broker did not take the promotion-ready event; the next gate to finish asks again" >&2
        fi
{{- end }}
