# catalog/tasks/deploy-manifests.yaml
#
# Phase 2: writes the app's own self-service `platform/envs/<env>.yaml` (idp/docs/
# gitops-strategy.md §10) instead of patching a Deployment directly via kubectl. The
# dev environment used to be a bare Deployment this Task owned outright
# (`kubectl set image` + `rollout status`) - that's gone. It's now provisioned by
# airframe's `airframe-application` chart (an Argo `Rollout`, not a Deployment)
# via an ArgoCD Application (in the separate argocd-apps namespace/instance - see
# idp/docs/gitops-strategy.md) that reads `platform/envs/<env>.yaml` straight out of
# the app's own repo as a Helm values file, `automated.selfHeal: true`. A real, live
# gap found running this Task against checkout-api: `kubectl set image deployment/...`
# started failing with "deployments.apps \"checkout-api\" not found" once that old bare
# Deployment was gone - there was never anything wrong with the Task, its whole target
# had stopped existing.
#
# Still deliberately NOT GitOps/PR-gated (see deploy.yaml's own header) - a direct
# commit to the app repo's main branch, no branch, no PR, matching platform/envs/
# dev.yaml's own documented "a developer commits straight here" self-service
# philosophy. This Task is just automating the same commit a developer would make by
# hand. Contrast with catalog/tasks/open-release-pr.yaml, which promotes to an upper
# env via a real PR against a SEPARATE gitops-<app-name> repo - dev has no gitops repo
# involved at all.
#
# Same GitHub App installation-token broker pattern as open-release-pr.yaml/
# deliver-onboarding-files.yaml (catalog/lib/github-app.sh) - a fresh,
# single-repo-scoped token minted per run, nothing this Task holds could reach any repo
# beyond the app's own. Token is scoped to the APP's own repo directly (not a
# gitops-<app-name> repo - dev has none), repo name assumed == app-name, matching the
# NodeJSApplication scaffold's own convention (airframe's
# compositions/nodejsapplication/templates/render-github-resources/src-repo.yaml:
# `repository: <<$xrName>>`).
#
# Waiting for rollout health: polls the Rollout's own `.status.phase` (Healthy/
# Progressing/Degraded - Argo Rollouts' real, documented field, confirmed live against
# checkout-api's own Rollout) via plain `kubectl get`, not the `kubectl-argo-rollouts`
# plugin - not bundled in the toolbox image (catalog/toolbox/Dockerfile only carries
# plain kubectl). Needs its own RBAC now (rollouts.argoproj.io, not apps/deployments) -
# see charts/glidepath-app/templates/env/deploy-rbac.yaml's matching update.
#
# release.image lands in cicd.yaml's deploy.releaseFile path (D9/AF-5,
# release-file-split.md) once an app sets that field - its own machine-owned file,
# `platform/envs/<env>.yaml` left untouched. Unset (every live app today) falls back to
# writing release.image straight into platform/envs/<env>.yaml, exactly as before -
# changing that default would break Ground sync for every app until the
# lower-envs ApplicationSet's own D9 step 3 change (3 valueFiles) lands too.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-manifests
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: image-ref
      type: string
    - name: env
      type: string
      description: >-
        Target environment name, e.g. dev. Maps to namespace <app-type>-<app-name>-<env>
        - a PEER of the app-namespace (<app-type>-<app-name>-cicd) under the platform's
        flat <type>-<app-name>-<env> namespace pattern, not a suffix built on top of it
        (deploy namespaces have nothing to do with "cicd" conceptually - see
        docs/concepts.md).
    - name: app-name
      type: string
    - name: app-type
      type: string
    - name: git-url
      type: string
      description: The app repo's own git-url - this Task commits straight to it, no separate gitops repo. Only its GitHub org/owner is used; the repo name is app-name itself.
  # Audience-bound projected ServiceAccount token for the shared broker's GitHub
  # token-minting endpoint - same pattern as open-release-pr.yaml's identical volume.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
  steps:
    - name: apply-and-wait
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: ENV
          value: $(params.env)
        - name: APP_NAME
          value: $(params.app-name)
        - name: APP_TYPE
          value: $(params.app-type)
        - name: GIT_URL
          value: $(params.git-url)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"
        source "${PLATFORM_LIB}/retry.sh"

        owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        token="$(github_app_installation_token "${owner}" "${APP_NAME}")"

        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${APP_NAME}.git"
        with_retry 3 -- git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"

        image_repo="${IMAGE_REF%:*}"
        image_tag="${IMAGE_REF##*:}"

        # Release-file split (D9/AF-5, ADR-0018): release.image lives in a machine-owned
        # <folder>/envs/<env>.release.yaml beside the human env file, which the lower-envs
        # ApplicationSet layers last. deploy.releaseFile overrides the path; unset means that
        # default (since 2026-10-06; before, unset wrote into the env file itself).
        release_file_template=""
        if [[ -f cicd.yaml ]]; then
          release_file_template="$(yq -r '.deploy.releaseFile // ""' cicd.yaml)"
        fi

        # ADR-0018 dual-path window: the environments folder is glidepath/ once the repo has
        # one, platform/ until then (same rule as deliver-onboarding-files.yaml). The lower-envs
        # ApplicationSet watches both, so an env file in both folders would be two Applications
        # with one name: refuse instead of writing to either.
        envs_root=platform
        [[ -d glidepath ]] && envs_root=glidepath
        if [[ -f "platform/envs/${ENV}.yaml" && -f "glidepath/envs/${ENV}.yaml" ]]; then
          echo "error: ${ENV} has a values file in both platform/envs/ and glidepath/envs/ - finish the platform/ -> glidepath/ move (delete the platform/ copy) before deploying" >&2
          exit 1
        fi
        # A releaseFile still naming platform/ after the move would recreate platform/ beside
        # glidepath/; the ApplicationSet reads the release file from the env file's own folder.
        if [[ "${envs_root}" == "glidepath" && "${release_file_template}" == platform/* ]]; then
          echo "warn: deploy.releaseFile '${release_file_template}' still names platform/ but this repo uses glidepath/ - writing under glidepath/ instead; update cicd.yaml" >&2
          release_file_template="glidepath/${release_file_template#platform/}"
        fi

        default_release_file="${envs_root}/envs/${ENV}.release.yaml"
        if [[ -z "${release_file_template}" ]]; then
          manifest="${default_release_file}"
        else
          manifest="${release_file_template//\{env\}/${ENV}}"
        fi
        # The lower-envs ApplicationSet layers only <folder>/envs/<env>.release.yaml over the env
        # file. A release file anywhere else would be a deploy that changes nothing.
        if [[ "${manifest}" != "${default_release_file}" ]]; then
          echo "error: deploy.releaseFile writes ${manifest}, but ${ENV} deploys from ${default_release_file} (the lower-envs ApplicationSet reads only that path) - set deploy.releaseFile to '${envs_root}/envs/{env}.release.yaml' or remove it" >&2
          exit 1
        fi
        mkdir -p "$(dirname "${manifest}")"
        [[ -f "${manifest}" ]] || printf '# machine-owned: written by deploy-manifests.yaml (D9/AF-5) - do not hand-edit\n' > "${manifest}"
        yq -i -e "
          .release.image.repository = \"${image_repo}\" |
          .release.image.tag = \"${image_tag}\"
        " "${manifest}"
        git add "${manifest}"

        # Moving an app onto the split: the env file may still carry the image an earlier deploy
        # wrote there (release.image, or the deprecated rollout.image) and a bootstrap
        # "rollout: null" (null means "no workload" to the chart, and the release file sets no
        # rollout to override it). Drop exactly those, once, in this same commit.
        env_file="${envs_root}/envs/${ENV}.yaml"
        # Checked first so yq never rewrites (and re-formats) a human file that has none of them.
        if [[ -f "${env_file}" && "$(yq '(.release.image != null) or (.rollout.image != null) or (has("rollout") and .rollout == null)' "${env_file}")" == "true" ]]; then
          yq -i '
            del(.release.image) | del(.release | select(length == 0)) |
            del(.rollout.image) | del(.rollout | select(. == null))
          ' "${env_file}"
          echo "moved the image out of ${env_file} into ${manifest}"
          git add "${env_file}"
        fi

        git config user.name "glidepath deploy automation"
        git config user.email "deploy@glidepath.invalid"
        git commit --quiet -m "Deploy ${APP_NAME} to ${ENV}: ${IMAGE_REF}"
        with_retry 3 -- git push --quiet "${clone_url}" main

        NAMESPACE="${APP_TYPE}-${APP_NAME}-${ENV}"
        echo "pushed ${manifest} - waiting for argocd-apps' ${APP_NAME}-${ENV} Application to sync and the Rollout to become Healthy"

        # Wait for THIS image, not just any Healthy Rollout: the previous release is already Healthy,
        # so a phase-only check passed one second after the push, before Argo CD (which polls the
        # repo every ~3 minutes) had even seen the commit (sky-marshall, 2026-10-07). Degraded only
        # counts once the Rollout carries this image; the deadline covers a poll plus the rollout.
        deadline=$((SECONDS + 600))
        while true; do
          rollout_json="$(kubectl -n "${NAMESPACE}" get rollout "${APP_NAME}" -o json 2>/dev/null || echo '{}')"
          phase="$(jq -r '.status.phase // ""' <<<"${rollout_json}")"
          has_image="$(jq -r --arg img "${IMAGE_REF}" '[.spec.template.spec.containers[]?.image] | index($img) != null' <<<"${rollout_json}")"
          echo "rollout phase: ${phase:-<not found yet>}, running ${IMAGE_REF}: ${has_image}"
          if [[ "${has_image}" == "true" && "${phase}" == "Healthy" ]]; then
            break
          fi
          if [[ "${has_image}" == "true" && "${phase}" == "Degraded" ]]; then
            echo "error: rollout ${APP_NAME} in ${NAMESPACE} is Degraded on ${IMAGE_REF}" >&2
            exit 1
          fi
          if (( SECONDS >= deadline )); then
            echo "error: timed out waiting for rollout ${APP_NAME} in ${NAMESPACE} to run ${IMAGE_REF} Healthy (last phase: ${phase:-<not found>}, image applied: ${has_image})" >&2
            exit 1
          fi
          sleep 5
        done
