# catalog/tasks/build-image.yaml
#
# Resolves the Containerfile path + image tag, then builds and pushes a multi-arch
# (linux/arm64 and/or linux/amd64) image with rootless BuildKit. "Containerfile" (not
# "Dockerfile") is this platform's deliberate, vendor-neutral term for the same file -
# renamed from build.dockerfile 2026-09-22, see schemas/cicd.schema.json. The
# architectural expectation for app repos is that build.sh (catalog/tasks/
# build-source.yaml) does the actual build and the Containerfile is a thin packaging
# step that copies already-built artifacts - see nodejs-demo-app's build.sh/Containerfile
# for the reference shape. Teams doing the whole build inside a multi-stage Containerfile
# instead skip build-source entirely; this Task builds whatever Containerfile it's given
# either way.
#
# BuildKit replaced kaniko on 2026-10-17 (ADR-0026, superseding ADR-0010): kaniko was
# archived upstream in June 2025 (v1.24.0 was the last release), and it ignored per-stage
# `FROM --platform=$BUILDPLATFORM`, so every RUN step of the amd64 image ran under QEMU on
# kiac-dev's arm64 node - Go compilers crashed there (known-gaps #37) and in-Containerfile
# Java/Node builds ran several times slower. BuildKit honors $BUILDPLATFORM, so a
# Containerfile that compiles in a `FROM --platform=$BUILDPLATFORM` stage and
# cross-compiles to $TARGETARCH never emulates the compiler - only RUN steps in
# target-platform stages still go through the binfmt handlers 00-bootstrap/binfmt/
# registers (gitops-cluster-dev). Measured in the Phase 0 spike: a Go scaffold-shaped
# build for both platforms, push included, in 37s, where the kaniko amd64 step crashed in
# `lfstack.push` on the same Containerfile. A Containerfile that compiles in a
# target-platform stage (the old GoApplication scaffold) still emulates and still hits
# #37 - BuildKit does not fix that by itself; the Containerfile has to opt in.
#
# One buildctl invocation builds every requested platform (in parallel) and pushes the
# real OCI image index - no per-arch tags, no crane step. One platform requested pushes a
# plain single-platform manifest under the real tag, same as the old crane-cp case.
# buildctl adds no attestation manifests unless asked (unlike `docker buildx`), so the
# index holds only the platform images and Chains/Conforma see the same IMAGE_URL/
# IMAGE_DIGEST shape as before.
#
# Layer cache: an OCI cache manifest in a separate package per app,
# <image-repo>-buildcache:latest (mode=max, so intermediate build stages are cached too).
# A separate package rather than a tag on the app's own package keeps the cache out of
# Tower's Images tab and image prune, which list every tagged version of the app package.
# The first build of an app logs "failed to configure registry cache importer ... not
# found" and carries on - that's the expected cold-cache path, not a failure.
#
# Privilege model (docs/admin/rootless-builds.md): the BuildKit step runs as UID 1000 via
# rootlesskit, no privileged container, no capabilities added, no host mounts. It sets no
# seccomp or AppArmor profile, so the pod passes Pod Security "baseline" - the explicit
# `Unconfined` profiles BuildKit's own docs (and the Tekton catalog buildkit Task) use are
# rejected by baseline. Not "restricted": rootlesskit has to create a user namespace,
# which RuntimeDefault seccomp and allowPrivilegeEscalation=false both block (tried live,
# with and without hostUsers: false). This relies on the kubelet's seccompDefault being
# off (it is on kiac-dev); a cluster that turns it on needs a Localhost seccomp profile for
# this step.
#
# Config resolution below is plain bash with no span wrapping - it's sub-second work,
# and otel-cli's per-invocation overhead isn't worth it for that (see docs/tracing.md).
# The stage-level span covering this whole Task's duration is started/sent by the
# Pipeline via otel-stage-span-start/otel-span-send, not per-step here.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Resolves the Containerfile path + image tag, then builds+pushes a multi-arch (arm64+amd64) image with rootless BuildKit.
  workspaces:
    - name: source
  params:
    - name: config-json
      type: string
      description: Output of validate-cicd-config's config-json result.
    - name: image-repo
      type: string
      description: Destination registry/repo, e.g. ghcr.io/<org>/<app>.
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag from PaC (e.g., refs/tags/v1.2.3). Used to extract version for image tag. Empty for branch-based triggers."
    - name: git-url
      type: string
      default: ""
      description: "App repo URL, already threaded through build.yaml's own git-url param - only consumed here for the org.opencontainers.image.source label below. Defaulted (not required) so this Task doesn't newly reject a hand-built TaskRun that omits it; an empty source label is harmless."
    - name: pr-tag-only
      type: string
      default: "false"
      description: "\"true\" tags the image as <12-char-sha> alone, skipping the <version>-<short-sha> scheme below entirely. Set by deliver-onboarding-files.yaml for pull_request-triggered flows only - a PR's package.json version isn't something ArgoCD's pullRequest generator can read at manifest-generation time (glidepath-app's ephemeral-envs.yaml computes this exact image reference independently, from .head_sha alone, to know what to deploy), so PR images need a tag ephemeral-envs.yaml can predict without it."
    - name: flow-traceparent
      type: string
      description: Root traceparent for the whole flow (from start-flow-root-span) - gives the build-duration span its trace id. See emit-image-ref-and-span's own span-emission comment for why this Task can't wrap the build directly.
    - name: stage-span-id
      type: string
      description: The current stage's own span id (from start-stage-span) - the build-duration span is parented to it.
  results:
    - name: image-digest
    - name: image-ref
    - name: version
      description: "Task-level copy of resolve-build-config's own version step-result - exists so a downstream Task (e.g. build-artifact.yaml, publishing a wheel/binary from the same build) can reference $(tasks.build-image.results.version) directly instead of re-deriving VERSION itself and risking drift from the image tag."
    - name: image-repo
      description: Bare repo name, no tag - only exists so build.yaml's Pipeline-level IMAGE_URL result (Tekton Chains' type-hinting convention, see docs/image-signing.md) has a task-result expression to reference; Tekton's admission webhook rejects a Pipeline result whose value is a plain $(params.*) reference, it must be $(tasks.*.results.*).
    - name: IMAGE_URL
      description: Same value as image-repo, duplicated under Conforma's exact-cased Task-level type-hint name - policy/release/lib/tekton/task_results.rego's build_tasks() looks for a task with results *ending in* "IMAGE_URL"/"IMAGE_DIGEST", independent of and unrelated to Chains' own artifacts.taskrun.storage signing/storage config (confirmed live before adding this - it only reads predicate.buildConfig.tasks[].results, which Chains already populates for every task regardless of storage settings). See docs/provenance-policy.md.
    - name: IMAGE_DIGEST
      description: Same value as image-digest, duplicated under Conforma's exact-cased Task-level type-hint name - see IMAGE_URL above.
  # Registry push credentials for BuildKit. A `kubernetes.io/dockerconfigjson` Secret
  # named registry-credentials must exist in the Application's own namespace (not -dev) -
  # see docs/onboarding.md. Mounted at the rootless image's $HOME/.docker, which
  # DOCKER_CONFIG points at.
  volumes:
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: resolve-build-config
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      results:
        - name: containerfile-path
        - name: image-ref
        - name: version
          description: "Resolved VERSION alone (no -<sha> suffix) - exists so build-and-push can set org.opencontainers.image.version without re-parsing it back out of image-ref."
        - name: platforms
          description: "BuildKit platform list from cicd.yaml's build.platforms, e.g. \"linux/arm64,linux/amd64\" (default: both)."
        - name: span-start-time
          description: Stamped immediately before BuildKit starts - see emit-image-ref-and-span's span-emission comment for why the actual span is sent from there instead of here.
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CFG='$(params.config-json)'
        # build.dockerfile renamed build.containerfile 2026-09-22 (schemas/
        # cicd.schema.json - "Containerfile" is this platform's deliberate,
        # vendor-neutral term for the same file). The `// "./Containerfile"`
        # here is defense-in-depth, not the only guard: validate-cicd-config
        # now applies every schema default (including this one) onto
        # config-json centrally before any Task sees it - see that Task's own
        # comment for the real bug this used to be (a missing key handed
        # the builder a literal ".../null" path) before that central fix existed.
        CONTAINERFILE_PATH="$(jq -r '.build.containerfile // "./Containerfile"' <<< "${CFG}")"
        SHORT_SHA="$(cut -c1-7 <<< "$(params.git-revision)")"
        SRC="$(workspaces.source.path)"

        # Version selection: a tag push is authoritative - use it directly, same as the
        # old cd-pipelines platform's task-get-tag.yaml. Any other trigger derives the
        # version from the app repo's own manifest instead of a fixed placeholder, so
        # dev/main-branch images carry a real, traceable version rather than always
        # "0.0.0" - same manifest lookup + precedence order (package.json before
        # pom.xml) as that same prior Task.
        GIT_TAG='$(params.git-tag)'
        if [[ -n "${GIT_TAG}" ]]; then
          # PaC provides refs/tags/v1.2.3 or refs/tags/v1.2.3-rc.1
          # Extract: 1.2.3 or 1.2.3-rc.1 (remove refs/tags/ and leading 'v' if present)
          VERSION=$(echo "${GIT_TAG}" | sed -E 's|^refs/tags/v?||')
        elif [[ -f "${SRC}/package.json" ]]; then
          VERSION="$(jq -r '.version' "${SRC}/package.json")"
        elif [[ -f "${SRC}/pom.xml" ]]; then
          VERSION="$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"]/text()' "${SRC}/pom.xml" 2>/dev/null || true)"
          # Maven's CI-friendly-versions pattern (<version>${revision}</version>, the
          # real value under <properties><revision>) - same fallback task-get-tag.yaml
          # used, since a literal "${revision}" string is not a usable image tag.
          if [[ "${VERSION}" == '${revision}' ]]; then
            VERSION="$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="properties"]/*[local-name()="revision"]/text()' "${SRC}/pom.xml" 2>/dev/null || true)"
          fi
          VERSION="${VERSION%%-*}"
        elif [[ -f "${SRC}/pyproject.toml" ]]; then
          # A Python app had no manifest this precedence chain read at all - every image
          # came out "0.0.0-<sha>" regardless of what pyproject.toml actually declared
          # (found live on baggage-api/boarding-api/flight-api - known-gap #1). yq (already
          # in the toolbox, v4.44.3) reads TOML natively via -p toml; "null" is yq's own
          # string for a genuinely absent key (not the possibly-templated `${revision}`
          # placeholder pom.xml's block guards against - PEP 621's [project.version] is a
          # plain literal, no dynamic-version convention to special-case here).
          VERSION="$(yq -p toml -r '.project.version // ""' "${SRC}/pyproject.toml" 2>/dev/null || true)"
        elif [[ -f "${SRC}/VERSION" ]]; then
          # Generic escape hatch for a repo using none of the three manifests above -
          # a single line, no key to extract, just trim whitespace/newline.
          VERSION="$(tr -d '[:space:]' < "${SRC}/VERSION")"
        fi
        [[ -z "${VERSION:-}" ]] && VERSION="0.0.0"

        if [[ "$(params.pr-tag-only)" == "true" ]]; then
          # 12-char sha, matching glidepath-app's ephemeral-envs.yaml, which
          # computes this same image reference independently via ArgoCD's own template
          # (trunc-12'd .head_sha - see that file's own comment).
          IMAGE_REF="$(params.image-repo):$(cut -c1-12 <<< "$(params.git-revision)")"
        else
          IMAGE_REF="$(params.image-repo):${VERSION}-${SHORT_SHA}"
        fi
        # Defaults to both platforms when build.platforms is omitted entirely, matching
        # schemas/cicd.schema.json's own default - jq's `// ["arm64","amd64"]` only kicks
        # in when the key is absent/null, so an app that sets platforms: [amd64] gets
        # exactly that. Sorted and de-duplicated so the order is stable in logs.
        PLATFORMS="$(jq -r '(.build.platforms // ["arm64","amd64"]) | unique | map("linux/" + .) | join(",")' <<< "${CFG}")"
        if [[ -z "${PLATFORMS}" ]]; then
          echo "error: build.platforms resolved to an empty set - schema's minItems:1 should have caught this at validate-cicd-config. Refusing to publish nothing." >&2
          exit 1
        fi

        printf '%s' "${CONTAINERFILE_PATH}" > "$(step.results.containerfile-path.path)"
        echo "containerfile-path=${CONTAINERFILE_PATH}"
        printf '%s' "${IMAGE_REF}" > "$(step.results.image-ref.path)"
        echo "image-ref=${IMAGE_REF}"
        printf '%s' "${VERSION}" > "$(step.results.version.path)"
        echo "version=${VERSION}"
        printf '%s' "${PLATFORMS}" > "$(step.results.platforms.path)"
        echo "platforms=${PLATFORMS}"
        # -n here matters, unlike the two lines above it's not just style: this result is
        # read back by emit-image-ref-and-span via a cross-step env var substitution, not a
        # `cat`-based one - command substitution strips a trailing newline automatically,
        # a raw env var substitution doesn't. A bare `date | tee` here left one in, which
        # otel-cli's --start flag received literally - a real bug, found live: the span
        # silently never reached Tempo (no error, no exit-nonzero, just absent).
        _r="$(date -u +"%Y-%m-%dT%H:%M:%S.%NZ")"
        printf '%s' "${_r}" > "$(step.results.span-start-time.path)"
        echo "span-start-time=${_r}"

    - name: build-and-push
      # Pinned by digest (multi-arch index) - same reasoning as every other version pin
      # here. -rootless is the variant that runs as UID 1000 under rootlesskit; see this
      # file's header for the privilege model.
      image: moby/buildkit:v0.33.1-rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
      # Requests only, no limits (2026-10-09): see docs/admin/pipeline-performance.md "Step
      # resources". Double the old per-arch kaniko step's request: one step now builds both
      # platforms in parallel.
      computeResources:
        requests: { cpu: 500m, memory: 512Mi }
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      # No SSL_CERT_FILE override (kaniko needed one): this image is Alpine-based with a
      # real /etc/ssl/certs, which is on the SSL_CERT_DIR list Tekton injects - confirmed
      # live in the Phase 0 spike.
      #
      # Cross-step results as env vars, not inline $(steps.*.results.*) in the script:
      # Tekton's admission webhook only allows stepResult substitutions in env, command and
      # args. $(workspaces.source.path) is a different substitution class and stays inline.
      env:
        # Runs the build processes without a separate PID-namespace sandbox - required
        # when buildkitd itself runs inside an unprivileged container (BuildKit's own
        # rootless-on-Kubernetes guidance).
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox
        - name: DOCKER_CONFIG
          value: /home/user/.docker
        - name: CONTAINERFILE_PATH
          value: $(steps.resolve-build-config.results.containerfile-path)
        - name: IMAGE_REF
          value: $(steps.resolve-build-config.results.image-ref)
        - name: PLATFORMS
          value: $(steps.resolve-build-config.results.platforms)
        - name: CACHE_REF
          value: $(params.image-repo)-buildcache:latest
        # OCI annotations (known-gaps #23): labels apply regardless of what the app's own
        # Containerfile declares, so this needs no opt-in from app teams. See
        # docs/provenance-policy.md/docs/image-signing.md for how Chains' attestations
        # relate to these (complementary: Chains proves what built it, these labels are
        # the image's own inspectable self-description).
        - name: OCI_VERSION
          value: $(steps.resolve-build-config.results.version)
        - name: OCI_REVISION
          value: $(params.git-revision)
        - name: OCI_SOURCE
          value: $(params.git-url)
        - name: OCI_CREATED
          value: $(steps.resolve-build-config.results.span-start-time)
      volumeMounts:
        - name: registry-credentials
          mountPath: /home/user/.docker
          readOnly: true
      # HANGAR_VERSION/HANGAR_GIT_REVISION build-args (known-gaps #24: Go apps have no
      # version-injection path) only take effect for a Containerfile that declares a
      # matching `ARG`, so they're a no-op for every app that doesn't. Generic, not
      # Go-specific - see docs/user/cicd-yaml-reference.md.
      #
      # --dockerfile and --context are both the source workspace root; filename is the
      # Containerfile's path relative to it (validate-cicd-config has already normalized
      # build.containerfile, default ./Containerfile).
      script: |
        #!/bin/sh
        set -eu
        SRC="$(workspaces.source.path)"
        echo "platforms=${PLATFORMS}"
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context="${SRC}" \
          --local dockerfile="${SRC}" \
          --opt filename="${CONTAINERFILE_PATH}" \
          --opt platform="${PLATFORMS}" \
          --opt label:org.opencontainers.image.version="${OCI_VERSION}" \
          --opt label:org.opencontainers.image.revision="${OCI_REVISION}" \
          --opt label:org.opencontainers.image.source="${OCI_SOURCE}" \
          --opt label:org.opencontainers.image.created="${OCI_CREATED}" \
          --opt build-arg:HANGAR_VERSION="${OCI_VERSION}" \
          --opt build-arg:HANGAR_GIT_REVISION="${OCI_REVISION}" \
          --import-cache type=registry,ref="${CACHE_REF}" \
          --export-cache type=registry,ref="${CACHE_REF}",mode=max,oci-mediatypes=true,image-manifest=true \
          --output type=image,name="${IMAGE_REF}",push=true,oci-mediatypes=true \
          --metadata-file /tmp/build-metadata.json
        # The pushed image's digest (the index digest for a multi-platform build). The
        # image has no jq; the metadata file is flat JSON with one containerimage.digest.
        DIGEST="$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' /tmp/build-metadata.json | head -n1)"
        if [ -z "${DIGEST}" ]; then
          echo "error: buildctl pushed but wrote no containerimage.digest to its metadata file" >&2
          cat /tmp/build-metadata.json >&2
          exit 1
        fi
        printf '%s' "${DIGEST}" > "$(results.image-digest.path)"
        echo "image-digest=${DIGEST}"

    # Sends the span covering the whole build-image duration - not from within the
    # build-and-push step itself, since the BuildKit image has no otel-cli. Using this
    # step's own start (immediately after build-and-push exits) as the span's end time is
    # an approximation, not BuildKit's exact internal finish instant - close enough for
    # real diagnostic purposes, and there's no cheaper way to get closer without adding
    # otel-cli to that image. Only reached if every prior step succeeded (a
    # failure halts the TaskRun before this step runs) - same honest, documented gap as
    # build-source.yaml/run-tests.yaml's own emit-span steps.
    - name: emit-image-ref-and-span
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: IMAGE_REF
          value: $(steps.resolve-build-config.results.image-ref)
        - name: IMAGE_REPO
          value: $(params.image-repo)
        - name: VERSION
          value: $(steps.resolve-build-config.results.version)
        - name: SPAN_START
          value: $(steps.resolve-build-config.results.span-start-time)
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/otel.sh"
        printf '%s' "${IMAGE_REF}" > "$(results.image-ref.path)"
        echo "image-ref=${IMAGE_REF}"
        printf '%s' "${IMAGE_REPO}" > "$(results.image-repo.path)"
        echo "image-repo=${IMAGE_REPO}"
        printf '%s' "${VERSION}" > "$(results.version.path)"
        echo "version=${VERSION}"
        printf '%s' "${IMAGE_REPO}" > "$(results.IMAGE_URL.path)"
        echo "IMAGE_URL=${IMAGE_REPO}"
        # image-digest is a TASK-level result (build-and-push writes it from BuildKit's
        # metadata file), not a step-level one - a cross-step "steps dot results dot name" env
        # var reference only
        # applies to step-scoped results and silently resolves to the literal unresolved
        # placeholder string for a task-level one (confirmed live, a real bug on the first
        # attempt - and note: writing that exact syntax even inside a comment here trips
        # Tekton's admission webhook, since its variable substitution is a plain string
        # match with no awareness of bash comments - confirmed live the hard way). A
        # results-dot-name-dot-path reference inline in script is ALSO rejected once the
        # result belongs to an earlier step. Task-level result files live at the
        # well-documented, stable /tekton/results/<name> path regardless of which step
        # wrote them, so read it directly rather than fighting either restriction.
        cat /tekton/results/image-digest | tee "$(results.IMAGE_DIGEST.path)"
        otel_task_span_send "build-image" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" \
          "${SPAN_START}" "$(date -u +"%Y-%m-%dT%H:%M:%S.%NZ")" "Succeeded"
