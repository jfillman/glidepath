# catalog/tasks/build-image.yaml
#
# Resolves the Containerfile path + image tag, then builds+pushes a real multi-arch
# (linux/arm64 + linux/amd64) image with kaniko + crane. "Containerfile" (not
# "Dockerfile") is this platform's deliberate, vendor-neutral term for the same
# file - renamed from build.dockerfile 2026-09-22, see schemas/cicd.schema.json.
# The architectural expectation for app repos is that build.sh (catalog/tasks/
# build-source.yaml, a separate Task as of Phase 3 item 8.1) does the actual build (npm
# ci, compiling, whatever the language needs) and the Containerfile becomes a thin
# packaging step that copies already-built artifacts rather than re-running the build
# itself - see nodejs-demo-app's build.sh/Containerfile for the reference shape. Teams
# doing the whole build inside a multi-stage Containerfile instead (no separate
# build.sh) skip build-source entirely (see that file's own header) - this Task doesn't
# need to know which case it is, kaniko just builds whatever Containerfile it's given
# either way.
#
# The actual image-build steps still run on kaniko - a deliberate, narrow exception to
# "pipeline step code is bash": kaniko's image has no shell by design (that's what makes
# rootless builds work under Pod Security "restricted" - see docs/rootless-builds.md).
# This mirrors a precedent already in the platform's own lineage: the old system's
# git-clone Task likewise used a purpose-built compiled binary rather than bash, for the
# same class of reason. Every OTHER step here, and in every other catalog Task, is bash.
#
# Multi-arch, per-app configurable (2026-09-22): builds linux/arm64 (kiac-dev, native)
# and/or linux/amd64 (kind-prod, cross-built via kaniko's --custom-platform under QEMU
# emulation - see 00-bootstrap/binfmt/ in gitops-cluster-dev, a DaemonSet that registers
# binfmt_misc handlers on kiac-dev's node; without it the amd64 build step below fails
# outright with "exec format error", confirmed live before that DaemonSet existed),
# per cicd.yaml's build.platforms (schemas/cicd.schema.json, defaults to both). Original
# design (same day) built both unconditionally for every app; revised same day after
# realizing that's real wasted work for an app like backstage that only ever deploys to
# one cluster (kind-prod) and never the other - see gitops-cluster-kind-prod/60-backstage/
# backstage/deployment.yaml's own image-tag history for the incident this solves.
#
# Known issue: a Go app's amd64 leg can crash go build itself under this QEMU
# emulation with "runtime: lfstack.push invalid packing" / "fatal error:
# lfstack.push" - a real, upstream QEMU bug (bisected to commit 2d708164e0,
# "linux-user: Define TASK_UNMAPPED_BASE in $guest/target_mman.h", still present
# in the qemu-v10.2.3 tonistiigi/binfmt image 00-bootstrap/binfmt/ installs as of
# 2026-09-22) that hands Go's GC addresses its lock-free stack can't pack
# correctly. Confirmed live on boarding-api (arm64 leg built the identical source
# fine, natively; amd64 crashed here). golang/go#69255 tracks a real fix for Go
# 1.26; until then, this Task can't fix it - kaniko doesn't propagate its own
# process environment into RUN steps (confirmed against kaniko's own behavior),
# so there's no platform-side env var that reaches the crash. The workaround
# (`ENV GODEBUG=asyncpreemptoff=1` before the build's RUN step, disabling the
# async-preemption signal machinery most of these QEMU-emulation GC crashes
# trace back to) has to go in the affected app's own Containerfile - see
# boarding-api's for a real example.
#
# kaniko itself has no multi-arch/manifest-list capability (it only ever produces one
# single-platform image per invocation, no equivalent of `docker buildx build --platform
# a,b` or a manifest-push command) - so this Task runs kaniko once per requested arch,
# each pushing to its own throwaway `-arm64`/`-amd64`-suffixed tag, then uses crane
# (google/go-containerregistry) to either combine both into a real OCI image index (both
# platforms requested) or just retag the single build under the real tag (one platform
# requested) - either way publishing the real, unsuffixed tag every downstream consumer
# already expects. The per-arch `-arm64`/`-amd64` tags stay published after a two-platform
# build (harmless - crane reuses their already-pushed blobs by digest, no extra storage,
# useful for debugging a single arch in isolation) but nothing should deploy against them
# directly.
#
# Tekton has no per-STEP conditional execution (`when:` only gates whole PipelineTasks,
# and splitting this into separate per-arch Tasks would mean multiple possible Task names
# producing build-image's results, which Tekton's $(tasks.X.results.Y) can't reference
# dynamically - "whichever one ran" isn't expressible) - so each kaniko step below gates
# itself internally: a thin `#!/busybox/sh` script checks resolve-build-config's
# build-arm64/build-amd64 results and exits 0 immediately if that platform wasn't
# requested, `exec`ing straight into kaniko (never wrapping/monitoring it) otherwise.
# kaniko's `-debug` image (already used here for the SSL_CERT_FILE fix below) does bundle
# a busybox shell at /busybox/sh, confirmed live - the "kaniko has no shell" framing
# above is about its slim/production image, not this one. This keeps build-image a single
# stable Task name with a fixed result set regardless of which platforms a given app
# requests, at the cost of an unwanted platform's step still starting a container (cheap -
# a few seconds - vs. actually running kaniko, which is what's expensive).
#
# Config resolution below is plain bash with no span wrapping - it's sub-second work,
# and otel-cli's per-invocation overhead isn't worth it for that (see docs/tracing.md).
# The stage-level span covering this whole Task's duration is started/sent by the
# Pipeline via otel-stage-span-start/otel-span-send, not per-step here.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Resolves the Containerfile path + image tag, then builds+pushes a multi-arch (arm64+amd64) image with kaniko + crane.
  workspaces:
    - name: source
  params:
    - name: config-json
      type: string
      description: Output of validate-cicd-config's config-json result.
    - name: image-repo
      type: string
      description: Destination registry/repo, e.g. ghcr.io/<org>/<app>.
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag from PaC (e.g., refs/tags/v1.2.3). Used to extract version for image tag. Empty for branch-based triggers."
    - name: pr-tag-only
      type: string
      default: "false"
      description: "\"true\" tags the image as <12-char-sha> alone, skipping the <version>-<short-sha> scheme below entirely. Set by deliver-onboarding-files.yaml for pull_request-triggered flows only - a PR's package.json version isn't something ArgoCD's pullRequest generator can read at manifest-generation time (glidepath-app's ephemeral-envs.yaml computes this exact image reference independently, from .head_sha alone, to know what to deploy), so PR images need a tag ephemeral-envs.yaml can predict without it."
    - name: flow-traceparent
      type: string
      description: Root traceparent for the whole flow (from start-flow-root-span) - gives the kaniko-duration span its trace id. See emit-image-ref-and-span's own span-emission comment for why this Task can't wrap kaniko directly.
    - name: stage-span-id
      type: string
      description: The current stage's own span id (from start-stage-span) - the kaniko-duration span is parented to it.
  results:
    - name: image-digest
    - name: image-ref
    - name: image-repo
      description: Bare repo name, no tag - only exists so build.yaml's Pipeline-level IMAGE_URL result (Tekton Chains' type-hinting convention, see docs/image-signing.md) has a task-result expression to reference; Tekton's admission webhook rejects a Pipeline result whose value is a plain $(params.*) reference, it must be $(tasks.*.results.*).
    - name: IMAGE_URL
      description: Same value as image-repo, duplicated under Conforma's exact-cased Task-level type-hint name - policy/release/lib/tekton/task_results.rego's build_tasks() looks for a task with results *ending in* "IMAGE_URL"/"IMAGE_DIGEST", independent of and unrelated to Chains' own artifacts.taskrun.storage signing/storage config (confirmed live before adding this - it only reads predicate.buildConfig.tasks[].results, which Chains already populates for every task regardless of storage settings). See docs/provenance-policy.md.
    - name: IMAGE_DIGEST
      description: Same value as image-digest, duplicated under Conforma's exact-cased Task-level type-hint name - see IMAGE_URL above.
  # Registry push credentials for kaniko. A `kubernetes.io/dockerconfigjson` Secret
  # named registry-credentials must exist in the Application's own namespace (not -dev) -
  # see docs/onboarding.md. Mounted at kaniko's default docker-config lookup path so no
  # extra kaniko flag is needed.
  volumes:
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: resolve-build-config
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      results:
        - name: containerfile-path
        - name: image-ref
        - name: build-arm64
          description: "\"true\"/\"false\" - whether cicd.yaml's build.platforms includes arm64 (default: both platforms, so default is \"true\")."
        - name: build-amd64
          description: "\"true\"/\"false\" - same as build-arm64, for amd64."
        - name: span-start-time
          description: Stamped immediately before kaniko starts - see emit-image-ref-and-span's span-emission comment for why the actual span is sent from there instead of here.
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CFG='$(params.config-json)'
        # build.dockerfile renamed build.containerfile 2026-09-22 (schemas/
        # cicd.schema.json - "Containerfile" is this platform's deliberate,
        # vendor-neutral term for the same file). The `// "./Containerfile"`
        # here is defense-in-depth, not the only guard: validate-cicd-config
        # now applies every schema default (including this one) onto
        # config-json centrally before any Task sees it - see that Task's own
        # comment for the real bug this used to be (a missing key handed
        # kaniko a literal ".../null" path) before that central fix existed.
        CONTAINERFILE_PATH="$(jq -r '.build.containerfile // "./Containerfile"' <<< "${CFG}")"
        SHORT_SHA="$(cut -c1-7 <<< "$(params.git-revision)")"
        SRC="$(workspaces.source.path)"

        # Version selection: a tag push is authoritative - use it directly, same as the
        # old cd-pipelines platform's task-get-tag.yaml. Any other trigger derives the
        # version from the app repo's own manifest instead of a fixed placeholder, so
        # dev/main-branch images carry a real, traceable version rather than always
        # "0.0.0" - same manifest lookup + precedence order (package.json before
        # pom.xml) as that same prior Task.
        GIT_TAG='$(params.git-tag)'
        if [[ -n "${GIT_TAG}" ]]; then
          # PaC provides refs/tags/v1.2.3 or refs/tags/v1.2.3-rc.1
          # Extract: 1.2.3 or 1.2.3-rc.1 (remove refs/tags/ and leading 'v' if present)
          VERSION=$(echo "${GIT_TAG}" | sed -E 's|^refs/tags/v?||')
        elif [[ -f "${SRC}/package.json" ]]; then
          VERSION="$(jq -r '.version' "${SRC}/package.json")"
        elif [[ -f "${SRC}/pom.xml" ]]; then
          VERSION="$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"]/text()' "${SRC}/pom.xml" 2>/dev/null || true)"
          # Maven's CI-friendly-versions pattern (<version>${revision}</version>, the
          # real value under <properties><revision>) - same fallback task-get-tag.yaml
          # used, since a literal "${revision}" string is not a usable image tag.
          if [[ "${VERSION}" == '${revision}' ]]; then
            VERSION="$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="properties"]/*[local-name()="revision"]/text()' "${SRC}/pom.xml" 2>/dev/null || true)"
          fi
          VERSION="${VERSION%%-*}"
        fi
        [[ -z "${VERSION:-}" ]] && VERSION="0.0.0"

        if [[ "$(params.pr-tag-only)" == "true" ]]; then
          # 12-char sha, matching glidepath-app's ephemeral-envs.yaml, which
          # computes this same image reference independently via ArgoCD's own template
          # (trunc-12'd .head_sha - see that file's own comment).
          IMAGE_REF="$(params.image-repo):$(cut -c1-12 <<< "$(params.git-revision)")"
        else
          IMAGE_REF="$(params.image-repo):${VERSION}-${SHORT_SHA}"
        fi
        # Defaults to both platforms when build.platforms is omitted entirely, matching
        # schemas/cicd.schema.json's own default - jq's `// ["arm64","amd64"]` only
        # kicks in when the key is absent/null, not when it's an explicit (possibly
        # single-element) array, so an app that sets platforms: [amd64] gets exactly
        # that, not both.
        # `|| true` on each: jq -e exits non-zero for a legitimate "false" match (the
        # platform genuinely isn't requested), which under this script's `set -e` would
        # otherwise abort the whole step - not an error case, so it must not fail the build.
        BUILD_ARM64="false"
        BUILD_AMD64="false"
        jq -e '(.build.platforms // ["arm64","amd64"]) | index("arm64") != null' <<< "${CFG}" >/dev/null && BUILD_ARM64="true" || true
        jq -e '(.build.platforms // ["arm64","amd64"]) | index("amd64") != null' <<< "${CFG}" >/dev/null && BUILD_AMD64="true" || true

        echo -n "${CONTAINERFILE_PATH}" | tee "$(step.results.containerfile-path.path)"
        echo -n "${IMAGE_REF}" | tee "$(step.results.image-ref.path)"
        echo -n "${BUILD_ARM64}" | tee "$(step.results.build-arm64.path)"
        echo -n "${BUILD_AMD64}" | tee "$(step.results.build-amd64.path)"
        # -n here matters, unlike the two lines above it's not just style: this result is
        # read back by emit-image-ref-and-span via a cross-step env var substitution, not a
        # `cat`-based one - command substitution strips a trailing newline automatically,
        # a raw env var substitution doesn't. A bare `date | tee` here left one in, which
        # otel-cli's --start flag received literally - a real bug, found live: the span
        # silently never reached Tempo (no error, no exit-nonzero, just absent).
        echo -n "$(date -u +"%Y-%m-%dT%H:%M:%S.%NZ")" | tee "$(step.results.span-start-time.path)"

    - name: build-and-push-arm64
      # Bumped from v1.23.2-debug 2026-08-16 as a real, independently-worthwhile fix
      # (that image's baked-in ca-certificates.crt was dated 2024-07-08 - over 2 years
      # stale) - but NOT what actually caused the live "x509: certificate signed by
      # unknown authority" failure this session hit pushing to ghcr.io (confirmed by
      # direct test: v1.24.0's own 2025-05-21 bundle hit the byte-identical error).
      # v1.24.0 is the latest kaniko release as of this fix (no newer tag exists) -
      # kept pinned, not "latest", same reasoning as every other version pin here.
      image: gcr.io/kaniko-project/executor:v1.24.0-debug
      # Uses `script:` (not a plain `command:` invocation of the executor binary) only
      # for the thin platform-gate check below - the moment that check passes, `exec`
      # replaces the shell process with kaniko directly, so kaniko still ends up as the
      # step's actual running process, not something wrapped/monitored by bash. See this
      # file's header comment for why per-step conditional skipping needs a shell at all
      # (Tekton has no native per-step `when:`), and why kaniko's `-debug` image (already
      # needed here for the SSL_CERT_FILE fix below) can support one - it bundles a real
      # busybox shell at /busybox/sh, confirmed live, unlike its slim/production image.
      #
      # SSL_CERT_FILE override - the REAL root cause, found live via a direct kubectl
      # exec into a real kaniko pod: Tekton's own entrypoint injects
      # SSL_CERT_DIR=/tekton-custom-certs:/etc/ssl/certs:/etc/pki/tls/certs into every
      # step (its built-in custom-CA-injection mechanism, config-trusted-cabundle -
      # empty/optional here, nobody's populated it). kaniko's own debug image doesn't
      # have ANY of those paths - confirmed live, `/etc/ssl/certs` doesn't exist at all
      # in this image. Its real bundle lives at the non-standard
      # /kaniko/ssl/certs/ca-certificates.crt, which Tekton's injected SSL_CERT_DIR
      # never points at - so Go's x509 verifier finds zero trusted CAs and every TLS
      # connection fails, regardless of kaniko version. Confirmed live: setting
      # SSL_CERT_FILE here (which Go checks in addition to SSL_CERT_DIR, and which
      # takes precedence for the single-file case) turned the TLS error into a
      # completely different, expected registry-auth error - proving this was the
      # actual, complete fix, not a partial one.
      env:
        - name: SSL_CERT_FILE
          value: /kaniko/ssl/certs/ca-certificates.crt
        # BUILD_ARM64/CONTAINERFILE_PATH/IMAGE_REF as env vars, not inline $(steps.*.results.*)
        # in the script body below - Tekton's admission webhook rejects cross-step result
        # substitutions anywhere except env/command/args ("stepResult substitutions are
        # only allowed in env, command and args"), a real error hit live the first time
        # this Task actually ran as a TaskRun (not caught by this session's earlier
        # testing, which exercised the same shell logic in hand-written raw Pods that
        # never went through Tekton's admission webhook at all). $(workspaces.source.path)
        # below is a different substitution class (workspace, not stepResult) and stays
        # inline - confirmed by this same error only naming the script fields, not
        # rejecting the whole Task outright.
        - name: BUILD_ARM64
          value: $(steps.resolve-build-config.results.build-arm64)
        - name: CONTAINERFILE_PATH
          value: $(steps.resolve-build-config.results.containerfile-path)
        - name: IMAGE_REF
          value: $(steps.resolve-build-config.results.image-ref)
      volumeMounts:
        - name: registry-credentials
          mountPath: /kaniko/.docker
          readOnly: true
      script: |
        #!/busybox/sh
        set -eu
        if [ "${BUILD_ARM64}" != "true" ]; then
          echo "arm64 not in this app's cicd.yaml build.platforms - skipping"
          exit 0
        fi
        exec /kaniko/executor \
          --dockerfile=$(workspaces.source.path)/${CONTAINERFILE_PATH} \
          --context=$(workspaces.source.path) \
          --destination=${IMAGE_REF}-arm64 \
          --custom-platform=linux/arm64 \
          --cache=true \
          --cache-ttl=336h

    - name: build-and-push-amd64
      # Same image/flags as build-and-push-arm64 above (see that step's comments for
      # the kaniko version pin and SSL_CERT_FILE fix, both apply identically here) -
      # only --custom-platform and --destination differ. Runs on kiac-dev's arm64 node
      # same as the arm64 leg, but under QEMU emulation via the binfmt_misc handlers
      # 00-bootstrap/binfmt/ registers on that node (gitops-cluster-dev) - without that
      # DaemonSet this step fails immediately with "exec format error" on the first RUN
      # instruction that isn't a pure data copy. --custom-platform is kaniko's real flag
      # name (--customPlatform is accepted but logs a deprecation warning - confirmed
      # live testing this).
      image: gcr.io/kaniko-project/executor:v1.24.0-debug
      env:
        - name: SSL_CERT_FILE
          value: /kaniko/ssl/certs/ca-certificates.crt
        # See build-and-push-arm64's own comment on why these are env vars, not inline
        # $(steps.*.results.*) in the script body.
        - name: BUILD_AMD64
          value: $(steps.resolve-build-config.results.build-amd64)
        - name: CONTAINERFILE_PATH
          value: $(steps.resolve-build-config.results.containerfile-path)
        - name: IMAGE_REF
          value: $(steps.resolve-build-config.results.image-ref)
      volumeMounts:
        - name: registry-credentials
          mountPath: /kaniko/.docker
          readOnly: true
      script: |
        #!/busybox/sh
        set -eu
        if [ "${BUILD_AMD64}" != "true" ]; then
          echo "amd64 not in this app's cicd.yaml build.platforms - skipping"
          exit 0
        fi
        exec /kaniko/executor \
          --dockerfile=$(workspaces.source.path)/${CONTAINERFILE_PATH} \
          --context=$(workspaces.source.path) \
          --destination=${IMAGE_REF}-amd64 \
          --custom-platform=linux/amd64 \
          --cache=true \
          --cache-ttl=336h

    - name: publish-multiarch-manifest
      # Combines whichever single-arch image(s) got pushed above into the real,
      # unsuffixed tag every downstream consumer expects - kaniko itself has no
      # manifest-list/multi-arch capability (see this file's header comment), so this is
      # a separate step using crane (google/go-containerregistry), not kaniko. Three
      # cases, all real and exercised (not just the both-platforms one): both requested
      # -> a real OCI image index via `crane index append`; exactly one requested (e.g.
      # backstage, amd64-only) -> `crane cp` just aliases that single arch-suffixed image
      # under the real tag, no index wrapper for a genuinely single-platform image;
      # neither requested -> cicd.yaml's build.platforms resolved to an empty set, which
      # the schema's minItems:1 should already reject at validate-cicd-config - reaching
      # this branch means that validation was bypassed somehow, so fail loudly rather
      # than silently publish nothing.
      #
      # Pinned by digest, not the `:debug` tag alone - gcr.io/go-containerregistry/crane
      # only publishes ONE floating `debug` tag (no versioned debug variant exists in
      # that registry, confirmed live via the GCR tags-list API before adding this), so a
      # digest pin is the only way to keep this reproducible the way every other version
      # in this file is pinned. `:debug` (not the plain, distroless default image)
      # specifically because this step needs a shell to run crane + write a Task result -
      # the distroless variant has no shell at all, same reasoning as kaniko's own
      # debug-image choice above. Shebang is /busybox/sh, not /bin/sh - this image is
      # busybox-based, confirmed against upstream's own documented usage.
      image: gcr.io/go-containerregistry/crane@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
      env:
        - name: DOCKER_CONFIG
          value: /crane/.docker
        # See build-and-push-arm64's own comment on why these are env vars, not inline
        # $(steps.*.results.*) in the script body - the same admission-webhook rejection
        # applies here.
        - name: IMAGE_REF
          value: $(steps.resolve-build-config.results.image-ref)
        - name: BUILD_ARM64
          value: $(steps.resolve-build-config.results.build-arm64)
        - name: BUILD_AMD64
          value: $(steps.resolve-build-config.results.build-amd64)
      volumeMounts:
        - name: registry-credentials
          mountPath: /crane/.docker
          readOnly: true
      script: |
        #!/busybox/sh
        set -eu
        if [ "${BUILD_ARM64}" = "true" ] && [ "${BUILD_AMD64}" = "true" ]; then
          crane index append \
            -m "${IMAGE_REF}-arm64" \
            -m "${IMAGE_REF}-amd64" \
            -t "${IMAGE_REF}"
        elif [ "${BUILD_ARM64}" = "true" ]; then
          crane cp "${IMAGE_REF}-arm64" "${IMAGE_REF}"
        elif [ "${BUILD_AMD64}" = "true" ]; then
          crane cp "${IMAGE_REF}-amd64" "${IMAGE_REF}"
        else
          echo "error: build.platforms resolved to an empty set - schema's minItems:1 should have caught this at validate-cicd-config. Refusing to publish nothing." >&2
          exit 1
        fi

        crane digest "${IMAGE_REF}" | tr -d '\n' | tee "$(results.image-digest.path)"

    # Sends the span covering the whole build-image duration (both kaniko legs plus the
    # manifest-combine) - not from within any of those steps themselves, since none of
    # them have otel-cli (kaniko's debug image has a shell now, per the platform-gating
    # steps above, but never otel-cli; crane's image doesn't either). Using this step's
    # own start (immediately after publish-multiarch-manifest exits) as the span's end
    # time is an approximation, not kaniko/crane's exact internal finish instant - close
    # enough for real diagnostic purposes, and there's no cheaper way to get closer
    # without adding otel-cli to one of those images, which would reintroduce the exact
    # problem this exception avoids. Only reached if every prior step succeeded (a
    # failure halts the TaskRun before this step runs) - same honest, documented gap as
    # build-source.yaml/run-tests.yaml's own emit-span steps.
    - name: emit-image-ref-and-span
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: IMAGE_REF
          value: $(steps.resolve-build-config.results.image-ref)
        - name: IMAGE_REPO
          value: $(params.image-repo)
        - name: SPAN_START
          value: $(steps.resolve-build-config.results.span-start-time)
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/otel.sh"
        echo -n "${IMAGE_REF}" | tee "$(results.image-ref.path)"
        echo -n "${IMAGE_REPO}" | tee "$(results.image-repo.path)"
        echo -n "${IMAGE_REPO}" | tee "$(results.IMAGE_URL.path)"
        # image-digest is a TASK-level result (publish-multiarch-manifest writes it via
        # `crane digest`, now that this Task builds multi-arch - see that step's own
        # comment), not a step-level one - a cross-step "steps dot results dot name" env
        # var reference only
        # applies to step-scoped results and silently resolves to the literal unresolved
        # placeholder string for a task-level one (confirmed live, a real bug on the first
        # attempt - and note: writing that exact syntax even inside a comment here trips
        # Tekton's admission webhook, since its variable substitution is a plain string
        # match with no awareness of bash comments - confirmed live the hard way). A
        # results-dot-name-dot-path reference inline in script is ALSO rejected once the
        # result belongs to an earlier step. Task-level result files live at the
        # well-documented, stable /tekton/results/<name> path regardless of which step
        # wrote them, so read it directly rather than fighting either restriction.
        cat /tekton/results/image-digest | tee "$(results.IMAGE_DIGEST.path)"
        otel_task_span_send "build-image" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" \
          "${SPAN_START}" "$(date -u +"%Y-%m-%dT%H:%M:%S.%NZ")" "Succeeded"
