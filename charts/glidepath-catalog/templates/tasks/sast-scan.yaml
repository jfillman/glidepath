# catalog/tasks/sast-scan.yaml
#
# Real Semgrep SAST for the `sast` gate (replaces governance-gate-stub). The gitops
# PR-check (sast-check.yaml) doesn't call this Task directly - it reads this Task's
# attested outcome from the image's SLSA provenance instead, avoiding a re-scan of
# unchanged source (see verify-sast-attestation.yaml).
#
# Runs on the official semgrep/semgrep image directly, not the shared toolbox image -
# Semgrep ships no downloadable binary release to pin, so the usual static-binary
# pattern (gitsign/ec/cosign) doesn't apply. Same exception already made for kaniko
# (build-image.yaml).
#
# Rules: p/ci + p/security-audit (both free, no Semgrep App token needed - `--config
# auto` requires one). p/ci alone is a quality bundle, not a security one - it missed a
# deliberately-planted command-injection snippet that p/security-audit caught.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sast-scan
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Runs Semgrep (p/ci ruleset) against the source workspace; fails closed on real findings.
  workspaces:
    - name: source
  params:
    - name: flow-traceparent
      type: string
      default: ""
      description: Leave empty when there's no flow/stage context (e.g. a PR-triggered GitOps-repo check) - see governance-stub.yaml for the same convention.
    - name: stage-span-id
      type: string
      default: ""
      description: The calling stage's own span id - this scan's span is parented to it. Ignored when flow-traceparent is empty.
    - name: config-json
      type: string
      default: ""
      description: Output of validate-cicd-config's config-json result - read for notifications.slack.* only (same as notify-slack.yaml). Left empty in the gitops-repo PR-check context, same as flow-traceparent above - this Task isn't called there anyway, but keeping the default makes it safe if that ever changes.
    - name: app-name
      type: string
      default: ""
    - name: git-url
      type: string
      default: ""
    - name: git-revision
      type: string
      default: ""
  results:
    - name: outcome
      description: "'passed' or 'failed' - a real result, never 'stub'."
    - name: span-start-time
    - name: span-end-time
      description: Task-level result, set only once the scan step completes (pass or fail) - written and read within this same self-contained Task.
    - name: findings-summary
      description: "Total finding count plus up to 8 real findings (severity/rule-id/file:line) extracted from Semgrep's JSON output, for the Slack notification below - richer than the plain \"Findings: N (M blocking)\" summary line."
  volumes:
    - name: slack-webhook
      secret:
        secretName: app-secrets
        optional: true
  steps:
    # onError: continue - Tekton's default is to skip all later steps once one fails, so
    # without this emit-span/notify-slack below would never run. notify-slack re-raises
    # the real failure explicitly by reading the outcome result. Same fix as image-scan.yaml.
    - name: scan
      onError: continue
      image: semgrep/semgrep:1.172.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        # Not set -e: semgrep's exit code (0=clean, 1=findings under --error) is the
        # real pass/fail signal - a script-level early exit would skip writing `outcome`.
        set -uo pipefail
        # Plain `date`, not catalog/lib/otel.sh - this image has neither otel-cli nor
        # $PLATFORM_LIB (same as build-source.yaml/run-tests.yaml's agent-image steps).
        #
        # Whole-second precision, not %N: semgrep/semgrep is Alpine/BusyBox, whose `date`
        # doesn't support %N and silently truncates the format string after it, producing
        # a malformed timestamp that otel-cli couldn't use (span never reached Tempo).
        # A scan takes seconds, so whole-second precision is fine here.
        date -u +"%Y-%m-%dT%H:%M:%SZ" | tee "$(results.span-start-time.path)"

        # --json --output writes to a FILE so stdout stays human-readable (unlike Trivy,
        # whose --format fully replaces stdout).
        semgrep scan --config p/ci --config p/security-audit --error --json --output /tmp/scan-results.json . 2>&1 | tee /tmp/scan-output.txt
        EXIT_CODE=${PIPESTATUS[0]}

        date -u +"%Y-%m-%dT%H:%M:%SZ" | tee "$(results.span-end-time.path)"

        # Extract real findings (not just the "Findings: N (M blocking)" summary line)
        # from semgrep --json's schema: .results[] with check_id/path/start.line/extra.severity.
        TOTAL_COUNT="$(jq -r '.results | length' /tmp/scan-results.json 2>/dev/null || echo 0)"
        TOP_FINDINGS="$(jq -r '
          .results[:8]
          | map("*" + .extra.severity + "* " + .check_id + " - " + .path + ":" + (.start.line | tostring))
          | join("\n")
          ' /tmp/scan-results.json 2>/dev/null || echo "")"
        {
          echo "${TOTAL_COUNT} finding(s)"
          if [[ -n "${TOP_FINDINGS}" ]]; then
            echo "${TOP_FINDINGS}"
            [[ "${TOTAL_COUNT}" -gt 8 ]] && echo "_+$((TOTAL_COUNT - 8)) more - see the full report in this Task's own log_"
          fi
        } | tee "$(results.findings-summary.path)"

        if [[ "${EXIT_CODE}" -eq 0 ]]; then
          echo -n "passed" | tee "$(results.outcome.path)"
        else
          echo "sast-scan: semgrep reported blocking findings (exit ${EXIT_CODE})" >&2
          echo -n "failed" | tee "$(results.outcome.path)"
          exit 1
        fi

    # Runs whether scan passed or failed, because scan has onError: continue (unlike
    # build-source/run-tests' emit-span, which only runs on success).
    - name: emit-span
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [[ -z "${FLOW_TRACEPARENT}" ]]; then
          echo "no flow-traceparent provided - skipping span emission (expected for PR-triggered GitOps-repo checks)" >&2
          exit 0
        fi
        source "${PLATFORM_LIB}/otel.sh"
        # outcome/span-start-time/span-end-time are Task-level results written by an
        # earlier step (scan). A cross-step "results.NAME.path"-style reference
        # silently resolves to the literal placeholder string, so read
        # /tekton/results/<name> directly instead (same workaround as
        # build-image.yaml's emit-image-ref-result).
        OUTCOME_VALUE="$(cat /tekton/results/outcome 2>/dev/null || echo unknown)"
        SPAN_START="$(cat /tekton/results/span-start-time 2>/dev/null || echo "")"
        SPAN_END="$(cat /tekton/results/span-end-time 2>/dev/null || echo "")"
        TEKTON_STATUS="Succeeded"
        [[ "${OUTCOME_VALUE}" != "passed" ]] && TEKTON_STATUS="Failed"
        otel_task_span_send "sast-scan" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" \
          "${SPAN_START}" "${SPAN_END}" "${TEKTON_STATUS}" "sast.outcome=${OUTCOME_VALUE}"

    # Shift-left Slack notification, sent from inside this Task rather than as a
    # pipeline-level `finally` step - a `finally` task referencing a failed task's
    # result gets skipped entirely (see notify-slack.yaml), so it has to live here.
    - name: notify-slack
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: slack-webhook
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: APP_NAME
          value: $(params.app-name)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # scan has onError: continue, so its failure doesn't fail this Task on its own -
        # every path below must fall through to the final check rather than `exit 0`
        # directly, or a real scan failure would silently report as passing.
        OUTCOME_VALUE="$(cat /tekton/results/outcome 2>/dev/null || echo unknown)"

        CFG='$(params.config-json)'
        if [[ -z "${CFG}" ]]; then
          echo "no config-json provided - skipping notification (expected for PR-triggered GitOps-repo checks, this Task isn't called there)" >&2
        elif [[ "$(jq -r '.notifications.slack.enabled // false' <<< "${CFG}")" != "true" ]]; then
          echo "slack notifications disabled in cicd.yaml, skipping"
        elif [[ "$(jq -r 'if .notifications.slack.scanResults == false then "false" else "true" end' <<< "${CFG}")" != "true" ]]; then
          echo "notifications.slack.scanResults is false in cicd.yaml - shift-left scan notifications disabled for this Application (general per-stage notifications are unaffected), skipping"
        else
          CHANNEL="$(jq -r '.notifications.slack.channel // empty' <<< "${CFG}")"
          WEBHOOK_URL="$(cat /var/run/secrets/platform/slack-webhook-url 2>/dev/null || true)"
          if [[ -z "${WEBHOOK_URL}" ]]; then
            echo "warn: notifications.slack.enabled=true but no slack-webhook-url secret is mounted for this Application - skipping, not failing the pipeline" >&2
          else
            FINDINGS="$(cat /tekton/results/findings-summary 2>/dev/null || echo "")"

            # Same docs/design-language.md conventions as notify-slack.yaml: one blue
            # accent, muted red only on failure, a single ⚠ on the header only when the
            # outcome isn't success.
            if [[ "${OUTCOME_VALUE}" == "passed" ]]; then
              COLOR="#2563EB"
              HEADER_TEXT="${APP_NAME} · SAST Passed"
            else
              COLOR="#B91C1C"
              HEADER_TEXT="⚠ ${APP_NAME} · SAST Failed"
            fi
            REPO_SHORT="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/([^/.]+).*#\1/\2#')"
            SHORT_SHA="${GIT_REVISION:0:12}"
            COMMIT_URL="${GIT_URL}/commit/${GIT_REVISION}"
            # Scan parameters are fixed platform policy right now, same reasoning as
            # image-scan.yaml's own SCAN_PARAMS.
            SCAN_PARAMS="config: p/ci, p/security-audit"

            payload="$(jq -n \
              --arg channel "${CHANNEL}" \
              --arg color "${COLOR}" \
              --arg headerText "${HEADER_TEXT}" \
              --arg app "${APP_NAME}" \
              --arg repoShort "${REPO_SHORT}" \
              --arg repoUrl "${GIT_URL}" \
              --arg shortSha "${SHORT_SHA}" \
              --arg commitUrl "${COMMIT_URL}" \
              --arg scanParams "${SCAN_PARAMS}" \
              --arg findings "${FINDINGS:-no summary available}" \
              --arg footer "platform-cicd · $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '
              def field(fieldLabel; fieldValue): {type: "mrkdwn", text: ("*" + fieldLabel + "*\n" + fieldValue)};
              {
                channel: $channel,
                attachments: [{
                  color: $color,
                  blocks: [
                    {type: "header", text: {type: "plain_text", text: $headerText, emoji: true}},
                    {type: "section", fields: [
                      field("App"; $app),
                      field("Repo"; "<" + $repoUrl + "|" + $repoShort + ">"),
                      field("Commit"; "<" + $commitUrl + "|" + $shortSha + ">"),
                      field("Scan parameters"; $scanParams)
                    ]},
                    {type: "section", text: {type: "mrkdwn", text: ("*Findings*\n" + $findings)}},
                    {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
                  ]
                }]
              }
              ')"

            curl --fail --silent --show-error --max-time 10 --retry 3 --retry-connrefused \
              -X POST "${WEBHOOK_URL}" \
              -H 'Content-Type: application/json' \
              -d "${payload}"
          fi
        fi

        # Re-raise scan's own real failure - see that step's onError: continue comment.
        if [[ "${OUTCOME_VALUE}" != "passed" ]]; then
          exit 1
        fi
