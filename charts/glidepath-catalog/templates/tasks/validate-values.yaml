# catalog/tasks/validate-values.yaml
#
# Runs a VALIDATOR IMAGE against the values files a gitops-repo PR changes, and fails the check when it exits
# non-zero. Generic on purpose: Glidepath does not know what the files mean. The image is a parameter
# (values.valuesValidatorImage); the Hangar default is Airframe's `airframe-validate` image, which checks each
# file against a strict form of the chart schema (unknown keys such as `rolout:`), the component XRD schemas,
# and `helm template`. Someone running Glidepath without Airframe points it at another image or leaves the
# gate unregistered (see docs/admin/release-guardrails.md).
#
# Contract with the image: it provides `validate-values [--app NAME] FILE...` on its PATH, run in the cloned repo
# (files are relative to it), exit 0 = valid, non-zero = invalid, output shown in the check.
# Which files: every `*values.yaml` this PR changes relative to its base (GitHub's compare endpoint, a merge-base
# diff), not just HEAD~1, so a human or agent PR with several commits is fully covered. No matching file = the
# check passes with a note. The repo itself is a one-commit fetch of the PR head, not a full clone (2026-10-09,
# report item 5); without a PR number (a manual run) the changed files are the revision's own commit's.
# A changed `<cluster>/base.yaml` (shared values of the Flight environments on that cluster, layered under each
# one's values.yaml; Tower's App Configuration edits it) is validated itself and brings in every
# `<cluster>/<env>/values.yaml` on that cluster, so each environment it reaches is checked with the new base.
#
# An environment that renders its own chart (cicd.yaml deploy.chart / environments[].chart other than Airframe's,
# ADR-0023 slice 5) is not given to the Airframe validator, whose strict keys and component checks describe a chart
# it does not render. Its files get a plain `helm template` with that chart instead (step own-chart), plus the two
# chart-contract checks a render can prove: a Namespace, and a Rollout named after the app. That render runs in the token-less
# render-manifests task (profile `values`), not in this Task's pod: the Task runs twice around it (phase `fetch`: clone-and-list, publish,
# validate; phase `decide`: own-chart reads the render as data and makes the two checks), as policy-validation-gate does.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-values
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  description: Fetches a gitops-repo PR head and runs a validator image against the values files the PR changes.
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's repo_url.
    - name: revision
      type: string
      description: The PR head commit - PaC's revision.
    - name: pr-number
      type: string
      default: ""
      description: PaC's body.pull_request.number - the changed files are those between the PR's base and revision. Empty means "just this commit".
    - name: validator-image
      type: string
      default: {{ include "glidepath-catalog.validatorImage" . | quote }}
      description: The validator image. Must provide `validate-values [--app NAME] FILE...` on its PATH.
    - name: app-name
      type: string
      default: ""
      description: The application name, passed to the validator as --app when set.
    - name: phase
      type: string
      description: "fetch | decide: the Pipeline runs this Task twice around render-manifests (fetch: clone-and-list, publish, validate; decide: own-chart)."
    - name: pipeline-run-name
      type: string
      default: ""
      description: Names this run in the volume's marker.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
    - name: work
      emptyDir: {}
  workspaces:
    - name: publish
      optional: true
      mountPath: /publish
    - name: trusted
      optional: true
      readOnly: true
      mountPath: /trusted
    - name: rendered
      optional: true
      readOnly: true
      mountPath: /rendered
  stepTemplate:
    env:
      - name: PHASE
        value: $(params.phase)
      - name: PIPELINE_RUN
        value: $(params.pipeline-run-name)
  steps:
    - name: clone-and-list
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - { name: github-token-broker-token, mountPath: /var/run/secrets/platform, readOnly: true }
        - { name: work, mountPath: /work }
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
        - name: PR_NUMBER
          value: $(params.pr-number)
        - name: APP_NAME
          value: $(params.app-name)
        - name: DEFAULT_CHART_REPO_URL
          value: {{ .Values.defaultChart.repoURL | quote }}
        - name: DEFAULT_CHART_PATH
          value: {{ .Values.defaultChart.path | quote }}
        # The default chart's revision: the one the validator image bakes (glidepath-catalog.validatorImage). An environment is on the
        # default chart, rendered with the baked chart, only at this revision; any other is an own chart.
        - name: DEFAULT_CHART_REVISION
          value: {{ .Values.defaultChart.targetRevision | quote }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        {{- include "glidepath-catalog.gitAuth" . | nindent 8 }}
        [[ "${PHASE}" == fetch ]] || exit 0
        source "${PLATFORM_LIB}/github-app.sh"
        source "${PLATFORM_LIB}/retry.sh"
        {{- include "glidepath-catalog.inputGuards" . | nindent 8 }}

        owner="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        repo="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        token="$(github_app_installation_token "${owner}" "${repo}")"
        api() {
          curl --fail --silent --show-error --retry 3 --retry-connrefused --max-time 20 \
            -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"
        }
        # The tree at the PR head, one commit deep: the validator reads the files from it.
        mkdir -p /work/repo && cd /work/repo
        git init --quiet
        git_auth "${token}"
        with_retry 3 -- git fetch --quiet --depth 1 "https://${GIT_HOST}/${owner}/${repo}.git" "${REVISION}"
        git checkout --quiet FETCH_HEAD
        git_auth_clear  # the fetch is done: the token's header does not stay in the environment of everything this step runs next

        # Changed files: the PR's base...head compare (merge-base semantics, like the old `git merge-base
        # origin/main`), or the single commit when there is no PR. `removed` dropped = the old --diff-filter=AMR.
        # A /retest fires an issue_comment webhook whose payload has no pull_request, so PaC leaves the
        # template string in place - resolve the PR from the commit, as itsm-gate.yaml does.
        if [[ -n "${PR_NUMBER}" ]] && ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
          PR_NUMBER="$(api "https://api.github.com/repos/${owner}/${repo}/commits/${REVISION}/pulls" | jq -r '.[0].number // empty')"
        fi
        if [[ -n "${PR_NUMBER}" ]]; then
          base_sha="$(api "https://api.github.com/repos/${owner}/${repo}/pulls/${PR_NUMBER}" | jq -r '.base.sha')"
          changed="$(api "https://api.github.com/repos/${owner}/${repo}/compare/${base_sha}...${REVISION}" \
            | jq -r '.files[] | select(.status != "removed") | .filename')"
        else
          changed="$(api "https://api.github.com/repos/${owner}/${repo}/commits/${REVISION}" \
            | jq -r '.files[] | select(.status != "removed") | .filename')"
        fi
        grep -E '(^|/)values\.yaml$|^[^/]+/base\.yaml$' <<<"${changed}" > /work/files.txt || true
        for b in $(grep -E '^[^/]+/base\.yaml$' /work/files.txt || true); do
          ls "$(dirname "${b}")"/*/values.yaml 2>/dev/null >> /work/files.txt || true
        done
        sort -u -o /work/files.txt /work/files.txt
        echo "values files changed in this PR: $(wc -l < /work/files.txt | tr -d ' ')"
        cat /work/files.txt

        # Which chart each file's environment renders (<cluster>/<env>/values.yaml): the environment's chart over
        # deploy.chart, glidepath-app.resolveChart's rules. An infra service's gitops repo is its own app repo and
        # carries cicd.yaml; an app's gitops repo does not, so read the app repo's.
        : > /work/own.txt
        cicd=""
        if [[ -f cicd.yaml ]]; then
          cicd="$(cat cicd.yaml)"
        elif [[ -n "${APP_NAME}" ]]; then
          app_token="$(github_app_installation_token "${owner}" "${APP_NAME}" 2>/dev/null || true)"
          # 200 = read; 404 = the app has no cicd.yaml (no chart named: the default chart); anything else (network, auth, 5xx) fails the task
          http_code="$(curl -sSL -o /work/cicd.fetched -w '%{http_code}' -H "Authorization: Bearer ${app_token}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${owner}/${APP_NAME}/contents/cicd.yaml")" || http_code=000
          case "${http_code}" in
            200) cicd="$(cat /work/cicd.fetched)" ;;
            404) cicd="" ;;
            *) echo "FAIL: reading cicd.yaml of ${APP_NAME} failed (HTTP ${http_code}); the chart lookup cannot tell the default chart from an unreadable one"; exit 1 ;;
          esac
        fi
        # fail closed on a chart spec the resolver below cannot read: it would fall back to the default chart
        if [[ -n "${cicd}" ]]; then echo "${cicd}" | yq -o json '.' 2>/dev/null | chart_specs_ok || { echo "FAIL: cicd.yaml's deploy.chart or an environment's chart is not a mapping; the gate will not guess which chart is rendered"; exit 1; }; fi
        if [[ -n "${cicd}" && -s /work/files.txt ]]; then
          keep=()
          # the default chart comes from these inputs: an unset one fails the task, it is never read as "the default chart"
          for v in DEFAULT_CHART_REPO_URL DEFAULT_CHART_PATH DEFAULT_CHART_REVISION; do
            [[ -n "${!v:-}" ]] || { echo "FAIL: ${v} is not set (catalog values defaultChart.*): the default chart is unknown, so the gate will not guess which chart is rendered"; exit 1; }
          done
          while read -r f; do
            # Only a path of the environment shape is an environment: <cluster>/<env>/values.yaml, or <cluster>/base.yaml, under a cluster directory
            # that is a plain name. Any other changed values file (a root values.yaml, x/values.yaml, a deeper path, a directory that is not a name)
            # is validated as a file and is not an environment, as before. An environment shape with an invalid name refuses the run.
            if [[ "${f}" =~ ^([^/]+)/([^/]+)/values\.yaml$ ]]; then
              cluster="${BASH_REMATCH[1]}"; env="${BASH_REMATCH[2]}"
            elif [[ "${f}" =~ ^([^/]+)/base\.yaml$ ]]; then
              cluster="${BASH_REMATCH[1]}"; env="base.yaml"
            else
              keep+=("${f}"); continue
            fi
            valid_name "${cluster}" || { keep+=("${f}"); continue; }
            if [[ "${env}" != "base.yaml" ]] && ! valid_name "${env}"; then
              echo "FAIL: a changed values file is under an environment directory whose name is not a plain name (lower case letters, digits, hyphens)"; exit 1
            fi
            # A cluster's shared base.yaml has no environment, so it resolves to the app's chart. On an own chart it
            # is not a whole values file to render alone: the environments it brought in are rendered with it
            # layered underneath (step own-chart), so it is dropped here.
            # An environment deploy.environments does not list (and base.yaml) gets deploy.chart: the selector used to yield nothing for it, so the
            # default chart. The default chart is the cluster default at DEFAULT_CHART_REVISION: another revision is an own chart.
            spec="$(echo "${cicd}" | ENV_NAME="${env}" yq -o json '{"app": (.deploy.chart // {}), "env": ([(.deploy.environments // [])[] | select(.name == strenv(ENV_NAME)) | .chart // {}] | .[0] // {}), "target": (.deploy.target // "k8s-rollout")}')" \
              || { echo "FAIL: cicd.yaml could not be read for the chart lookup of environment ${env} (deploy.chart / deploy.environments[].chart); a failed lookup is not the default chart"; exit 1; }
            resolved="$(echo "${spec}" | jq -c --arg r "${DEFAULT_CHART_REPO_URL}" --arg p "${DEFAULT_CHART_PATH}" --arg v "${DEFAULT_CHART_REVISION}" '
                  def over($b; $o): if ($o.repoURL // "") != "" then $o
                    else $b + ($o | with_entries(select(.value != null and .value != "")))
                      | (if ($o.path // "") != "" then del(.chart) elif ($o.chart // "") != "" then del(.path) else . end) end;
                  over(over({repoURL: $r, path: $p, targetRevision: $v}; .app); .env) + {target}')" \
              || { echo "FAIL: the chart lookup for environment ${env} failed (deploy.chart / deploy.environments[].chart, or the DEFAULT_CHART_* inputs); a failed lookup is not the default chart"; exit 1; }
            [[ -n "${resolved}" ]] || { echo "FAIL: the chart lookup for ${env} returned nothing (cicd.yaml deploy.chart / deploy.environments[].chart, or the DEFAULT_CHART_* inputs); a failed lookup is not the default chart"; exit 1; }
            if [[ "$(echo "${resolved}" | jq -r --arg r "${DEFAULT_CHART_REPO_URL}" --arg p "${DEFAULT_CHART_PATH}" --arg v "${DEFAULT_CHART_REVISION}" \
                 '.target == "k8s-rollout" and (.repoURL != $r or (.chart // "") != "" or .path != $p or (.targetRevision // "") != $v)')" == "true" ]]; then
              [[ "${env}" == "base.yaml" ]] || echo "${f}|${cluster}|${env}|${resolved}" >> /work/own.txt
            else
              keep+=("${f}")
            fi
          done < /work/files.txt
          printf '%s\n' "${keep[@]+"${keep[@]}"}" | sed '/^$/d' > /work/files.txt
        fi

        # Fetch each distinct own chart once, into /work/charts/<n> (git) or /work/charts/<n>.tgz (OCI registry).
        mkdir -p /work/charts
        n=0
        while IFS='|' read -r f cluster env chart; do
          n=$((n + 1))
          repo_url="$(echo "${chart}" | jq -r .repoURL)"; rev="$(echo "${chart}" | jq -r '.targetRevision // "main"')"
          # the fetch below carries credentials: only from the hosts the platform names, with plain revision, path and chart names
          if ! valid_chart_source "${repo_url}" "${rev}" "$(echo "${chart}" | jq -r '.path // "."')" "$(echo "${chart}" | jq -r '.chart // ""')"; then
            echo "FAIL: ${f%%/*}: the environment's chart source is not an allowed one (https git host or OCI registry from chartSources, plain revision and path)"; exit 1
          fi
          if [[ "${repo_url}" == oci://* ]]; then
            name="$(echo "${chart}" | jq -r .chart)"
            with_retry 3 -- oras pull "${repo_url#oci://}/${name}:${rev}" -o "/work/charts/${n}-oci" >/dev/null
            mv "$(ls /work/charts/${n}-oci/*.tgz | head -1)" "/work/charts/${n}.tgz"
            echo "${f}|${cluster}|${env}|/work/charts/${n}.tgz" >> /work/own-resolved.txt
          else
            path="$(echo "${chart}" | jq -r '.path // "."')"
            clone_url="${repo_url%.git}.git"
            git_auth_clear
            gh_owner="$(echo "${repo_url}" | sed -nE 's#https?://github\.com/([^/]+)/.*#\1#p')"
            gh_repo="$(echo "${repo_url}" | sed -nE 's#https?://github\.com/[^/]+/([^/]+).*#\1#p')"; gh_repo="${gh_repo%.git}"  # the whole repository name (it may contain a dot), not the part before the first one
            if [[ -n "${gh_owner}" ]] && t="$(github_app_installation_token "${gh_owner}" "${gh_repo}" 2>/dev/null)"; then
              git_auth "${t}"
              clone_url="https://${GIT_HOST}/${gh_owner}/${gh_repo}.git"
            fi
            # One-commit fetch of the pinned revision (branch, tag or sha), not a full clone.
            mkdir -p "/work/charts/${n}"
            git -C "/work/charts/${n}" init --quiet
            with_retry 3 -- git -C "/work/charts/${n}" fetch --quiet --depth 1 "${clone_url}" "${rev}"
            git -C "/work/charts/${n}" checkout --quiet FETCH_HEAD
            rm -f "/work/charts/${n}/.git/config"
            echo "${f}|${cluster}|${env}|/work/charts/${n}/${path}" >> /work/own-resolved.txt
          fi
          echo "own chart for ${f}: ${chart}"
        done < /work/own.txt
        # Nothing past this point needs .git (and a fetch by URL never wrote the token into it, unlike the old
        # clone). Do not chmod /work itself: it is the volume mount root, owned by root, and this step runs as
        # a non-root user (it fails with "Operation not permitted"). Files this step creates are already
        # world-readable; the validator image only reads them.
        rm -f .git/config
        # what the render task is given: one line per environment that renders its own chart (cluster|env|chart)
        touch /work/own-resolved.txt
        cut -d'|' -f2- /work/own-resolved.txt | sort -u > /work/plan.txt
        chmod -R a+rX /work/repo /work/files.txt /work/charts /work/own-resolved.txt /work/plan.txt 2>/dev/null || true
    - name: publish
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: work, mountPath: /work }
      script: |
        {{- include "glidepath-catalog.gatePublish" . | nindent 8 }}
    - name: validate
      image: $(params.validator-image)
      imagePullPolicy: IfNotPresent
      # Not readOnly and no workingDir: the runtime tries to mkdir workingDir on the mount and fails with
      # "read-only file system" even when it already exists. The script cd's instead.
      volumeMounts:
        - { name: work, mountPath: /work }
      env:
        - name: APP_NAME
          value: $(params.app-name)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        [[ "${PHASE}" == fetch ]] || exit 0
        cd /work/repo
        if [[ ! -s /work/files.txt ]]; then
          echo "No values files changed: nothing to validate."
          exit 0
        fi
        args=()
        [[ -n "${APP_NAME}" ]] && args+=(--app "${APP_NAME}")
        mapfile -t files < /work/files.txt
        # The contract: the image provides an executable `validate-values` on its PATH.
        exec validate-values "${args[@]}" "${files[@]}"
    - name: own-chart
      # Reads what render-manifests wrote for the environments that render their own chart, as data (files/lib/rendered-ingest.py), and makes
      # the two checks a render can prove. The validator image has python3 and pyyaml.
      image: $(params.validator-image)
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: work, mountPath: /work }
      env:
        - name: APP_NAME
          value: $(params.app-name)
        - name: GATE
          value: values
        {{- include "glidepath-catalog.ingestLimits" . | nindent 8 }}
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        [[ "${PHASE}" == decide ]] || exit 0
        [[ -f /trusted/PUBLISHED && "$(cat /trusted/PUBLISHED)" == "${PIPELINE_RUN}" ]] || { echo "FAIL: the fetch phase's data for this run is not on the workspace"; exit 1; }
        cp -a /trusted/. /work/
        [[ -s /work/plan.txt ]] || exit 0
        python3 - <<'PY'
        {{- include "glidepath-catalog.renderedIngest" . | nindent 8 }}
        PY
