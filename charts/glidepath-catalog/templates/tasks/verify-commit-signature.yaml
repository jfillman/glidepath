# catalog/tasks/verify-commit-signature.yaml
#
# The real (not stub) `provenance` gate (renamed from `policy-check` 2026-08-23, see
# docs/admin/release-guardrails.md), Phase 3 item 2 - see docs/commit-signing.md for
# the full design. Deliberately a dedicated Task, not a new branch inside the shared
# governance-gate-stub.yaml/governance-check.yaml - sast/image-scan/sbom stay honestly
# fake, and "which gates are real" stays answerable just by looking at which catalog Task
# each gitops repo's .tekton/pull-request-*.yaml file references, matching this
# platform's Phase 1 "make stub-ness structurally loud" precedent.
#
# Runs as a PaC-triggered Check on the GITOPS repo's own PR, but the commit that actually
# needs a verified human signature is the APP-repo commit being promoted - the gitops
# commit itself is generated by open-release-pr.yaml's own automation identity, never
# hand-signed. open-release-pr.yaml embeds X-App-Repo/X-App-Commit trailers in that
# commit's message specifically so this Task can find its way back to the right commit
# without a second PaC Repository CR/webhook on the app repo.
#
# Walks the PR's commits newest-first for the trailers (not just REVISION's own message)
# - 2026-08-12, real bug found live once every commit on a release PR started getting
# independently checked (see pull-request-provenance.yaml's own history for why that
# changed): open-release-pr.yaml's SECOND commit ("Add outcome-reporting hooks...")
# never carried these trailers, only its first commit ("Release: promote...") did -
# both promote the exact same app commit. Checking only REVISION's own message made
# this Task fail on every release PR's actual HEAD, permanently.
#
# The commits come from the GitHub API (pulls/N/commits), not a clone of the gitops
# repo (2026-10-09, report item 5): the old full clone was p50 5s of work behind a 23s
# pod start, for one `git log --grep`. Bounding the walk to the PR's own commits is also
# the right scope - a prior release's promote commit is in main's history and would
# have been found by an unbounded walk had this PR carried no trailers at all. With no
# PR number (a manual run) the walk falls back to the 50 commits reachable from
# REVISION, the old `git log` view.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-commit-signature
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's `repo_url`.
    - name: revision
      type: string
      description: The gitops PR's head commit - PaC's `revision`.
    - name: pr-number
      type: string
      default: ""
      description: PaC's `body.pull_request.number` - bounds the trailer search to this PR's own commits. Empty means "the commits reachable from revision".
    - name: app-namespace
      type: string
    - name: app-name
      type: string
      description: Used to find <app-name>-policy-config in this Application's own namespace (charts/glidepath-app/templates/governance/policy-config.yaml).
  # Audience-bound projected ServiceAccount token for the shared broker's GitHub
  # token-minting endpoint - same pattern as clone-repo-authenticated.yaml/
  # comment-pr-check-result.yaml. Both the gitops repo (read over the API) and the app
  # repo (one-commit fetch) can be private, so both need a real installation token.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
  steps:
    - name: verify
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
        - name: PR_NUMBER
          value: $(params.pr-number)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"
        source "${PLATFORM_LIB}/retry.sh"

        gitops_owner="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        gitops_repo="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        gitops_token="$(github_app_installation_token "${gitops_owner}" "${gitops_repo}")"
        gitops_api="https://api.github.com/repos/${gitops_owner}/${gitops_repo}"

        # The trailers open-release-pr.yaml embeds - see that file's own comment on why
        # these exist instead of a second PaC Repository CR on the app repo. Newest
        # commit first, same order `git log --grep` walked (header comment). The commit
        # list is one API read; a missing trailer reaches the explicit check below.
        if [[ -n "${PR_NUMBER}" ]]; then
          messages="$(curl --fail --silent --show-error --retry 3 --retry-connrefused --max-time 20 \
            -H "Authorization: Bearer ${gitops_token}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${gitops_api}/pulls/${PR_NUMBER}/commits?per_page=100" | jq -r 'reverse | .[].commit.message')"
          scope="PR #${PR_NUMBER}'s commits"
        else
          messages="$(curl --fail --silent --show-error --retry 3 --retry-connrefused --max-time 20 \
            -H "Authorization: Bearer ${gitops_token}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${gitops_api}/commits?sha=${REVISION}&per_page=50" | jq -r '.[].commit.message')"
          scope="the 50 commits reachable from ${REVISION:0:12}"
        fi
        app_repo="$(grep -E -m1 '^X-App-Repo: ' <<<"${messages}" | sed -E 's/^X-App-Repo: //' || true)"
        app_commit="$(grep -E -m1 '^X-App-Commit: ' <<<"${messages}" | sed -E 's/^X-App-Commit: //' || true)"

        if [[ -z "${app_repo}" || -z "${app_commit}" ]]; then
          echo "FAIL: none of ${scope} carries X-App-Repo/X-App-Commit trailers - cannot determine which app commit to verify" >&2
          exit 1
        fi
        echo "Verifying ${app_repo}@${app_commit} (trailers found in ${scope})"
        workdir="$(mktemp -d)"

        # Narrow, single-commit fetch - no PaC Repository CR/webhook needed on the app
        # repo for this. The app repo can be private same as the gitops repo, so this
        # mints its own installation token rather than assuming a public, unauthenticated
        # fetch works.
        app_owner="$(echo "${app_repo}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        app_repo_name="$(echo "${app_repo}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        app_token="$(github_app_installation_token "${app_owner}" "${app_repo_name}")"
        app_clone_url="https://x-access-token:${app_token}@github.com/${app_owner}/${app_repo_name}.git"

        cd "${workdir}"
        mkdir app && cd app
        git init --quiet
        git fetch --quiet --depth 1 "${app_clone_url}" "${app_commit}"

        # Application's allowed-signers list - plain emails, one per line, comments/blanks
        # ignored - turned into the --certificate-identity-regexp gitsign needs right
        # here, not hand-built into the ConfigMap as pre-made regex (see
        # charts/glidepath-app/templates/governance/policy-config.yaml). "." and "+"
        # are escaped in each email
        # since both are regex metachars - "+" matters in practice, not just in theory:
        # GitHub's own private/noreply address format is "<id>+<username>@users.noreply.
        # github.com", so an unescaped "+" there would silently turn into a quantifier
        # and fail to match its own literal string - a real bug this hit live, not a
        # hypothetical.
        # grep -v legitimately matches nothing when an app has no real signers
        # configured (the common, default case) - under set -o pipefail, grep's own
        # "no lines matched" exit 1 then becomes the WHOLE pipeline's exit status,
        # which set -e treats as a hard script abort right here, silently, before ever
        # reaching the deliberate "FAIL: ... empty allowlist" message below. Confirmed
        # live: the real symptom was a bare "exited with code 1: Error" with zero
        # output on the PR check, not the intended graceful failure message. `|| true`
        # neutralizes grep's own exit code without masking a genuine kubectl failure -
        # pipefail still reports kubectl's non-zero status if THAT fails for real.
        allowed_emails="$(kubectl get configmap "${APP_NAME}-policy-config" -n "${APP_NAMESPACE}" \
          -o jsonpath='{.data.allowed-commit-signers}' \
          | { grep -vE '^\s*(#.*)?$' || true; } | sed -E 's/^\s+|\s+$//g')"

        if [[ -z "${allowed_emails}" ]]; then
          echo "FAIL: ${APP_NAME}-policy-config in ${APP_NAMESPACE} has no allowed-commit-signers entries - refusing to verify against an empty allowlist" >&2
          exit 1
        fi

        identity_regexp="^($(echo "${allowed_emails}" | sed -E 's/[.+]/\\&/g' | paste -sd '|' -))$"

        # Issuer confirmed against a real signed commit's cert, not gitsign's default
        # config output - those disagree, and the cert is authoritative. gitsign's
        # config shows "https://oauth2.sigstore.dev/auth" because that's the Dex-based
        # broker gitsign talks to during login, but that broker federates to an upstream
        # IdP (GitHub, in our case), and it's the upstream connector's own issuer URL
        # that ends up in the cert's issuer claim - "https://github.com/login/oauth".
        # Verifying against the broker URL fails against every real cert. See
        # docs/commit-signing.md.
        gitsign verify \
          --certificate-identity-regexp "${identity_regexp}" \
          --certificate-oidc-issuer "https://github.com/login/oauth" \
          FETCH_HEAD
