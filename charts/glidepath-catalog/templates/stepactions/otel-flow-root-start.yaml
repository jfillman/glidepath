# catalog/stepactions/otel-flow-root-start.yaml
#
# Generates identifiers + a start timestamp for a NEW flow-root span - covering the
# entire build->test->deploy->release run - WITHOUT sending anything to the collector
# yet (see otel_flow_root_begin in otel.sh for why: the flow only finishes many
# independently-triggered PipelineRuns later, and otel-cli has no "start now, decide
# the end time later" mode that survives a process/Pod boundary). Actual emission
# happens once, in end-flow-root-span, called from whichever stage is currently last
# in the chain (deploy, in Phase 1 - see end-flow-root-span.yaml).
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: otel-flow-root-start
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  image: {{ .Values.toolboxImage }}
  results:
    - name: traceparent
      description: W3C traceparent of the flow-root span. Thread through every subsequent Task param and into the CDEvent payload - see docs/tracing.md.
    - name: start-time
      description: Flow-root span's real start time. Thread alongside traceparent all the way to whichever stage ends the flow (currently deploy) - see end-flow-root-span.
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    source "${PLATFORM_LIB}/otel.sh"
    read -r traceparent start_time <<< "$(otel_flow_root_begin)"
    printf '%s' "${traceparent}" > "$(step.results.traceparent.path)"
    printf '%s' "${start_time}" > "$(step.results.start-time.path)"
