# catalog/stepactions/otel-span-send.yaml
#
# One-shot, stateless span emission - the ONLY place flow-root/stage spans are
# actually sent to the collector. Replaces the old otel-span-end.yaml design, which
# assumed a "span end" call could reach the "span background" daemon process that
# started the span - true only when both calls run in the same process, which is
# never the case across Tekton Task boundaries (each Task is its own Pod). Verified
# live: every span sent through the old background-daemon path showed an exact 1.00s
# duration and a `timeout` event, because the daemon self-closed on its own default
# --timeout (1s) after the real "end" call - running in a different Task's Pod -
# never reached it. See docs/tracing.md and otel.sh's file header.
#
# Used for BOTH stage-span sends (end-stage-span, span-id non-empty) and the single
# flow-root-span send (end-flow-root-span, span-id left empty) - see otel_span_send
# in otel.sh for the empty-span-id convention.
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: otel-span-send
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
    hangar.io/catalog: "true"
spec:
  image: {{ .Values.toolboxImage }}
  params:
    - name: name
      type: string
    - name: flow-traceparent
      type: string
      description: W3C traceparent identifying the flow's trace id and the flow-root span's own id.
    - name: span-id
      type: string
      default: ""
      description: This span's own id (from otel_stage_span_begin). Leave empty when this call is ending the flow-root span itself.
    - name: start-time
      type: string
    - name: status
      type: string
      description: Tekton's own aggregate status string - pass $(tasks.status) from the calling Pipeline's finally block directly, no translation needed.
    - name: attrs
      type: string
      default: ""
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  # StepActions reject $(params.x) substitution directly inside `script:` (Tekton's
  # admission webhook: "param substitution in scripts is not allowed") - unlike Tasks,
  # where it's fine. Params have to come in as positional args instead and be read via
  # $1/$2/... - see docs/tracing.md for this getting caught the hard way, against a
  # real cluster, not in review.
  args:
    - "$(params.name)"
    - "$(params.flow-traceparent)"
    - "$(params.span-id)"
    - "$(params.start-time)"
    - "$(params.status)"
    - "$(params.attrs)"
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    source "${PLATFORM_LIB}/otel.sh"
    otel_span_send "$1" "$2" "$3" "$4" "$(otel_now)" "$5" "$6"
