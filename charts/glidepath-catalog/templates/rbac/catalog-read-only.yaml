# templates/rbac/catalog-read-only.yaml (see docs/catalog-versioning.md)
#
# Every Application's pipeline-runner SA needs to READ Pipelines/Tasks/StepActions in
# {{ .Release.Namespace }} via Tekton's cluster resolver (see
# charts/glidepath-app/files/onboarding-templates/app-repo/onboarding-resync.yaml and
# charts/glidepath-app/templates/triggers/*.yaml, both of which reference
# {kind: pipeline, name: ..., namespace: <this release's namespace>}). Bound to a group
# (system:serviceaccounts by default - every ServiceAccount cluster-wide) rather than
# granted per-Application at onboarding, because the catalog holds no secrets and read
# access to Pipeline/Task/StepAction *definitions* isn't app-sensitive - only WRITE
# access to this namespace is restricted (nothing binds Applications write here at all).
# Kept as a value (rbac.readOnlyGroup) rather than hardcoded so a canary install into a
# second namespace can, if ever needed, bind a narrower group instead of the
# cluster-wide default every Application already relies on in the real production
# release.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-read-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks", "stepactions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-read-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glidepath-catalog.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: catalog-read-only }
subjects:
  - kind: Group
    name: {{ .Values.rbac.readOnlyGroup }}
    apiGroup: rbac.authorization.k8s.io
