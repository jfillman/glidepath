apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.appName }}-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: m, image: "registry.example/acme/migrate:1"}]
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.appName }}-test
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers: [{name: t, image: "registry.example/acme/test:1"}]
