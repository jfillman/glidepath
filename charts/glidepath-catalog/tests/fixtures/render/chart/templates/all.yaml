apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    hangar.io/managed-secrets: {{ index .Values.namespace.labels "hangar.io/managed-secrets" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-config
  namespace: {{ .Release.Namespace }}
data:
  cluster: {{ .Values.cluster | quote }}
  release: {{ .Release.Name | quote }}
  note: "café: multi-line\nsecond line"
  count: "010"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: {{ .Values.appName }}}}
  template:
    metadata: {labels: {app: {{ .Values.appName }}}}
    spec:
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - {name: ENV, value: {{ .Values.envName | quote }}}
            - {name: SAFE_YAML_BOOL, value: "yes"}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Release.Namespace }}
spec:
  ports: [{port: 80}]
