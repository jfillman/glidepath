# charts/glidepath-catalog/values.yaml
#
# Deliberately minimal - every Task/Pipeline/StepAction under templates/ is unparameterized
# by design (see Chart.yaml). The only real values knob is which RBAC group gets read
# access, kept as a value rather than hardcoded so a canary install (see
# docs/admin/catalog-versioning.md) can, if ever needed, bind a narrower group than
# system:serviceaccounts instead of the cluster-wide default every Application already relies on.

rbac:
  # Which RBAC group gets read access to this catalog's Tasks/Pipelines/StepActions
  # (templates/rbac/). Defaults to the cluster-wide system:serviceaccounts group every
  # Application's pipelines already run as - narrow this for a canary install that
  # shouldn't be resolvable by every tenant's PipelineRun yet.
  readOnlyGroup: system:serviceaccounts

# The shared toolbox image (catalog/toolbox/Dockerfile) every bash-based catalog step
# runs in. Defaults to this repo's own published image - real, public, and pullable by
# anyone, so it's a working default (unlike a repo URL or secret, sharing a public tool
# image is normal). Override if you've built and published your own copy - see
# catalog/toolbox/Dockerfile's own build command.
#
# Pinned to an explicit tag, not :latest, as of 2026-08-24: schemas/cicd.schema.json is
# baked into this image (Dockerfile's own header explains why), and validate-cicd-config
# needs the version carrying the test.suite -> test.name / steps[].suite -> testName
# rename. Every Task uses imagePullPolicy: IfNotPresent, so re-pushing :latest wouldn't
# actually reach already-cached nodes - a real staleness class this platform has hit
# before. Bump this tag (not just the image content) whenever schema.json changes.
#
# 2026-09-21: bumped for the build.agent enum widening (go-1.23/1.24,
# python-3.12/3.13 - see schemas/cicd.schema.json and catalog/lib/build-agents.env)
# that Airframe's own GoApplication/PythonApplication XRDs needed to scaffold a
# real, version-matched cicd.yaml at onboarding instead of a version-pinned stub.
#
# 2026-09-22: bumped for the build.dockerfile -> build.containerfile schema rename.
# The previous tag's baked-in schema.json still had additionalProperties: false on
# `build` with no `containerfile` key, so any cicd.yaml using the new key name
# failed validate-cicd-config outright ("Additional property containerfile is not
# allowed") - found live on backstage right after Airframe's own scaffold templates
# were bumped to write `containerfile:`, not `dockerfile:` (idp-service-catalog
# v0.3.77). Same staleness class the comment above already describes: the schema
# source was correct, only the baked image lagged.
# 2026-09-27: bumped again for deploy.releaseFile (D9/AF-5's cicd.schema.json field,
# schema-only so far - no Task reads it yet). Multi-arch (arm64+amd64), built via
# `container build -a arm64 -a amd64` per the toolbox Dockerfile's own comment.
# 2026-10-23: bumped for cicd.yaml's api block (api.spec/api.type, read by attest-api-spec.yaml).
# 2026-10-23, -2: api.spec's pattern used a lookahead, which yajsv (Go RE2) cannot compile, so every build's
# preflight failed until this tag. catalog-ci's schema-yajsv job now runs the same validator.
# 2026-10-24: bumped for oasdiff 1.33.0 (the api-compat release check's OpenAPI diff).
# 2026-10-26: bumped for the Kyverno CLI 1.19.0 (the policy-validation release check, ADR-0028).
toolboxImage: ghcr.io/jfillman/glidepath-toolbox:2026-10-26-kyverno
# The shared Trivy server image-scan.yaml scans against (glidepath-control-plane's trivyServer). Empty, or a
# server that does not answer /healthz, means each scan downloads the DB itself (the pre-2026-10-09 behaviour).
trivyServerUrl: http://trivy-server.platform-system.svc.cluster.local:4954

# The cluster's default environment chart (ADR-0023 slice 1). Set from the cluster repo's cluster-defaults.yaml
# (the platform-cicd-catalog Application reads it as a value file), the same file the environment ApplicationSets
# and glidepath-app read, so the values gate validates against the chart environments actually render.
# No repoURL/targetRevision default: the fleet's Airframe repo and version are input. validate-values.yaml fails the
# render without targetRevision (when valuesValidatorImage is unset) and passes repoURL to the validator.
defaultChart:
  repoURL: ""
  path: charts/airframe-application
  targetRevision: ""

# The image the values-validation gate (tasks/validate-values.yaml) runs against a gitops PR's values files.
# It must provide `validate-values [--app NAME] FILE...` on its PATH, exit 0 = valid. Empty (the default) means
# Airframe's own validator at the default chart's tag: workflow airframe-validate-image publishes
# <valuesValidatorRepository>:<tag> for every Airframe release tag, carrying that tag's chart. Set it only for a
# validator that does not follow the chart tag. Public, like the toolbox image. No default: the validator image is
# Airframe's published artifact, so where it lives follows the fleet's Airframe (set it beside defaultChart, e.g.
# ghcr.io/<owner>/airframe-validate). The render fails when both this and valuesValidatorImage are empty.
valuesValidatorRepository: ""
valuesValidatorImage: ""

# Base URL of the Backstage backend that notify-backstage.yaml POSTs to. One Backstage
# instance platform-wide (not one per cluster, not one per Application), so this is a
# chart-level value rather than a per-app cicd.yaml field. Every Pipeline runs on the dev
# cluster and Backstage may run on another, so this is normally Backstage's externally
# reachable Gateway URL (e.g. http://backstage.example.internal), NOT an in-cluster
# Service DNS name, and the Gateway's listener port rather than Backstage's own :7007
# Service port. Empty by default - notify-backstage.yaml treats an empty value the same as
# notifications.backstage.enabled being unset: skip cleanly, don't fail the pipeline. See
# docs/admin/notifications.md.
backstageBaseUrl: ""

# Companion to backstageBaseUrl above, for a Backstage hostname a pod's DNS cannot resolve:
# when set, deliver-onboarding-files.yaml writes a run-wide hostAliases entry pinning
# backstageBaseUrl's host to this IP into a new/resynced app's git-rooted .tekton/*.yaml
# PipelineRuns (setting it without backstageBaseUrl fails the render). Must equal
# glidepath-control-plane's backstageHostAliasIP, which forwards the same alias to every
# app's glidepath-app (flow-triggers.yaml/release-outcome-trigger.yaml, for the
# CDEvents-chained steps a flow's git-rooted first step doesn't cover). A lab IP that changes
# on restart has to be updated in both when it changes. Empty by default (and normally): no
# hostAliases entry is rendered.
backstageHostAliasIP: ""

# Cluster-agnostic namespace derivation: which namespace Tekton Chains runs in -
# matters here because verify-image-provenance.yaml/verify-sast-attestation.yaml
# verify the Chains controller's own signing identity by SERVICE ACCOUNT NAMESPACE
# (certificate-identity-regexp), a security-critical check, not cosmetic. Defaults to
# tektoncd/operator's single-targetNamespace convention (see
# gitops-cluster-dev/50-platform-cicd/tekton-operator/) - the sole install path now.
tektonChainsNamespace: tekton-pipelines

# OIDC issuers a Chains signing certificate may name (the `iss` of the ServiceAccount token
# Fulcio exchanged). verify-image-provenance.yaml/verify-sast-attestation.yaml accept any of
# them, matched exactly. The kind default is the API server's built-in issuer; a cluster with
# its own public issuer (apron clusterIdentity) lists that one too, and keeps the old one for
# as long as attestations signed under it still need to verify.
sigstoreIssuers:
  - https://kubernetes.default.svc.cluster.local

# Single source of truth for every guardrail gate enforced on a gitops-repo release PR
# (docs/admin/release-guardrails.md). Adding or removing a gate here is only PART of the
# change - it also needs its own catalog Pipeline (a dedicated one for a real gate, or
# just a new .tekton/pull-request-<name>.yaml onboarding template pointing at the shared
# `governance-check` Pipeline for a stub - see governance-check.yaml/governance-gate-
# stub.yaml) plus a matching required-status-check entry in the gitops repo's own branch
# protection (a manual GitHub setting, not platform IaC - see release.md). This list
# itself only drives the two places that used to hardcode all four original gate names:
# detect-bypass-merge.yaml's break-glass check and open-release-pr.yaml's PR-body table.
# `status: real` vs `stub` controls only how each is described in that table - it has no
# effect on enforcement (branch protection enforces every required check identically
# regardless of stub-ness; see ADR-0003 for why a stub is still a real, structurally-loud
# gate, just one whose check always reports "stub" rather than passing real judgment).
# `class` (ADR-0021 decision 8, ADR-0020): integrity | content | process | approval - what the gate
# protects, which decides how it treats a rollback to an eligible target (integrity blocks, content
# records without blocking, process unchanged). `targets` lists the deploy.target values the gate
# applies to (absent = every target); it decides which gates a cloud target's release pin PR gets.
# The check ride (docs/admin/testing.md): the one TestWorkflow per app that a release
# depends on. A `role: check-ride` test step runs <app>-<workflowName> from the shared
# check-rides repository, synced into Testkube's namespace by Argo CD (the cluster
# repo's 50-glidepath/check-rides), never a file from the app repo. Its passing run is
# attested onto the image through Tekton Chains and read by the qa gate (below).
checkRide:
  workflowName: check-ride

# The qa gate (docs/admin/testing.md, phase 3): what counts as a passing check ride in the
# promoted image's test provenance. qa-gate.yaml reads these as its param defaults.
qa:
  # The Argo CD Application that syncs the check-rides repository into Testkube's namespace
  # (the cluster repo's 50-glidepath/check-rides). A ride counts only when run-testworkflow
  # recorded workflow-source "argocd:<this name>" - the fence: never a workflow from the app repo.
  checkRidesApplication: check-rides
  # How old the newest passing check ride may be, from the attestation's Rekor integration
  # time (the provenance's buildFinishedOn only if the entry has none) to the gate's run.
  # Ns, Nm, Nh or Nd. A rollback to an eligible target is advisory and not held to this.
  maxAge: 72h

# The api-compat release check (docs/admin/api-compat.md).
apiCompat:
  # Block (only when the gate is also required) when a breaking change touches an operation observed in use in the
  # target environment and no app owner has overridden it with `/api-break-ok <reason>`. false: report only.
  blockWhenInUse: false
  # How far back "in use" looks, a PromQL range.
  usageWindow: 7d
  # Where each target cluster's span metrics can be queried from this cluster's pipeline pods, keyed by cluster
  # registry name: {url: http://...}, a Prometheus-compatible query endpoint. Only endpoints these pods reach
  # without credentials: no token is minted or stored for this. A cluster missing here has usage "unknown",
  # and unknown usage never blocks. Example for the control-plane cluster itself:
  #   hangar-dev: { url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090 }
  usage: {}

# Release-signing policy (docs/admin/commit-signing.md): who may sign, and who may merge, the app commit a
# release promotes - read by the provenance gate (verify-commit-signature.yaml) and passed to Conforma as rule
# data (verify-image-provenance.yaml). Admin-owned on purpose: it used to be each app's cicd.yaml
# (governance.allowedCommitSigners), so the team being gated could add itself to the list that gates it. The
# default is this file (a glidepath PR); a cluster sets its own in the cluster repo's 50-glidepath/glidepath-catalog
# values - never cicd.yaml or Tower. A product owner asks for a change there; a platform admin merges it.
# Rendered into ConfigMap release-signing-policy in this namespace (templates/release-signing-policy.yaml).
# apps.<name> merges over defaults (jq `*`): objects merge key by key, a list or a scalar replaces, so an app's own
# allowedCommitSigners replaces the default list, and `enabled: false` turns a default off for one app.
# An app's cicd.yaml can only TIGHTEN githubMerge (governance.githubMerge.mode: strict, a higher
# requiredApprovals); it cannot enable the path or name mergers.
releaseSigning:
  defaults:
    # Emails allowed to gitsign the promoted commit (and, in strict mode, every commit of the merged PR). Plain
    # addresses, no regex. Empty fails every gitsign verification closed ("refusing an empty allowlist").
    allowedCommitSigners: []
    # Accept a commit GitHub made by merging a pull request (merge commit, squash or rebase, signed with GitHub's
    # web-flow key), when GitHub's record proves which allowed person merged it. Off by default: a web-flow
    # signature fails exactly as before.
    githubMerge:
      enabled: false
      # merger: the merge itself is the evidence (GitHub's key + merged_by in allowedMergers).
      # strict: also every commit in the PR is gitsign-signed by an allowedCommitSigners address.
      mode: merger
      # GitHub logins (case-insensitive) whose merge counts. Empty with enabled: true fails closed. List people,
      # not bots, so a person still presses merge.
      allowedMergers: []
      # APPROVED reviews required on the PR's final head, by allowedMergers logins other than the merger. 0 = none.
      # The gate's version of a ruleset's required reviews: it holds on GitHub Free and records who approved.
      requiredApprovals: 0
  # Per-app entries, keyed by app name, e.g.:
  #   backstage:
  #     githubMerge: { enabled: true, allowedMergers: [jfillman] }
  apps: {}

# Change management (docs/admin/change-management.md): the `itsm` gate as a wrapper over whatever change tool a
# company runs. `none` (the default) keeps the gate a loud stub and every lifecycle hook a no-op. `servicenow`
# talks to the Table API on change_request; `webhook` POSTs one JSON body per call to an adapter endpoint that
# fronts any other tool (the contract is in files/lib/itsm.sh). With a provider set, open-release-pr creates a
# change request per release (an emergency change for a rollback, linked to the change it rolls back), the itsm
# gate verifies it is approved or scheduled, mark-release-merged moves it to implementing, and the relay's
# healthy / rolled-back outcomes close it successful / unsuccessful. The change's id, number and URL are on the
# release record (release-tracking-<chain-id>: changeRequestId/Number/Url/State) and resolve-release-tracking's
# results. Whether the gate blocks is the registry: releaseGuardrails[itsm].required (true by default).
itsm:
  provider: none
  # The Kubernetes Secret, in each app's -cicd namespace, holding the change tool's credentials: `token` (sent as a
  # bearer) or `username` + `password` (basic). The control plane fans it out from the platform's Infisical project
  # (glidepath-control-plane itsm.credentials, a ClusterExternalSecret) - never a value here. Missing: unauthenticated,
  # with a warning in the log (a lab's throwaway endpoint).
  credentialsSecret: itsm-credentials
  servicenow:
    # https://<instance>.service-now.com, no trailing slash.
    instanceUrl: ""
    # change_request.state values that count as approved or scheduled for the gate (approval == "approved" always
    # counts): -2 Scheduled, -1 Implement by ServiceNow's default change model.
    approvedStates: ["-2", "-1"]
  webhook:
    # The adapter endpoint. The lab runs hack/lab/itsm_mock_server.py behind it (an Argo CD Application over hack/lab).
    url: ""

# Each entry: name (= the PipelineRun generateName prefix, so the check is "Pipelines as Code CI / <name>-"),
# description, status (real | stub), class (content | process | integrity | approval), optional targets, and
# `required` (default true). required: false makes a real gate ADVISORY on every release PR: its Pipeline renders
# only the -advisory copy of its check (onError: continue, docs/admin/release-guardrails.md), so the check run is
# green and the PR comment says what it found and that it did not block; detect-bypass-merge, release-log-emit
# and hack/apply-guardrail-ruleset.sh leave it out of the required set (a merge past it is not a bypass). A stub
# ignores the field. sast and provenance refuse required: false (the chart fails to render): they are the image's
# integrity, and advising on them is exactly the "advises rather than enforces" weakness the SDLC review named.
# Platform knob, not an app setting: the default is this file (a glidepath PR); one cluster overrides it through
# releaseGuardrailOverrides below (the cluster repo's 50-glidepath/glidepath-catalog) - never cicd.yaml or Tower.
releaseGuardrails:
  - name: sast
    description: Static analysis (Semgrep) of the promoted commit's source
    status: real
    class: content
    required: true
  - name: image-scan
    description: Vulnerability scan (Trivy) of the promoted image
    status: real
    class: content
    required: true
  - name: provenance
    description: Commit signature (gitsign, or a GitHub PR merge by an allowed login) + SLSA provenance (Conforma)
    status: real
    class: integrity
    required: true
  - name: sbom
    description: Software bill of materials
    status: real
    class: content
    required: true
  # name must equal the PipelineRun generateName prefix (values-): wait-for-release-guardrails looks up the check
  # "Pipelines as Code CI / <name>-".
  - name: values
    description: Values-file validation (strict keys, component XRD specs, helm template) by the validator image
    status: real
    class: integrity
    required: true
    targets: [k8s-rollout]
  # `status` follows itsm.provider (stub while none, real otherwise - glidepath-catalog.guardrails); `required`
  # applies once a provider is set: false makes an unapproved change advisory (the comment says so) instead of a
  # failed check.
  - name: itsm
    description: An approved or scheduled change request for this release in the change tool (ServiceNow, or any tool behind the webhook adapter)
    status: stub
    class: process
    required: true
  - name: api-compat
    description: "API compatibility - the promoted image's signed API spec (cicd.yaml api.spec) diffed against the spec of the image the target environment runs, with the operations each breaking change touches and whether they are in use"
    status: real
    class: content
    # Warn-only to start (user decision 2026-10-23). Even required, it blocks only what apiCompat.blockWhenInUse
    # allows (a breaking change to an operation observed in use, with no owner override); docs/admin/api-compat.md.
    required: false
  - name: qa
    description: A passing, recent check ride from the shared check-rides repository, attested on the promoted image
    status: real
    class: content
    # Advisory until every app with a Flight environment has apps/<app>/check-ride.yaml in the check-rides
    # repository and a role: check-ride test step (docs/admin/testing.md); flip to true then.
    required: false
  # Real since 2026-10-26 (ADR-0028): the release PR's environments rendered and evaluated offline against the target
  # cluster's admission policies from git (glidepath-control-plane's policyValidation, served by the broker). class integrity, like values: it judges whether
  # the release can be applied at all, not the image, so it has no rollback-advisory copy - the cluster's admission
  # makes no exception for a rollback either. Required from the start: only a Deny/Enforce policy's violation blocks
  # (one Argo CD's sync would hit anyway); Audit/Warn policies and undecidable rules are warnings.
  - name: policy-validation
    description: The release's rendered manifests evaluated offline (Kyverno CLI) against the target cluster's admission policies (ValidatingPolicy, ClusterPolicy, ValidatingAdmissionPolicy) from its GitOps repo
    status: real
    class: integrity
    required: true
    targets: [k8s-rollout]

# Per-cluster overrides of `required`, keyed by gate name, for a cluster's catalog Application values:
#   releaseGuardrailOverrides:
#     qa: { required: true }
# A map merges with the chart default; overriding releaseGuardrails itself would replace the whole list, so a
# gate added upstream would silently vanish on that cluster. Only `required` is read here. Every consumer of the
# registry (the gate Pipelines, detect-bypass-merge, release-log-emit, open-release-pr) renders from the merged
# result (_helpers.tpl, glidepath-catalog.guardrails); hack/apply-guardrail-ruleset.sh takes the same file with -f.
releaseGuardrailOverrides: {}

# Per-app advisory gates (2026-10-28), admin-owned like the map above - never cicd.yaml, never Tower:
#   releaseGuardrailOverridesByApp:
#     backstage:
#       image-scan: { required: false }   # 85 HIGH trixie base CVEs with no fix yet
# Narrower than the per-cluster form: the gate still runs as a hard check and posts its real verdict on that app's
# release PRs (red stays red), but nothing that decides whether the release may go ahead waits on it for that app -
# the promotion fan-in, promote's PROM-03, detect-bypass-merge, release-log-emit's bypass flag,
# wait-for-release-guardrails, the PR body's table and hack/apply-guardrail-ruleset.sh. Only `required: false` is
# accepted; sast, provenance and image-promotion, an unknown gate and a non-plain app name fail the render
# (_helpers.tpl glidepath-catalog.advisoryGatesByApp, docs/admin/release-guardrails.md).
releaseGuardrailOverridesByApp: {}

# Ground and Flight registries (ADR-0029). Ground is where builds push and what lower clusters, Testkube and the
# release gates read. Flight is what a Flight environment's release file pins once promotion is on; only the
# promoter writes it. Admin-owned: never cicd.yaml, never Tower settings. A namespace of "" means the app's GitHub
# owner, which is today's behaviour, so both blocks default to exactly what was hardcoded before.
registries:
  ground: { host: ghcr.io, namespace: "" }
  flight: { host: ghcr.io, namespace: "" }
promotion:
  # On: open-release-pr pins the Flight repository (the promote pipeline copies the image there). Off (default):
  # a Flight release pins the Ground repository, as before. Needs pinDigest.
  enabled: false
  # Write release.image.digest and release.image.source into every release file (deploy-manifests for Ground
  # environments, open-release-pr for Flight). airframe-application before v0.3.166 rejects both keys, so turn this
  # on only after every cluster's defaultChart is at v0.3.166 or later.
  pinDigest: false
  # The promote pipeline (ADR-0029 phase 2, docs/admin/registries.md): it starts this workflow through the broker's
  # /promoter-token (glidepath-control-plane promoter.*), waits for it, verifies the copy in Flight
  # (registries.flight.namespace) and posts the release PR's image-promotion check. Empty repo: the pipeline refuses.
  promoter:
    repo: ""            # <owner>/<repo> of the promote workflow
    workflow: promote.yaml
    ref: main
    timeoutMinutes: 20
    # The promotion attestation's signer (keyless, public Sigstore): the workflow's own Actions identity.
    issuer: https://token.actions.githubusercontent.com
