# catalog/tasks/verify-image-provenance.yaml
#
# Image-provenance half of the real `provenance` gate (renamed from `policy-check`
# 2026-08-23, see docs/admin/release-guardrails.md - verify-commit-signature.yaml is the
# commit-signature half). Verifies the promoted image's cosign signature/SLSA provenance
# attestation (both produced by Tekton Chains), then evaluates it with Conforma against the
# base policy plus this app's own policy data.
#
# Uses cosign + `ec validate input` rather than one `ec validate image` call: `ec`'s built-in
# signature verification needs a TUF trust root, and a self-hosted TUF repo for our own Fulcio
# (no public trust, no live mirror) is heavy for what should be a simple local trust anchor.
# cosign verifies against a local --trusted-root instead; ec then runs pure policy evaluation
# on the already-verified payload - same 3-stage design `ec validate image` itself documents,
# just split across tools. See docs/provenance-policy.md for more.
#
# --insecure-ignore-sct stays on cosign calls: no CT log is deployed for Fulcio (a
# genuinely separate mechanism from Rekor's artifact tlog, out of scope here). Rekor
# itself is now real (docs/admin/provenance-policy.md) - --insecure-ignore-tlog is gone,
# replaced with real tlog verification against our self-hosted rekor-server. This is the
# actual fix for the Fulcio short-lived-cert-expiry gate failure (docs/admin/
# release-guardrails.md's "known open issue"): cosign uses the Rekor entry's own
# integrated timestamp to prove the signing cert was valid AT SIGNING TIME, instead of
# checking cert validity against current (release-PR) time.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-image-provenance
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's `repo_url`.
    - name: revision
      type: string
      description: The gitops PR's head commit - PaC's `revision`.
    - name: app-namespace
      type: string
    - name: app-name
      type: string
      description: Used to find <app-name>-policy-config in this Application's own namespace.
  # Audience-bound projected ServiceAccount token for the shared broker's GitHub
  # token-minting endpoint - same pattern as clone-repo-authenticated.yaml/
  # verify-commit-signature.yaml. The gitops repo this Task clones can be private, so
  # a bare unauthenticated fetch isn't enough.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
  steps:
    - name: verify
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"
        source "${PLATFORM_LIB}/retry.sh"

        gitops_owner="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        gitops_repo="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        gitops_token="$(github_app_installation_token "${gitops_owner}" "${gitops_repo}")"
        gitops_clone_url="https://x-access-token:${gitops_token}@github.com/${gitops_owner}/${gitops_repo}.git"

        workdir="$(mktemp -d)"
        with_retry 3 -- git clone --quiet "${gitops_clone_url}" "${workdir}/gitops"
        cd "${workdir}/gitops"
        git checkout --quiet "${REVISION}"

        # Promoted image ref comes straight from the manifest open-release-pr.yaml patches -
        # already the authoritative record of what's being promoted. Found via `git diff`
        # rather than a hardcoded path since this Task runs off the gitops repo's own PR
        # webhook with no env/cluster param, and the target is a scaffolded
        # <cluster>/<env>/values.yaml (idp-application Helm values), not a fixed Deployment path.
        manifest="$(git diff --name-only HEAD~1 HEAD -- '*/values.yaml' | head -1)"
        if [[ -z "${manifest}" ]]; then
          echo "FAIL: no */values.yaml changed between HEAD~1 and ${REVISION} - expected open-release-pr.yaml's single surgical image-tag commit" >&2
          exit 1
        fi
        image_repo="$(yq -r '.rollout.image.repository' "${manifest}")"
        image_tag="$(yq -r '.rollout.image.tag' "${manifest}")"
        if [[ -z "${image_repo}" || "${image_repo}" == "null" || -z "${image_tag}" || "${image_tag}" == "null" ]]; then
          echo "FAIL: could not read rollout.image.repository/tag from ${manifest}" >&2
          exit 1
        fi
        image_ref="${image_repo}:${image_tag}"

        # cosign's signature/attestation lookup is digest-keyed, so a plain tag reference
        # fails with "no signatures found" even when signatures exist - resolve to a digest
        # first. Registry API called directly per GHCR's token convention (this platform is
        # GHCR-specific, not a generic OCI discovery flow).
        registry="${image_ref%%/*}"
        rest="${image_ref#*/}"
        repo="${rest%:*}"
        tag="${rest##*:}"
        token="$(curl -fsSL --retry 3 --retry-connrefused --max-time 15 "https://${registry}/token?service=${registry}&scope=repository:${repo}:pull" | jq -r '.token')"
        # Accept both Docker v2 and OCI manifest media types - kaniko pushes OCI-format
        # manifests, and requesting only the Docker v2 type 404s even though the manifest exists.
        digest="$(curl -fsSL -D - -o /dev/null --retry 3 --retry-connrefused --max-time 15 \
          -H "Authorization: Bearer ${token}" \
          -H "Accept: application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
          "https://${registry}/v2/${repo}/manifests/${tag}" \
          | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}')"
        if [[ -z "${digest}" ]]; then
          echo "FAIL: could not resolve digest for ${image_ref}" >&2
          exit 1
        fi
        image_ref="${registry}/${repo}@${digest}"
        echo "Verifying provenance for ${image_ref}"

        # Public half of Fulcio's root CA - kept in a separate ConfigMap from fulcio-secret.
        kubectl get configmap fulcio-root-ca -n platform-catalog \
          -o jsonpath='{.data.cert\.pem}' > "${workdir}/fulcio-root.pem"

        # Public half of Rekor's tlog signing key - fetched LIVE from Rekor's own
        # /api/v1/log/publicKey, not a cached ConfigMap (that was the original design,
        # synced by a control-plane-chart hook Job - removed 2026-09-06 after it caused
        # a real live failure: Rekor's Trillian tree got recreated independently of the
        # control-plane chart's own install/upgrade cycle - a separate ArgoCD
        # Application owns Rekor - so nothing re-ran the sync Job, and the cached
        # ConfigMap silently kept serving a stale key. cosign's signature check against
        # that wrong key failed exactly like a missing tlog entry would
        # ("not enough verified log entries from transparency log: 0 < 1"), with no
        # hint it was actually a key mismatch - confirmed live by diffing the
        # ConfigMap's key against this same endpoint's current response. Rekor's key is
        # genuinely public data with a live discovery endpoint; caching it was the bug,
        # not a performance optimization worth keeping.
        curl -fsSL --max-time 10 http://rekor-server.rekor-system.svc/api/v1/log/publicKey > "${workdir}/rekor.pub"

        # --trusted-root (a local JSON doc) replaces the older --ca-roots (bare PEM): once
        # generate-sbom.yaml started signing via cosign 3.x's newer bundle format, cosign
        # requires --trusted-root unconditionally, even to verify this unrelated attestation.
        # Built the same way generate-sbom.yaml builds it, from the same fulcio-root-ca source.
        # start-time is fixed to an arbitrary date well before this cluster's own Rekor
        # existed - same "always valid" convention as Fulcio's root, not a real service
        # start time (this Rekor has no historical entries to bound against anyway).
        cosign trusted-root create \
          --fulcio="url=http://fulcio-server.fulcio-system.svc,certificate-chain=${workdir}/fulcio-root.pem" \
          --rekor="url=http://rekor-server.rekor-system.svc,public-key=${workdir}/rekor.pub,start-time=2020-01-01T00:00:00Z" \
          --no-default-ctfe --no-default-tsa \
          --out "${workdir}/trusted-root.json"

        identity_regexp="^https://kubernetes\.io/namespaces/{{ .Values.tektonChainsNamespace }}/serviceaccounts/.*$"
        issuer="https://kubernetes.default.svc.cluster.local"

        # No separate bare-image `cosign verify` - Chains here only produces attestations
        # (.att), not a standalone image signature (.sig, which needs a TaskRun-level type
        # hint we don't set). Not a gap: the attestation's signed payload already records
        # the exact image digest, so verifying it proves the same thing a signature would.

        # Attestation signature + extract the verified provenance payload.
        #
        # Not a single `cosign verify-attestation --type slsaprovenance` call: this image
        # carries two attestations in different DSSE envelope formats (Chains' SLSA
        # provenance, older plain envelope; generate-sbom's CycloneDX SBOM, cosign 3.x bundle
        # format). cosign's --type filter doesn't reliably exclude the non-matching one before
        # verifying identity, so a bad SBOM-attestation identity check fails the whole
        # verification even when a valid provenance attestation is also present - this was
        # the root cause of the old sbom+policyCheck conflict (now fixed; both can be enabled
        # together).
        #
        # Fix: filter by type ourselves in jq first, then verify each survivor individually
        # via `cosign verify-blob-attestation` (single-candidate, no registry-side type
        # discovery). That command requires a new-bundle-format sigstore bundle regardless of
        # the attestation's original format, so one is built by hand: the newer format already
        # has everything needed; the older plain envelope's cert isn't in the envelope JSON at
        # all - it lives in the `.att` OCI tag's manifest annotations instead.
        att_dir="${workdir}/attestations"
        mkdir -p "${att_dir}"
        cosign download attestation "${image_ref}" > "${att_dir}/all-attestations.jsonl" 2>/dev/null || true
        if [[ ! -s "${att_dir}/all-attestations.jsonl" ]]; then
          echo "FAIL: no attestations found for ${image_ref}" >&2
          exit 1
        fi

        att_token=""
        i=0
        provenance_files=()
        while IFS= read -r line; do
          is_bundle="$(jq -r 'has("dsseEnvelope")' <<<"${line}")"
          if [[ "${is_bundle}" == "true" ]]; then
            payload_b64="$(jq -r '.dsseEnvelope.payload' <<<"${line}")"
          else
            payload_b64="$(jq -r '.payload' <<<"${line}")"
          fi
          predicate_type="$(echo "${payload_b64}" | base64 -d | jq -r '.predicateType')"
          if [[ "${predicate_type}" != "https://slsa.dev/provenance/v0.2" ]]; then
            continue
          fi

          if [[ "${is_bundle}" == "true" ]]; then
            cert_der_b64="$(jq -r '.verificationMaterial.certificate.rawBytes' <<<"${line}")"
            sig_b64="$(jq -r '.dsseEnvelope.signatures[0].sig' <<<"${line}")"
          else
            if [[ -z "${att_token}" ]]; then
              att_token="$(curl -fsSL --retry 3 --retry-connrefused --max-time 15 "https://${registry}/token?service=${registry}&scope=repository:${repo}:pull" | jq -r '.token')"
            fi
            att_manifest="$(curl -fsSL --retry 3 --retry-connrefused --max-time 15 -H "Authorization: Bearer ${att_token}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://${registry}/v2/${repo}/manifests/sha256-${digest#sha256:}.att")"
            cert_pem="$(jq -r '.layers[0].annotations["dev.sigstore.cosign/certificate"]' <<<"${att_manifest}")"
            cert_der_b64="$(echo "${cert_pem}" | openssl x509 -outform DER | base64 | tr -d '\n')"
            sig_b64="$(jq -r '.signatures[0].sig' <<<"${line}")"
          fi
          payload_type="$(jq -r 'if has("dsseEnvelope") then .dsseEnvelope.payloadType else .payloadType end' <<<"${line}")"

          # Written to files, not passed via jq --arg - the base64 payload can exceed the
          # OS argv size limit ("Argument list too long"); --rawfile has no such ceiling.
          printf '%s' "${cert_der_b64}" > "${att_dir}/cert-${i}.txt"
          printf '%s' "${payload_b64}" > "${att_dir}/payload-${i}.txt"
          printf '%s' "${sig_b64}" > "${att_dir}/sig-${i}.txt"
          printf '%s' "${payload_type}" > "${att_dir}/ptype-${i}.txt"

          # Real tlog entry lookup - required now that --insecure-ignore-tlog=false below
          # actually checks it. Chains' OCI-stored attestation (legacy plain-envelope
          # format for provenance) never embeds the Rekor inclusion proof itself, only the
          # cert/payload/sig - confirmed live, not assumed (a --bundle with no tlogEntries
          # always reports "0 < 1 verified log entries" regardless of whether Rekor
          # actually logged it). Rekor's own search index is keyed by sha256 of the raw
          # DSSE payload bytes (confirmed live via `redis-cli` against rekor-redis's real
          # keys, cross-checked against a known entry's own payloadHash field) - not the
          # cert, not a public key, not the image digest, all of which return nothing.
          payload_hash="$(echo "${payload_b64}" | base64 -d | sha256sum | awk '{print $1}')"
          # Retried, not a single shot: confirmed live 2026-09-05 that Trillian commits
          # the entry immediately (Chains' own logs show a real logIndex right after
          # upload) but rekor-redis's search index - what /api/v1/index/retrieve
          # actually queries - lags a few seconds behind. A verify Task running this
          # soon after the signing step (the normal case, same pipeline chain) can hit
          # an empty index result even though the entry genuinely exists; re-running the
          # exact same search moments later (manually, post-incident) found it
          # immediately. with_retry's exponential backoff (2/4/8/16/32s, ~62s total)
          # comfortably clears this indexing lag without masking a real "never logged"
          # case, which still fails after all attempts.
          rekor_uuid_file="${att_dir}/rekor-uuid-${i}.txt"
          rekor_index_lookup() {
            local uuid
            uuid="$(curl -fsSL --max-time 10 -X POST -H "Content-Type: application/json" \
              -d "{\"hash\": \"sha256:${payload_hash}\"}" \
              http://rekor-server.rekor-system.svc/api/v1/index/retrieve | jq -r '.[0] // empty')"
            [[ -n "${uuid}" ]] || return 1
            printf '%s' "${uuid}" > "${rekor_uuid_file}"
          }
          if ! with_retry 6 -- rekor_index_lookup; then
            echo "FAIL: no Rekor tlog entry found for attestation payload hash ${payload_hash} after retrying - was it signed before Rekor was deployed, or before transparency.enabled was set?" >&2
            exit 1
          fi
          rekor_uuid="$(cat "${rekor_uuid_file}")"
          rekor_entry="$(curl -fsSL --max-time 10 "http://rekor-server.rekor-system.svc/api/v1/log/entries/${rekor_uuid}" | jq ".[\"${rekor_uuid}\"]")"
          rekor_body_b64="$(jq -r '.body' <<<"${rekor_entry}")"
          # logID/rootHash/hashes come back hex from Rekor's REST API but cosign's bundle
          # schema wants them base64 (confirmed by diffing a real cosign-sign-blob-produced
          # bundle against Rekor's raw API response for the same entry).
          # -j (not -r): the checkpoint string already ends in its own real newline, and
          # Rekor's "signed note" format is newline-exact - -r would add a second one and
          # break parsing (confirmed live: "unmarshalling signed note: malformed note").
          jq -j '.verification.inclusionProof.checkpoint' <<<"${rekor_entry}" > "${att_dir}/checkpoint-${i}.txt"
          hashes_json="$(jq -r '.verification.inclusionProof.hashes[]' <<<"${rekor_entry}" | while read -r h; do echo "${h}" | xxd -r -p | base64 -w0; echo; done | jq -R . | jq -s .)"
          jq -n \
            --arg logIndex "$(jq -r '.logIndex' <<<"${rekor_entry}")" \
            --arg logId "$(jq -r '.logID' <<<"${rekor_entry}" | xxd -r -p | base64 -w0)" \
            --arg kind "$(echo "${rekor_body_b64}" | base64 -d | jq -r '.kind')" \
            --arg version "$(echo "${rekor_body_b64}" | base64 -d | jq -r '.apiVersion')" \
            --arg integratedTime "$(jq -r '.integratedTime' <<<"${rekor_entry}")" \
            --arg sigEntryTs "$(jq -r '.verification.signedEntryTimestamp' <<<"${rekor_entry}")" \
            --arg inclLogIndex "$(jq -r '.verification.inclusionProof.logIndex' <<<"${rekor_entry}")" \
            --arg inclRootHash "$(jq -r '.verification.inclusionProof.rootHash' <<<"${rekor_entry}" | xxd -r -p | base64 -w0)" \
            --arg inclTreeSize "$(jq -r '.verification.inclusionProof.treeSize' <<<"${rekor_entry}")" \
            --argjson hashes "${hashes_json}" \
            --rawfile checkpoint "${att_dir}/checkpoint-${i}.txt" \
            --arg body "${rekor_body_b64}" \
            '{logIndex: $logIndex, logId: {keyId: $logId}, kindVersion: {kind: $kind, version: $version},
              integratedTime: $integratedTime, inclusionPromise: {signedEntryTimestamp: $sigEntryTs},
              inclusionProof: {logIndex: $inclLogIndex, rootHash: $inclRootHash, treeSize: $inclTreeSize,
                hashes: $hashes, checkpoint: {envelope: $checkpoint}},
              canonicalizedBody: $body}' \
            > "${att_dir}/tlog-${i}.json"

          bundle_file="${att_dir}/bundle-${i}.json"
          jq -n \
            --rawfile cert "${att_dir}/cert-${i}.txt" \
            --rawfile payload "${att_dir}/payload-${i}.txt" \
            --rawfile payloadType "${att_dir}/ptype-${i}.txt" \
            --rawfile sig "${att_dir}/sig-${i}.txt" \
            --slurpfile tlogEntries "${att_dir}/tlog-${i}.json" \
            '{mediaType: "application/vnd.dev.sigstore.bundle.v0.3+json",
              verificationMaterial: {certificate: {rawBytes: $cert}, tlogEntries: $tlogEntries},
              dsseEnvelope: {payload: $payload, payloadType: $payloadType, signatures: [{sig: $sig}]}}' \
            > "${bundle_file}"

          cosign verify-blob-attestation \
            --bundle "${bundle_file}" \
            --digest "${digest#sha256:}" \
            --digestAlg sha256 \
            --insecure-ignore-tlog=false \
            --insecure-ignore-sct=true \
            --trusted-root "${workdir}/trusted-root.json" \
            --certificate-identity-regexp "${identity_regexp}" \
            --certificate-oidc-issuer "${issuer}" \
            --type slsaprovenance

          payload_file="${att_dir}/provenance-${i}.json"
          echo "${payload_b64}" | base64 -d > "${payload_file}"
          provenance_files+=("${payload_file}")
          i=$((i + 1))
        done < "${att_dir}/all-attestations.jsonl"

        if [[ ${#provenance_files[@]} -eq 0 ]]; then
          echo "FAIL: no verified slsaprovenance attestations found for ${image_ref}" >&2
          exit 1
        fi

        # Wrap as {"attestations": [{"statement": <payload>}]} before handing to `ec` -
        # required, not cosmetic. Conforma's lib.pipelinerun_attestations (used by nearly
        # every slsa3-collection rule) reads input.attestations[].statement, not a bare
        # Statement; without this wrapping it silently resolves to an empty list and every
        # rule built on it reports a vacuous "Pass". `ec validate image` does this wrapping
        # internally; `ec validate input` doesn't, so it's done here.
        wrapped_provenance_file="${workdir}/wrapped-provenance.json"
        jq -s '{attestations: map({statement: .})}' "${provenance_files[@]}" > "${wrapped_provenance_file}"

        # input.image.source is read by a separate policy rule (_expected_sources) to check
        # the attestation against the real source ref. Pulled directly from the clone task's
        # own results rather than round-tripped through materials, since this is the source
        # of truth. Revision must be the full commit SHA, not a symbolic ref.
        #
        # Matches on `.name` (the stable pipeline-task name "clone-repo" from build.yaml),
        # NOT `.invocation.environment.labels["tekton.dev/task"]` (the underlying Task CRD
        # name) - confirmed live 2026-09-06 that Chains does NOT reliably attach that label
        # to every task's provenance record (clone-repo-authenticated's own TaskRun had no
        # "tekton.dev/task" label at all, while every other task in the same PipelineRun
        # did), which silently zeroed out image.source and failed Conforma's
        # slsa_source_correlated rule. `.name` is Chains' own top-level field for each
        # buildConfig.tasks[] entry, always present, and is the one name that's genuinely
        # stable across catalog Task CRD renames (this exact label-based match already
        # broke once before, 2026-08-23, when the CRD backing this same pipeline task was
        # renamed) - a strictly better anchor than the CRD name for a lookup we don't need
        # Conforma's rule shape for.
        source_git_url="$(jq -r '[.attestations[].statement.predicate.buildConfig.tasks[]
          | select(.name == "clone-repo")
          | .results[] | select(.name == "url") | .value][0] // empty' "${wrapped_provenance_file}")"
        source_git_commit="$(jq -r '[.attestations[].statement.predicate.buildConfig.tasks[]
          | select(.name == "clone-repo")
          | .results[] | select(.name == "commit") | .value][0] // empty' "${wrapped_provenance_file}")"
        if [[ -n "${source_git_url}" && -n "${source_git_commit}" ]]; then
          jq --arg url "${source_git_url}" --arg rev "${source_git_commit}" \
            '. + {image: {source: {git: {url: $url, revision: $rev}}}}' \
            "${wrapped_provenance_file}" > "${wrapped_provenance_file}.tmp"
          mv "${wrapped_provenance_file}.tmp" "${wrapped_provenance_file}"
        fi

        # Same tenant policy-config ConfigMap verify-commit-signature.yaml reads; exposed
        # to Conforma as ruleData for future rules (no current base-policy rule checks it).
        # Same grep -v/pipefail/set -e gotcha as that file: grep -v matching nothing when no
        # signers are configured aborts the script under set -e without `|| true`.
        allowed_emails_json="$(kubectl get configmap "${APP_NAME}-policy-config" -n "${APP_NAMESPACE}" \
          -o jsonpath='{.data.allowed-commit-signers}' 2>/dev/null \
          | { grep -vE '^\s*(#.*)?$' || true; } | sed -E 's/^\s+|\s+$//g' \
          | jq -R -s -c 'split("\n") | map(select(length > 0))')"

        # Platform-wide required-tasks list (same for every app, unlike allowed-commit-signers
        # - this describes build.yaml itself). Names must be the underlying Task CRD name
        # ("tekton.dev/task" label), not the per-step pipelineTask name - that's what
        # Conforma's tasks.required_tasks_found actually matches against.
        #
        # Derived live from the real `build` Pipeline object rather than hardcoded, matching
        # this platform's "read fresh from source of truth" pattern elsewhere. A hand-written
        # list already proved the risk: it missed tasks living in spec.finally (separate from
        # spec.tasks). pipeline-runner already has the RBAC needed for this.
        #
        # `select(.when == null)` excludes the when:-gated governance-stub tasks (sast-scan/
        # image-scan/generate-sbom), which are legitimately skipped when an app's cicd.yaml
        # disables that gate.
        #
        # `git-clone[sslVerify=true]` uses Conforma's task-parameter-matching syntax to pin
        # the clone to have run with TLS verification, not just that git-clone ran at all.
        #
        # Known limitation: only resolver types that put the target name in a `name` param
        # (cluster/hub) are recognized - a task added via the `git` resolver would be
        # silently dropped. Revisit if build.yaml adopts it.
        data_dir="${workdir}/data"
        mkdir -p "${data_dir}"
        required_tasks_json="$(kubectl get pipeline build -n {{ .Release.Namespace }} -o json | jq -c '
          [(.spec.tasks // [])[], (.spec.finally // [])[] | select(.when == null) |
           (.taskRef.params[] | select(.name=="name") | .value)] | unique |
          map(if . == "git-clone" then "git-clone[sslVerify=true]" else . end)
        ')"
        jq -n --argjson tasks "${required_tasks_json}" '{
          "required-tasks": [{ "effective_on": "2020-01-01T00:00:00Z", "tasks": $tasks }]
        }' > "${data_dir}/data.json"

        # Concatenates Conforma's base policy (policy/lib + policy/release, two separate
        # required sources) with this app's own data, in one EnterpriseContractPolicy spec.
        # @slsa3 matches this item's original "high SLSA level" ambition - a deliberate,
        # not-the-safest choice (see docs/provenance-policy.md for tradeoffs).
        # allowed_builder_ids pins provenance to this platform's own Chains controller
        # identity (matches the rule's existing default; makes it explicit).
        # tasks.required_tasks_found isn't in the @slsa3 collection (tagged
        # redhat/redhat_security), so it's included individually rather than pulling in the
        # whole @redhat collection, which would also drag in trusted_task's OCI-bundle-
        # resolver trust model - a mismatch for this platform's cluster/hub-resolved
        # catalog Tasks.
        # sbom.found/sbom_cyclonedx.cdx_supported_version deliberately not included - whether
        # Conforma's own policy should assert on SBOM presence/format is a separate decision.
        #
        # NOTE: keep explanatory prose here, not inside the jq program string below - an
        # apostrophe in an inline jq comment previously broke out of the surrounding bash
        # single-quoted string and corrupted the whole command.
        policy_file="${workdir}/policy.yaml"
        jq -n --argjson emails "${allowed_emails_json:-[]}" --arg data_dir "${data_dir}/" '{
          sources: [{
            policy: [
              "github.com/conforma/policy//policy/lib?ref=main",
              "github.com/conforma/policy//policy/release?ref=main"
            ],
            data: [$data_dir],
            config: {
              include: [
                "@slsa3",
                "tasks.required_tasks_found",
                "tasks.required_tasks_list_provided",
                "tasks.data_provided"
              ]
            },
            ruleData: {
              allowed_commit_signers: $emails,
              allowed_builder_ids: ["https://tekton.dev/chains/v2"]
            }
          }]
        }' > "${policy_file}"

        # Stage 3: policy evaluation against the already-verified, correctly-wrapped
        # provenance. Real pass/fail via ec's own exit code (--strict defaults true).
        #
        # --timeout 10m: found live 2026-08-23 that ec's own default (5m) was getting
        # hit almost exactly - a real run failed with "eval_cancel_error: exceeded
        # allowed execution time of 5m0s" even though cosign's own verification just
        # above it had already succeeded ("Verified OK") - i.e. this is purely slow
        # Rego policy evaluation, unrelated to the separate cert-expiry issue documented
        # in docs/admin/release-guardrails.md. Doubling the budget is a mitigation based
        # on the one data point available (it ran right up to the old cap, not wildly
        # past it), not a proven fix - revisit if evaluation still times out at 10m; see
        # this Task's own pipelineRun timeout budget (pull-request-provenance.yaml)
        # for the matching headroom this needs upstream.
        ec validate input "${wrapped_provenance_file}" --policy "${policy_file}" --output json --timeout 10m
