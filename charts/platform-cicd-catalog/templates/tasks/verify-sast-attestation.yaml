# catalog/tasks/verify-sast-attestation.yaml
#
# Real (not a re-scan) SAST governance check. Originally sast-check.yaml re-ran Semgrep
# against the promoted commit's source at release time - genuinely redundant, caught by
# the user: the source at a fixed commit never changes, and a real build-time Semgrep
# run (build.yaml's own sast-scan Task, Phase 3 item 8.4) already produced a real,
# cryptographically-attested result. This Task looks that result up from the image's own
# SLSA provenance attestation (predicate.buildConfig.tasks[], the same field
# verify-image-provenance.yaml already reads for git-clone's url/commit) instead of
# redoing the work - genuine shift-left: SAST already blocked the BUILD if it failed
# (8.4's DAG fix makes build-image wait on sast-scan), so this is about *proving* that
# gate held for the real image being promoted, not re-running it.
#
# A missing sast-scan entry in buildConfig.tasks means the task was skipped - Tekton
# never creates a TaskRun for a when:-gated skip, and Chains' provenance only records
# real TaskRuns, so this can only mean governance.sast was false for this build. Treated
# as a pass, not a failure: cicd.yaml's own toggle is the Application's explicit choice,
# and this gate shouldn't silently override it by demanding evidence of something the
# Application never asked to run. A PRESENT task with any outcome other than "passed"
# fails closed.
#
# cosign/trusted-root/digest-resolution mechanism duplicated from verify-image-
# provenance.yaml rather than shared/refactored - same "a little duplication is safer
# than re-touching an already-verified, security-sensitive Task" precedent already used
# for resolve-app-commit.yaml vs. verify-commit-signature.yaml.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-sast-attestation
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  description: Looks up the sast-scan task's real outcome from the promoted image's own SLSA provenance attestation, rather than re-running Semgrep.
  params:
    - name: image-ref
      type: string
      description: Full image reference (repo:tag) whose build attestation records the sast-scan outcome to check.
  steps:
    - name: verify
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent  # public image on ghcr.io, not kind-loaded
      env:
        - name: IMAGE_REF
          value: $(params.image-ref)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/retry.sh"
        workdir="$(mktemp -d)"

        # Tag -> digest resolution, identical to verify-image-provenance.yaml's own -
        # cosign's attestation lookup is digest-keyed, a plain tag genuinely fails with
        # "no signatures found" even when real attestations exist.
        registry="${IMAGE_REF%%/*}"
        rest="${IMAGE_REF#*/}"
        repo="${rest%:*}"
        tag="${rest##*:}"
        token="$(curl -fsSL --retry 3 --retry-connrefused --max-time 15 "https://${registry}/token?service=${registry}&scope=repository:${repo}:pull" | jq -r '.token')"
        digest="$(curl -fsSL -D - -o /dev/null --retry 3 --retry-connrefused --max-time 15 \
          -H "Authorization: Bearer ${token}" \
          -H "Accept: application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
          "https://${registry}/v2/${repo}/manifests/${tag}" \
          | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}')"
        if [[ -z "${digest}" ]]; then
          echo "FAIL: could not resolve digest for ${IMAGE_REF}" >&2
          exit 1
        fi
        image_ref="${registry}/${repo}@${digest}"
        echo "Checking sast-scan outcome in provenance for ${image_ref}"

        kubectl get configmap fulcio-root-ca -n platform-catalog \
          -o jsonpath='{.data.cert\.pem}' > "${workdir}/fulcio-root.pem"
        kubectl get configmap rekor-public-key -n platform-catalog \
          -o jsonpath='{.data.rekor\.pub}' > "${workdir}/rekor.pub"
        cosign trusted-root create \
          --fulcio="url=http://fulcio-server.fulcio-system.svc,certificate-chain=${workdir}/fulcio-root.pem" \
          --rekor="url=http://rekor-server.rekor-system.svc,public-key=${workdir}/rekor.pub,start-time=2020-01-01T00:00:00Z" \
          --no-default-ctfe --no-default-tsa \
          --out "${workdir}/trusted-root.json"

        # Manual type-filter-then-verify-blob-attestation, not a single `cosign
        # verify-attestation --type slsaprovenance` call - same fix, same duplication
        # precedent (see this file's own header), as verify-image-provenance.yaml's
        # identical block - see that file's own comment here for the full live
        # incident writeup (cosign's own --type filter doesn't reliably exclude a
        # differently-formatted, non-matching attestation before attempting identity
        # verification against it - confirmed live, this is the actual root cause of
        # the previously-only-"narrowed" sbom+policyCheck conflict).
        identity_regexp="^https://kubernetes\.io/namespaces/{{ .Values.tektonChainsNamespace }}/serviceaccounts/.*$"
        issuer="https://kubernetes.default.svc.cluster.local"
        att_dir="${workdir}/attestations"
        mkdir -p "${att_dir}"
        cosign download attestation "${image_ref}" > "${att_dir}/all-attestations.jsonl" 2>/dev/null || true
        if [[ ! -s "${att_dir}/all-attestations.jsonl" ]]; then
          echo "FAIL: no attestations found for ${image_ref}" >&2
          exit 1
        fi

        att_token=""
        i=0
        provenance_files=()
        while IFS= read -r line; do
          is_bundle="$(jq -r 'has("dsseEnvelope")' <<<"${line}")"
          if [[ "${is_bundle}" == "true" ]]; then
            payload_b64="$(jq -r '.dsseEnvelope.payload' <<<"${line}")"
          else
            payload_b64="$(jq -r '.payload' <<<"${line}")"
          fi
          predicate_type="$(echo "${payload_b64}" | base64 -d | jq -r '.predicateType')"
          if [[ "${predicate_type}" != "https://slsa.dev/provenance/v0.2" ]]; then
            continue
          fi

          if [[ "${is_bundle}" == "true" ]]; then
            cert_der_b64="$(jq -r '.verificationMaterial.certificate.rawBytes' <<<"${line}")"
            sig_b64="$(jq -r '.dsseEnvelope.signatures[0].sig' <<<"${line}")"
          else
            if [[ -z "${att_token}" ]]; then
              att_token="$(curl -fsSL --retry 3 --retry-connrefused --max-time 15 "https://${registry}/token?service=${registry}&scope=repository:${repo}:pull" | jq -r '.token')"
            fi
            att_manifest="$(curl -fsSL --retry 3 --retry-connrefused --max-time 15 -H "Authorization: Bearer ${att_token}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://${registry}/v2/${repo}/manifests/sha256-${digest#sha256:}.att")"
            cert_pem="$(jq -r '.layers[0].annotations["dev.sigstore.cosign/certificate"]' <<<"${att_manifest}")"
            cert_der_b64="$(echo "${cert_pem}" | openssl x509 -outform DER | base64 | tr -d '\n')"
            sig_b64="$(jq -r '.signatures[0].sig' <<<"${line}")"
          fi
          payload_type="$(jq -r 'if has("dsseEnvelope") then .dsseEnvelope.payloadType else .payloadType end' <<<"${line}")"

          printf '%s' "${cert_der_b64}" > "${att_dir}/cert-${i}.txt"
          printf '%s' "${payload_b64}" > "${att_dir}/payload-${i}.txt"
          printf '%s' "${sig_b64}" > "${att_dir}/sig-${i}.txt"
          printf '%s' "${payload_type}" > "${att_dir}/ptype-${i}.txt"

          # Real tlog entry lookup - required now that --insecure-ignore-tlog=false below
          # actually checks it. See verify-image-provenance.yaml's identical block for the
          # full live incident writeup: Chains' OCI-stored legacy-format attestation never
          # embeds the Rekor inclusion proof, and Rekor's own search index is keyed by
          # sha256 of the raw DSSE payload bytes (confirmed live via redis-cli), not the
          # cert/pubkey/image-digest.
          payload_hash="$(echo "${payload_b64}" | base64 -d | sha256sum | awk '{print $1}')"
          # Retried, not a single shot - see verify-image-provenance.yaml's identical
          # block for the full live incident writeup: rekor-redis's search index lags a
          # few seconds behind Trillian's real commit, so a verify Task running this
          # soon after signing (the normal case) can hit an empty result for an entry
          # that genuinely exists.
          rekor_uuid_file="${att_dir}/rekor-uuid-${i}.txt"
          rekor_index_lookup() {
            local uuid
            uuid="$(curl -fsSL --max-time 10 -X POST -H "Content-Type: application/json" \
              -d "{\"hash\": \"sha256:${payload_hash}\"}" \
              http://rekor-server.rekor-system.svc/api/v1/index/retrieve | jq -r '.[0] // empty')"
            [[ -n "${uuid}" ]] || return 1
            printf '%s' "${uuid}" > "${rekor_uuid_file}"
          }
          if ! with_retry 6 -- rekor_index_lookup; then
            echo "FAIL: no Rekor tlog entry found for attestation payload hash ${payload_hash} after retrying - was it signed before Rekor was deployed, or before transparency.enabled was set?" >&2
            exit 1
          fi
          rekor_uuid="$(cat "${rekor_uuid_file}")"
          rekor_entry="$(curl -fsSL --max-time 10 "http://rekor-server.rekor-system.svc/api/v1/log/entries/${rekor_uuid}" | jq ".[\"${rekor_uuid}\"]")"
          rekor_body_b64="$(jq -r '.body' <<<"${rekor_entry}")"
          # -j (not -r): the checkpoint string already ends in its own real newline, and
          # Rekor's "signed note" format is newline-exact - -r would add a second one and
          # break parsing (confirmed live: "unmarshalling signed note: malformed note").
          jq -j '.verification.inclusionProof.checkpoint' <<<"${rekor_entry}" > "${att_dir}/checkpoint-${i}.txt"
          hashes_json="$(jq -r '.verification.inclusionProof.hashes[]' <<<"${rekor_entry}" | while read -r h; do echo "${h}" | xxd -r -p | base64 -w0; echo; done | jq -R . | jq -s .)"
          jq -n \
            --arg logIndex "$(jq -r '.logIndex' <<<"${rekor_entry}")" \
            --arg logId "$(jq -r '.logID' <<<"${rekor_entry}" | xxd -r -p | base64 -w0)" \
            --arg kind "$(echo "${rekor_body_b64}" | base64 -d | jq -r '.kind')" \
            --arg version "$(echo "${rekor_body_b64}" | base64 -d | jq -r '.apiVersion')" \
            --arg integratedTime "$(jq -r '.integratedTime' <<<"${rekor_entry}")" \
            --arg sigEntryTs "$(jq -r '.verification.signedEntryTimestamp' <<<"${rekor_entry}")" \
            --arg inclLogIndex "$(jq -r '.verification.inclusionProof.logIndex' <<<"${rekor_entry}")" \
            --arg inclRootHash "$(jq -r '.verification.inclusionProof.rootHash' <<<"${rekor_entry}" | xxd -r -p | base64 -w0)" \
            --arg inclTreeSize "$(jq -r '.verification.inclusionProof.treeSize' <<<"${rekor_entry}")" \
            --argjson hashes "${hashes_json}" \
            --rawfile checkpoint "${att_dir}/checkpoint-${i}.txt" \
            --arg body "${rekor_body_b64}" \
            '{logIndex: $logIndex, logId: {keyId: $logId}, kindVersion: {kind: $kind, version: $version},
              integratedTime: $integratedTime, inclusionPromise: {signedEntryTimestamp: $sigEntryTs},
              inclusionProof: {logIndex: $inclLogIndex, rootHash: $inclRootHash, treeSize: $inclTreeSize,
                hashes: $hashes, checkpoint: {envelope: $checkpoint}},
              canonicalizedBody: $body}' \
            > "${att_dir}/tlog-${i}.json"

          bundle_file="${att_dir}/bundle-${i}.json"
          jq -n \
            --rawfile cert "${att_dir}/cert-${i}.txt" \
            --rawfile payload "${att_dir}/payload-${i}.txt" \
            --rawfile payloadType "${att_dir}/ptype-${i}.txt" \
            --rawfile sig "${att_dir}/sig-${i}.txt" \
            --slurpfile tlogEntries "${att_dir}/tlog-${i}.json" \
            '{mediaType: "application/vnd.dev.sigstore.bundle.v0.3+json",
              verificationMaterial: {certificate: {rawBytes: $cert}, tlogEntries: $tlogEntries},
              dsseEnvelope: {payload: $payload, payloadType: $payloadType, signatures: [{sig: $sig}]}}' \
            > "${bundle_file}"

          cosign verify-blob-attestation \
            --bundle "${bundle_file}" \
            --digest "${digest#sha256:}" \
            --digestAlg sha256 \
            --insecure-ignore-tlog=false \
            --insecure-ignore-sct=true \
            --trusted-root "${workdir}/trusted-root.json" \
            --certificate-identity-regexp "${identity_regexp}" \
            --certificate-oidc-issuer "${issuer}" \
            --type slsaprovenance

          payload_file="${att_dir}/provenance-${i}.json"
          echo "${payload_b64}" | base64 -d > "${payload_file}"
          provenance_files+=("${payload_file}")
          i=$((i + 1))
        done < "${att_dir}/all-attestations.jsonl"

        if [[ ${#provenance_files[@]} -eq 0 ]]; then
          echo "FAIL: no verified slsaprovenance attestations found for ${image_ref}" >&2
          exit 1
        fi

        # Same task-name field verify-image-provenance.yaml already matches git-clone
        # against - the underlying Task CRD name (Tekton's "tekton.dev/task" label),
        # which for sast-scan is identical to its pipelineTask instance name in
        # build.yaml (no ambiguity the way git-clone's hub-resolved name could have had).
        outcome="$(jq -sr '[.[] | .predicate.buildConfig.tasks[]?
          | select(.invocation.environment.labels["tekton.dev/task"] == "sast-scan")
          | .results[] | select(.name == "outcome") | .value][0] // "not-configured"' \
          "${provenance_files[@]}")"

        case "${outcome}" in
          passed)
            echo "sast-scan passed at build time (verified via provenance attestation)."
            ;;
          not-configured)
            echo "sast-scan was not present in this build's provenance - governance.sast was false for this build. Treated as a pass (Application's own choice, not overridden here)."
            ;;
          *)
            echo "FAIL: sast-scan's attested outcome was '${outcome}', not 'passed'." >&2
            exit 1
            ;;
        esac
