# templates/testkube/rbac.yaml
#
# One shared, namespace-scoped Role in Testkube's own `testkube` namespace, granting
# CREATE/GET on TestWorkflow/TestWorkflowExecution CRs - bound per-tenant by each
# Application's own glidepath-app chart (templates/testkube/rbac-and-secret.yaml),
# never by this file. Lives here (the one singleton, cluster-wide chart), not
# duplicated per tenant, because the Role's rules are identical for every tenant - only
# the RoleBinding (which SA gets it) is tenant-specific.
#
# Deliberately NOT resourceNames-restricted, unlike the per-tenant secrets grant
# (rbac-and-secret.yaml): TestWorkflow names are developer-chosen and self-service
# (a file dropped in the app repo's own platform/ folder, no operator involved), so a
# fixed allow-list of names isn't possible without reintroducing an operator step for
# every new test name - which would defeat the point. Accepted, lower-severity
# consequence: any tenant's pipeline-runner could technically create/overwrite another
# tenant's TestWorkflow object name in this shared namespace. Mitigated at the
# correctness (not RBAC) layer: run-testworkflow.yaml always force-rewrites
# metadata.name to "<trusted-app-name>-<test-name>" before applying, using app-name sourced
# from the PipelineRun's own trusted platformIdentity-derived params - a compromised
# pipeline step COULD still bypass that script logic and call the API directly with an
# arbitrary name, same as any namespace-mate could, but the blast radius stops at "a
# confusing test-definition overwrite," not secret exfiltration (that vector is closed
# separately, per-tenant, with resourceNames in rbac-and-secret.yaml).
#
# Why not cluster-scoped: this Role only ever needs to reach the one `testkube`
# namespace, so a Role+per-tenant-RoleBinding here costs nothing extra over a
# ClusterRole and keeps the same "narrowest scope that works" discipline as every other
# identity in this platform (see glidepath-app's pipeline-runner.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testkube-testworkflow-runner
  namespace: {{ .Values.testkubeNamespace }}
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "testkube"
rules:
  - apiGroups: ["testworkflows.testkube.io"]
    resources: ["testworkflows"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["testworkflows.testkube.io"]
    resources: ["testworkflowexecutions"]
    verbs: ["get", "create"]
