# platform/broker/manifests/eventlistener.yaml
#
# Shared internal broker EventListener for inter-stage chaining (build->test->deploy->
# release) - discovers per-Application Trigger CRs via namespaceSelector, rather than one
# EventListener per Application (unnecessary operational tax at scale; see docs/admin/chaining.md).
#
# RBAC note: this ServiceAccount can only WATCH Trigger objects - it never creates
# PipelineRuns itself. Tekton Triggers creates the PipelineRun using the firing Trigger's
# own least-privilege serviceAccountName via scoped SA impersonation (each Application
# grants this broker SA `impersonate` on exactly its own pipeline-runner SA), not the
# broker's own identity - a world apart from the old platform's cluster-wide impersonate
# + cluster-admin binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdevents-broker
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "broker"
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdevents-broker-read-triggers
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "broker"
rules:
  - apiGroups: ["triggers.tekton.dev"]
    # eventlisteners/interceptors (namespaced) were missing from an earlier version -
    # the sink controller watches its own EventListener/Interceptor objects and
    # crash-loops without list/watch on both.
    resources: ["triggers", "triggerbindings", "triggertemplates", "clustertriggerbindings", "clusterinterceptors", "eventlisteners", "interceptors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdevents-broker-read-triggers
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "broker"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cdevents-broker-read-triggers }
subjects:
  - kind: ServiceAccount
    name: cdevents-broker
    namespace: platform-system
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: cdevents-broker
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "broker"
  namespace: platform-system
spec:
  serviceAccountName: cdevents-broker
  # NamespaceSelector lives directly on EventListenerSpec, not nested under
  # triggerSelector - confirmed against tektoncd/triggers' actual API, not the
  # OpenShift-Pipelines-era shape this once copied. See docs/admin/chaining.md.
  namespaceSelector:
    matchNames: ["*"]
  resources:
    kubernetesResource:
      replicas: 3
      serviceType: ClusterIP
      spec:
        template:
          spec:
            containers:
              - resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { memory: 128Mi }
# Tekton Triggers auto-creates a Service named el-cdevents-broker in this namespace -
# that's the address catalog/tasks/send-cdevent.yaml's CDEVENTS_BROKER_URL points at.
