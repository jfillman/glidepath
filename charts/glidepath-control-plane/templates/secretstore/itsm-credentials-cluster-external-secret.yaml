# templates/secretstore/itsm-credentials-cluster-external-secret.yaml
#
# The change tool's credentials for glidepath-catalog's change-management Tasks (open-release-pr, itsm-gate,
# itsm-change: glidepath docs/admin/change-management.md), fanned out to every namespace this platform manages
# - the same broadcast as glidepath-backstage-notify next to this file, for the same reason: one platform-wide
# credential, needed in every tenant's own PipelineRun namespace. The keys are planted in the platform's
# Infisical project by hand, never here: `itsm-token` (a bearer token) or `itsm-username` + `itsm-password`
# (basic auth). Rendered only when itsm.credentials.enabled; the catalog mounts the Secret optional, so a
# lab with an unauthenticated throwaway endpoint needs none of this.
{{- if .Values.itsm.credentials.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: itsm-credentials
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
spec:
  externalSecretName: itsm-credentials
  namespaceSelectors:
    - matchLabels:
        hangar.io/managed-secrets: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.secretStore.name }}
      kind: {{ .Values.secretStore.kind }}
    target:
      name: {{ .Values.itsm.credentials.secretName }}
      creationPolicy: Owner
    data:
      {{- range .Values.itsm.credentials.keys }}
      - secretKey: {{ . }}
        remoteRef:
          key: itsm-{{ . }}
      {{- end }}
{{- end }}
