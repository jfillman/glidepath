# The Flight promoter's two secrets (values promoter, ADR-0029 phase 2). flight-promoter-app is mounted only into the
# broker (templates/broker/interceptor.yaml): no Task pod holds the promoter App's key. flight-registry-read is a
# read-only Flight credential for the promote pipeline's post-copy verification; it cannot write Flight.
{{- if .Values.promoter.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flight-promoter-app
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
  namespace: platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: flight-promoter-app
    creationPolicy: Owner
  data:
    - secretKey: github-application-id
      remoteRef:
        key: {{ .Values.promoter.appIdKey }}
    - secretKey: github-private-key
      remoteRef:
        key: {{ .Values.promoter.privateKeyKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flight-registry-read
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
  namespace: {{ .Values.promoter.catalogNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: flight-registry-read
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.promoter.flightReadKey }}
{{- end }}
