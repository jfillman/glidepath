# templates/secretstore/cluster-secret-store.yaml (docs/admin/secrets-management.md)
#
# The control plane's own Infisical-backed bridge - real backend now (self-hosted
# Infisical via infisical-secretstore-operator, the same mechanism airframe's
# SecretStore XRD uses for per-app secrets), not the old ESO `kubernetes` provider
# stopgap. Rendered as a NATIVE ClusterSecretStore, not wrapped in a
# kubernetes.m.crossplane.io Object the way idp's own Composition has to: that wrapper
# is only required when the renderer is a namespaced Crossplane XR (Crossplane v2
# forbids composing a cluster-scoped resource from one) - this chart is plain Helm, so
# no such restriction applies.
#
# Backed by infisical-project.yaml's InfisicalProject CR (same directory) - see that
# file for why this control plane gets its OWN Infisical project rather than reusing
# any app's per-(app,cluster) project. hostAPI/auth come from this chart's values
# (Kubernetes Auth, no persisted credential; the project slug derives from clusterName) rather than driven by a
# live cluster-registry lookup the way idp's Composition does it - this chart is a true
# singleton pinned to platform-system (see Chart.yaml), always installed on the cluster
# that also hosts Infisical by default. On a cluster that doesn't (Infisical as a separate
# service, e.g. Apron's eks runtime), set secretStore.infisical.hostAPI to its URL and
# secretStore.infisical.auth: universal.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.secretStore.infisical.hostAPI | quote }}
      auth:
        {{- if eq (.Values.secretStore.infisical.auth | default "kubernetes") "universal" }}
        # Infisical runs off this cluster (secretStore.infisical.auth: universal): the SecretStore Composition
        # composes a universal-auth identity when the cluster registry does not mark this cluster infisicalHost,
        # and writes its clientId/clientSecret to the same <projectSlug>-infisical-creds Secret.
        universalAuthCredentials:
          clientId:
            name: {{ include "glidepath-control-plane.infisicalCredentialsSecretName" . }}
            namespace: platform-system
            key: clientId
          clientSecret:
            name: {{ include "glidepath-control-plane.infisicalCredentialsSecretName" . }}
            namespace: platform-system
            key: clientSecret
        {{- else }}
        kubernetesAuthCredentials:
          identityId:
            name: {{ include "glidepath-control-plane.infisicalCredentialsSecretName" . }}
            namespace: platform-system
            key: identityId
        {{- end }}
      secretsScope:
        projectSlug: {{ include "glidepath-control-plane.infisicalProjectSlug" . }}
        environmentSlug: shared
        secretsPath: "/"
