# templates/secretstore/github-app-creds-external-secret.yaml
#
# Replaces the manual "copy pipelines-as-code-secret into platform-system, once per
# cluster" step (docs/admin/release.md) with a real ExternalSecret, synced from this
# control plane's own Infisical project (infisical-project.yaml). The GitHub App's
# id/private key still need to be planted into Infisical by hand once per cluster
# (same "manual by design" posture as every other credential's ultimate source in this
# platform - see docs/admin/secrets-management.md) - what this removes is the repeated
# kubectl-copy-from-pipelines-as-code-secret step, not the one-time real-credential
# provisioning itself.
#
# Same two keys token-review-interceptor's /github-installation-token endpoint already
# expects (github-app.sh / catalog/lib/github-app.sh) - unchanged from the raw Secret
# this replaces.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-creds
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
  namespace: platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: github-app-creds
    creationPolicy: Owner
  data:
    - secretKey: github-application-id
      remoteRef:
        key: github-application-id
    - secretKey: github-private-key
      remoteRef:
        key: github-private-key
