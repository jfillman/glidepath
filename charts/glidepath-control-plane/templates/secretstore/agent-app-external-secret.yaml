# The agents' GitHub App (values agentToken, Autopilot AP-B1, hangar D4). Mounted only into the broker
# (templates/broker/interceptor.yaml), which mints per-repo tokens for Clearance's repo.pr.open; no agent pod and no
# Clearance pod holds the key.
{{- if .Values.agentToken.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-app
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
  namespace: platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: agent-app
    creationPolicy: Owner
  data:
    - secretKey: github-application-id
      remoteRef:
        key: {{ .Values.agentToken.appIdKey }}
    - secretKey: github-private-key
      remoteRef:
        key: {{ .Values.agentToken.privateKeyKey }}
{{- end }}
