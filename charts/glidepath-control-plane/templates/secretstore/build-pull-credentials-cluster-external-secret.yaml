{{- if .Values.buildPullCredential.remoteKey }}
{{- if eq .Values.buildPullCredential.remoteKey "registry-credentials-dockerconfigjson" }}
{{- fail "buildPullCredential.remoteKey cannot be the push credential's key (registry-credentials-dockerconfigjson): the build pod runs the repository's code and can read this Secret" }}
{{- end }}
{{- if eq .Values.buildPullCredential.secretName "registry-credentials" }}
{{- fail "buildPullCredential.secretName cannot be registry-credentials" }}
{{- end }}
# templates/secretstore/build-pull-credentials-cluster-external-secret.yaml
#
# Copies the READ-ONLY registry credential (a dockerconfigjson whose token can read packages and nothing else) into every namespace
# the platform manages, beside registry-credentials (the push credential, registry-credentials-cluster-external-secret.yaml). The
# image build pod (glidepath-catalog build-image) mounts it, optionally, so BuildKit can pull private base images and import the
# main build cache. The build pod runs the repository's Containerfile RUN lines, so whatever is in this Secret is readable by a
# pull request's author: it must not be able to push. Nothing is rendered until the operator names a remote key.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.buildPullCredential.secretName }}
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
spec:
  externalSecretName: {{ .Values.buildPullCredential.secretName }}
  namespaceSelectors:
    - matchLabels:
        hangar.io/managed-secrets: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.secretStore.name }}
      kind: {{ .Values.secretStore.kind }}
    target:
      name: {{ .Values.buildPullCredential.secretName }}
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: {{ .Values.buildPullCredential.remoteKey | quote }}
{{- end }}
