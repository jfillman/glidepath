# templates/secretstore/glidepath-backstage-notify-cluster-external-secret.yaml
#
# Disseminates the shared static service token notify-backstage.yaml uses to
# authenticate to Backstage's notifications REST API (see glidepath's own
# docs/admin/notifications.md) to every namespace this platform manages -
# same broadcast mechanism and reasoning as registry-credentials-cluster-
# external-secret.yaml right next to this file: one shared, platform-wide
# credential (not per-app, there's exactly one Backstage instance per
# cluster), needed in every tenant's own PipelineRun namespace (where the
# Task pod actually runs), not just this chart's own install namespace.
#
# Namespace selection by label, not name pattern, matching registry-
# credentials' own reasoning - hangar.io/managed-secrets: "true" is applied
# by ArgoCD's own managedNamespaceMetadata on every namespace this platform
# creates.
#
# v1, not v1beta1 - same real, live-confirmed CRD-version finding as
# registry-credentials-cluster-external-secret.yaml (this cluster's ESO only
# serves v1 for ClusterExternalSecret).
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: glidepath-backstage-notify
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "secretstore"
spec:
  externalSecretName: glidepath-backstage-notify
  namespaceSelectors:
    - matchLabels:
        hangar.io/managed-secrets: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.secretStore.name }}
      kind: {{ .Values.secretStore.kind }}
    target:
      name: glidepath-backstage-notify
      creationPolicy: Owner
    data:
      - secretKey: backstage-notify-token
        remoteRef:
          key: backstage-notify-token
