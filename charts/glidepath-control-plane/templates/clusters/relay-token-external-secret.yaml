# templates/clusters/relay-token-external-secret.yaml
#
# Replaces the hand-`kubectl create secret <relaySecretName> -n platform-system`
# step (docs/admin/secrets-management.md's old relaySecretName note in values.yaml)
# with a real ExternalSecret per registered cluster, synced from this control plane's
# own Infisical project - one key per cluster (relay-token-<cluster name>), still
# planted into Infisical by hand once per cluster (the value itself has to originate
# somewhere; this only removes the direct-to-k8s-Secret copy step). The SAME value
# also needs to exist in that cluster's OWN Infisical project (see
# gitops-cluster-kind-prod's platform-cicd-kind-prod project) as
# platform-outcome-relay-token, for its own outcome-reporting hook Jobs to present back
# to argocd-outcome-relay - see docs/admin/multi-cluster.md.
#
# argocd-outcome-relay.yaml's own RBAC (resourceNames: [.relaySecretName]) is
# unchanged - it only needs `get` on this Secret's name, regardless of who creates it.
{{- if .Values.clusters }}
{{- range .Values.clusters }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .relaySecretName }}
  labels:
    {{- include "glidepath-control-plane.labels" $ | nindent 4 }}
    hangar.io/subcomponent: "clusters"
  namespace: platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.secretStore.name }}
    kind: {{ $.Values.secretStore.kind }}
  target:
    name: {{ .relaySecretName }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: relay-token-{{ .name }}
{{- end }}
{{- end }}
