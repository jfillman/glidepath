# templates/api/glidepath-api.yaml
#
# glidepath-api (docs/admin/api.md): Glidepath's API for people, Tower and agents. Renders
# nothing until apiImage is set, so a cluster can take this chart version before the first image
# exists (api-ci.yaml builds it and sets apiImage on main).
#
# Three kinds of RBAC, kept apart on purpose:
#   - glidepath-api's OWN identity: TokenReview and SubjectAccessReview (to decide who a caller is
#     and what they may do), namespaces get (to find an app's -cicd namespace), release-tracking
#     ConfigMaps list/get, each app's registry-credentials Secret (get, that name only: evidence
#     reads it per request to pull the image's attestations from GHCR), PipelineRuns get, create
#     and patch (re-run and cancel), TriggerTemplates get (promote and rollback fill the app's own
#     promote-release / rollback-release template), and the live reads Tower's views of runs in flight
#     moved onto (phase 6b): PipelineRuns and TaskRuns list, TaskRuns and pods get, pods/log get. Tekton Results is read through tekton-results-relay, so no
#     Results grant. The Fulcio root (fulcio-root-ca in platform-catalog) needs nothing here:
#     templates/sigstore/fulcio-root-configmap.yaml already lets every ServiceAccount get exactly
#     that ConfigMap.
#   - glidepath-api-reader: who may READ through the API. A virtual group, glidepath.hangar.io, that
#     nothing in the cluster serves; the API asks a SubjectAccessReview against it in the app's
#     namespace. Bound cluster-wide to api.readers. An app-scoped grant is a RoleBinding to the same
#     ClusterRole in that app's -cicd namespace.
#   - glidepath-api-operator: who may RE-RUN and CANCEL through the API (verbs rerun and cancel on
#     runs.glidepath.hangar.io). Bound cluster-wide to api.operators; an app-scoped grant is a
#     RoleBinding to it in that app's -cicd namespace, as for the reader. It holds no read: an
#     operator that should also see runs needs glidepath-api-reader too.
#   - glidepath-api-releaser: who may PROMOTE and ROLL BACK through the API (verbs promote and rollback on
#     environments.glidepath.hangar.io, tier T2: both only start the app's release Pipeline, whose PR a
#     human merges). Bound cluster-wide to api.releasers; app-scoped as for the others. No read.
#
# Events (GET /v1/events, docs/admin/api.md#events): the ClusterInterceptor glidepath-api-events and its Trigger
# below tap the shared broker. The interceptor always answers continue: false, so the Trigger never creates
# anything; glidepath-api re-checks every event's token itself (the interceptor endpoint is reachable by anything
# in the cluster) and fans each event out to the other replicas, found from the Service's EndpointSlices
# (a Role in platform-system: list and watch endpointslices, nothing else) and authenticated with a second
# projected token (audience glidepath-api-peer) that only the replicas accept.
#
# glidepath-api holds no GitHub credential: promote and rollback ask the broker's /github-read-token
# (templates/broker/interceptor.yaml, githubRead.callers) for a read-only token on one of the app's own
# repos, per request, authenticated with the projected token mounted below (audience github-read-token).
{{- if .Values.apiImage }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glidepath-api
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glidepath-api
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  # list: the start-up warm-up finds every app's -cicd namespace (cmd/glidepath-api/warm.go).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # Release records live in each app's own -cicd namespace, and apps are onboarded after install,
  # so this is cluster-wide: get+list only, and the API only ever reads release-tracking ones.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Evidence: the app's dockerconfigjson for GHCR, in every -cicd namespace (apps are onboarded after
  # install, so cluster-wide), restricted by name. get only: a name-restricted rule can't grant list.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["registry-credentials"]
    verbs: ["get"]
  # Re-run (get the source, create the copy) and cancel (merge patch spec.status). Cluster-wide is
  # unavoidable, since apps are onboarded after install, and RBAC can't say "only Glidepath's shape":
  # the shape lock is the cluster's admission policy (gitops glidepath-api-pipelinerun-shape, named
  # tower-pipelinerun-shape until P6), which matches system:serviceaccount:platform-system:glidepath-api.
  # Since P6 Tower's identity holds no PipelineRun write and the same policy refuses one from it.
  # list (P6b): Tower's live views moved onto the API (GET /v1/apps/{app}/live, GET /v1/live), so the
  # API lists the runs Tower used to list through its own Kubernetes proxy. Cluster-wide for the fleet view.
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "create", "patch"]
  # P6b, read only: an app's TaskRuns and the fleet's TaskRuns by run (GET /v1/apps/{app}/live,
  # GET /v1/live/taskruns), and one TaskRun to find its pod for a live step log.
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list"]
  # P6b, read only: a live step log (GET /v1/apps/{app}/live/taskruns/{taskRun}/logs/{container}) reads the
  # TaskRun's pod (to refuse a container it doesn't have) and that container's log. Cluster-wide because
  # apps are onboarded after install; the API only ever names the pod a TaskRun in the app's namespace names.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get"]
  # Promote and rollback read the app's promote-release / rollback-release TriggerTemplate (glidepath-app) and
  # create the PipelineRun it describes, under the same shape policy.
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["triggertemplates"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glidepath-api
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: glidepath-api }
subjects:
  - kind: ServiceAccount
    name: glidepath-api
    namespace: platform-system
---
# Events fan-out: the other replicas' addresses, in glidepath-api's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glidepath-api-peers
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glidepath-api-peers
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: glidepath-api-peers }
subjects:
  - kind: ServiceAccount
    name: glidepath-api
    namespace: platform-system
---
{{- if .Values.promoter.enabled }}
# The Flight registry's read credential (templates/secretstore/flight-promoter-external-secrets.yaml), for reading a
# Flight image's evidence (FLIGHT_PULL_SECRET): that one Secret, in the catalog namespace, get only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glidepath-api-flight-read
  namespace: {{ .Values.promoter.catalogNamespace }}
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["flight-registry-read"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glidepath-api-flight-read
  namespace: {{ .Values.promoter.catalogNamespace }}
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: glidepath-api-flight-read }
subjects:
  - kind: ServiceAccount
    name: glidepath-api
    namespace: platform-system
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glidepath-api-reader
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["glidepath.hangar.io"]
    resources: ["runs", "runs/logs", "releases", "evidence", "tests", "environments", "events"]
    verbs: ["get", "list"]
{{- $readers := .Values.api.readers | default dict }}
{{- if or $readers.users $readers.groups $readers.serviceAccounts }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glidepath-api-reader
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: glidepath-api-reader }
subjects:
  {{- range $readers.users }}
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ . | quote }} }
  {{- end }}
  {{- range $readers.groups }}
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ . | quote }} }
  {{- end }}
  {{- range $readers.serviceAccounts }}
  - { kind: ServiceAccount, name: {{ .name | quote }}, namespace: {{ .namespace | quote }} }
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glidepath-api-operator
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["glidepath.hangar.io"]
    resources: ["runs"]
    verbs: ["rerun", "cancel"]
{{- $operators := .Values.api.operators | default dict }}
{{- if or $operators.users $operators.groups $operators.serviceAccounts }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glidepath-api-operator
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: glidepath-api-operator }
subjects:
  {{- range $operators.users }}
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ . | quote }} }
  {{- end }}
  {{- range $operators.groups }}
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ . | quote }} }
  {{- end }}
  {{- range $operators.serviceAccounts }}
  - { kind: ServiceAccount, name: {{ .name | quote }}, namespace: {{ .namespace | quote }} }
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glidepath-api-releaser
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["glidepath.hangar.io"]
    resources: ["environments"]
    verbs: ["promote", "rollback"]
{{- $releasers := .Values.api.releasers | default dict }}
{{- if or $releasers.users $releasers.groups $releasers.serviceAccounts }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glidepath-api-releaser
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: glidepath-api-releaser }
subjects:
  {{- range $releasers.users }}
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ . | quote }} }
  {{- end }}
  {{- range $releasers.groups }}
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ . | quote }} }
  {{- end }}
  {{- range $releasers.serviceAccounts }}
  - { kind: ServiceAccount, name: {{ .name | quote }}, namespace: {{ .namespace | quote }} }
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glidepath-api
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  replicas: {{ .Values.api.replicas | default 2 }}
  selector:
    matchLabels: { app: glidepath-api }
  template:
    metadata:
      labels: { app: glidepath-api }
    spec:
      serviceAccountName: glidepath-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless "nonroot"
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: {{ .Values.apiImage }}
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: DELEGATES
              value: {{ join "," (.Values.api.delegates | default list) | quote }}
            - name: PROMOTER_REPO
              value: {{ .Values.api.promoterRepo | default .Values.promoter.dispatchRepo | quote }}
            {{- if .Values.promoter.enabled }}
            # Flight images (the promoter repository owner's ghcr.io namespace) are read with the Flight registry's
            # read credential: an app's registry-credentials is the Ground owner's, which Flight refuses (403,
            # 2026-10-30, once the Ground owner lost access to the Flight account).
            - name: FLIGHT_PULL_SECRET
              value: {{ printf "%s/flight-registry-read" .Values.promoter.catalogNamespace | quote }}
            {{- end }}
            # Promote and rollback: the apps' GitHub owner, and the broker that mints per-request read tokens.
            - name: GITHUB_OWNER
              value: {{ include "glidepath-control-plane.githubOwner" . | quote }}
            - name: BROKER_URL
              value: {{ .Values.api.brokerUrl | default "http://cdevents-broker-auth.platform-system.svc.cluster.local:8080" | quote }}
            - name: BROKER_TOKEN_PATH
              value: /var/run/secrets/glidepath/broker/token
            # Events: the buffer's bounds, and this pod for the fan-out to its peers.
            {{- $events := .Values.api.events | default dict }}
            - name: EVENTS_MAX
              value: {{ $events.maxEvents | default 2000 | quote }}
            - name: EVENTS_MAX_AGE
              value: {{ $events.maxAge | default "24h" | quote }}
            - name: EVENTS_MAX_STREAMS
              value: {{ $events.maxStreams | default 100 | quote }}
            - name: EVENTS_RELAYS
              value: "system:serviceaccount:platform-system:glidepath-relay"
            - name: EVENTS_PEER_TOKEN_PATH
              value: /var/run/secrets/glidepath/peer/token
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          volumeMounts:
            - name: broker-token
              mountPath: /var/run/secrets/glidepath/broker
              readOnly: true
            - name: peer-token
              mountPath: /var/run/secrets/glidepath/peer
              readOnly: true
      volumes:
        # Only the broker's /github-read-token accepts this audience; the kubelet rotates it, and the API reads it
        # from disk on every mint.
        - name: broker-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: github-read-token
                  expirationSeconds: 3600
                  path: token
        # Events fan-out between replicas: only glidepath-api's peer endpoint accepts this audience.
        - name: peer-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: glidepath-api-peer
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: glidepath-api
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  selector: { app: glidepath-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
# The events tap. The broker (templates/broker/eventlistener.yaml) runs every Trigger in every namespace
# for every event, so this one sees them all: its only interceptor hands each event, with its
# Authorization header, to glidepath-api, which always answers continue: false.
apiVersion: triggers.tekton.dev/v1alpha1
kind: ClusterInterceptor
metadata:
  name: glidepath-api-events
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  clientConfig:
    service:
      name: glidepath-api
      namespace: platform-system
      path: /internal/events/tap
      port: 8080
---
# A Trigger must name a template with at least one resource. This one is never instantiated: the tap
# never lets the Trigger continue, and the broker's ServiceAccount can't create ConfigMaps anyway.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: glidepath-api-events-noop
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  resourcetemplates:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        generateName: glidepath-api-events-never-
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: glidepath-api-events
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  interceptors:
    - ref: { name: glidepath-api-events, kind: ClusterInterceptor }
  template:
    ref: glidepath-api-events-noop
{{- end }}
