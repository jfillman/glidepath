# templates/api/glidepath-api.yaml
#
# glidepath-api (docs/admin/api.md): Glidepath's API for people, Tower and agents. Renders
# nothing until apiImage is set, so a cluster can take this chart version before the first image
# exists (api-ci.yaml builds it and sets apiImage on main).
#
# Three kinds of RBAC, kept apart on purpose:
#   - glidepath-api's OWN identity: TokenReview and SubjectAccessReview (to decide who a caller is
#     and what they may do), namespaces get (to find an app's -cicd namespace), release-tracking
#     ConfigMaps list/get, each app's registry-credentials Secret (get, that name only: evidence
#     reads it per request to pull the image's attestations from GHCR), and PipelineRuns get, create
#     and patch (re-run and cancel). Tekton Results is read through tekton-results-relay, so no
#     Results grant. The Fulcio root (fulcio-root-ca in platform-catalog) needs nothing here:
#     templates/sigstore/fulcio-root-configmap.yaml already lets every ServiceAccount get exactly
#     that ConfigMap.
#   - glidepath-api-reader: who may READ through the API. A virtual group, glidepath.hangar.io, that
#     nothing in the cluster serves; the API asks a SubjectAccessReview against it in the app's
#     namespace. Bound cluster-wide to api.readers. An app-scoped grant is a RoleBinding to the same
#     ClusterRole in that app's -cicd namespace.
#   - glidepath-api-operator: who may RE-RUN and CANCEL through the API (verbs rerun and cancel on
#     runs.glidepath.hangar.io). Bound cluster-wide to api.operators; an app-scoped grant is a
#     RoleBinding to it in that app's -cicd namespace, as for the reader. It holds no read: an
#     operator that should also see runs needs glidepath-api-reader too.
{{- if .Values.apiImage }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glidepath-api
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glidepath-api
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  # Release records live in each app's own -cicd namespace, and apps are onboarded after install,
  # so this is cluster-wide: get+list only, and the API only ever reads release-tracking ones.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Evidence: the app's dockerconfigjson for GHCR, in every -cicd namespace (apps are onboarded after
  # install, so cluster-wide), restricted by name. get only: a name-restricted rule can't grant list.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["registry-credentials"]
    verbs: ["get"]
  # Re-run (get the source, create the copy) and cancel (merge patch spec.status). Cluster-wide is
  # unavoidable, since apps are onboarded after install, and RBAC can't say "only Glidepath's shape":
  # the shape lock is the cluster's admission policy (gitops tower-pipelinerun-shape), which must
  # match system:serviceaccount:platform-system:glidepath-api as it matches Tower's identity.
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glidepath-api
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: glidepath-api }
subjects:
  - kind: ServiceAccount
    name: glidepath-api
    namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glidepath-api-reader
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["glidepath.hangar.io"]
    resources: ["runs", "runs/logs", "releases", "evidence", "tests"]
    verbs: ["get", "list"]
{{- $readers := .Values.api.readers | default dict }}
{{- if or $readers.users $readers.groups $readers.serviceAccounts }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glidepath-api-reader
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: glidepath-api-reader }
subjects:
  {{- range $readers.users }}
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ . | quote }} }
  {{- end }}
  {{- range $readers.groups }}
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ . | quote }} }
  {{- end }}
  {{- range $readers.serviceAccounts }}
  - { kind: ServiceAccount, name: {{ .name | quote }}, namespace: {{ .namespace | quote }} }
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glidepath-api-operator
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
rules:
  - apiGroups: ["glidepath.hangar.io"]
    resources: ["runs"]
    verbs: ["rerun", "cancel"]
{{- $operators := .Values.api.operators | default dict }}
{{- if or $operators.users $operators.groups $operators.serviceAccounts }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glidepath-api-operator
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: glidepath-api-operator }
subjects:
  {{- range $operators.users }}
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ . | quote }} }
  {{- end }}
  {{- range $operators.groups }}
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ . | quote }} }
  {{- end }}
  {{- range $operators.serviceAccounts }}
  - { kind: ServiceAccount, name: {{ .name | quote }}, namespace: {{ .namespace | quote }} }
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glidepath-api
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  replicas: {{ .Values.api.replicas | default 2 }}
  selector:
    matchLabels: { app: glidepath-api }
  template:
    metadata:
      labels: { app: glidepath-api }
    spec:
      serviceAccountName: glidepath-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless "nonroot"
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: {{ .Values.apiImage }}
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: DELEGATES
              value: {{ join "," (.Values.api.delegates | default list) | quote }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: glidepath-api
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  selector: { app: glidepath-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- end }}
