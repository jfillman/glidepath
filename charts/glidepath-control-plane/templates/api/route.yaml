{{- /* glidepath-api on the cluster's Gateway (docs/admin/api.md#people-over-the-gateway-route): people sign in with a
people-dex ID token (api.oidc), and any other caller's token still goes to TokenReview, so the API server's proxy is not
needed. Off unless api.route.hostname is set. */ -}}
{{- $route := .Values.api.route | default dict }}
{{- if $route.hostname }}
{{- $gw := $route.gateway | default dict }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glidepath-api
  namespace: platform-system
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "glidepath-api"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name | default "hangar" }}
      namespace: {{ $gw.namespace | default "hangar-gateway" }}
  hostnames: [{{ $route.hostname | quote }}]
  rules:
    # /v1 only: the probes, the broker's tap (/internal/events/tap) and the peers' /internal routes stay in cluster.
    - matches: [{ path: { type: PathPrefix, value: /v1 } }]
      backendRefs: [{ group: "", kind: Service, name: glidepath-api, port: 8080 }]
{{- end }}
