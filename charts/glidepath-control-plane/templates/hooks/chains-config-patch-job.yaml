# templates/hooks/chains-config-patch-job.yaml - replaces the old manual `kubectl patch`
# step for Tekton Chains' chains-config (see hooks/chains-config-reference.yaml, kept as
# documentation/values source).
#
# Uses a hook Job + `kubectl patch --type merge`, not a plain Helm ConfigMap template:
# Chains installs its own empty chains-config ConfigMap in a namespace this chart
# doesn't own, so a same-named Helm-templated ConfigMap would fail on first install
# ("already exists", not adopted). A patch doesn't care who created the object.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chains-config-patcher
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "hooks"
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chains-config-patcher
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "hooks"
  namespace: {{ .Values.tektonChainsNamespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["chains-config"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chains-config-patcher
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "hooks"
  namespace: {{ .Values.tektonChainsNamespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: chains-config-patcher }
subjects:
  - kind: ServiceAccount
    name: chains-config-patcher
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: chains-config-patch
  labels:
    {{- include "glidepath-control-plane.labels" . | nindent 4 }}
    hangar.io/subcomponent: "hooks"
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: chains-config-patcher
      restartPolicy: Never
      containers:
        - name: patch
          image: {{ .Values.toolboxImage }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              kubectl patch configmap chains-config -n {{ .Values.tektonChainsNamespace }} --type merge -p '{{ dict "data" .Values.chains.configPatch | toJson }}'
