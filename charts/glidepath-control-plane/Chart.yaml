apiVersion: v2
name: glidepath-control-plane
description: >-
  Everything in this platform that is not Application-related and not genuinely
  third-party software with its own upstream release cycle: the shared CDEvents broker
  (EventListener + TokenReview interceptor), the stalled-pipeline detector, the
  ephemeral-env PR-namespace TTL sweep, the DORA exporter, self-hosted Fulcio, the Tekton
  Chains config patch, and the ExternalSecrets ClusterSecretStore bridge. One release for
  the whole platform. Genuinely third-party installs (Tekton core, Triggers,
  Pipelines-as-Code, kube-prometheus-stack, External Secrets Operator itself, Rekor) are
  each their own ArgoCD Application on the target cluster, not this chart - see
  docs/admin/installation.md.

  Deliberately pinned to the `platform-system` namespace (hardcoded in every template,
  not templated to .Release.Namespace): this is a true singleton, always installed once,
  and every Application's RBAC (broker impersonation grants, etc.) already references
  `platform-system`'s ServiceAccounts by fixed name - making the namespace configurable
  would add a flexibility nobody needs at the cost of a real cross-chart-reference
  mismatch risk. Install with `--namespace platform-system --create-namespace`.
type: application
version: 0.1.0
appVersion: "1.0.0"
