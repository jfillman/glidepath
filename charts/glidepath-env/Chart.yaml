apiVersion: v2
name: glidepath-env
description: >-
  What Glidepath needs inside one Ground environment's namespace: today the pipeline runner's read access to the
  Rollout (deploy-manifests waits for it to become Healthy). Rendered as a source of that environment's own
  Application (glidepath-app's lower-envs ApplicationSet), so it syncs in the same operation that creates the
  namespace (ADR-0023 slice 3).
type: application
version: 0.1.0
appVersion: "1.0.0"
