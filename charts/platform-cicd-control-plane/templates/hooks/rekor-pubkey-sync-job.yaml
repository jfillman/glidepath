# platform/hooks/rekor-pubkey-sync-job.yaml
#
# Fetches Rekor's tlog public key live and writes it into the rekor-public-key
# ConfigMap (templates/sigstore/rekor-public-key-rbac.yaml owns that ConfigMap's RBAC
# only, not its data) - completes the same "no manual values-file editing" pattern
# hooks/fulcio-bootstrap-job.yaml established for Fulcio's root cert.
#
# Genuinely different shape from that Job, for a real reason: Fulcio's material is
# MINTED (this cluster generates its own root, nothing to wait for), Rekor's is
# FETCHED from an already-running server that a completely separate ArgoCD
# Application (gitops-cluster-*/50-platform-cicd/rekor/) owns. ArgoCD doesn't
# guarantee sync ordering BETWEEN independent Applications, so this can't be a
# pre-install hook gated on "rekor must already be up" - instead it's post-install/
# post-upgrade (matching chains-config-patch-job.yaml's own phase) and retries the
# curl call itself in a loop until rekor-server answers, tolerating it not existing
# yet on a brand-new cluster's very first sync. Re-fetches and re-applies on every
# sync unconditionally (unlike Fulcio's bootstrap, this is naturally idempotent -
# same key every time, nothing to accidentally clobber).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rekor-pubkey-sync
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "hooks"
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rekor-pubkey-sync
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "hooks"
  namespace: platform-catalog
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rekor-public-key"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rekor-pubkey-sync
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "hooks"
  namespace: platform-catalog
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: rekor-pubkey-sync }
subjects:
  - kind: ServiceAccount
    name: rekor-pubkey-sync
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rekor-pubkey-sync
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "hooks"
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: rekor-pubkey-sync
      restartPolicy: Never
      containers:
        - name: sync
          image: {{ .Values.toolboxImage }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "==> waiting for rekor-server to answer (up to ~4 minutes, retries every 10s)"
              for i in $(seq 1 24); do
                if curl -fsS -o /tmp/rekor.pub http://rekor-server.rekor-system.svc/api/v1/log/publicKey; then
                  echo "rekor-server responded on attempt ${i}"
                  break
                fi
                if [[ "${i}" -eq 24 ]]; then
                  echo "error: rekor-server never answered - is the rekor Application deployed/healthy?" >&2
                  exit 1
                fi
                echo "attempt ${i}/24: rekor-server not ready yet, retrying in 10s"
                sleep 10
              done

              echo "==> writing rekor-public-key ConfigMap"
              kubectl create configmap rekor-public-key -n platform-catalog \
                --from-file=rekor.pub=/tmp/rekor.pub \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "rekor pubkey sync complete"
