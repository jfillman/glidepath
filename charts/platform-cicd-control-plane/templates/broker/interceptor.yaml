# platform/broker/manifests/interceptor.yaml
#
# Deploys the TokenReview-based interceptor, registered as ClusterInterceptor
# "cdevents-broker-auth". RBAC is narrow: create TokenReviews (cluster-scoped by
# necessity), and read-only list/get on PaC Repository CRs (to check a caller owns the
# gitops repo it's requesting a GitHub token for, since this service also mints scoped
# GitHub App installation tokens for release - see docs/release.md). No access to
# PipelineRuns/Secrets/Repository writes in any Application namespace.
#
# github-app-creds holds the same two fields as PaC's own pipelines-as-code-secret,
# needed as an independent copy because Secrets are namespace-scoped and this pod lives
# in platform-system while PaC's own Secret lives in tekton-pipelines (not
# pipelines-as-code - see gitops-cluster-dev's pipelines-as-code-vendored.yaml).
# 2026-08-19/2026-08-23: no manual kubectl copy anymore - both are independent
# ExternalSecrets synced from the same two Infisical keys (github-application-id/
# github-private-key), see secretstore/github-app-creds-external-secret.yaml (this
# chart) and gitops-cluster-dev/50-platform-cicd/tekton-operator/
# pipelines-as-code-secret-external-secret.yaml. See docs/admin/secrets-management.md.
#
# Plain HTTP, not HTTPS: a cert-manager self-signed-CA cert (Tekton's usual pattern) was
# tried and hit a hard wall getting the CA into the sink pod's trust store (blocked by
# the EventListener CRD's admission webhook). TokenReview-verified caller identity is the
# real trust boundary regardless - see docs/admin/chaining.md.
{{- if .Values.selfManageNamespace }}
# Real conflict: Helm's --create-namespace (or ArgoCD's CreateNamespace=true
# syncOption) and this chart's own Namespace resource for the SAME namespace are
# mutually exclusive in Helm v3.21.3 - --create-namespace produces a namespace with no
# Helm release-tracking metadata, which this resource then can't import.
# selfManageNamespace defaults true (Helm-owned); a cluster whose ArgoCD Application
# already sets CreateNamespace=true should set it false instead.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdevents-broker-auth-tokenreview
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["pipelinesascode.tekton.dev"]
    resources: ["repositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdevents-broker-auth-tokenreview
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cdevents-broker-auth-tokenreview
subjects:
  - kind: ServiceAccount
    name: cdevents-broker-auth
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: cdevents-broker-auth }
  template:
    metadata:
      labels: { app: cdevents-broker-auth }
    spec:
      serviceAccountName: cdevents-broker-auth
      securityContext:
        runAsNonRoot: true
        # Explicit numeric UID matching distroless's "nonroot" user - kubelet can't
        # verify runAsNonRoot against a non-numeric USER name and refuses to start the
        # container otherwise.
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: interceptor
          image: {{ .Values.interceptorImage }}
          # Public image on ghcr.io, not kind-loaded. Previously referenced a
          # nonexistent ghcr.io/platform-cicd org and only ran via a stale kind-loaded
          # image.
          #
          # interceptorImage's tag is a git-sha (.github/workflows/broker-image-ci.yaml),
          # not "latest", specifically so IfNotPresent is safe: a real live bug (2026-09-
          # 06) had this Deployment silently running a build from over two weeks earlier
          # - source had long since fixed it, but nothing ever rebuilt+pushed the image
          # (docs/admin/installation.md's documented "no CI wired to a private cluster"
          # gap), and even after a manual rebuild+push, IfNotPresent+":latest" kept
          # serving the node's already-cached old digest for that same tag until it was
          # evicted by hand. An immutable per-commit tag makes that whole class of bug
          # structurally impossible: IfNotPresent can only ever "already have" a tag by
          # having previously pulled that exact commit's image.
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTP }
          volumeMounts:
            - name: github-app-creds
              mountPath: /etc/github-app
              readOnly: true
      volumes:
        - name: github-app-creds
          secret:
            secretName: github-app-creds
---
apiVersion: v1
kind: Service
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
spec:
  selector: { app: cdevents-broker-auth }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: triggers.tekton.dev/v1alpha1
kind: ClusterInterceptor
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
spec:
  clientConfig:
    service:
      name: cdevents-broker-auth
      namespace: platform-system
      path: /
      port: 8080
