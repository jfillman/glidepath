openapi: 3.0.3
info:
  title: Glidepath API
  version: 0.6.0
  description: |
    Runs, logs, release records, supply-chain evidence and test runs for one app, and Glidepath's
    contract (docs/admin/api.md). Phases 1 and 2 of the Glidepath API spec are reads (tier T0); phase 3
    adds the first writes (tier T1): re-run and cancel a PipelineRun in the app's namespace. Phase 4 adds
    tier T2, propose: promote to a Flight environment and roll one back, each only starting the app's
    release Pipeline, whose gitops PR a human merges. Phase 5 adds the CDEvents stream (GET /v1/events):
    every event the shared broker carries, re-verified, as server-sent events with resume. Phase 6b adds the live
    reads Tower's views of runs in flight need (PipelineRuns, TaskRuns and step logs as the cluster holds them now)
    and the fleet's run history across every namespace. 0.6.0 adds the fleet's release records and release Events
    (GET /v1/releases, GET /v1/releases/events), the last reads Tower's Ops Wall made through its own Kubernetes proxy.

    Every /v1 call needs a bearer token the cluster's TokenReview accepts, in `Authorization`, or in
    `X-Glidepath-Authorization` when the call comes through the API server's service proxy (which
    drops `Authorization`). App routes are then authorized with a SubjectAccessReview in the app's
    `<type>-<app>-cicd` namespace on the virtual group `glidepath.hangar.io`.

    `x-glidepath-tier` on each operation is its tier: T0 read, T1 reversible in Ground, T2 propose
    for Flight, T3 never offered. tools/gen_contract.py copies every operation and tier into the contract.
servers:
  - url: http://glidepath-api.platform-system.svc.cluster.local:8080
    description: in cluster
  - url: /api/v1/namespaces/platform-system/services/glidepath-api:8080/proxy
    description: through the API server's service proxy (send the token in X-Glidepath-Authorization)
security:
  - bearer: []
  - proxied: []
paths:
  /v1/whoami:
    get:
      operationId: whoami
      summary: Who the API thinks you are
      x-glidepath-tier: T0
      parameters: [{ $ref: "#/components/parameters/OnBehalfOf" }]
      responses:
        "200": { description: The caller, content: { application/json: { schema: { $ref: "#/components/schemas/Caller" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/contract:
    get:
      operationId: getContract
      summary: contract/glidepath-contract.json, as this API was built with it
      x-glidepath-tier: T0
      responses:
        "200": { description: The contract, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/runs:
    get:
      operationId: listRuns
      summary: An app's runs since a time, newest first, from Tekton Results
      description: Needs `list` on `runs.glidepath.hangar.io` in the app's namespace. Runs from before the app's -cicd namespace was created are never returned.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
        - { name: sinceHours, in: query, schema: { type: integer, minimum: 1, maximum: 744, default: 24 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - name: view
          in: query
          description: summary (one row per run) or full (each run's PipelineRun and TaskRuns)
          schema: { type: string, enum: [summary, full], default: summary }
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { oneOf: [{ $ref: "#/components/schemas/RunRow" }, { $ref: "#/components/schemas/Run" }] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/runs/{result}:
    get:
      operationId: getRun
      summary: One run, its PipelineRun and TaskRuns
      description: Needs `get` on `runs.glidepath.hangar.io`. `result` is the Tekton Results id, which is the PipelineRun's uid.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/Result" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/runs/{result}/logs/{taskRun}:
    get:
      operationId: getRunLog
      summary: One TaskRun's archived step logs, as plain text
      description: Needs `get` on `runs/logs`. Each line is prefixed with its step, `[step] ...`.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/Result" }
        - { name: taskRun, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The log, content: { text/plain: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/runs/{result}/explain:
    get:
      operationId: explainRun
      summary: Why a run failed, classified against the contract's knownFailures
      description: >-
        Needs `get` on `runs/logs` (it reads the failed TaskRuns' logs). For each failed TaskRun, the first step that
        exited non-zero, the first knownFailure (in contract order) its log lines or condition message match, the line
        that matched, and the hint and field to change. `knownFailure` is null when nothing matched; `evidence` is then
        the step's last lines. Act on the id and the hint, never on the message text.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/Result" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The run explained, content: { application/json: { schema: { $ref: "#/components/schemas/Explanation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/live:
    get:
      operationId: listLiveRuns
      summary: Every PipelineRun and TaskRun in the app's namespace right now, from the cluster
      description: >-
        Needs `list` on `runs.glidepath.hangar.io` in the app's namespace. The objects as the API server lists them, with
        `metadata.managedFields` dropped and nothing else changed: runs in flight, and finished ones until Tekton deletes
        them (about an hour). Older runs are archived: GET /v1/apps/{app}/runs. Cached at most 2 s.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The live runs, content: { application/json: { schema: { $ref: "#/components/schemas/LiveRuns" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/live/taskruns/{taskRun}/logs/{container}:
    get:
      operationId: getLiveLog
      summary: One container's log from a live TaskRun's pod, as plain text
      description: >-
        Needs `get` on `runs/logs`. Reads the TaskRun in the app's namespace, then its pod's (`status.podName`) log for
        `container` (a step is `step-<name>`), each line prefixed with the container runtime's RFC 3339 timestamp, as
        `kubectl logs --timestamps`. Never cached. A container the pod doesn't have, or one that hasn't started, is 400;
        a TaskRun or pod that is gone (or a TaskRun with no pod yet) is 404 `GP-LIVE-404`: a finished run's log is
        archived (GET /v1/apps/{app}/runs/{result}/logs/{taskRun}).
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { name: taskRun, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$" } }
        - { name: container, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" } }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The log, content: { text/plain: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/runs:
    get:
      operationId: listFleetRuns
      summary: Finished runs across every app, newest first, from Tekton Results
      description: >-
        GET /v1/apps/{app}/runs for the whole fleet (Results' `parents/-`), summary rows only, each with its namespace
        and app. Needs `list` on `runs.glidepath.hangar.io`: cluster-wide without `app=`, in the app's namespace with
        it. Same window and limit rules; with `app=`, runs from before the app's namespace was created are not returned.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/FleetApp" }
        - { name: sinceHours, in: query, schema: { type: integer, minimum: 1, maximum: 744, default: 24 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/FleetRunRow" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/live:
    get:
      operationId: listFleetLiveRuns
      summary: Every PipelineRun in the cluster right now
      description: >-
        Needs `list` on `runs.glidepath.hangar.io`: cluster-wide without `app=`, in the app's namespace with it. Each
        object as the API server lists it, `metadata.managedFields` dropped. No TaskRuns: ask for the ones of the runs
        shown with GET /v1/live/taskruns. Cached at most 2 s.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/FleetApp" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The PipelineRuns
          content:
            application/json:
              schema:
                type: object
                required: [pipelineRuns]
                properties:
                  pipelineRuns: { type: array, items: { $ref: "#/components/schemas/KubeObject" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/live/taskruns:
    get:
      operationId: listFleetLiveTaskRuns
      summary: The TaskRuns of the named PipelineRuns, right now
      description: >-
        The TaskRuns whose `tekton.dev/pipelineRun` label is one of `pipelineRuns`, in every namespace (or the `app=`
        one). Same authorization as GET /v1/live. No names: `{"taskRuns":[]}`. Cached at most 2 s.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/FleetApp" }
        - name: pipelineRuns
          in: query
          description: Comma-separated PipelineRun names (lower-case DNS names of at most 63 characters), at most 200 distinct
          schema: { type: string }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The TaskRuns
          content:
            application/json:
              schema:
                type: object
                required: [taskRuns]
                properties:
                  taskRuns: { type: array, items: { $ref: "#/components/schemas/KubeObject" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/releases:
    get:
      operationId: listFleetReleases
      summary: Every release record in the cluster, with its namespace and labels
      description: >-
        Every `release-tracking` ConfigMap (label `hangar.io/subcomponent=release-tracking`) in every namespace, or with
        `app=` only that app's (label `hangar.io/app`) in its namespace. Needs `list` on `releases.glidepath.hangar.io`:
        cluster-wide without `app=`, in the app's namespace with it. Each record is the ConfigMap's name, namespace,
        labels and data (`{}` when it has none, never null). GET /v1/apps/{app}/releases is unchanged. Not cached.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/FleetApp" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The records
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases: { type: array, items: { $ref: "#/components/schemas/FleetRelease" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/releases/events:
    get:
      operationId: listFleetReleaseEvents
      summary: The ReleaseStalled and ReleaseDrift Events about release records
      description: >-
        The core/v1 Events with reason `ReleaseStalled` or `ReleaseDrift` (one list per reason, by field selector) whose
        involvedObject is a ConfigMap named `release-tracking-*`, in every namespace or the `app=` one. Same
        authorization as GET /v1/releases. Stalled ones first, then drift, each in the API server's order. Not cached.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/FleetApp" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/ReleaseEvent" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/releases:
    get:
      operationId: listReleases
      summary: Every release record of an app, all environments
      description: Needs `list` on `releases.glidepath.hangar.io`. The keys of `data`, and the release states, are in docs/admin/release-state.md and the contract's states.release.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The records
          content:
            application/json:
              schema: { type: object, properties: { releases: { type: array, items: { $ref: "#/components/schemas/Release" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/releases/{chainId}:
    get:
      operationId: getRelease
      summary: The release record of one flow (release-tracking-<chainId>)
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { name: chainId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,200}$" } }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The record, content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/evidence:
    get:
      operationId: getEvidence
      summary: Every signature and attestation on an image, each re-verified against the cluster's Fulcio root and Rekor
      description: >-
        Needs `get` on `evidence.glidepath.hangar.io` in the app's namespace. Reads the image from GHCR with the app's own
        `registry-credentials` Secret (read for this request only), finds its attestations in all three places they live
        (the legacy `.att` tag, OCI 1.1 referrers, the `.sig` tag), re-reads each one's Rekor entry by log index and
        verifies it. Tower's `/provenance` answer, field for field. Act on `verified` and `verificationCode`, never on
        `verificationError`'s text.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - name: image
          in: query
          required: true
          description: "ghcr.io/<repo>:<tag>, ghcr.io/<repo>@sha256:<digest> or ghcr.io/<repo>:<tag>@sha256:<digest>"
          schema: { type: string }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The image's evidence, content: { application/json: { schema: { $ref: "#/components/schemas/Evidence" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/tests:
    get:
      operationId: listTests
      summary: An app's test runs from Testkube, newest first, each read in full
      description: >-
        Needs `list` on `tests.glidepath.hangar.io`. Every Testkube execution Glidepath tagged `app=<app>`. A run the agent
        reported `aborted` while every step passed is counted as passed and carries `statusNote` (a known race on short
        runs, which Glidepath's run-testworkflow also corrects).
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema: { type: object, properties: { runs: { type: array, items: { $ref: "#/components/schemas/TestRun" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/tests/{id}/report:
    get:
      operationId: getTestReport
      summary: The JUnit report a test run left (data/artifacts/junit.xml)
      description: Needs `get` on `tests.glidepath.hangar.io`. The run must be this app's. 404 when the run has no report.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" } }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The report, content: { application/xml: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/pipelineruns/{name}/rerun:
    post:
      operationId: rerunRun
      summary: Start a copy of a PipelineRun, once per Idempotency-Key
      description: >-
        Needs `rerun` on `runs.glidepath.hangar.io` in the app's namespace. Reads the live PipelineRun `name` in the app's
        -cicd namespace and creates a new one with its spec (without spec.status) and only its hangar.io/app and /flow
        labels, as Tower's re-run does. The new run is named `<name>-rerun-<5 hex>` (the prefix cut at 58 characters),
        the hex from sha256(app/name/Idempotency-Key), and annotated `glidepath.hangar.io/rerun-of` and
        `glidepath.hangar.io/idempotency-key-sha256`. The same key again answers 200 with `replayed: true` and creates
        nothing, from either replica; a name taken by anything else is 409. With `dryRun=true`, the create is a
        server-side dry run (admission runs, nothing is stored) and the answer carries the object. A delegate must send
        X-Glidepath-On-Behalf-Of.
      x-glidepath-tier: T1
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/RunName" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/DryRunHeader" }
        - name: Idempotency-Key
          in: header
          required: true
          description: Any string the caller picks for this one re-run, the same on every retry of it.
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Rerun" } } } }
        "200": { description: "A replay of an earlier call with this key, or a dry run", content: { application/json: { schema: { $ref: "#/components/schemas/Rerun" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/pipelineruns/{name}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a PipelineRun (CancelledRunFinally, so its finally tasks still report)
      description: >-
        Needs `cancel` on `runs.glidepath.hangar.io` in the app's namespace. Sends the JSON merge patch
        `{"spec":{"status":"CancelledRunFinally"}}`. A run already cancelled (spec.status Cancelled or
        CancelledRunFinally, or a cancelled Succeeded condition) or already finished is not patched and answers 200 with
        `already-cancelled` or `already-finished`. Safe to retry. With `dryRun=true`, the patch is a server-side dry run
        and the answer carries it. A delegate must send X-Glidepath-On-Behalf-Of.
      x-glidepath-tier: T1
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/RunName" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/DryRunHeader" }
      responses:
        "200": { description: What happened, content: { application/json: { schema: { $ref: "#/components/schemas/Cancellation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/environments:
    get:
      operationId: listEnvironments
      summary: The app's environments, their tiers and their promotion order (Tower's release plan)
      description: >-
        Needs `list` on `environments.glidepath.hangar.io` in the app's namespace. Read from the app's cicd.yaml on
        GitHub (its source repo, or an InfraService's gitops repo) with a read-only token the broker mints for this
        request: `deploy.environments` in order when every entry is Ground or Flight (orderSource promotionOrder),
        else the order of the release pipeline's deploy/release steps (pipeline-steps). No cicd.yaml is an empty plan.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The plan, content: { application/json: { schema: { $ref: "#/components/schemas/ReleasePlan" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/environments/{env}/rollback-plan:
    get:
      operationId: getRollbackPlan
      summary: The environment's current release and the earlier releases it may roll back to
      description: >-
        Needs `get` on `environments.glidepath.hangar.io` in the app's namespace. From the release records for this
        environment and cluster: current is the newest that ran (by prCreatedAt); targets are the newest five that
        reached healthy, less the current release and image and repeated images, newest first. Tower's RollbackPlan,
        byte for byte.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/Env" }
        - { name: cluster, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" } }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200": { description: The plan, content: { application/json: { schema: { $ref: "#/components/schemas/RollbackPlan" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/environments/{env}/promote:
    post:
      operationId: promoteEnvironment
      summary: Propose a promotion to a Flight environment (start the app's release Pipeline; a human merges its PR)
      description: >-
        Needs `promote` on `environments.glidepath.hangar.io` in the app's namespace. Tower's promote, for a Flight
        target only (a Ground target is 422: that is a direct commit to the app repo, which needs a GitHub write
        identity). The target must be the environment right after sourceEnv in the app's own order, or for a first
        deploy (sourceImageRepo+sourceImageTag) its first environment. The image is read from the source
        environment's release file, never taken from the request (a first deploy's tag must name a real commit of the
        app repo). If the release PR for that commit (branch release-<env>-<sha8>) is already open, the answer is it
        (mode pr, alreadyOpen) and nothing starts. Otherwise the promote-release TriggerTemplate's PipelineRun is
        created, named promote-<env>-<sha8>-<6 hex of sha256(app/promote/env/cluster/Idempotency-Key)>: the same key
        again answers 200 with replayed true. With dryRun, the create is a server-side dry run and the answer carries
        the object. A delegate must send X-Glidepath-On-Behalf-Of, who is the run's initiator.
      x-glidepath-tier: T2
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/Env" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/DryRunHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PromoteRequest" } } }
      responses:
        "201": { description: The release run started, content: { application/json: { schema: { $ref: "#/components/schemas/PromoteResult" } } } }
        "200": { description: "A replay, a dry run, or the release PR already open", content: { application/json: { schema: { $ref: "#/components/schemas/PromoteResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/apps/{app}/environments/{env}/rollback:
    post:
      operationId: rollbackEnvironment
      summary: Propose a rollback of a Flight environment to an earlier release (the release Pipeline; a human merges)
      description: >-
        Needs `rollback` on `environments.glidepath.hangar.io` in the app's namespace. Tower's rollback: the target must
        be one of the rollback plan's targets (computed here from the release records, never taken from the request).
        If the rollback's PR (branch release-rollback-<env>-<sha8>) is already open, the answer is it. Otherwise the
        rollback-release TriggerTemplate's PipelineRun is created (config-revision main), named
        rollback-<env>-<sha8>-<6 hex>, idempotent per Idempotency-Key as promote is. Unlike Tower, the answer does not
        wait for the PR. A delegate must send X-Glidepath-On-Behalf-Of.
      x-glidepath-tier: T2
      parameters:
        - { $ref: "#/components/parameters/App" }
        - { $ref: "#/components/parameters/Env" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/DryRunHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RollbackRequest" } } }
      responses:
        "201": { description: The rollback release run started, content: { application/json: { schema: { $ref: "#/components/schemas/RollbackResult" } } } }
        "200": { description: "A replay, a dry run, or the rollback PR already open", content: { application/json: { schema: { $ref: "#/components/schemas/RollbackResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/events:
    get:
      operationId: streamEvents
      summary: The CDEvents stream, as server-sent events
      description: |
        Every CDEvent the shared broker carries whose sender glidepath-api re-verified, as `text/event-stream`:
        one SSE message per event, `id: <Envelope.id>` and `data: <Envelope JSON>` (no `event:` field, so an
        EventSource's onmessage gets them). A comment line (`: ping`) every 15 s keeps an idle stream open through
        proxies. The stream runs until the client disconnects, the replica stops, or the client falls more than 256
        events behind (the stream ends; reconnect with Last-Event-ID).

        Needs `list` on `events.glidepath.hangar.io`: in the app's namespace with `app=`, cluster-wide (a
        SubjectAccessReview with no namespace) without it. A caller with only per-app access must pass `app=`.

        Without a resume point the stream is live only. With `Last-Event-ID` (or `since=` an event id) it first
        replays what this replica's buffer holds after that id, plus anything received up to 10 s before it
        (replicas add each other's events slightly out of order), so a resume may repeat an event: dedupe by id. Ids
        mean the same on every replica, so a stream can resume on another one. The buffer is best-effort and in memory
        (2000 events / 24 h per replica by default): what it no longer holds is not replayed.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/EventApp" }
        - { $ref: "#/components/parameters/EventType" }
        - { $ref: "#/components/parameters/EventSince" }
        - name: Last-Event-ID
          in: header
          description: The last event id this client saw; preferred over `since`. What EventSource sends when it reconnects.
          schema: { type: string }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The stream
          content:
            text/event-stream:
              schema: { type: string, description: "SSE messages whose data is an Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/events/recent:
    get:
      operationId: listRecentEvents
      summary: The buffered events, as JSON
      description: |
        The same events and filters as GET /v1/events, from this replica's buffer, oldest first, at most `limit` of
        the newest. For tests, agents, and callers that would rather poll than hold a stream; poll with `since=` the
        last id seen. Same authorization as GET /v1/events.
      x-glidepath-tier: T0
      parameters:
        - { $ref: "#/components/parameters/EventApp" }
        - { $ref: "#/components/parameters/EventType" }
        - { $ref: "#/components/parameters/EventSince" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 100 } }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Envelope" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    proxied: { type: apiKey, in: header, name: X-Glidepath-Authorization, description: "Bearer <token>, for calls through the API server's service proxy" }
  parameters:
    App: { name: app, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" } }
    Result: { name: result, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
    RunName: { name: name, in: path, required: true, description: A live PipelineRun's name, schema: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{0,252}$" } }
    Env: { name: env, in: path, required: true, description: An environment in the app's cicd.yaml, schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" } }
    FleetApp:
      name: app
      in: query
      description: Only this app's namespace. Required for a caller without cluster-wide access.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    EventApp:
      name: app
      in: query
      description: Only this app's events. Required for a caller without cluster-wide access.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    EventType:
      name: type
      in: query
      description: A CDEvent type prefix, e.g. `dev.cdevents.pipelinerun.` or `dev.cdevents.pipelinerun.finished`.
      schema: { type: string, maxLength: 256 }
    EventSince:
      name: since
      in: query
      description: Replay after this event id (as Last-Event-ID), or after this RFC 3339 time.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Any string the caller picks for this one write, the same on every retry of it.
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    DryRun:
      name: dryRun
      in: query
      description: true does every read and check, and a Kubernetes server-side dry run (dryRun All), and returns what would be written. Audited with dryRun true. Through the API server's service proxy use the X-Glidepath-Dry-Run header instead; the API server refuses a proxied request with dryRun in its query.
      schema: { type: boolean, default: false }
    DryRunHeader:
      name: X-Glidepath-Dry-Run
      in: header
      description: Same as ?dryRun (true or false); the form a caller must use through the API server's service proxy. If both are given they must agree.
      schema: { type: boolean, default: false }
    OnBehalfOf:
      name: X-Glidepath-On-Behalf-Of
      in: header
      required: false
      description: The person a delegate (Tower) acts for. Refused from anyone not in the chart's api.delegates; required on a delegate's write (GP-AUTH-004). Recorded in the audit line.
      schema: { type: string, maxLength: 256 }
  responses:
    Error:
      description: A refusal or failure with a stable rule id
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Envelope:
      type: object
      description: One CDEvent, as GET /v1/events delivers it.
      required: [id, app, routingKey, receivedAt, event]
      properties:
        id:
          type: string
          pattern: "^[0-9]{16}-[0-9a-f]{12}$"
          description: >-
            When the first replica received it (unix microseconds, 16 digits) and a hash of context.source and
            context.id. Ordered as a string; the same on every replica; what Last-Event-ID and since take.
        app: { type: string, description: "The app the event is about, as the sender's verified identity says" }
        routingKey:
          type: string
          description: >-
            `<app>.<subject>.<predicate>` from the CDEvent type, lower case (dev.cdevents.pipelinerun.finished.0.3.0 for
            app gate-api is gate-api.pipelinerun.finished). Has AMQP topic semantics: match it with `*` and `#` patterns.
        receivedAt: { type: string, format: date-time }
        event: { type: object, description: The CDEvent exactly as its sender posted it to the broker }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        rule:
          type: string
          description: >-
            GP-AUTH-001 no token, GP-AUTH-002 token rejected, GP-AUTH-003 on-behalf-of refused, GP-AUTH-004 a delegate's
            write must name the person, GP-AUTHZ-001 not allowed, GP-LOG-404 the run exists but has no archived log for that
            TaskRun, GP-LIVE-404 the live TaskRun or its pod is gone (or has no pod yet), GP-API-409 a write's derived run name is taken by another object, GP-API-422 the write can't be
            done as asked (out of order, a Ground target, an ineligible rollback target, nothing to promote, or the
            cluster refused it: admission policy or RBAC), GP-API-503 this replica serves its maximum number of event
            streams, GP-API-400/404/502
        hint: { type: string }
    Explanation:
      type: object
      required: [result, status, failures, contractVersion]
      properties:
        result: { type: string }
        name: { type: string }
        status: { type: string, enum: [succeeded, failed, cancelled, running, unknown] }
        contractVersion: { type: integer }
        failures:
          type: array
          items:
            type: object
            required: [taskRun, knownFailure, log]
            properties:
              taskRun: { type: string }
              task: { type: string, description: The pipeline task (tekton.dev/pipelineTask) }
              step: { type: string, description: The first step that exited non-zero }
              reason: { type: string }
              message: { type: string, description: The TaskRun's Succeeded condition message }
              knownFailure:
                nullable: true
                type: object
                required: [id, hint]
                properties:
                  id: { type: string, description: A knownFailures id from the contract }
                  hint: { type: string }
                  field: { type: string, description: "JSON pointer into cicd.yaml, when one field is the fix" }
              evidence: { type: string, description: "The matching line, or the failing step's last lines when nothing matched" }
              log: { type: string, enum: [archived, missing] }
    Evidence:
      type: object
      required: [digest, attestations]
      properties:
        digest: { type: string, description: "sha256:<hex>, resolved from the tag when the image named one" }
        attestations:
          type: array
          description: Legacy-tag attestations, then referrer attestations, then image signatures, in the order each was found
          items: { $ref: "#/components/schemas/Attestation" }
    Attestation:
      type: object
      description: >-
        An attestation's in-toto statement, every field of it as signed (`_type`, `predicateType`, `subject`, `predicate`),
        plus what verifying it found. A classic image signature has predicateType
        cosign.sigstore.dev/signature/simple-signing and its simple-signing payload as the predicate. A field with no value
        is absent, not null.
      required: [predicateType, verified, verificationCode, logSource]
      additionalProperties: true
      properties:
        predicateType: { type: string }
        predicate: { description: The statement's predicate (any JSON) }
        subject:
          type: array
          items: { type: object, properties: { name: { type: string }, digest: { type: object, additionalProperties: { type: string } } } }
        certificate:
          type: object
          description: The signing certificate, as Node's X509Certificate prints it. Absent when there is none or it doesn't parse.
          required: [validFrom, validTo]
          properties:
            subject: { type: string, description: "One RDN per line; absent for an empty name (a Fulcio leaf's)" }
            issuer: { type: string }
            identity: { type: string, description: "The first URI SAN, where Fulcio puts the signer's identity" }
            validFrom: { type: string, example: "Oct 21 06:12:16 2026 GMT" }
            validTo: { type: string }
        transparencyLog:
          type: object
          required: [logIndex]
          properties:
            logIndex: { type: number, nullable: true }
            logId: { type: string, description: hex }
            integratedTime: { type: number, nullable: true, description: Unix seconds }
        verified: { type: boolean }
        verificationError: { type: string, description: "Why it didn't verify, in the verifier's words. Display only." }
        verificationCode:
          type: string
          enum: [verified, no-log-entry, log-entry-mismatch, stale-receipt, digest-mismatch, signature-invalid, trust-root-unavailable, incomplete]
        logSource: { type: string, enum: [rekor, embedded, none], description: "The log entry checked: read fresh from Rekor, the image's own copy, or none" }
    TestRun:
      type: object
      required: [id, name, workflow, status, steps, hasReport]
      properties:
        id: { type: string }
        name: { type: string }
        workflow: { type: string }
        status: { type: string, description: "passed, failed, aborted, running, queued..., after the aborted-but-passed correction" }
        statusNote: { type: string }
        role: { type: string, description: "check-ride or test (the tag Glidepath set)" }
        env: { type: string }
        test: { type: string }
        image: { type: string }
        revision: { type: string }
        chain: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }
        durationMs: { type: number }
        steps: { type: array, items: { type: object, properties: { name: { type: string }, status: { type: string } } } }
        hasReport: { type: boolean, description: True when the run left a JUnit report (getTestReport) }
    Rerun:
      type: object
      required: [name, replayed]
      properties:
        name: { type: string, description: The re-run's name }
        replayed: { type: boolean, description: True when an earlier call with this Idempotency-Key made it }
        dryRun: { type: boolean }
        object: { type: object, description: "Dry run only: the PipelineRun the API creates (or, on a replay, the one it found)" }
    Cancellation:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [cancelled, already-cancelled, already-finished] }
        dryRun: { type: boolean }
        patch: { type: object, description: "Dry run only, when a patch would be sent: the JSON merge patch" }
    ReleasePlan:
      type: object
      required: [order, orderSource, lower, upper]
      properties:
        order: { type: array, items: { type: string } }
        orderSource: { type: string, enum: [promotionOrder, pipeline-steps] }
        lower: { type: array, items: { type: string }, description: Ground environments }
        upper:
          type: array
          description: Flight environments
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              cluster: { type: string, description: Absent for a same-cluster Flight environment }
              production: { type: boolean, description: "Present (true) only on the environment cicd.yaml marks production: true" }
        releaseFile: { description: "deploy.releaseFile as written, when it is" }
    RollbackTarget:
      type: object
      required: [releaseId, image, gitRevision, gitUrl, healthyAt]
      properties:
        releaseId: { type: string }
        image: { type: string }
        gitRevision: { type: string }
        gitUrl: { type: string }
        healthyAt: { type: string }
        state: { type: string }
    RollbackPlan:
      type: object
      required: [targets]
      properties:
        current:
          type: object
          description: The release running now; absent when nothing has run there. A field its record lacks is absent.
          required: [state]
          properties:
            releaseId: { type: string }
            image: { type: string }
            state: { type: string }
            stateAt: { type: string }
        targets: { type: array, items: { $ref: "#/components/schemas/RollbackTarget" }, description: Newest first }
    PromoteRequest:
      type: object
      description: The target cluster and exactly one source pair.
      required: [cluster]
      properties:
        cluster: { type: string, description: The target environment's cluster }
        sourceEnv: { type: string }
        sourceCluster: { type: string }
        sourceImageRepo: { type: string, description: First deploy only }
        sourceImageTag: { type: string, description: "First deploy only: its trailing hex must be a commit of the app repo" }
    PromoteResult:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [pipeline, pr] }
        pipelineRun: { type: string, description: "mode pipeline: the release run in the app's -cicd namespace" }
        prUrl: { type: string, description: "mode pr: the release PR already open for this commit" }
        alreadyOpen: { type: boolean }
        replayed: { type: boolean, description: Present (true) when an earlier call with this Idempotency-Key started the run }
        dryRun: { type: boolean }
        object: { type: object, description: "Dry run only: the PipelineRun the API creates (or found, on a replay)" }
    RollbackRequest:
      type: object
      required: [cluster, targetReleaseId, reason]
      properties:
        cluster: { type: string }
        targetReleaseId: { type: string, description: One of the rollback plan's targets }
        reason: { type: string, description: "Why; trimmed, required, at most 1024 characters" }
    RollbackResult:
      type: object
      required: [alreadyOpen, target]
      properties:
        prUrl: { type: string, description: The rollback PR already open }
        alreadyOpen: { type: boolean }
        pipelineRun: { type: string }
        target: { $ref: "#/components/schemas/RollbackTarget" }
        replaces: { type: string, description: The release-id the rollback replaces }
        replayed: { type: boolean }
        dryRun: { type: boolean }
        object: { type: object }
    Caller:
      type: object
      properties:
        user: { type: string }
        uid: { type: string }
        groups: { type: array, items: { type: string } }
        onBehalfOf: { type: string }
        delegate: { type: boolean }
    RunRow:
      type: object
      required: [result, name, status]
      properties:
        result: { type: string, description: The Tekton Results id (the PipelineRun's uid) }
        name: { type: string }
        pipeline: { type: string }
        status: { type: string, enum: [succeeded, failed, cancelled, unknown] }
        startTime: { type: string }
        endTime: { type: string }
        commit: { type: string }
        eventType: { type: string }
        prNumber: { type: string }
    FleetRunRow:
      description: A RunRow from any namespace
      allOf:
        - { $ref: "#/components/schemas/RunRow" }
        - type: object
          required: [namespace]
          properties:
            namespace: { type: string, description: "The Result's parent, the namespace the run ran in" }
            app: { type: string, description: "The app, when the namespace is app-<app>-cicd or infra-<app>-cicd; absent otherwise" }
    KubeObject:
      type: object
      additionalProperties: true
      description: A Tekton object as the API server lists it, with metadata.managedFields dropped
    LiveRuns:
      type: object
      required: [pipelineRuns, taskRuns]
      properties:
        pipelineRuns: { type: array, items: { $ref: "#/components/schemas/KubeObject" } }
        taskRuns: { type: array, items: { $ref: "#/components/schemas/KubeObject" } }
    Run:
      type: object
      required: [result, pipelineRun, taskRuns]
      properties:
        result: { type: string }
        pipelineRun: { type: object, description: "The PipelineRun, trimmed to metadata (name, namespace, uid, creationTimestamp, labels, Tekton/PaC/hangar annotations), spec.params, spec.pipelineRef and status" }
        taskRuns: { type: array, items: { type: object } }
    Release:
      type: object
      required: [name, data]
      properties:
        name: { type: string, description: "release-tracking-<chain-id>" }
        data: { type: object, additionalProperties: { type: string } }
    FleetRelease:
      type: object
      required: [name, namespace, labels, data]
      properties:
        name: { type: string, description: "release-tracking-<chain-id>" }
        namespace: { type: string }
        labels: { type: object, additionalProperties: { type: string }, description: "The ConfigMap's labels (hangar.io/app, env, cluster, ...)" }
        data: { type: object, additionalProperties: { type: string } }
    ReleaseEvent:
      type: object
      required: [reason, namespace, recordName, message]
      properties:
        reason: { type: string, enum: [ReleaseStalled, ReleaseDrift] }
        namespace: { type: string, description: "The involvedObject's namespace, else the Event's" }
        recordName: { type: string, description: "The record (ConfigMap) the Event is about: release-tracking-<chain-id>" }
        message: { type: string }
        at:
          type: string
          format: date-time
          description: "RFC 3339 UTC: lastTimestamp, else eventTime, else firstTimestamp, else creationTimestamp; absent when none is set"
