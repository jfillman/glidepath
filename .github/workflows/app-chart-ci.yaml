name: app-chart-ci

# Covers the single highest-risk piece of new logic in Phase 3 item 7: conditional
# rendering off cicd.yaml's pipeline: stage list (charts/glidepath-app/templates/
# _helpers.tpl's glidepath-app.hasStage). This is the direct fix for a
# live-confirmed bug (a release PipelineRun fired for an Application whose cicd.yaml
# never declared a release stage) - a regression here would silently reproduce that bug
# in a new form, so every fixture below asserts both presence AND absence of the
# stage-gated resources, not just "did it render without error."

on:
  pull_request:
    paths:
      - "charts/glidepath-app/**"
      - ".github/workflows/app-chart-ci.yaml"
      - "schemas/**"
  push:
    branches: [main]
    paths:
      - "charts/glidepath-app/**"
      - ".github/workflows/app-chart-ci.yaml"
      - "schemas/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/glidepath-app

  # The environments model (ADR-0019): old and new shape must render identically, the chart must
  # refuse the unsupported combinations, and the schema must refuse mixing the shapes.
  envs-model:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml jsonschema
      - run: python3 charts/glidepath-app/tests/envs_model_test.py

  fixture-matrix:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Write fixtures + platform-identity
        run: |
          mkdir -p /tmp/fixtures
          printf '%s\n' \
            'platformIdentity:' \
            '  appName: fixture-app' \
            '  type: app' \
            '  gitopsRepoUrl: https://github.com/fixture-org/gitops-fixture-app' \
            '  appRepoUrl: https://github.com/fixture-org/fixture-app' \
            '  githubOwner: fixture-org' \
            '  catalogNamespace: platform-catalog' \
            > /tmp/fixtures/platform-identity.yaml

          printf '%s\n' \
            'pipelines:' \
            '  ci:' \
            '    steps:' \
            '      - stage: build' \
            '    trigger:' \
            '      source: event' \
            '      event: artifact.published' \
            'governance: { policyCheck: false }' \
            'ephemeralEnvironments: { pullRequest: { enabled: false } }' \
            'build: { cache: { enabled: false } }' \
            > /tmp/fixtures/build-only.yaml

          printf '%s\n' \
            'pipelines:' \
            '  ci:' \
            '    steps:' \
            '      - stage: build' \
            '      - stage: test' \
            '        env: dev' \
            '        testName: unit' \
            '    trigger:' \
            '      source: event' \
            '      event: artifact.published' \
            'governance: { policyCheck: false }' \
            'ephemeralEnvironments: { pullRequest: { enabled: false } }' \
            'build: { cache: { enabled: false } }' \
            > /tmp/fixtures/build-test.yaml

          printf '%s\n' \
            'pipelines:' \
            '  ci:' \
            '    steps:' \
            '      - stage: build' \
            '      - stage: test' \
            '        env: dev' \
            '        testName: unit' \
            '      - stage: deploy' \
            '        env: dev' \
            '      - stage: release' \
            '        env: prod' \
            '    trigger:' \
            '      source: event' \
            '      event: artifact.published' \
            'deploy: { lowerEnvironments: [dev, qa], upperEnvironments: [prod] }' \
            'governance: { policyCheck: true, allowedCommitSigners: [dev@example.com] }' \
            'ephemeralEnvironments: { pullRequest: { enabled: true } }' \
            'build: { cache: { enabled: true, size: large } }' \
            > /tmp/fixtures/full-pipeline.yaml

      - name: 'Fixture: build-only - test/deploy/release/argocd resources must be ABSENT (policy ConfigMap, build-cache PVC and the Ground ApplicationSet, ADR-0023 slice 3, are unconditional - see docs/onboarding.md)'
        run: |
          helm template t charts/glidepath-app \
            -f /tmp/fixtures/build-only.yaml -f /tmp/fixtures/platform-identity.yaml \
            > /tmp/rendered-build-only.yaml
          python3 hack/ci/assert_app_render.py /tmp/rendered-build-only.yaml \
            --absent Trigger:flow-ci-1-test Trigger:flow-ci-2-deploy Trigger:flow-ci-3-release \
            --absent AppProject ApplicationSet:fixture-app-pr-envs Application \
            --present ApplicationSet:fixture-app-lower-envs \
            --present ServiceAccount:pipeline-runner \
            --present ConfigMap:fixture-app-policy-config \
            --present PersistentVolumeClaim:build-cache-fixture-app

      - name: 'Fixture: build-test - only the test-stage Trigger present (flow-ci-1-test; Triggers are named <flow>-<step index>-<stage>)'
        run: |
          helm template t charts/glidepath-app \
            -f /tmp/fixtures/build-test.yaml -f /tmp/fixtures/platform-identity.yaml \
            > /tmp/rendered-build-test.yaml
          python3 hack/ci/assert_app_render.py /tmp/rendered-build-test.yaml \
            --present Trigger:flow-ci-1-test \
            --absent Trigger:flow-ci-2-deploy Trigger:flow-ci-3-release \
            --absent AppProject ApplicationSet:fixture-app-pr-envs Application \
            --present ApplicationSet:fixture-app-lower-envs

      - name: 'Fixture: full-pipeline - every stage-gated resource must be PRESENT, sized correctly (deploy RBAC: only the same-cluster Flight env prod; Ground dev/qa get theirs from their own Application, ADR-0023 slice 3)'
        run: |
          helm template t charts/glidepath-app \
            -f /tmp/fixtures/full-pipeline.yaml -f /tmp/fixtures/platform-identity.yaml \
            > /tmp/rendered-full.yaml
          python3 hack/ci/assert_app_render.py /tmp/rendered-full.yaml \
            --present Trigger:flow-ci-1-test Trigger:flow-ci-2-deploy Trigger:flow-ci-3-release \
            --present AppProject Application ApplicationSet \
            --present ConfigMap:fixture-app-policy-config \
            --present PersistentVolumeClaim:build-cache-fixture-app \
            --present Role:allow-pipeline-runner-deploy \
            --count Role:allow-pipeline-runner-deploy 1 \
            --pvc-size PersistentVolumeClaim:build-cache-fixture-app 5Gi

      - name: No stray unrendered Helm template syntax (excluding the deliberately-escaped ArgoCD ApplicationSet vars)
        run: |
          # ephemeral-envs.yaml deliberately emits literal {{.number}}/{{.head_sha}}/etc
          # for ArgoCD's own template engine to evaluate later - see that file's header
          # comment. The onboarding-templates ConfigMaps also carry Pipelines-as-Code's own
          # variables ({{ repo_url }}, {{ revision }}, {{ body.pull_request.number }}: a space
          # after the braces, a bare lower-case name) because those files are delivered to a
          # repo and evaluated by PaC there. A Helm leak looks different ({{ .Values.x }}, a
          # leading dot), so only the PaC shape is allowed. Anything else is a real bug.
          # lower-envs.yaml (ADR-0023 slice 3) likewise emits {{.envName}} and {{.path.path}}/{{.path.filename}} for
          # its git-files generator.
          if grep -n '{{' /tmp/rendered-full.yaml | grep -v '{{\.\(number\|head_sha\|envName\|path\.path\|path\.filename\)\|trunc 12 \.head_sha' | grep -v -E '\{\{ [a-z_][a-z_0-9.]* \}\}'; then
            echo "ERROR: unexpected stray '{{' in rendered output"
            exit 1
          fi
          echo "OK: only the expected, deliberately-escaped ArgoCD template syntax present"

  # Lightweight, ungated publish (2026-08-11 - see charts/glidepath-control-plane/
  # templates/argocd/tenant-onboarding-applicationset.yaml's own header for why the
  # ApplicationSet pulls this chart from an OCI registry instead of rendering it
  # straight from this git repo). Deliberately NOT a real release process - every push
  # to main that touches the chart publishes a new OCI artifact immediately, no version
  # bump review, no promotion gate. Explicitly a placeholder: a proper versioned/tested/
  # promoted release workflow for all three of this platform's own charts is flagged as
  # a follow-up, not built here - this exists purely to keep the ArgoCD migration moving
  # without blocking on that larger piece of work.
  #
  # needs: [lint] only, deliberately NOT fixture-matrix - this whole workflow turned out
  # to have never actually run successfully (found live, 2026-08-11: a YAML block-scalar/
  # bash-heredoc indentation conflict broke it at the parse level, fixed here, but
  # fixture-matrix's own fixtures/assertions are ALSO stale against the current chart -
  # missing test.suite, expecting the policy ConfigMap/build-cache PVC conditionally
  # absent when they're unconditional by design, and asserting old on-<stage>-success
  # Trigger names from before the multi-flow rework, none of which this pass fixes).
  # Gating publish on a test suite that's never once passed would just silently block
  # publish forever - fixing fixture-matrix for real is its own follow-up.
  publish:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Push chart to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Hyphen pre-release, not +build metadata - OCI tags can't contain '+' (Helm
          # rewrites it to '_' on push), and older ArgoCD versions don't reverse that
          # rewrite before semver-matching a wildcard targetRevision, breaking
          # auto-tracking (confirmed via a real ArgoCD issue, argoproj/argo-cd#14097,
          # not assumed). Same <version>-<shortsha> shape this platform already uses for
          # every app image it builds (see build-image.yaml).
          base_version="$(grep '^version:' charts/glidepath-app/Chart.yaml | awk '{print $2}')"
          chart_version="${base_version}-$(git rev-parse --short=7 HEAD)"

          mkdir -p /tmp/chart-dist
          helm package charts/glidepath-app --version "${chart_version}" --app-version "${chart_version}" -d /tmp/chart-dist
          helm push "/tmp/chart-dist/glidepath-app-${chart_version}.tgz" oci://ghcr.io/jfillman/charts
