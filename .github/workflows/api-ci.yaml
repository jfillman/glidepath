name: api-ci

# glidepath-api (docs/admin/api.md). On a pull request: go vet and go test. On main: build and push
# a multi-arch image, then set apiImage in glidepath-control-plane's values.yaml to its immutable
# sha- tag, so the control-plane Application's own Argo CD sync rolls it out - the same loop
# broker-image-ci.yaml uses, for the same reason (CI can't reach the private clusters).

on:
  pull_request:
    paths:
      - "glidepath/api/**"
      - "contract/**"
      - "api/openapi.yaml"
      - ".github/workflows/api-ci.yaml"
  push:
    branches: [main]
    paths:
      - "glidepath/api/**"
      - "contract/**"
      - "api/openapi.yaml"
      - ".github/workflows/api-ci.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: glidepath/api/go.mod
          cache-dependency-path: glidepath/api/go.sum
      - name: go vet
        working-directory: glidepath/api
        run: go vet ./...
      - name: go test
        working-directory: glidepath/api
        run: go test ./...

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: image
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/glidepath-api:sha-$(git rev-parse --short HEAD)"
          # Build context is the repo root: the image carries contract/glidepath-contract.json.
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f glidepath/api/cmd/glidepath-api/Dockerfile -t "${image}" .
          archs=$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest}}' | jq -r '[.manifests[].platform.architecture | select(. != "unknown")] | sort | join(",")')
          echo "pushed ${image} for ${archs}"
          [ "${archs}" = "amd64,arm64" ] || { echo "expected amd64,arm64, got ${archs}"; exit 1; }
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: Set apiImage in glidepath-control-plane's values.yaml
        run: |
          set -euo pipefail
          sed -i "s|^apiImage: .*|apiImage: ${{ steps.image.outputs.image }}|" charts/glidepath-control-plane/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/glidepath-control-plane/values.yaml
          git commit -m "Bump glidepath-api image to ${{ steps.image.outputs.image }}"
          git pull --rebase origin main
          git push
