name: catalog-ci

# First CI this repo has ever had (see docs/admin/catalog-versioning.md).
# GitHub-hosted runners cannot reach the platform's clusters (local kind clusters, no
# public endpoint) - so this workflow deliberately does NOT attempt a real "install to
# a canary namespace and run a real pipeline" verification. That step is real and
# still required before merging a catalog change to main (which ArgoCD auto-syncs to
# every real Application) - see catalog-versioning.md for how it's done via a
# temporary canary Application instead. What this workflow DOES cover (no cluster
# needed): Helm lint, a full `helm template`
# render (catches YAML/Go-template syntax errors, the most common real mistake when
# hand-editing Tekton Task/Pipeline YAML), and a structural sanity check confirming
# every rendered Task/Pipeline/StepAction still has a name and the expected apiVersion.

on:
  pull_request:
    paths:
      - "charts/glidepath-catalog/**"
      - ".github/workflows/catalog-ci.yaml"
      - "schemas/**"
  push:
    branches: [main]
    paths:
      - "charts/glidepath-catalog/**"
      - ".github/workflows/catalog-ci.yaml"
      - "schemas/**"

jobs:
  # validate-cicd-config must hand every Task a config-json whose environment fields agree, whichever
  # shape cicd.yaml uses (ADR-0019). Runs the Task's own jq programs on fixtures.
  config-json-environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: python3 charts/glidepath-catalog/tests/validate_config_envs_test.py
      - run: python3 charts/glidepath-catalog/tests/resolve_deploy_target_env_test.py

  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/glidepath-catalog

      - name: helm template (full render)
        run: |
          helm template glidepath-catalog charts/glidepath-catalog \
            --namespace platform-catalog > /tmp/rendered.yaml

      - name: Structural sanity check
        run: |
          python3 - <<'EOF'
          import yaml, sys
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          if not docs:
              print("ERROR: rendered output is empty"); sys.exit(1)
          expected_kinds = {"Task", "Pipeline", "StepAction", "Role", "RoleBinding"}
          bad = [d for d in docs if d.get("kind") not in expected_kinds]
          if bad:
              print(f"ERROR: unexpected kind(s) in catalog chart output: {[d.get('kind') for d in bad]}")
              sys.exit(1)
          unnamed = [d for d in docs if not d.get("metadata", {}).get("name")]
          if unnamed:
              print(f"ERROR: {len(unnamed)} resource(s) missing metadata.name")
              sys.exit(1)
          print(f"OK: {len(docs)} resources rendered, all named, all expected kinds")
          EOF

      - name: No stray unrendered Helm/PaC template syntax
        run: |
          # Catches the exact class of bug hit live while building this chart: PaC's own
          # {{ repo_url }}-style variables (or a stray literal brace pair) left
          # unescaped in a comment/description collide with Helm's Go-template engine.
          # helm template above would already fail loudly on most of these, but this
          # catches ones that happen to parse successfully with the wrong output.
          # grep -n prefixes each line with "<number>:", so the comment filter has to skip that
          # prefix: a bare `grep -v "^\s*#"` never matched, and flagged a comment that deliberately
          # renders a literal brace pair (comment-pr-check-result.yaml).
          if grep -n '{{' /tmp/rendered.yaml | grep -v -E '^[0-9]+:\s*#'; then
            echo "ERROR: rendered output contains a literal '{{' - check for an unescaped PaC/ArgoCD template variable in a comment or string"
            exit 1
          fi
          echo "OK: no stray template syntax in rendered output"
