name: catalog-ci

# First CI this repo has ever had (see docs/admin/catalog-versioning.md).
# GitHub-hosted runners cannot reach the platform's clusters (local kind clusters, no
# public endpoint) - so this workflow deliberately does NOT attempt a real "install to
# a canary namespace and run a real pipeline" verification. That step is real and
# still required before merging a catalog change to main (which ArgoCD auto-syncs to
# every real Application) - see catalog-versioning.md for how it's done via a
# temporary canary Application instead. What this workflow DOES cover (no cluster
# needed): Helm lint, a full `helm template`
# render (catches YAML/Go-template syntax errors, the most common real mistake when
# hand-editing Tekton Task/Pipeline YAML), and a structural sanity check confirming
# every rendered Task/Pipeline/StepAction still has a name and the expected apiVersion.

on:
  pull_request:
    paths:
      - "charts/glidepath-catalog/**"
      - ".github/workflows/catalog-ci.yaml"
      - "schemas/**"
      - "catalog/lib/chain-slug.sh"
      - "hack/ci/chain_slug_test.sh"
      - "hack/ci/build-exemption-cel/**"
      - "hack/apply-guardrail-ruleset.sh"
      - "hack/lab/**"
      - "catalog/toolbox/github-web-flow.asc"
  push:
    branches: [main]
    paths:
      - "charts/glidepath-catalog/**"
      - ".github/workflows/catalog-ci.yaml"
      - "schemas/**"
      - "catalog/lib/chain-slug.sh"
      - "hack/ci/chain_slug_test.sh"
      - "hack/ci/build-exemption-cel/**"
      - "hack/apply-guardrail-ruleset.sh"
      - "hack/lab/**"
      - "catalog/toolbox/github-web-flow.asc"

jobs:
  # validate-cicd-config must hand every Task a config-json whose environment fields agree, whichever
  # shape cicd.yaml uses (ADR-0019). Runs the Task's own jq programs on fixtures.
  config-json-environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: python3 charts/glidepath-catalog/tests/validate_config_envs_test.py
      - run: python3 charts/glidepath-catalog/tests/resolve_deploy_target_env_test.py

  # The schema through the validator the toolbox actually runs (yajsv, Go RE2 regexes): a pattern Python's jsonschema
  # accepts can still fail to compile there, and then every build's preflight fails (2026-10-23, a lookahead in
  # api.spec's pattern). Every docs/user/examples file must pass.
  schema-yajsv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go run github.com/neilpa/yajsv@v1.4.1 -s schemas/cicd.schema.json docs/user/examples/*.yaml

  # The config-only build exemption every push flow carries, evaluated with cel-go (what Pipelines-as-Code uses)
  # against 15 push payloads: cicd.yaml/glidepath//.tekton/ changes never build, the first onboarding merge does.
  build-exemption-cel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hack/ci/build-exemption-cel/go.mod
      - run: go run .
        working-directory: hack/ci/build-exemption-cel

  # deploy-lambda's AWS login: web identity only, a clear error for each missing piece, never a stored key.
  aws-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: charts/glidepath-catalog/tests/aws_credentials_test.sh

  # Ground/Flight registries (ADR-0029): defaults reproduce the old hardcoded repositories, pinDigest writes and
  # removes release.image.digest/source, promotion pins Flight, the gates read source.
  registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: charts/glidepath-catalog/tests/registries_test.sh

  # The promote Task and promote-image StepAction (ADR-0029 phase 2): the promotion rules' refusals, the workflow's
  # failing step as the reason, the Flight verification and the image-promotion check run, against fakes.
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: charts/glidepath-catalog/tests/promote_test.sh

  # The promotion fan-in (ADR-0029 phase 3): comment-pr-check-result's promotion-ready step.
  promotion-fan-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: charts/glidepath-catalog/tests/promotion_fan_in_test.sh

  # validate-values and policy-validation-gate on a /retest: pr-number arrives as the unsubstituted PaC template.
  retest-pr-number:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: charts/glidepath-catalog/tests/retest_pr_number_test.sh

  # The registry's per-gate `required` (docs/admin/release-guardrails.md): which task each gate Pipeline renders
  # (hard + advisory, or advisory alone), the bypass tooling's required set, the ruleset script, and the refusal
  # to make sast/provenance advisory.
  gate-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: charts/glidepath-catalog/tests/gate_required_test.sh

  # The provenance gate's commit check (docs/admin/commit-signing.md): both acceptance paths against recorded
  # real commits (fixtures/commits), real gpgv and GitHub's real web-flow keyring; GitHub API, kubectl, git fetch
  # and gitsign stubbed.
  commit-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: charts/glidepath-catalog/tests/verify_commit_signature_test.sh
      - run: charts/glidepath-catalog/tests/comment_signature_marker_test.sh

  # Change management (docs/admin/change-management.md): the provider client and the rendered itsm-gate /
  # itsm-change scripts through the whole lifecycle against hack/lab/itsm_mock_server.py, both providers.
  change-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: charts/glidepath-catalog/tests/itsm_test.sh
      - run: charts/glidepath-catalog/tests/attest_api_spec_test.sh
      # The api-compat check against the real oasdiff, the toolbox's version and checksum.
      - run: |
          curl -fsSL -o /tmp/oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz
          echo "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247  /tmp/oasdiff.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/oasdiff.tar.gz -C /usr/local/bin oasdiff
      - run: charts/glidepath-catalog/tests/api_compat_test.sh

  # The policy-validation release check (docs/admin/policy-validation.md): the render and evaluate steps against a
  # fixture chart and a 30-policy tree of every admission-policy shape, with the real helm and the Kyverno CLI at the
  # toolbox's version (release tarball, checksum pinned from the release's checksums.txt).
  policy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: |
          curl -fsSL -o /tmp/kyverno.tar.gz https://github.com/kyverno/kyverno/releases/download/v1.19.0/kyverno-cli_v1.19.0_linux_x86_64.tar.gz
          echo "f5b4dc73c8e2f3f66e8e0034dc370e6eb6c4617eff7d5ae3838d2200034eb421  /tmp/kyverno.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kyverno.tar.gz -C /usr/local/bin kyverno
      - run: charts/glidepath-catalog/tests/policy_validation_test.sh

  # The flow slug's word lists: 256 x 256, no duplicates, and the chain-id -> slug
  # mapping Tower's mirror (src/tekton/chainSlug.ts) is pinned to.
  chain-slug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: hack/ci/chain_slug_test.sh

  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/glidepath-catalog -f charts/glidepath-catalog/tests/values.example.yaml

      - name: helm template (full render)
        run: |
          helm template glidepath-catalog charts/glidepath-catalog \
            -f charts/glidepath-catalog/tests/values.example.yaml \
            --namespace platform-catalog > /tmp/rendered.yaml
          # With promotion on (ADR-0029 phase 3): the fan-in step and the promote Trigger render too.
          helm template glidepath-catalog charts/glidepath-catalog \
            -f charts/glidepath-catalog/tests/values.example.yaml \
            --set promotion.enabled=true --set promotion.pinDigest=true \
            --set registries.flight.namespace=riley-roooo --set promotion.promoter.repo=riley-roooo/flight-promoter \
            --namespace platform-catalog > /tmp/rendered-promotion.yaml

      - name: Structural sanity check
        run: |
          python3 - <<'EOF'
          import yaml, sys
          # ConfigMap: release-signing-policy only (ADR-0027) - data, never secrets. ServiceAccount:
          # glidepath-promoter (ADR-0029), no permissions of its own, and with promotion on glidepath-promote-trigger
          # (create PipelineRuns here, nothing else) with the promote Trigger.
          kinds = {"Task", "Pipeline", "StepAction", "Role", "RoleBinding", "ConfigMap", "ServiceAccount"}
          for path, expected_kinds in (("/tmp/rendered.yaml", kinds),
                                       ("/tmp/rendered-promotion.yaml", kinds | {"Trigger", "TriggerBinding", "TriggerTemplate"})):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              if not docs:
                  print(f"ERROR: {path} is empty"); sys.exit(1)
              bad = [d for d in docs if d.get("kind") not in expected_kinds]
              if bad:
                  print(f"ERROR: unexpected kind(s) in {path}: {[d.get('kind') for d in bad]}")
                  sys.exit(1)
              unnamed = [d for d in docs if not d.get("metadata", {}).get("name")]
              if unnamed:
                  print(f"ERROR: {len(unnamed)} resource(s) missing metadata.name in {path}")
                  sys.exit(1)
              print(f"OK: {path}: {len(docs)} resources rendered, all named, all expected kinds")
          EOF

      - name: No stray unrendered Helm/PaC template syntax
        run: |
          # Catches the exact class of bug hit live while building this chart: PaC's own
          # {{ repo_url }}-style variables (or a stray literal brace pair) left
          # unescaped in a comment/description collide with Helm's Go-template engine.
          # helm template above would already fail loudly on most of these, but this
          # catches ones that happen to parse successfully with the wrong output.
          # grep -n prefixes each line with "<number>:", so the comment filter has to skip that
          # prefix: a bare `grep -v "^\s*#"` never matched, and flagged a comment that deliberately
          # renders a literal brace pair (comment-pr-check-result.yaml).
          if cat /tmp/rendered.yaml /tmp/rendered-promotion.yaml | grep -n '{{' | grep -v -E '^[0-9]+:\s*#'; then
            echo "ERROR: rendered output contains a literal '{{' - check for an unescaped PaC/ArgoCD template variable in a comment or string"
            exit 1
          fi
          echo "OK: no stray template syntax in rendered output"
